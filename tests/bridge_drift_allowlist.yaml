# Bridge drift burn-down list -- every line here is an IOU, not a rule.
#
# tests/test_matlab_bridge_hashes.py gates two things: no bridge entry may
# drift from NDI-matlab, and every entry naming a matlab_path must carry a
# matlab_last_sync_hash. Both were newly enforced per NDI-python#211, and the
# entries below already violated them on the day the gate went up.
#
# THE GATE IS ON FOR EVERYTHING ELSE. An entry not listed here fails
# immediately, so no NEW unexamined drift can enter. This file is the
# pre-existing debt, enumerated so it can be counted and burnt down rather
# than sitting invisible -- which is how 60 entries drifted unnoticed in the
# first place (#191).
#
# TO BURN ONE DOWN: read what MATLAB actually changed,
#     git -C ../NDI-matlab log <matlab_last_sync_hash>..HEAD -- src/ndi/<matlab_path>
#     git -C ../NDI-matlab diff <matlab_last_sync_hash>..HEAD -- src/ndi/<matlab_path>
# then either port the behavioural change and bump the hash, or -- if nothing
# on the Python side must follow -- just bump it. A regular port needs no
# decision_log for this; see section 7 of the bridge spec. Then DELETE the
# line from this file. A shrinking file is the progress metric.
#
# THIS FILE CANNOT ROT. TestTheAllowlistOnlyShrinks fails if a listed entry no
# longer drifts, so a fixed entry MUST be removed here in the same PR. The
# list can only shrink; nothing can be added to it without a deliberate edit
# that a reviewer sees.
#
# THE DRIFT BURN-DOWN IS DONE, BAR ONE. It ran 60 -> 1 in four passes: the 18
# signature entries (#214), the 16 body entries under src/ndi (#220), the 8
# non-cloud body entries and the 2 comments-only ones (#224), and the 18 of
# the +ndi/+cloud/ cluster, which moved together in MATLAB -- bulk uploads
# and waitForAllBulkUploads, curl instead of websave, signed-URL sets, and
# the sync pipeline reporting failures it used to bury -- so they were read
# as one change rather than eighteen.
#
# WHAT IT FOUND. Roughly one entry in three was hiding a real defect, not
# bookkeeping. The signature pass alone: startSession had dropped a
# now-required organizationId, a dataset-scoped query was unreachable from
# Python, setup.lab duplicated every DAQ system on a second run,
# session.database_rm ignored the flag it was passed and deleted some
# documents twice, database.remove had no OnMissing, and the profiles file
# sat at the umask default beside a 0600 secrets file. The cloud pass:
# waitForAllBulkUploads was ported but never called, so a sync could list the
# remote mid-extraction; a file the cloud listed but never received was never
# re-queued; a document archive with nothing to read in it returned an empty
# list; a transfer URL was never checked for https; a zipped folder
# downloaded with no extension; and a document whose binary failed to upload
# was recorded as synced. Each is in the decision_log of its entry.
#
# THE POINT BEING: an entry whose hash is stale is not a formality. Read the
# diff before bumping.

# ---------------------------------------------------------------------------
# drifted: 1
#
# The +cloud cluster is done. One entry stays, and it is a real unported
# change rather than bookkeeping: NDI-matlab cd3c11673 reconstructs a file
# series' ingest_locations when a dataset comes down from the cloud, and this
# side has no file-series support in the cloud path at all. That is NDI-python
# #215, which is being worked separately. Bumping the hash would claim the
# entry is current when the gap is exactly what the drift is pointing at, so
# it stays listed until #215 lands.
# ---------------------------------------------------------------------------
drifted:

  - name: downloadNdiDocuments
    matlab_path: "+ndi/+cloud/+sync/+internal/downloadNdiDocuments.m"  # 1 commit(s) since (#215)

# ---------------------------------------------------------------------------
# no_hash: the entries below are the count -- the number is deliberately
# not repeated here, so that concurrent burn-down PRs do not all collide
# on one line of prose.
#
# An entry with a matlab_path and no matlab_last_sync_hash can never show
# drift, so it claims its port is current forever and no check can contradict
# it. Determine the commit each was examined against and record it -- or, if
# nobody knows, examine the file now and record today's commit for it.
# ---------------------------------------------------------------------------
no_hash:
  - name: SyncIndex
    matlab_path: "+ndi/+cloud/+sync/+internal/+index/"
