# Bridge drift burn-down list -- every line here is an IOU, not a rule.
#
# tests/test_matlab_bridge_hashes.py gates two things: no bridge entry may
# drift from NDI-matlab, and every entry naming a matlab_path must carry a
# matlab_last_sync_hash. Both were newly enforced per NDI-python#211, and the
# entries below already violated them on the day the gate went up.
#
# THE GATE IS ON FOR EVERYTHING ELSE. An entry not listed here fails
# immediately, so no NEW unexamined drift can enter. This file is the
# pre-existing debt, enumerated so it can be counted and burnt down rather
# than sitting invisible -- which is how 60 entries drifted unnoticed in the
# first place (#191).
#
# TO BURN ONE DOWN: read what MATLAB actually changed,
#     git -C ../NDI-matlab log <matlab_last_sync_hash>..HEAD -- src/ndi/<matlab_path>
#     git -C ../NDI-matlab diff <matlab_last_sync_hash>..HEAD -- src/ndi/<matlab_path>
# then either port the behavioural change and bump the hash, or -- if nothing
# on the Python side must follow -- just bump it. A regular port needs no
# decision_log for this; see section 7 of the bridge spec. Then DELETE the
# line from this file. A shrinking file is the progress metric.
#
# THIS FILE CANNOT ROT. TestTheAllowlistOnlyShrinks fails if a listed entry no
# longer drifts, so a fixed entry MUST be removed here in the same PR. The
# list can only shrink; nothing can be added to it without a deliberate edit
# that a reviewer sees.
#
# START WITH THE `signature` ONES. Those are MATLAB commits that changed a
# function signature or arguments block, so the recorded input/output contract
# may now be wrong -- that is where a stale hash is most likely hiding a real
# defect rather than bookkeeping.

# ---------------------------------------------------------------------------
# drifted: 60  (signature 18, body 40, comments-only 2)
# ---------------------------------------------------------------------------
