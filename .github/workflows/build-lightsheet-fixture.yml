name: Build lightsheet blob fixture

on:
  # Manual only. This uploads a synthetic pyramid to a real cloud
  # account, so we do not want it firing on every PR -- one run
  # populates a fixture the integration tests can then point at.
  workflow_dispatch:
    inputs:
      user:
        description: 'Test user account to upload under'
        type: choice
        required: true
        default: '1'
        options: ['1', '2']
      environment:
        description: 'Cloud environment'
        type: choice
        required: true
        default: 'prod'
        options: ['prod', 'dev']
      ndi_matlab_ref:
        description: 'NDI-matlab branch/tag/SHA that carries lightsheet_blob_cloud_roundtrip'
        required: true
        default: 'claude/lightsheet-zarr-ndi-viewer-djp5vk'

concurrency:
  group: build-lightsheet-fixture
  cancel-in-progress: false

jobs:
  build-fixture:
    name: Build + upload (User ${{ inputs.user }}, ${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      cloud_dataset_id: ${{ steps.roundtrip.outputs.cloud_dataset_id }}
      dataset_name: ${{ steps.roundtrip.outputs.dataset_name }}

    steps:
      # Both repos, same branch-name fallback pattern the symmetry
      # workflow uses so a paired NDI-matlab branch is picked up
      # automatically when one exists.
      - name: Check out NDI-python
        uses: actions/checkout@v4
        with:
          path: NDI-python

      # The blob-fixture routine (ndi.test.cloud.lightsheet_blob_cloud_roundtrip)
      # is not on NDI-matlab main yet -- it lives on the sibling
      # claude/lightsheet-zarr-ndi-viewer-djp5vk branch. `ndi_matlab_ref`
      # picks which ref to check out (default: that branch). Fall back
      # to main only when the requested ref no longer exists on the
      # remote, and fail loudly rather than silently use a main that
      # cannot resolve the routine.
      - name: Check out NDI-matlab (from ndi_matlab_ref)
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          ref: ${{ inputs.ndi_matlab_ref }}
          path: NDI-matlab
        continue-on-error: true
        id: matlab_checkout_branch

      - name: Check out NDI-matlab (main fallback)
        if: steps.matlab_checkout_branch.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          ref: main
          path: NDI-matlab

      # napariViewLightsheet does not run in this workflow (the
      # roundtrip passes ViewLocal=false and ViewCloud=false), but
      # a lot of MATLAB code paths still touch a QT/GTK
      # library when they build the file cache. Xvfb costs nothing
      # to start and takes those paths out of the failure surface.
      - name: Start virtual display server
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: |
            Communications_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NDI-python
        working-directory: NDI-python
        run: |
          python -m pip install --upgrade pip
          python ndi_install.py --dev --no-validate --verbose

      # Run the MATLAB roundtrip. It builds the synthetic OME-Zarr
      # (see makeBlobFixture.m), ingests it to a session, adds the
      # session to an ndi.dataset.dir, uploads to NDI cloud with
      # uploadAsNew=true, and prints CLOUD_DATASET_ID=... to stdout
      # (via the fprintf below). We capture that line into a job
      # output so a follow-up integration workflow can point at the
      # newly uploaded fixture with `${{ needs.build-fixture.outputs.cloud_dataset_id }}`.
      #
      # Credentials come from the same TEST_USER_1_*/TEST_USER_2_*
      # secrets test-cloud-api.yml uses, picked by the workflow_dispatch input.
      - name: Run MATLAB roundtrip
        id: roundtrip
        uses: matlab-actions/run-command@v2
        env:
          NDI_CLOUD_USERNAME: ${{ inputs.user == '1' && secrets.TEST_USER_1_USERNAME || secrets.TEST_USER_2_USERNAME }}
          NDI_CLOUD_PASSWORD: ${{ inputs.user == '1' && secrets.TEST_USER_1_PASSWORD || secrets.TEST_USER_2_PASSWORD }}
          CLOUD_API_ENVIRONMENT: ${{ inputs.environment }}
        with:
          command: |
            cd("NDI-matlab");
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tools"));

            fixtureDir = fullfile(pwd, "tests", "+ndi", "+symmetry");
            matbox.installRequirements(fixtureDir);

            info = ndi.test.cloud.lightsheet_blob_cloud_roundtrip( ...
                "ViewLocal", false, ...
                "ViewCloud", false, ...
                "Verbose", true);

            % Persist the identifiers where the workflow can pick
            % them up: on stdout for the log, and via
            % GITHUB_OUTPUT so a follow-up job can consume them.
            fprintf('CLOUD_DATASET_ID=%s\n', info.cloudDatasetId);
            fprintf('DATASET_NAME=%s\n', info.cloudDatasetName);

            fid = fopen(getenv("GITHUB_OUTPUT"), "a");
            fprintf(fid, "cloud_dataset_id=%s\n", info.cloudDatasetId);
            fprintf(fid, "dataset_name=%s\n", info.cloudDatasetName);
            fclose(fid);

      - name: Write summary
        run: |
          {
            echo "## Lightsheet fixture uploaded"
            echo ""
            echo "**User:** ${{ inputs.user }}"
            echo "**Environment:** ${{ inputs.environment }}"
            echo ""
            echo "\`\`\`"
            echo "cloud_dataset_id: ${{ steps.roundtrip.outputs.cloud_dataset_id }}"
            echo "dataset_name:     ${{ steps.roundtrip.outputs.dataset_name }}"
            echo "\`\`\`"
            echo ""
            echo "The follow-up integration workflow can point at this fixture with:"
            echo ""
            echo "\`\`\`"
            echo "NDI_LIGHTSHEET_TEST_FIXTURE_ID=${{ steps.roundtrip.outputs.cloud_dataset_id }}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY

      # Save the id to a small json artifact too, so a caller can
      # download it programmatically instead of scraping the summary.
      - name: Save fixture id as artifact
        run: |
          cat > lightsheet_fixture.json <<EOF
          {
            "cloud_dataset_id": "${{ steps.roundtrip.outputs.cloud_dataset_id }}",
            "dataset_name": "${{ steps.roundtrip.outputs.dataset_name }}",
            "user": "${{ inputs.user }}",
            "environment": "${{ inputs.environment }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload fixture id artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightsheet-fixture-id
          path: lightsheet_fixture.json
          retention-days: 30
