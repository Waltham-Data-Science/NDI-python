name: Test Cross-Language Symmetry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      matlab_ref:
        description: >-
          NDI-matlab ref (branch, tag, or full SHA) to check out. Leave empty to
          use the branch-matching behaviour. Supply a SHA for a reproducible run
          -- the default path tracks the tip of NDI-matlab main, so an upstream
          commit can turn this job red or green with no change in this repo.
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symmetry:
    name: MATLAB ↔ Python symmetry tests
    runs-on: ubuntu-latest

    steps:
      # ── Checkout both repos ────────────────────────────────────────────
      - name: Check out NDI-python
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: NDI-python

      - name: Check out NDI-matlab (requested ref, else matching branch)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: VH-Lab/NDI-matlab
          # An explicit workflow_dispatch ref wins. Otherwise use the same
          # branch name as NDI-python so paired feature branches stay in
          # sync; fall back to main when the matlab branch does not exist.
          ref: ${{ inputs.matlab_ref || github.head_ref || github.ref_name }}
          path: NDI-matlab
        continue-on-error: true
        id: matlab_checkout_branch

      # An explicitly requested ref must NOT silently degrade to main -- that
      # would report a reproducible run while testing against something else.
      - name: Fail if the requested NDI-matlab ref does not exist
        if: steps.matlab_checkout_branch.outcome == 'failure' && inputs.matlab_ref != ''
        run: |
          echo "::error::Requested NDI-matlab ref '${{ inputs.matlab_ref }}' could not be checked out"
          exit 1

      - name: Check out NDI-matlab (main fallback)
        if: steps.matlab_checkout_branch.outcome == 'failure' && inputs.matlab_ref == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: VH-Lab/NDI-matlab
          ref: main
          path: NDI-matlab

      # The MATLAB side of this job was pinned to nothing: a branch-name match
      # against the tip of NDI-matlab, or main, with `release: latest` on top.
      # Nothing recorded which revision actually ran, so a red symmetry job
      # could not be attributed to either repo. Record it before anything runs.
      - name: Record resolved NDI-matlab revision
        shell: bash
        run: |
          MATLAB_SHA="$(git -C NDI-matlab rev-parse HEAD)"
          MATLAB_DESC="$(git -C NDI-matlab log -1 --format='%h %ad %s' --date=short)"
          PYTHON_SHA="$(git -C NDI-python rev-parse HEAD)"
          echo "NDI_MATLAB_SHA=$MATLAB_SHA" >> "$GITHUB_ENV"
          {
            echo "### Symmetry inputs"
            echo ''
            echo "| repo | ref requested | resolved SHA |"
            echo "| --- | --- | --- |"
            echo "| NDI-python | \`${{ github.head_ref || github.ref_name }}\` | \`$PYTHON_SHA\` |"
            echo "| NDI-matlab | \`${{ inputs.matlab_ref || github.head_ref || github.ref_name }}\` (fallback: main) | \`$MATLAB_SHA\` |"
            echo ''
            echo "NDI-matlab HEAD: $MATLAB_DESC"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Runtime setup ──────────────────────────────────────────────────
      - name: Start virtual display server
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4  # v2
        with:
          release: latest
          cache: true
          products: |
            Communications_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@8fe220fbaec9e119ec5081eb917c8e016e275f1e  # v1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install NDI-python
        working-directory: NDI-python
        run: |
          python -m pip install --upgrade pip
          python ndi_install.py --dev --no-validate --verbose

      # ── Download test datasets ────────────────────────────────────────
      - name: Download test datasets
        run: |
          curl -L -o /tmp/69a8705aa9ab25373cdc6563.tgz \
            https://github.com/Waltham-Data-Science/file-passing/raw/refs/heads/main/69a8705aa9ab25373cdc6563.tgz

      # ── Stage 1: MATLAB makeArtifacts ──────────────────────────────────
      # Scope by directory: matbox.installRequirements points at the
      # +ndi/+symmetry folder (which has its own narrow requirements.txt),
      # and TestSuite.fromFolder discovers tests in that directory tree.
      - name: "Stage 1: MATLAB makeArtifacts"
        uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659  # v2
        with:
          command: |
            cd("NDI-matlab");
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tools"));

            symDir = fullfile(pwd, "tests", "+ndi", "+symmetry");
            matbox.installRequirements(symDir);

            % Record MATLAB's tempdir. Python's symmetry conftest derives the
            % artifact root from tempfile.gettempdir(); MATLAB Stage 1 writes
            % under MATLAB's tempdir. Nothing verified the two resolve to the
            % same place, and if they diverge every read test skips and the job
            % goes green having compared nothing. The next step compares them.
            tempDirFile = fullfile(getenv("GITHUB_WORKSPACE"), "ndi_symmetry_matlab_tempdir.txt");
            fid = fopen(tempDirFile, "w");
            assert(fid > 0, "Could not write MATLAB tempdir file.");
            fprintf(fid, "%s", tempdir);
            fclose(fid);

            % Persist the fully-resolved search path (NDI dirs + the matbox
            % dependencies just installed) so Stage 3 can reuse this one
            % installation instead of running installRequirements a second
            % time. A second install re-validates the already-installed repos
            % and would fail any dependency that lacks a LICENSE/README.
            savedPathFile = fullfile(getenv("GITHUB_WORKSPACE"), "ndi_symmetry_matlabpath.txt");
            fid = fopen(savedPathFile, "w");
            assert(fid > 0, "Could not write saved MATLAB path file.");
            fprintf(fid, "%s", path());
            fclose(fid);

            import matlab.unittest.TestSuite
            import matlab.unittest.TestRunner

            suite = TestSuite.fromFolder( ...
                fullfile(symDir, "+makeArtifacts"), "IncludingSubfolders", true);
            fprintf("\n=== MATLAB makeArtifacts: %d test(s) ===\n", numel(suite));
            assert(~isempty(suite), "No MATLAB makeArtifacts tests found.")

            runner = TestRunner.withTextOutput("Verbosity", "Detailed");
            results = runner.run(suite);

            fprintf("\n=== MATLAB makeArtifacts: %d passed, %d failed ===\n", ...
                nnz([results.Passed]), nnz([results.Failed]));
            assert(all(~[results.Failed]), "MATLAB makeArtifacts failed")

      # ── Gate: the MATLAB producer must actually have produced ──────────
      #
      # Verified: with /tmp/NDI/symmetryTest absent -- exactly the state after a
      # Stage 1 that produced nothing -- the old Stage 2 command reported
      # "42 skipped in 1.35s" and exited 0. Every read test guards on
      # `if not artifact_dir.exists(): pytest.skip(...)`, 35 sites across 14
      # files, so the consumer side could not fail while the producer side
      # could. Two independent gates now close that: this step (the artifact
      # tree exists and both runtimes agree where it is) and
      # NDI_SYMMETRY_REQUIRE_ARTIFACTS below (individual artifacts cannot go
      # missing quietly).
      - name: Assert MATLAB and Python agree on the artifact root
        shell: bash
        run: |
          MATLAB_TMP="$(cat "$GITHUB_WORKSPACE/ndi_symmetry_matlab_tempdir.txt")"
          PYTHON_TMP="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          # Compare resolved paths: /tmp vs /private/tmp vs a trailing slash are
          # the same directory but different strings.
          MATLAB_REAL="$(python -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$MATLAB_TMP")"
          PYTHON_REAL="$(python -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$PYTHON_TMP")"
          echo "MATLAB tempdir: $MATLAB_TMP -> $MATLAB_REAL"
          echo "Python tempdir: $PYTHON_TMP -> $PYTHON_REAL"
          {
            echo ''
            echo "artifact root — MATLAB: \`$MATLAB_REAL\`, Python: \`$PYTHON_REAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MATLAB_REAL" != "$PYTHON_REAL" ]; then
            echo "::error::MATLAB and Python resolve different temp roots; every read test would skip and this job would pass having compared nothing."
            exit 1
          fi
          echo "SYMMETRY_BASE=$PYTHON_REAL/NDI/symmetryTest" >> "$GITHUB_ENV"

      - name: Assert MATLAB Stage 1 produced artifacts
        shell: bash
        run: |
          MATLAB_ARTIFACTS="$SYMMETRY_BASE/matlabArtifacts"
          if [ ! -d "$MATLAB_ARTIFACTS" ]; then
            echo "::error::Stage 1 produced no MATLAB artifacts at $MATLAB_ARTIFACTS"
            exit 1
          fi
          COUNT="$(find "$MATLAB_ARTIFACTS" -name '*.json' | wc -l | tr -d ' ')"
          echo "matlabArtifacts JSON files: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$MATLAB_ARTIFACTS contains no JSON artifacts"
            exit 1
          fi
          echo "- matlabArtifacts JSON files: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # ── Stage 2: Python makeArtifacts + readArtifacts ──────────────────
      - name: "Stage 2a: Python makeArtifacts"
        working-directory: NDI-python
        run: pytest tests/symmetry/make_artifacts/ -v --tb=short -rs

      - name: Assert Python Stage 2a produced artifacts
        shell: bash
        run: |
          PYTHON_ARTIFACTS="$SYMMETRY_BASE/pythonArtifacts"
          if [ ! -d "$PYTHON_ARTIFACTS" ]; then
            echo "::error::Python makeArtifacts produced nothing at $PYTHON_ARTIFACTS"
            exit 1
          fi
          COUNT="$(find "$PYTHON_ARTIFACTS" -name '*.json' | wc -l | tr -d ' ')"
          echo "pythonArtifacts JSON files: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$PYTHON_ARTIFACTS contains no JSON artifacts"
            exit 1
          fi
          echo "- pythonArtifacts JSON files: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # NDI_SYMMETRY_REQUIRE_ARTIFACTS=1 turns every pytest.skip in the
      # symmetry tree into a failure (tests/symmetry/conftest.py). Local
      # developers without MATLAB keep the skips; CI does not get to.
      - name: "Stage 2b: Python readArtifacts (no skips tolerated)"
        working-directory: NDI-python
        env:
          NDI_SYMMETRY_REQUIRE_ARTIFACTS: "1"
        run: pytest tests/symmetry/read_artifacts/ -v --tb=short -rs --strict-markers

      # ── Stage 3: MATLAB readArtifacts ──────────────────────────────────
      # Reuse the installation from Stage 1: restore the saved search path
      # instead of re-running installRequirements. The dependency files
      # persist on the runner between steps; only the path is lost when the
      # fresh MATLAB session starts. This avoids a redundant install and the
      # re-validation that install would perform on the existing repos.
      - name: "Stage 3: MATLAB readArtifacts (reads Python artifacts)"
        uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659  # v2
        with:
          command: |
            cd("NDI-matlab");

            savedPathFile = fullfile(getenv("GITHUB_WORKSPACE"), "ndi_symmetry_matlabpath.txt");
            assert(isfile(savedPathFile), ...
                "Saved MATLAB path from Stage 1 is missing; cannot reuse install.");
            path(fileread(savedPathFile));

            symDir = fullfile(pwd, "tests", "+ndi", "+symmetry");

            import matlab.unittest.TestSuite
            import matlab.unittest.TestRunner

            suite = TestSuite.fromFolder( ...
                fullfile(symDir, "+readArtifacts"), "IncludingSubfolders", true);
            fprintf("\n=== MATLAB readArtifacts: %d test(s) ===\n", numel(suite));
            assert(~isempty(suite), "No MATLAB readArtifacts tests found.")

            runner = TestRunner.withTextOutput("Verbosity", "Detailed");
            results = runner.run(suite);

            fprintf("\n=== MATLAB readArtifacts: %d passed, %d failed ===\n", ...
                nnz([results.Passed]), nnz([results.Failed]));
            assert(all(~[results.Failed]), "MATLAB readArtifacts failed")
