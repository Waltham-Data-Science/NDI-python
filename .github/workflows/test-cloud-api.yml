name: Test Cloud API

on:
  # Run once a day
  schedule:
    - cron: '0 0 * * *'

  # Allow manual runs from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-tests:
    name: Cloud API (User ${{ matrix.user }}, ${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        user: [1, 2]
        environment: [prod, dev]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with ndi_install.py
        run: |
          python -m pip install --upgrade pip
          python ndi_install.py --dev --no-validate --verbose

      - name: Run cloud API tests
        env:
          NDI_CLOUD_USERNAME: ${{ matrix.user == 1 && secrets.TEST_USER_1_USERNAME || secrets.TEST_USER_2_USERNAME }}
          NDI_CLOUD_PASSWORD: ${{ matrix.user == 1 && secrets.TEST_USER_1_PASSWORD || secrets.TEST_USER_2_PASSWORD }}
          CLOUD_API_ENVIRONMENT: ${{ matrix.environment }}
          # The MATLAB BYOL tests call DELETE /users/me/matlab-license, so
          # tests/_matlab_license_guard.py refuses to run unless this is set
          # explicitly. User 2 is the account ci.yml documents as having no
          # registered license, so the destructive tests run end-to-end and
          # clean up after themselves. User 1's license state is not
          # established, so it gets "true": the destructive tests skip
          # themselves and the teardown never calls clearMatlabLicense.
          NDI_CLOUD_TEST_USER_HAS_MATLAB_LICENSE: ${{ matrix.user == 1 && 'true' || 'false' }}
        run: |
          # All live cloud test files, not just test_cloud_live.py -- the
          # others were previously exercised only by ci.yml, so they had no
          # coverage on days when nobody opened a PR.
          pytest tests/test_cloud_*.py -v --tb=short
