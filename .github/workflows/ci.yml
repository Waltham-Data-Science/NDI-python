name: CI

on:
  push:
    branches: [main]
  # No branch filter: a PR targeting a feature branch needs lint and tests
  # just as much as one targeting main.
  pull_request:

env:
  # See the comment on the Pyraview build in ndi_install.py: pip's default
  # 15s network cap turns a slow PyPI slot into "No matching distribution
  # found". 600s here covers every pip subprocess the workflow runs.
  PIP_DEFAULT_TIMEOUT: "600"

jobs:
  lint:
    runs-on: ubuntu-latest
    # Only the lint job gets cancel-in-progress. The test job talks to the
    # live cloud, and cancelling it mid-run strands the datasets it created.
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

  bridge:
    name: MATLAB/Python bridge completeness
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bridge-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Two checkouts, laid out as siblings, because the check compares
      # NDI-matlab's +ndi/+cloud tree against this repo's bridge YAMLs.
      # No MATLAB runtime is needed -- it only reads the source tree --
      # so this stays a fast job rather than joining test-symmetry.yml.
      - uses: actions/checkout@v4
        with:
          path: NDI-python

      - name: Check out NDI-matlab (matching branch, fall back to main)
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          # Same pairing rule as test-symmetry.yml: a bridge entry usually
          # lands in the same feature branch as the MATLAB function it
          # records, so check that branch when it exists.
          ref: ${{ github.head_ref || github.ref_name }}
          path: NDI-matlab
        continue-on-error: true
        id: matlab_checkout_branch

      - name: Check out NDI-matlab (main fallback)
        if: steps.matlab_checkout_branch.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          ref: main
          path: NDI-matlab

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Check bridge completeness
        working-directory: NDI-python
        env:
          # Both repos are checked out above, so an absent MATLAB tree
          # means the checkout step broke. Fail instead of skipping --
          # a check that could not run must not report a pass (see #77).
          NDI_BRIDGE_CHECK_STRICT: "1"
        run: pytest tests/test_matlab_bridge_completeness.py -v --tb=short

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with ndi_install.py
        run: |
          python -m pip install --upgrade pip
          python ndi_install.py --dev --no-validate --verbose

      - name: Validate installation
        run: python -m ndi check

      - name: Run tests with coverage
        env:
          NDI_CLOUD_USERNAME: ${{ secrets.TEST_USER_2_USERNAME }}
          NDI_CLOUD_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
          # The CI test account does not have a registered MATLAB
          # license, so the destructive BYOL tests (DELETE
          # /users/me/matlab-license) are allowed to run; they will
          # clean up after themselves. The license guard in
          # tests/_matlab_license_guard.py enforces this at module-import
          # time and refuses to run if this variable is unset.
          NDI_CLOUD_TEST_USER_HAS_MATLAB_LICENSE: "false"
        run: |
          # Use sys.monitoring (PEP 669) on Python 3.12+ for faster coverage.
          # CTracer (sys.settrace) is catastrophically slow on 3.12 when
          # importing large packages like openminds (~6 min vs ~2 sec).
          COVERAGE_CORE=$(python -c "import sys; print('sysmon' if sys.version_info >= (3,12) else 'ctrace')")
          export COVERAGE_CORE
          pytest tests/ -v --tb=short --cov=src/ndi --cov-report=term-missing
