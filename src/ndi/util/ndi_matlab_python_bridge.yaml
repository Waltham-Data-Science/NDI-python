# ndi_matlab_python_bridge.yaml — src/ndi/util/
# The Primary Contract for the ndi.util namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: datestamp2datetime
    type: function
    matlab_path: "+ndi/+util/datestamp2datetime.m"
    python_path: "ndi/util/datestamp2datetime.py"
    input_arguments:
      - name: datestampStr
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: dt
        type_python: "datetime.datetime"
    decision_log: >
      Exact match. Converts an NDI datestamp string (ISO 8601 with
      milliseconds and timezone offset) to a Python datetime object in UTC.

  - name: downsampleTimeseries
    type: function
    matlab_path: "+ndi/+util/downsampleTimeseries.m"
    python_path: "ndi/util/downsampleTimeseries.py"
    input_arguments:
      - name: t_in
        type_matlab: "numeric | datetime (vector, mustBeNumericOrDatetime)"
        type_python: "np.ndarray"
      - name: d_in
        type_matlab: "(:,:) double {mustHaveCompatibleDimensions(d_in, t_in)}"
        type_python: "np.ndarray"
      - name: LP
        type_matlab: "double (scalar, positive)"
        type_python: "Annotated[float, Field(gt=0)]"
    output_arguments:
      - name: t_out
        type_python: "np.ndarray"
      - name: d_out
        type_python: "np.ndarray"
    decision_log: >
      Exact match. Downsamples a timeseries with anti-aliasing.
      If sampling frequency > 2*LP, applies a 4th-order Chebyshev
      Type I low-pass filter before downsampling; otherwise returns
      data unchanged. NOTE: MATLAB also accepts datetime vectors for
      t_in; Python only accepts np.ndarray.

  - name: getHexDiffFromFileObj
    type: function
    matlab_path: "+ndi/+util/getHexDiffFromFileObj.m"
    python_path: "ndi/util/getHexDiffFromFileObj.py"
    input_arguments:
      - name: file_obj1
        type_matlab: "(1,1) did.file.fileobj"
        type_python: "IO[bytes]"
      - name: file_obj2
        type_matlab: "(1,1) did.file.fileobj"
        type_python: "IO[bytes]"
      - name: chunkSize
        type_matlab: "double (scalar, positive)"
        type_python: "Annotated[int, Field(gt=0)]"
        default: "1048576"
    output_arguments:
      - name: are_identical
        type_python: "bool"
      - name: diff_output
        type_python: "str"
    decision_log: >
      Exact match. Compares two file-like objects chunk by chunk.
      Returns (True, '') if identical, or (False, hex_diff_string)
      for first mismatched chunk.

  - name: hexDiff
    type: function
    matlab_path: "+ndi/+util/hexDiff.m"
    python_path: "ndi/util/hexDiff.py"
    input_arguments:
      - name: filename1
        type_matlab: "char"
        type_python: "str | Path"
      - name: filename2
        type_matlab: "char"
        type_python: "str | Path"
      - name: StartByte
        type_matlab: "double (scalar, non-negative)"
        type_python: "Annotated[int, Field(ge=0)]"
        default: "0"
      - name: StopByte
        type_matlab: "double (scalar, non-negative)"
        type_python: "Annotated[int, Field(ge=0)] | None"
        default: "None"
    output_arguments: []
    decision_log: >
      Exact match. Compares two files and prints only the 16-byte
      lines where they differ. Output is printed to console (no return value).
      MATLAB default for StopByte is Inf; Python uses None (semantically equivalent).

  - name: hexDiffBytes
    type: function
    matlab_path: "+ndi/+util/hexDiffBytes.m"
    python_path: "ndi/util/hexDiffBytes.py"
    input_arguments:
      - name: data1
        type_matlab: "uint8 (vector)"
        type_python: "bytes"
      - name: data2
        type_matlab: "uint8 (vector)"
        type_python: "bytes"
      - name: StartOffset
        type_matlab: "double (scalar, non-negative)"
        type_python: "Annotated[int, Field(ge=0)]"
        default: "0"
    output_arguments:
      - name: diff_string
        type_python: "str"
    decision_log: >
      Exact match. Compares two byte sequences and returns a formatted
      hex diff string showing only differing 16-byte lines. Returns
      empty string if identical.

  - name: hexDump
    type: function
    matlab_path: "+ndi/+util/hexDump.m"
    python_path: "ndi/util/hexDump.py"
    input_arguments:
      - name: filename
        type_matlab: "char"
        type_python: "str | Path"
      - name: StartByte
        type_matlab: "double (scalar, non-negative)"
        type_python: "Annotated[int, Field(ge=0)]"
        default: "0"
      - name: StopByte
        type_matlab: "double (scalar, non-negative)"
        type_python: "Annotated[int, Field(ge=0)] | None"
        default: "None"
    output_arguments: []
    decision_log: >
      Exact match. Prints a hex dump of a file showing hexadecimal
      and ASCII content. Output is printed to console (no return value).
      MATLAB default for StopByte is Inf; Python uses None (semantically equivalent).

  - name: rehydrateJSONNanNull
    type: function
    matlab_path: "+ndi/+util/rehydrateJSONNanNull.m"
    python_path: "ndi/util/rehydrateJSONNanNull.py"
    input_arguments:
      - name: jsonText
        type_matlab: "char"
        type_python: "str"
      - name: nan_string
        type_matlab: "char"
        type_python: "str"
        default: "'\"__NDI__NaN__\"'"
      - name: inf_string
        type_matlab: "char"
        type_python: "str"
        default: "'\"__NDI__Infinity__\"'"
      - name: ninf_string
        type_matlab: "char"
        type_python: "str"
        default: "'\"__NDI__-Infinity__\"'"
    output_arguments:
      - name: rehydratedJsonText
        type_python: "str"
    decision_log: >
      Exact match. Replaces NDI sentinel strings for NaN, Infinity,
      and -Infinity in JSON text with Python-compatible representations.

  - name: sessionSummary
    type: function
    matlab_path: "+ndi/+util/sessionSummary.m"
    python_path: "ndi/util/session_summary.py"
    input_arguments:
      - name: session_obj
        type_matlab: "ndi.session"
        type_python: "Any"
    output_arguments:
      - name: summary
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match. Creates a summary dict of an ndi.session object
      for symmetry testing.

  - name: compareSessionSummary
    type: function
    matlab_path: "+ndi/+util/compareSessionSummary.m"
    python_path: "ndi/util/compare_session_summary.py"
    input_arguments:
      - name: summary1
        type_matlab: "struct"
        type_python: "dict[str, Any]"
      - name: summary2
        type_matlab: "struct"
        type_python: "dict[str, Any]"
      - name: excludeFiles
        type_matlab: "cell array of char"
        type_python: "list[str] | None"
        default: "None"
      - name: excludeFields
        type_matlab: "cell array of char"
        type_python: "list[str] | None"
        default: "None"
    output_arguments:
      - name: report
        type_python: "list[str]"
    decision_log: >
      Exact match. Compares two session summaries and returns a list
      of difference strings. Empty list means summaries match.

  - name: datasetSummary
    type: function
    matlab_path: "+ndi/+util/datasetSummary.m"
    python_path: "ndi/util/dataset_summary.py"
    input_arguments:
      - name: dataset_obj
        type_matlab: "ndi.dataset.Dataset"
        type_python: "Any"
    output_arguments:
      - name: summary
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match. Creates a summary dict of an ndi.dataset.Dataset
      object for symmetry testing.

  - name: compareDatasetSummary
    type: function
    matlab_path: "+ndi/+util/compareDatasetSummary.m"
    python_path: "ndi/util/compare_dataset_summary.py"
    input_arguments:
      - name: summary1
        type_matlab: "struct"
        type_python: "dict[str, Any]"
      - name: summary2
        type_matlab: "struct"
        type_python: "dict[str, Any]"
      - name: excludeFiles
        type_matlab: "cell array of char"
        type_python: "list[str] | None"
        default: "None"
      - name: excludeFields
        type_matlab: "cell array of char"
        type_python: "list[str] | None"
        default: "None"
    output_arguments:
      - name: report
        type_python: "list[str]"
    decision_log: >
      Exact match. Compares two dataset summaries and returns a list
      of difference strings. Delegates session-level comparison to
      compareSessionSummary.

  - name: unwrapTableCellContent
    type: function
    matlab_path: "+ndi/+util/unwrapTableCellContent.m"
    python_path: "ndi/util/unwrapTableCellContent.py"
    input_arguments:
      - name: cellValue
        type_matlab: "any"
        type_python: "Any"
    output_arguments:
      - name: unwrappedValue
        type_python: "Any"
    decision_log: >
      Exact match. Recursively unwraps nested lists (up to 10 levels)
      to retrieve the innermost value. Returns float('nan') if the
      value is None or an empty list (matching MATLAB's NaN for empty cells).

# =========================================================================
# Not ported / Not applicable
# =========================================================================
  # --- Folder-picker trio, ported into one module (#154) ------------------

  - name: chooseDatasetOrSession
    matlab_path: "+ndi/+util/chooseDatasetOrSession.m"
    matlab_last_sync_hash: "db5e45c6"
    python_path: "ndi/util/choose_directory.py"
    python_qualified: "choose_dataset_or_session"
    decision_log: >
      Opens a folder dialog and keeps asking until the chosen directory is
      an NDI session or dataset. MATLAB has one .m file per picker; Python
      groups the three into choose_directory.py, which names all three
      MATLAB counterparts in its module docstring. Ported with the
      navigator's add-dataset flows and never recorded until now.

  - name: chooseSession
    matlab_path: "+ndi/+util/chooseSession.m"
    matlab_last_sync_hash: "db5e45c6"
    python_path: "ndi/util/choose_directory.py"
    python_qualified: "choose_session"
    decision_log: >
      The session-only picker. Python keeps MATLAB's acceptance rule: an
      NDI folder created before the object-type marker existed is accepted
      by choose_dataset_or_session (ACCEPT_ALL) but NOT by choose_session
      or choose_dataset, which need to know which of the two it is.

  - name: chooseDataset
    matlab_path: "+ndi/+util/chooseDataset.m"
    matlab_last_sync_hash: "db5e45c6"
    python_path: "ndi/util/choose_directory.py"
    python_qualified: "choose_dataset"
    decision_log: "The dataset-only picker. Same rule as chooseSession above."

  # --- Safe dotted-path struct access (#154) -----------------------------

  - name: getfieldpath
    matlab_path: "+ndi/+util/getfieldpath.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/document.py"
    python_qualified: "ndi_document._get_nested_property"
    decision_log: >
      Reads a nested field named by a dotted path ('base.name').
      MATLAB's reason for existing does NOT transfer: it replaces
      eval(['s.' name]), which lets a property name read from a document
      execute arbitrary code, and it therefore validates every segment
      with isvarname and raises on a bad one. Python never had that
      exposure -- the path is split and used as dict keys, which cannot
      execute anything -- so the validation is absent by design rather
      than by omission.
      One behavioural difference worth knowing: MATLAB RAISES
      ndi:util:getfieldpath:invalidPropertyName for a malformed path;
      Python returns the caller's default. A caller porting MATLAB code
      that relies on the error to detect a typo will get a silent default
      instead.

  - name: assignPropertyPath
    matlab_path: "+ndi/+util/assignPropertyPath.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/document.py"
    python_qualified: "ndi_document._set_nested_property"
    decision_log: >
      The write half of getfieldpath: assigns through a dotted path,
      creating intermediate levels as needed. Same story -- MATLAB exists
      to avoid eval(['s.' name '=value']) and validates with isvarname;
      Python assigns into nested dicts, where a crafted key is only ever a
      key. Both create missing intermediate levels, so the shapes agree.


not_applicable:

  - name: readNPY
    matlab_path: "+ndi/+util/readNPY.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_applicable
    decision_log: >
      A dependency-free .npy reader MATLAB needs because it cannot read
      NumPy's own format. Python reads it with numpy.load, which is where
      the format comes from -- there is nothing to port. NDI-python
      already relies on that: the kilosort waveform reader says so in a
      comment at ndi/fun/probe/import_/kilosort/waveform_data.py, noting
      "MATLAB reads these through ndi.util.readNPY; numpy reads its own".

  - name: ListDialog
    matlab_path: "+ndi/+util/ListDialog.m"
    matlab_last_sync_hash: "46672187"
    status: not_yet_ported
    decision_log: >
      A modal list picker replacing MATLAB's LISTDLG, whose font size is
      fixed and tiny; styled in the NDI Cloud colours. Its MATLAB callers
      are the cloud organization dialogs (selectOrganization,
      organizationLabels -- both recorded not_yet_ported in
      src/ndi/cloud/) and the navigator's datasetsPane.
      Python has no equivalent because it does not need the workaround:
      Qt list widgets take a font like any other widget, so a Python
      caller would build a QListWidget rather than a styled replacement
      for a built-in it does not have. What is NOT yet ported is the
      organization picker that MATLAB uses this for -- that gap is
      recorded on selectOrganization, not here.

  - name: removehiddenfilegroups
    matlab_path: "+ndi/+util/removehiddenfilegroups.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_applicable
    decision_log: >
      Both languages drop hidden files from epoch file groups, and both do
      it for the same reason: macOS AppleDouble shadow files
      ('._Epoch6_g0_t0.imec0.ap.bin') otherwise match '#'-style filematch
      patterns and produce spurious duplicate epochs sharing the genuine
      epoch's epoch_id. MATLAB factors it into this helper; Python does it
      inline in ndi_file_navigator.selectfilegroups.
      DIVERGENCE, recorded rather than fixed: the two do not agree on a
      MIXED group. MATLAB drops the WHOLE GROUP if any member is hidden;
      Python strips the hidden members and keeps the group if anything
      visible remains. For a group that is entirely shadow files the
      outcomes match (both drop it), which is the case the helper was
      written for. For a group holding one real file and one shadow file
      MATLAB discards the epoch and Python keeps it -- Python's answer is
      arguably the better one, but it is not MATLAB's, and epoch counts
      are exactly what the cross-language symmetry tests compare. Changing
      either side needs a symmetry case first.

  - name: writeSparse
    matlab_path: "+ndi/+util/writeSparse.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Writes a sparse N-dimensional array in the NDI .ndisparse binary
      format; ndi.element.ensemble uses it to store spike matrices.
      NDI-python has no reader or writer for that format: nothing under
      src/ or tests/ mentions .ndisparse, and ndi.element.ensemble builds
      its neuron-by-spike matrix in memory with scipy.sparse.lil_matrix
      instead.
      Worth flagging because MATLAB's own header makes a claim about
      Python that does not hold here: it says the file "can be read back
      with ndi.util.readSparse in MATLAB or with ndi_sparse.read_sparse in
      Python; the two implementations produce byte-for-byte identical
      files". No ndi_sparse module is importable from NDI-python's
      dependency set (ndi-compress installs 'ndicompress', which exposes
      compression helpers and no sparse reader). Until that module exists
      and is depended on, a .ndisparse file written by MATLAB cannot be
      read by NDI-python -- which matters, because ensembles are meant to
      move between the two toolboxes. Same shape of unverified
      cross-language claim as safeLocalFilename's, recorded in
      src/ndi/cloud/.

  - name: readSparse
    matlab_path: "+ndi/+util/readSparse.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      The read half of writeSparse above, and it lands with it. MATLAB
      returns a native sparse matrix for 2-D and a subs/vals/size struct
      for N-D, since MATLAB has no N-dimensional sparse type; a Python
      port would not need that split, scipy.sparse and an (indices,
      values, shape) triple covering both.

  - name: choosefile
    matlab_path: "+ndi/+util/choosefile.m"
    status: not_applicable
    decision_log: "MATLAB GUI dialog (inputdlg). No Python equivalent needed."

  - name: choosefileordir
    matlab_path: "+ndi/+util/choosefileordir.m"
    status: not_applicable
    decision_log: "MATLAB GUI dialog. No Python equivalent needed."

  - name: toolboxdir
    matlab_path: "+ndi/+util/toolboxdir.m"
    status: not_applicable
    decision_log: >
      MATLAB-specific path resolution using mfilename('fullpath').
      Python uses ndi.common.ndi_common_PathConstants instead.

  - name: "+openminds sub-package"
    matlab_path: "+ndi/+util/+openminds/"
    status: ported_elsewhere
    decision_log: >
      MATLAB sub-package with find_instance_name.m and
      find_techniques_names.m. Ported to ndi.openminds_convert
      module in Python (different namespace).
