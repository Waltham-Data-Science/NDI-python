    decision_log: >
      MATLAB documentation generation utilities (all_documents2markdown,
      build, calcbuild, concatenateFiles, docfun, document2markdown,
      schemastructure2docstructure). Python uses Sphinx/mkdocs instead.

      Confirmed against NDI-matlab c2bd3af62, the package's last-touching
      commit (a calcbuild crash fix for a missing
      documentation_structure.mat). The package still holds exactly the seven
      files named above. Nothing to port: Python's docs are built by mkdocs.
