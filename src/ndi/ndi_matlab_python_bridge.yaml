  # =========================================================================
  # ndi.data namespace
  # =========================================================================
  - name: data.evaluate_fitcurve
    matlab_path: "+ndi/+data/evaluate_fitcurve.m"
    matlab_last_sync_hash: "76b0673"
    python_path: "ndi/data.py"
    status: ported
    decision_log: >
      Ported (issue #78 tranche a). Reachable as ndi.data.evaluate_fitcurve at
      its MATLAB mirror path -- +ndi/+data/ becomes ndi/data.py. Reads
      fit_equation, fit_parameters, fit_parameter_names,
      fit_independent_variable_names and fit_dependent_variable_names from a
      fitcurve document and evaluates the equation at the supplied
      independent-variable values. Errors on the same three cases MATLAB
      errors on: more than one independent variable, more than one dependent
      variable, and parameter-name/value length mismatch. Tests in
      tests/test_data_evaluate_fitcurve.py.

      DELIBERATE DIVERGENCE FROM MATLAB: MATLAB runs the stored equation
      through eval(); Python parses it into an AST and walks that AST against
      an allow-list (numeric constants, the declared names, arithmetic, a
      short list of numpy functions). A fitcurve document is data and can
      arrive from a shared or cloud dataset, so treating its equation as
      executable code was refused; the trade-off is that an equation MATLAB
      would run may be refused here, and the error names what was refused so
      a legitimate equation can be supported by widening the list rather than
      by loosening the walker. TestSandboxRefusesEscapes pins this.

      NOTE: A second implementation exists at ndi.fun.data.evaluate_fitcurve.
      It uses a different (Python-invented) document schema
      (fit_variable_names, fit_parameter_values) and a restricted eval, not
      an AST walker. It predates this port and stays for backward
      compatibility with tests/test_phase1_gaps.py; ndi.data.evaluate_fitcurve
      is the canonical mirror-path entry. Consolidation onto one
      implementation is its own follow-up.

  # =========================================================================
  # ndi.setup namespace — MATLAB lab configurations
  # =========================================================================
  - name: setup
    matlab_path: "+ndi/+setup/"
    matlab_last_sync_hash: "03c79fa48"
    python_path: "ndi/setup/"
    status: ported
    decision_log: >
      Python equivalent of MATLAB lab setup wizards. The ndi.setup.lab()
      function reads DAQ system JSON configs from ndi_common/daq_systems/
      and creates the corresponding documents in a session. Per-lab
      wrappers (e.g. ndi.setup.rayolab) call lab() with a fixed name.
      Usage: ndi.setup.lab(session, "vhlab"); ndi.setup.rayolab(session).

      Examined against NDI-matlab 03c79fa48, the last commit touching anything
      under +ndi/+setup/, and TWO THINGS THE RECORD IMPLIED WERE THERE WERE
      NOT. (1) FIVE OF SIX PER-LAB WRAPPERS WERE MISSING. The record says
      "Per-lab wrappers (e.g. ndi.setup.rayolab) call lab() with a fixed
      name"; MATLAB has six -- angeluccilab, dbkatzlab, marderlab, rayolab,
      vhlab, yangyangwang -- and only rayolab existed here, so
      ndi.setup.vhlab(session), the call every MATLAB example for that lab
      uses, raised AttributeError. All five added, each a thin wrapper naming
      its own lab, and each verified to have a daq_systems directory to load.
      The six are exported as LAB_WRAPPERS. (2) labNames HAD NO COUNTERPART.
      MATLAB's ndi.setup.labNames lists the labs installed under
      ndi_common/daq_systems, sorted, dropping hidden directories, returning
      empty when there are none -- so there was no way to ask which labs a
      given install knows about. Ported. Ten lab directories ship on BOTH
      sides, so labNames returns ten while only six have a named wrapper; that
      is MATLAB's arrangement too, and lab(session, name) reaches the other
      four. ONE DIVERGENCE RECORDED RATHER THAN CHANGED: MATLAB's lab is
      lab(labName, ref, dirname) and CREATES and returns an ndi.session.dir;
      the Python lab is lab(session, lab_name) and returns None, taking a
      session the caller already made. The arguments are in a different order
      and play different roles, and the usage line in this record has always
      said so. Changing the signature now would break every caller for a
      cosmetic gain.

