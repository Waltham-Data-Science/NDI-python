# ndi_matlab_python_bridge.yaml — src/ndi/
# The Primary Contract for the root ndi namespace.
#
# NOTE: There is NO ndi.OBJECT class in MATLAB. The "base object" concept
# is factored into two mixable concerns:
#   - ndi.ido (identity/unique ID, inheriting from did.ido)
#   - ndi.documentservice (document persistence interface)
# Classes that need both inherit from both explicitly.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

conventions:
  regex_dialect: >
    All user-facing regex patterns in NDI (e.g. ndi.file.navigator
    filematch, ndi.file.navigator.rhd_series series/ancillary patterns)
    are written in MATLAB regex syntax. The Python port translates them
    to Python re syntax internally via
    ndi.util.matlab_regex.matlab_to_python_regex at the point of
    compile. New python code that consumes user-provided regex must
    route through this converter.

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: version
    type: function
    matlab_path: "+ndi/version.m"
    matlab_last_sync_hash: "8533e9f89"
    python_path: "ndi/__init__.py"
    input_arguments: []
    output_arguments:
      - name: v
        type_matlab: "char"
        type_python: "str"
      - name: url
        type_matlab: "char"
        type_python: "str"
    decision_log: >
      Exact match. Returns 2-tuple (version_string, url).
      MATLAB uses git describe; Python does the same with subprocess
      fallback to __version__. Synchronized 2026-03-13.

      Examined against NDI-matlab 8533e9f89, the file's last-touching commit.
      Same two outputs and the same fallback structure: ask git for the
      version of the checkout this file lives in, and fall back when there is
      no git. Each necessarily reports its OWN distribution -- MATLAB returns
      the NDI-matlab URL and vlt.git.git_repo_version, the port returns the
      NDI-python URL and `git describe --always --dirty`, falling back to the
      packaged __version__ where MATLAB falls back to the unexpanded
      '$Format:%H$' placeholder. Nothing to port.

  - name: setup.lab
    type: function
    matlab_path: "+ndi/+setup/lab.m"
    matlab_last_sync_hash: "68431eb38"
    python_path: "ndi/setup/lab.py"
    input_arguments:
      - name: labName
        type_matlab: "char"
        type_python: "str"
      - name: ref
        type_matlab: "char"
        type_python: "N/A (Python takes session directly)"
      - name: dirname
        type_matlab: "char"
        type_python: "N/A (Python takes session directly)"
    output_arguments:
      - name: S
        type_matlab: "ndi.session.dir"
        type_python: "None (mutates session in-place)"
    decision_log: >
      Reads DAQ system JSON configs from ndi_common/daq_systems/<labName>/
      and adds corresponding documents to the session. MATLAB creates
      the session.dir from (ref, dirname); Python takes a session that
      the caller has already created and adds documents to it.
      Python signature: ndi.setup.lab(session, lab_name).

  - name: setup.rayolab
    type: function
    matlab_path: "+ndi/+setup/rayolab.m"
    matlab_last_sync_hash: "ffe310085"
    python_path: "ndi/setup/rayolab.py"
    input_arguments:
      - name: ref
        type_matlab: "char"
        type_python: "N/A (Python takes session directly)"
      - name: dirname
        type_matlab: "char"
        type_python: "N/A (Python takes session directly)"
    output_arguments:
      - name: S
        type_matlab: "ndi.session.dir"
        type_python: "None (mutates session in-place)"
    decision_log: >
      Thin wrapper that calls setup.lab(session, "rayolab"). Loads the
      rayo_intanSeries and rayo_stim DAQ system configs from
      ndi_common/daq_systems/rayolab/. The rayo_stim system pairs with
      the RayoLabStims metadata reader. MATLAB rayolab.m calls
      ndi.setup.lab('rayolab', ref, dirname); Python rayolab(session)
      calls lab(session, "rayolab"). Python signature:
      ndi.setup.rayolab(session).

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.ido - Identity Object
  # =========================================================================
  - name: ido
    type: class
    matlab_path: "+ndi/ido.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/ido.py"
    python_class: "ndi_ido"
    inherits: "did.ido"

    properties:
      - name: id
        type_matlab: "char (inherited from did.ido)"
        type_python: "str"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: >
          Inherited from did.ido. Unique hexadecimal identifier
          sorted by creation time.

    methods:
      - name: ido
        kind: constructor
        input_arguments:
          - name: identifier
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_ido"
        decision_log: "Exact match. Generates new ID if none provided."

      - name: unique_id
        kind: static
        input_arguments: []
        output_arguments:
          - name: id
            type_python: "str"
        decision_log: >
          Exact match. Generates a new unique hex ID from current time
          and random number. Synchronized 2026-03-13.

      - name: is_valid
        kind: static
        input_arguments:
          - name: id_value
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match. Validates ID format (hex_hex or UUID).
          Synchronized 2026-03-13.

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: "Mapped to Python __eq__. Compares by ID string."

    decision_log: >
      Thin wrapper over did.ido. Python ndi_ido class provides the same
      unique ID generation. Synchronized 2026-03-13.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      MATLAB's ndi.ido is an empty subclass of did.ido -- it adds nothing but
      the name -- so the contract to check is the one its help states: a
      hexadecimal identifier built from the current date/time and a random
      number, sorting alphabetically in creation order. The port builds 16 hex
      digits of microsecond time, an underscore, and 16 random hex digits,
      which satisfies both that and the 33-character shape
      ndi.validators.mustBeID enforces. Nothing to port.

  # =========================================================================
  # ndi.documentservice - ndi_document Interface Mixin
  # =========================================================================
  - name: documentservice
    type: class
    matlab_path: "+ndi/documentservice.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/documentservice.py"
    python_class: "ndi_documentservice"
    inherits: ""

    properties: []

    methods:
      - name: documentservice
        kind: constructor
        input_arguments: []
        output_arguments:
          - name: obj
            type_python: "ndi_documentservice"
        decision_log: "Exact match."

      - name: newdocument
        input_arguments: []
        output_arguments:
          - name: ndi_document_obj
            type_python: "Any"
        decision_log: >
          Abstract-like method. Subclasses override to create
          specific document types.

      - name: searchquery
        input_arguments: []
        output_arguments:
          - name: sq
            type_python: "Any"
        decision_log: >
          Abstract-like method. Subclasses override to return
          queries matching their documents.

      - name: load_element_doc
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: doc
            type_python: "ndi_document | None"
        decision_log: >
          Exact match. Loads this object's document from the database
          via searchquery(). Returns None if not found.
          Synchronized 2026-03-13.

      - name: document_id
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: doc_id
            type_python: "str | None"
        decision_log: >
          Exact match. Returns the document ID for this object,
          or None if not found. Synchronized 2026-03-13.

    decision_log: >
      Interface class for document persistence. Any NDI class that
      can be stored as a document inherits from this.
      Synchronized 2026-03-13.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      Same two methods, newdocument and searchquery, and the same intent --
      MATLAB's own comment calls it "just an abstract class". The mechanism
      differs and is worth knowing: MATLAB's base methods are CONCRETE and
      return empty, so a subclass that overrides neither still instantiates
      and works, where the port marks both @abstractmethod on an ABC, so such
      a subclass raises TypeError at construction. Python enforces what MATLAB
      only documents. Harmless today -- all ten subclasses in this tree
      implement both -- and recorded because a future subclass would meet the
      difference immediately.

  # =========================================================================
  # ndi.document - ndi_document Model
  # =========================================================================
  - name: document
    type: class
    matlab_path: "+ndi/document.m"
    matlab_last_sync_hash: "00155f885"
    python_path: "ndi/document.py"
    python_class: "ndi_document"
    inherits: "did.document"

    properties:
      - name: document_properties
        type_matlab: "struct"
        type_python: "dict | DotDict"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "MATLAB struct; Python uses a dict-like DotDict."

    methods:
      # --- Constructor ---
      - name: document
        kind: constructor
        input_arguments:
          - name: document_type
            type_matlab: "char"
            type_python: "str"
          - name: varargin
            type_matlab: "varargin"
            type_python: "**kwargs"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: "Exact match."

      # --- Identity ---
      - name: id
        input_arguments: []
        output_arguments:
          - name: doc_id
            type_python: "str"
        decision_log: "Exact match. Returns base.id. Implemented as @property."

      - name: session_id
        input_arguments: []
        output_arguments:
          - name: sid
            type_python: "str"
        decision_log: "Exact match. Returns base.session_id. Implemented as @property."

      - name: doc_unique_id
        input_arguments: []
        output_arguments:
          - name: uid
            type_python: "str"
        decision_log: >
          "Exact match. Alias for id()." was not true against
          NDI-matlab 00155f885: there was no doc_unique_id on the Python
          class at all, so ported MATLAB code got an AttributeError rather
          than the id. MATLAB keeps the method and warns
          'depricated..use ID() instead' on every call. Added, raising the
          same flag as a DeprecationWarning.

      - name: get_fuid
        input_arguments:
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: fuid
            type_python: "str"
        decision_log: >
          NOT PREVIOUSLY RECORDED AND NOT PREVIOUSLY PORTED. MATLAB
          00155f885 defines get_fuid, and it is the lookup
          ndi.fun.doc.findFuid and both the session and dataset diff
          functions use to decide whether two documents point at the same
          stored file -- so its absence blocked those ports rather than
          merely leaving a gap. Returns the uid of the FIRST location of
          the named file, and '' when the document has no files, does not
          declare the name, or has not had it added. Ported.

      # --- ndi_session ---
      - name: set_session_id
        input_arguments:
          - name: session_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: "Exact match. Returns self for chaining."

      # --- Dependency Management ---
      - name: set_dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: dependency_value
            type_matlab: "char"
            type_python: "str"
          - name: error_if_not_found
            type_matlab: "logical"
            type_python: "bool"
            default: "True"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: "Exact match. Returns self for chaining."

      - name: dependency
        input_arguments: []
        output_arguments:
          - name: names
            type_python: "list[str]"
          - name: dependency_structures
            type_python: "list[dict]"
        decision_log: >
          Exact match. Returns 2-tuple (names, dependency_structures).
          Synchronized 2026-03-13.

      - name: dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: error_if_not_found
            type_matlab: "logical"
            type_python: "bool"
            default: "True"
        output_arguments:
          - name: value
            type_python: "str | None"
        decision_log: >
          Exact match. Returns dependency value by name. Raises
          KeyError if not found and error_if_not_found is True.
          Synchronized 2026-03-13.

      - name: dependency_value_n
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: error_if_not_found
            type_matlab: "logical"
            type_python: "bool"
            default: "True"
        output_arguments:
          - name: values
            type_python: "list[str]"
        decision_log: >
          Exact match. Returns values from numbered dependency list
          (e.g., element_1, element_2). Synchronized 2026-03-13.

      - name: add_dependency_value_n
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: value
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: >
          Exact match. Appends to numbered dependency list.
          Returns self for chaining. Synchronized 2026-03-13.

      - name: remove_dependency_value_n
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: index
            type_matlab: "integer"
            type_python: "int | None"
            default: "None"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: >
          Exact match. Removes numbered dependency by index, or all
          if index is None. Returns self for chaining.
          Synchronized 2026-03-13.

      # --- File Management ---
      - name: has_files
        input_arguments: []
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match. Checks if document has associated files.
          Synchronized 2026-03-13.

      - name: add_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: location
            type_matlab: "char"
            type_python: "str"
          - name: ingest
            type_matlab: "logical"
            type_python: "bool | None"
            default: "None"
          - name: delete_original
            type_matlab: "logical"
            type_python: "bool | None"
            default: "None"
          - name: location_type
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: >
          Exact match. Adds a file to the document's file_info.
          Auto-detects location_type from URL scheme.
          Returns self for chaining. Synchronized 2026-03-13.

      - name: remove_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: location
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: >
          Exact match. Removes a file or specific location from
          the document. Returns self for chaining.
          Synchronized 2026-03-13.

      - name: current_file_list
        input_arguments: []
        output_arguments:
          - name: file_names
            type_python: "list[str]"
        decision_log: >
          Exact match. Returns list of file names currently
          associated with this document. Synchronized 2026-03-13.

      # --- ndi_document Class Information ---
      - name: doc_class
        input_arguments: []
        output_arguments:
          - name: class_name
            type_python: "str"
        decision_log: >
          Exact match. Returns the document class name
          (e.g., 'base', 'element'). Synchronized 2026-03-13.

      - name: doc_superclass
        input_arguments: []
        output_arguments:
          - name: superclass_names
            type_python: "list[str]"
        decision_log: >
          Exact match. Returns list of superclass names by
          walking the document_class hierarchy.
          Synchronized 2026-03-13.

      - name: doc_isa
        input_arguments:
          - name: document_class
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match. Checks if document is of a class or
          inherits from it. Synchronized 2026-03-13.

      # --- Serialization ---
      - name: write
        input_arguments:
          - name: filePrefix
            type_matlab: "char"
            type_python: "str"
          - name: indent
            type_python: "int"
            default: "2"
          - name: writeLocalFiles
            type_matlab: "options.writeLocalFiles (logical, default false)"
            type_python: "bool"
            default: "False"
          - name: session
            type_matlab: "options.session (ndi.session, default empty)"
            type_python: "Any"
            default: "None"
        output_arguments: []
        decision_log: >
          RESOLVED against NDI-matlab 00155f885, and followed MATLAB per the
          maintainer's decision (2026-09-08); the previous entry recorded this
          divergence and deliberately left it. The first argument is a file
          PREFIX -- MATLAB writes [FILEPREFIX '.json'] and names each
          associated file [FILEPREFIX '_' FILENAME], so it identifies a SET of
          files, not one -- where the port treated it as the complete
          filename. USER-VISIBLE: a caller passing 'doc.json' now writes
          doc.json.json, which is what MATLAB does with the same argument.
          writeLocalFiles and session were not ported at all, so a document's
          files were never written alongside; both are here now, including
          MATLAB's rule that without a session it copies the first location
          whose location_type is 'file' and WARNS rather than raising when
          there is none. The JSON itself also diverged: MATLAB encodes with
          'ConvertInfAndNaN', true, which writes null, where json.dump writes
          the bare tokens NaN and Infinity -- not JSON, so a document carrying
          an unmeasured value produced a file Python could read back and a
          conforming parser could not. Python keeps indent (MATLAB's
          PrettyPrint is not adjustable) and still creates missing parent
          directories, which MATLAB does not; that cannot change where the
          file lands, only whether the call succeeds. MATLAB's own
          DocumentWriteTest is three cases and only testWriteJSON had a Python
          counterpart; testWriteLocalFiles and testWriteSessionFiles now do
          too.

      - name: setproperties
        input_arguments:
          - name: varargin
            type_matlab: "name-value pairs"
            type_python: "**kwargs"
        output_arguments:
          - name: ndi_document_obj
            type_python: "ndi_document"
        decision_log: >
          Exact match. Sets multiple properties at once using
          dot-notation paths. Returns self for chaining.
          Synchronized 2026-03-13.

      - name: validate
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
            default: "None"
        output_arguments:
          - name: result
            type_python: "ValidationResult"
        decision_log: >
          Exact match. Three-tier validation: this-class properties,
          superclass properties, dependency references.
          Synchronized 2026-03-13.

      # --- Conversion ---
      - name: to_table
        input_arguments: []
        output_arguments:
          - name: T
            type_matlab: "table"
            type_python: "pd.DataFrame"
        decision_log: >
          "Exact match" did not hold against NDI-matlab 00155f885, in three
          separate ways, each of which changed COLUMN NAMES -- the one thing
          a caller joins two tables on. (1) MATLAB passes an abbreviation
          list to vlt.data.flattenstruct2table, read from
          ndi_common/config/ndi_document2table_abbreviations.json, and
          strrep's each pair over the flattened names in FILE ORDER:
          orientation_direction_tuning becomes oridir, tuning_curve becomes
          TC, and eight more. That file ships in this repository too; it was
          simply never read, so every abbreviated field's column was named
          differently in the two languages. (2) MATLAB removes depends_on
          and files with rmfield, which reaches the TOP LEVEL ONLY; the port
          skipped those two names at EVERY depth, silently deleting any
          same-named field nested inside another property. (3) A property
          holding a list of records is a struct array in MATLAB, and
          flattenstruct2table gives it one column per sub-field
          (document_class.superclasses.definition) holding every record's
          value; the port emitted one column holding the raw list
          (document_class.superclasses). All three are fixed and covered by
          tests/test_document_to_table_and_fuid.py.

      - name: to_dict
        input_arguments: []
        output_arguments:
          - name: d
            type_python: "dict"
        decision_log: >
          Python-specific convenience. Returns deep copy of
          document_properties. Synchronized 2026-03-13.

      - name: to_json
        input_arguments:
          - name: indent
            type_python: "int"
            default: "2"
        output_arguments:
          - name: json_str
            type_python: "str"
        decision_log: >
          Python-specific convenience. Returns JSON string
          representation. Synchronized 2026-03-13.

      # --- Merging ---
      - name: plus
        input_arguments:
          - name: other
            type_matlab: "ndi.document"
            type_python: "ndi_document"
        output_arguments:
          - name: merged_doc
            type_python: "ndi_document"
        decision_log: >
          Exact match. Merges two documents. Fields in self take
          precedence. Mapped to Python __add__. Merges superclasses,
          dependencies, and file_lists. Synchronized 2026-03-13.

      # --- Equality ---
      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: "Mapped to Python __eq__. Compares by document ID."

      # --- Static Methods ---
      - name: find_doc_by_id
        kind: static
        input_arguments:
          - name: doc_array
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
          - name: doc_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc
            type_python: "ndi_document | None"
          - name: index
            type_python: "int | None"
        decision_log: >
          Exact match. Finds a document in a list by ID. Returns
          2-tuple (document, index) or (None, None).
          Synchronized 2026-03-13.

      - name: find_newest
        kind: static
        input_arguments:
          - name: doc_array
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
        output_arguments:
          - name: newest_doc
            type_python: "ndi_document"
          - name: index
            type_python: "int"
          - name: datestamp
            type_python: "datetime"
        decision_log: >
          Exact match. Finds the newest document by datestamp.
          Returns 3-tuple (doc, index, datestamp).
          Synchronized 2026-03-13.

      - name: read_blank_definition
        kind: static
        input_arguments:
          - name: document_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: definition
            type_python: "dict"
        decision_log: >
          The merge holds against NDI-matlab 00155f885 -- superclass labels,
          depends_on and files.file_list are unioned and de-duplicated on
          both sides. Two differences that are not defects but that a reader
          should know. MATLAB's argument is named jsonfilelocationstring and
          is a definition LOCATION such as $NDIDOCUMENTPATH/element.json;
          the Python argument is a bare type name, with a recursive search
          of the document tree behind it, and it accepts a relative path
          too. And MATLAB MEMOISES: a persistent containers.Map keyed on the
          location string, cleared by the sentinel call
          ndi.document.readblankdefinition('--clear-cache'). The port
          re-reads and re-merges every time, which for a deep hierarchy
          means re-globbing the tree once per superclass per document. That
          is a speed difference rather than a behavioural one, and the
          sentinel has nothing to clear here, so neither is ported.

    decision_log: >
      Core document class. Both languages use JSON schema-based
      document definitions. Synchronized 2026-03-13.


      Examined method by method against NDI-matlab 00155f885, the file's
      last-touching commit, and it did not hold. Four of the per-method
      records above are now corrected rather than re-dated: to_table named
      its columns differently in three ways, write means a file PREFIX in
      MATLAB and a filename here, doc_unique_id was recorded as an "exact
      match" for a method that did not exist, and get_fuid was not recorded
      at all. to_table, doc_unique_id and get_fuid are ported; see each.
      The class-level record also said inherits: "" where MATLAB is
      classdef document < did.document -- and the file carries a comment
      explaining that the subclassing is deliberate and why the constructor
      resolves the definition itself before calling did.document's struct
      path. Corrected to did.document. Python's ndi_document remains a
      standalone class that re-implements did.document's surface, which is
      the same arrangement ndi_ido already has.


      Two constructor details that DO hold and are worth writing down.
      MATLAB calls reset_file_info() after building from a definition, so
      files.file_info exists before add_file; the port creates it lazily
      inside add_file instead, and both refuse a name that is not in
      files.file_list. And the port additionally normalises depends_on,
      files.file_info and document_class.superclasses from a bare dict to a
      one-element list, which is the shape MATLAB's jsonencode produces for
      a single element -- MATLAB needs no such step because jsondecode
      makes it a 1x1 struct that its own code indexes identically.

  # =========================================================================
  # ndi.query - ndi_database ndi_query
  # =========================================================================
  - name: query
    type: class
    matlab_path: "+ndi/query.m"
    matlab_last_sync_hash: "1f2f4ace4"
    python_path: "ndi/query.py"
    python_class: "ndi_query"
    inherits: "did.query"

    properties:
      - name: searchstructure
        type_matlab: "struct"
        type_python: "list[dict]"
        decision_log: "Inherited from did.query."
      - name: field
        type_python: "str"
        decision_log: >
          Computed property. Returns the field being queried from
          search_structure. Synchronized 2026-03-13.
      - name: operator
        type_python: "str | None"
        decision_log: >
          Computed property. Returns the Python-style operator
          mapped from DID operation. Synchronized 2026-03-13.
      - name: value
        type_python: "Any"
        decision_log: >
          Computed property. Returns the query value (param1).
          Synchronized 2026-03-13.
      - name: queries
        type_python: "list[ndi_query]"
        decision_log: >
          List of sub-queries for composite (AND/OR) queries.
          Synchronized 2026-03-13.

    methods:
      # --- Constructor ---
      - name: query
        kind: constructor
        input_arguments:
          - name: field
            type_matlab: "char"
            type_python: "str"
          - name: op
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
          - name: param1
            type_matlab: "any"
            type_python: "Any"
            default: "None"
          - name: param2
            type_matlab: "any"
            type_python: "Any"
            default: "None"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Exact match."

      # --- NDI-specific query types ---
      - name: isa
        input_arguments:
          - name: class_name
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Exact match. Shorthand for isa query."

      - name: depends_on
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: dependency_value
            type_matlab: "char"
            type_python: "str"
            default: "''"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Exact match. Shorthand for depends_on query."

      # --- Comparison operators (MATLAB overloads -> Python __eq__ etc.) ---
      - name: eq
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          MATLAB == operator overload. Mapped to Python __eq__.
          Resolves to exact_string or exact_number.
          Synchronized 2026-03-13.

      - name: ne
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          MATLAB ~= operator overload. Mapped to Python __ne__.
          Synchronized 2026-03-13.

      - name: lt
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "MATLAB < overload. Mapped to Python __lt__. Synchronized 2026-03-13."

      - name: le
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "MATLAB <= overload. Mapped to Python __le__. Synchronized 2026-03-13."

      - name: gt
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "MATLAB > overload. Mapped to Python __gt__. Synchronized 2026-03-13."

      - name: ge
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "MATLAB >= overload. Mapped to Python __ge__. Synchronized 2026-03-13."

      # --- Logical operators ---
      - name: and
        input_arguments:
          - name: other
            type_matlab: "ndi.query"
            type_python: "ndi_query"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          MATLAB & overload. Mapped to Python __and__. Concatenates
          search_structures for AND semantics. Synchronized 2026-03-13.

      - name: or
        input_arguments:
          - name: other
            type_matlab: "ndi.query"
            type_python: "ndi_query"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          MATLAB | overload. Mapped to Python __or__. Creates nested
          'or' operation in search_structure. Synchronized 2026-03-13.

      - name: not
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          MATLAB ~ prefix. Mapped to Python __invert__. Negates all
          operations by toggling ~ prefix. Synchronized 2026-03-13.

      # --- String/pattern methods ---
      - name: contains
        input_arguments:
          - name: value
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Resolves to contains_string operation.
          Synchronized 2026-03-13.

      - name: match
        input_arguments:
          - name: pattern
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Resolves to regexp operation.
          Synchronized 2026-03-13.

      - name: equals
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Explicit equality method. Same as == operator.
          Synchronized 2026-03-13.

      # --- Comparison methods (explicit) ---
      - name: less_than
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Explicit less-than method. Synchronized 2026-03-13."

      - name: less_than_or_equal_to
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Explicit less-than-or-equal method. Synchronized 2026-03-13."

      - name: greater_than
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Explicit greater-than method. Synchronized 2026-03-13."

      - name: greater_than_or_equal_to
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: "Explicit greater-than-or-equal method. Synchronized 2026-03-13."

      # --- Field existence ---
      - name: has_field
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Resolves to hasfield operation.
          Synchronized 2026-03-13.

      - name: has_member
        input_arguments:
          - name: value
            type_python: "Any"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Resolves to hasmember operation.
          Synchronized 2026-03-13.

      # --- Static factory methods ---
      - name: all
        kind: static
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Returns query matching all documents
          (isa 'base'). Synchronized 2026-03-13.

      - name: none
        kind: static
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Returns query matching no documents.
          Synchronized 2026-03-13.

      - name: from_search
        kind: classmethod
        input_arguments:
          - name: field
            type_matlab: "char"
            type_python: "str"
          - name: operation
            type_matlab: "char"
            type_python: "str"
          - name: param1
            type_matlab: "any"
            type_python: "Any"
            default: "''"
          - name: param2
            type_matlab: "any"
            type_python: "Any"
            default: "''"
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. MATLAB-compatible factory method. Creates
          query using DID-style operation strings.
          Synchronized 2026-03-13.

      # --- Serialization ---
      - name: to_searchstructure
        input_arguments: []
        output_arguments:
          - name: ss
            type_python: "dict"
        decision_log: >
          Converts query to search structure dict with Python-style
          operators. Synchronized 2026-03-13.

      - name: to_search_structure
        input_arguments: []
        output_arguments:
          - name: ss
            type_python: "dict | list[dict]"
        decision_log: >
          Converts to DID-python compatible search structure.
          Unwraps single-element lists. Synchronized 2026-03-13.

    decision_log: >
      ndi_database query class supporting operators: regexp,
      exact_string, contains_string, exact_number, lessthan,
      lessthaneq, greaterthan, greaterthaneq, hasfield, isa,
      depends_on, hasmember, and negated versions.
      Module also exposes top-level convenience functions all(),
      none(), from_search() for MATLAB parity.
      Synchronized 2026-03-13.

      Examined against NDI-matlab 1f2f4ace4, the file's last-touching commit.
      The operator vocabulary matches and then some. MATLAB validates the
      operation with mustBeMember against a fixed list -- exact_string,
      contains_string, exact_number, lessthan(eq), greaterthan(eq), hasfield,
      hasanysubfield_contains_string, hasmember, isa, depends_on, regexp, or,
      and each of those negated with a leading '~'. The port validates too,
      through did.query, which carries the same set plus
      hasanysubfield_exact_string, and it implements the '~' negation. A first
      reading of NDI's own Python source suggests
      hasanysubfield_contains_string is missing because it is not spelled
      there; it is not -- it comes from did.query, which is also where
      MATLAB's 'isa' expands to it. Nothing to port.

  # =========================================================================
  # ndi.preferences - Singleton user-preferences store
  # =========================================================================
  - name: preferences
    type: class
    matlab_path: "+ndi/preferences.m"
    matlab_last_sync_hash: "362060795"
    python_path: "ndi/preferences.py"
    python_class: "Preferences"
    inherits: ""

    decision_log: >
      matlab and python both persist to ~/.ndi/NDI_Preferences.json on
      all platforms (synchronized 2026-05-11).
      NDI-matlab 9a9150e7c and the two commits before it add preference items:
      GUI/Navigator/SessionAppPackages, which this port already has, and three
      Parallel items (OpenPoolIfNone, UseDefaultNumberOfWorkers,
      NumberOfWorkers). The Parallel three are not ported and should not be:
      they govern MATLAB's parpool, where each worker is a separate MATLAB
      process, so a pool nobody asked for costs start-up time and a multiple of
      MATLAB's memory. Python has no parpool and no NDI code that would read
      them; a preference nothing consults is worse than an absent one.

