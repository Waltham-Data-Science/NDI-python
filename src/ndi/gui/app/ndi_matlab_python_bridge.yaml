          apps: the model -- probes, epochs, view, everything the rules act
          on -- is constructed either way, so all of it is testable with no
          display attached.
      - name: build
        access_matlab: private
        decision_log: >
          Ported to PySide6. The figure becomes a QMainWindow, the
          uicontrol row a QToolBar-style header of QComboBoxes, the axes a
          matplotlib FigureCanvasQTAgg, and the pan/zoom scrollbars
