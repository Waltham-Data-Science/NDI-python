# ndi_matlab_python_bridge.yaml — src/ndi/gui/app/
# The Primary Contract for the ndi.gui.app namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  - name: sessionApp
    type: class
    matlab_path: "+ndi/+gui/+app/sessionApp.m"
    matlab_last_sync_hash: "eaec593"
    python_path: "ndi/gui/app/session_app.py"
    python_class: "SessionApp"
    inherits: "handle"

    properties:
      - name: Name
        type_matlab: "string (Abstract, Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          The menu label. MATLAB declares it an abstract constant, so a
          subclass supplying none is abstract and meta.class reports it.
          Python has no such declaration to read, so Name is an ANNOTATION
          with no value: a subclass that never assigns it does not have the
          attribute, and that absence is what is_abstract tests.
      - name: Category
        type_matlab: "string (Constant, optional)"
        type_python: "ClassVar[str]"
        decision_log: >
          Optional submenu grouping, "" for none. Concrete in both
          languages, so an app opts INTO a submenu rather than out of one.

    methods:
      - name: list
        kind: static
        input_arguments:
          - name: packages
            type_matlab: "string (1,:)"
            type_python: "Sequence[str] | None"
            default: "None (ndi.gui.app.SessionApp.default_packages())"
        output_arguments:
          - name: apps
            type_matlab: "struct array with fields Name, Class, Category"
            type_python: "list[dict[str, str]]"
        decision_log: >
          Ported. MATLAB reads meta.package/meta.class, which catalogues the
          path without loading anything; Python has no such catalogue, so
          the modules are imported and their classes inspected. A module
          that will not import is SKIPPED rather than raised, mirroring
          MATLAB's tolerance of packages that are not on the path: one
          broken app must not empty the Apps menu. The struct array becomes
          a list of dicts, keeping MATLAB's capitalised field names, because
          the consumer (ndi.gui.nav.datasets_pane.session_apps) already
          speaks in Label/Launch/Category records.
      - name: defaultPackages
        kind: static
        python_name: default_packages
        input_arguments: []
        output_arguments:
          - name: pkgs
            type_matlab: "string (1,:)"
            type_python: "list[str]"
        decision_log: >
          Ported. ndi.gui.app and ndi.app, plus the packages the user named
          in the GUI.Navigator.SessionAppPackages preference, duplicates
          dropped and order kept. An unreadable preference leaves the
          built-ins in both languages.
      - name: launch
        kind: static
        input_arguments:
          - name: className
            type_matlab: "string | char"
            type_python: "str | type"
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: obj
            type_matlab: "the constructed app (cleared when nargout == 0)"
            type_python: "Any (always returned)"
        decision_log: >
          Ported. MATLAB's feval(className, session) becomes an import plus
          a call; the class object itself is accepted as well as its name.
          DIVERGENCE, deliberate: MATLAB may discard the app because its
          figure holds it through guidata, while a Python app that nothing
          references can be garbage-collected -- window and all -- as soon
          as launch returns. So launch always returns the object and
          DatasetsPane.launch_app keeps it in DatasetsPane.launched_apps.
      - name: parsePackageList
        kind: static
        python_name: parse_package_list
        access_matlab: private
        input_arguments:
          - name: value
            type_matlab: "string | char"
            type_python: "Any"
        output_arguments:
          - name: pkgs
            type_python: "list[str]"
        decision_log: >
          Ported. Splits on semicolons and commas, trims, drops empties.
          Python also accepts a list or tuple: ndi.preferences stores values
          verbatim with no type validation, so a user who set a list gets
          what they meant rather than the repr of one.
      - name: classesInPackages
        kind: static
        python_name: classes_in_packages
        access_matlab: private
        input_arguments:
          - name: packages
            type_python: "Sequence[str]"
        output_arguments:
          - name: classes
            type_matlab: "string (1,:) of class names"
            type_python: "list[type]"
        decision_log: >
          Ported, returning the classes themselves rather than their names,
          since Python has already imported them by the time it can name
          them. Recurses into subpackages, as MATLAB does through
          meta.package.PackageList. Only classes whose __module__ IS the
          module being scanned are reported, so a class re-exported by a
          package __init__ is attributed to the module that defines it and
          is never counted twice.
      - name: isSessionApp
        kind: static
        python_name: is_session_app
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "Any"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          MATLAB walks SuperclassList recursively; Python's issubclass does
          that walk itself. The interface is not an app: cls is SessionApp
          returns False in both languages (MATLAB never lists it because it
          is abstract).
      - name: isAbstract
        kind: static
        python_name: is_abstract
        access_matlab: "n/a (MATLAB reads meta.class.Abstract)"
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          NEW in Python, standing in for MATLAB's meta.class.Abstract: true
          when the class is abc-abstract, or when it never supplied a Name.
      - name: readName
        kind: static
        python_name: read_name
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: name
            type_python: "str"
        decision_log: >
          Ported, including MATLAB's fallback to the class's own name when
          the label cannot be read.
      - name: readCategory
        kind: static
        python_name: read_category
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: cat
            type_python: "str"
        decision_log: 'Ported. "" when the app declares no Category.'

  - name: ElectrodeDataExport
    type: class
    matlab_path: "+ndi/+gui/+app/ElectrodeDataExport.m"
    matlab_last_sync_hash: "1b99d29"
    python_path: "ndi/gui/app/electrode_data_export.py"
    python_class: "ElectrodeDataExport"
    inherits: "ndi.gui.app.sessionApp"

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Electrode Data Export", VERBATIM from MATLAB. The menu label is
          user-visible text, so a Pythonised one would be a divergence a
          user could see. The class name is MATLAB's for the same reason
          (PYTHON_PORTING_GUIDE section 2); the module holding it is
          snake_case, as every ported ndi.gui module is.
      - name: session
        type_matlab: "ndi.session (private)"
        type_python: "Any (public attribute)"
        decision_log: >
          The session being exported. Public here because the app is
          constructed and then driven by tests and by DatasetsPane, and
          Python has no private access to enforce anyway.
      - name: exporters
        type_matlab: "struct array (name, dir, bin)"
        type_python: "tuple[Exporter, ...]"
        decision_log: >
          MATLAB's struct array of supported sorters becomes a tuple of
          frozen Exporter dataclasses. Same three fields, same order, and
          the same extension point: add a row to support another sorter.

    methods:
      - name: ElectrodeDataExport
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        decision_log: >
          Ported. Python adds keyword-only position and build arguments:
          build=False constructs the app without a window, which is what
          lets the label, selection and geometry logic be tested with no
          display. MATLAB always builds.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported. MATLAB's uifigure/uigridlayout become a QWidget with
          box layouts, in the same four rows and with the same NDI Cloud
          colours from ndi.gui.cloudColors.
      - name: loadProbes
        kind: private
        python_name: load_probes
        decision_log: >
          Ported. getprobes('type','n-trode'); a session that raises lists
          nothing, as MATLAB's try/catch does.
      - name: refreshProbeList
        kind: private
        python_name: refresh_probe_list
        decision_log: >
          Ported, keeping the selection BY INDEX as MATLAB does. The label
          of the probe just exported is exactly the one that changes, so a
          selection kept by text would drop it.
      - name: exportedSorters
        kind: private
        python_name: exported_sorters
        input_arguments:
          - name: probe
            type_python: "Any"
        output_arguments:
          - name: names
            type_matlab: "cell array of char"
            type_python: "list[str]"
        decision_log: >
          Ported. Reads the filesystem through ndi.fun.file.elementDirectory,
          so an export written under the legacy '|' folder name still counts.
      - name: updateButtonState
        kind: private
        python_name: update_button_state
        decision_log: >
          Ported. Python also RETURNS the new state, so the rule can be
          asserted without reaching into the widget.
      - name: exporterByName
        kind: private
        python_name: exporter_by_name
        decision_log: >
          Ported. Returns None for an unknown name where MATLAB would index
          with an empty subscript.
      - name: doExport
        kind: private
        python_name: do_export
        output_arguments:
          - name: errors
            type_matlab: "none (uialert only)"
            type_python: "list[str]"
        decision_log: >
          Ported, including the missing-geometry confirmation defaulting to
          Cancel and the one progress bar shared across the selection.
          Python returns the per-probe error messages as well as showing
          them, so what failed is assertable. The export loop itself is
          split out as export_probes, which is the part that takes minutes
          and the part worth testing without dialogs.
      - name: i_makeBar / i_updateBar / i_closeBar
        kind: "local functions"
        python_name: "_make_bar / _update_bar / _close_bar"
        decision_log: >
          Ported as module helpers, each swallowing every failure as MATLAB
          does: a progress component that will not load must cost the user
          their progress bar and not their export. _process_events stands in
          for MATLAB's drawnow.
      - name: onOff
        kind: "local function"
        decision_log: >
          NOT PORTED, and not needed: it converts a logical to MATLAB's
          'on'/'off' Enable strings, and Qt's setEnabled takes the bool.

  - name: stimulusDecoder
    type: class
    matlab_path: "+ndi/+gui/+app/stimulusDecoder.m"
    matlab_last_sync_hash: "104c29e"
    python_path: "ndi/gui/app/stimulus_decoder.py"
    python_class: "stimulusDecoder"
    inherits: "ndi.gui.app.sessionApp"

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Stimulus Decoder", VERBATIM from MATLAB, as is the class name
          (PYTHON_PORTING_GUIDE section 2). The class name starts lowercase
          because the .m file does; a PascalCase alias StimulusDecoder is
          bound to the same class for callers who would rather not write it.
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Stimulus", verbatim: it is the submenu title the navigator draws,
          so a Pythonised one would be a user-visible divergence.
      - name: "stimulators / epochIds / decodedEpochs / presDocs / controlLabeledEpochs"
        type_matlab: "cell arrays (private)"
        type_python: "list[Any] / list[str] (public attributes)"
        decision_log: >
          Same five pieces of state, same meaning, kept parallel the same
          way: presDocs[i] is the document of decodedEpochs[i], which is what
          lets the parameter panels refill without a database read per click.
          Public here because the app is driven by tests and by DatasetsPane,
          and Python has no private access to enforce.

    methods:
      - name: stimulusDecoder
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        decision_log: >
          Ported, including the wait indicator over the first database reads.
          Python adds keyword-only position and build arguments; build=False
          constructs the app with no window, which is what lets the markers,
          selection and refusal rules be tested with no display.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported. uifigure/uigridlayout become a QWidget with box layouts, in
          the same six rows and the same 40/60 split, with the NDI Cloud
          colours from ndi.gui.cloudColors.
      - name: sessionPath
        kind: private
        python_name: session_path
        decision_log: 'Ported. "" when the session will not name a path.'
      - name: reloadProbes
        kind: private
        python_name: reload_probes
        decision_log: >
          Ported, split: load_stimulators reads the session, probe_labels
          renders the dropdown items, reload_probes drives the widget. The
          split is what makes the first two testable without Qt.
      - name: selectedProbe
        kind: private
        python_name: selected_probe
        decision_log: >
          Ported. MATLAB reads the dropdown's ItemsData (the probe index);
          Qt has no such field, so the current INDEX indexes self.stimulators,
          which is kept in dropdown order for exactly that.
      - name: onProbeChanged
        kind: private
        python_name: on_probe_changed
        decision_log: "Ported."
      - name: reloadEpochs
        kind: private
        python_name: reload_epochs
        decision_log: >
          Ported, keeping the selection BY EPOCH ID as MATLAB does: the
          markers change as epochs are decoded, and after switching probes
          the same row number means a different epoch.
      - name: decodedEpochIds
        kind: private
        python_name: decoded_epoch_ids
        output_arguments:
          - name: ids
            type_python: "list[str]"
        decision_log: >
          Ported, including the document cache (self.pres_docs, parallel to
          the returned ids) that keeps this to one database read per reload.
      - name: controlLabeledEpochIds
        kind: private
        python_name: control_labeled_epoch_ids
        decision_log: >
          Ported. A control_stimulus_ids document depends on a
          stimulus_presentation, not on the probe, so the route back to an
          epoch is through the cached presentation documents. MATLAB's
          containers.Map becomes a dict.
      - name: presDocsForEpochs
        kind: private
        python_name: pres_docs_for_epochs
        decision_log: "Ported."
      - name: clearEpochList
        kind: private
        python_name: clear_epoch_list
        decision_log: "Ported."
      - name: selectedEpochIds
        kind: private
        python_name: selected_epoch_ids
        decision_log: >
          Ported. Qt has no ItemsData, so the selected ROWS index
          self.epoch_ids -- and a list holding only a placeholder row
          ("(no stimulus epochs)") selects nothing, as MATLAB's empty
          ItemsData does.
      - name: updateButtonState
        kind: private
        python_name: update_button_state
        decision_log: >
          Ported, with the two rules split out as can_run_decoder and
          can_label_controls so each is assertable without a widget. Run
          follows the selection; Label follows the PROBE having a decoded
          epoch, because labeling has no per-epoch filter.
      - name: onEpochSelectionChanged
        kind: private
        python_name: on_epoch_selection_changed
        decision_log: "Ported."
      - name: updateStimulusInfo / setInfoMessage
        kind: private
        python_name: update_stimulus_info / stimulus_info
        decision_log: >
          Ported. stimulus_info decides what the panels say and is pure;
          update_stimulus_info puts it in the widgets. MATLAB's uitextarea
          becomes a read-only QPlainTextEdit and its uitable a QTableWidget.
      - name: valueToText
        kind: private
        python_name: value_to_text
        decision_log: >
          Ported as a module function. MATLAB's mat2str for numeric and
          logical values, element-by-element for cells and strings; an
          integer-valued float loses its trailing ".0", as mat2str does.
      - name: runDecoder
        kind: private
        python_name: run_decoder
        output_arguments:
          - name: newdocs
            type_matlab: "none (uialert only)"
            type_python: "list[ndi_document]"
        decision_log: >
          Ported, including the "every selected epoch is already decoded"
          refusal that points at the overwrite box. The refusal wording is
          split out as decode_refusal so it is testable; Python also returns
          the documents written as well as reporting them.
      - name: runControlLabels
        kind: private
        python_name: run_control_labels
        decision_log: >
          Ported, with its three refusals split out as label_refusal for the
          same reason.
      - name: finishRun / withWait / clearWait
        kind: private
        python_name: _run_guarded / with_wait / set_busy
        decision_log: >
          Ported in shape rather than in mechanism. MATLAB's uiprogressdlg is
          a modal indeterminate dialog; Qt's equivalent needs an event loop of
          its own to stay responsive, so the wait is a disabled window with a
          status line instead -- the same "this is working, do not press
          again" signal without a second loop. with_wait still nests, as
          MATLAB's does, restoring the outer message rather than blanking it.
      - name: onOff
        kind: "local function"
        decision_log: >
          NOT PORTED, and not needed: it converts a logical to MATLAB's
          'on'/'off' Enable strings, and Qt's setEnabled takes the bool.

  # -----------------------------------------------------------------------
  # NOT YET PORTED: the other apps that adopt the interface
  # -----------------------------------------------------------------------
  #   ElectrodeMap, ensembleMaker, katzExporter, kiasort, pipelineEditor,
  #   pyraview, spikeSorterImporter, stimulusResponse, vhNDISpikeSorter
  #
  # Three are blocked on subsystems outside this repo (ndi.cpipeline for the
  # pipeline editor, the sorters' own toolboxes for kiasort and
  # vhNDISpikeSorter); the rest are each their own piece of work. Nothing
  # here needs revisiting when they land: an app reaches the navigator's
  # Apps menu by subclassing SessionApp, and by nothing else. See
  # Waltham-Data-Science/NDI-python#122.

# =========================================================================
# Module-level helpers (Python only)
# =========================================================================
functions:

  - name: class_name
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. The fully qualified name of a class, as list() reports it
      in the Class field and launch() resolves.

  - name: import_module
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Imports a module or returns None. Standing in for the
      part of MATLAB's meta.package lookup that simply finds nothing when a
      package is not on the path.

  - name: walk_modules
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. A module and, if it is a package, everything beneath it.
      The recursion MATLAB does through meta.package.PackageList.

  - name: resolve_class
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Turns the Class string back into the class, which
      MATLAB's feval does implicitly. Raises ValueError when the name names
      nothing importable, or names something that is not a class.

  - name: unique_stable
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: "Python only. MATLAB's unique(..., 'stable')."
