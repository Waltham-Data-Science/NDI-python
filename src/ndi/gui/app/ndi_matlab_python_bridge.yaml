        type_matlab: "current_data / current_time / current_level / current_data_t0 / current_data_t1 / loaded_pixel_span / loaded_view_duration (private)"
        type_python: "same names, instance attributes"
        decision_log: >
          Kept name for name, because they are what needs_reload reads.
          MATLAB's comment about spiking_info living on the handle object
          rather than in appdata has no Python equivalent to make: an
          attribute on the object is already a reference.

    methods:
      - name: pyraview
        kind: constructor
        input_arguments:
          - name: session
