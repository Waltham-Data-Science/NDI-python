      - name: controlCallback / dispatch
        python_name: "the _on_* slots"
        access_matlab: private
        decision_log: >
          DIVERGENCE of mechanism, not behaviour. MATLAB routes every
          control through one callback that switches on a command string,
          because callbacks are wired by Tag; Qt connects each signal to
          its own slot. The commands map one to one:
          probe/epoch/band/mapping/spacing/pan/zoom/spiking/reset.
      - name: update_epoch_list
        python_name: epoch_items
        access_matlab: private
        decision_log: >
          Ported as a rule that returns the list, with _sync_epoch_dropdown
          putting it in the widget. MATLAB's placeholder -- a single space
          that carries no epoch -- is kept exactly (EMPTY_EPOCH_ITEM), as
          is the "No probes found" entry, because both are user-visible.
      - name: check_and_load
        access_matlab: private
        decision_log: >
          Ported. Finds the pyraview document for this probe, epoch and
          band, and builds it with make_pyraview_doc when there is none.
          The query is ndi.query on the four fields MATLAB uses; the
          exact-string form is this repo's 4-argument positional one, since
          ndi_query has no .exact_string method.
      - name: update_spiking_list_ui / apply_spiking_sort / sortSpikingInfo
        python_name: _sync_spiking_list / sort_spiking_info
        access_matlab: "private / static private"
        decision_log: >
          Ported, with the sort itself a module-level function: by_channel
          descending, then relabelled and recoloured from COLOR_CYCLE,
          which is MATLAB's cycle in MATLAB's order. Colours are what the
          user matches ticks to waveforms by, so they are not a place to
          differ.
      - name: ensure_spike_times_loaded
        access_matlab: private
        decision_log: >
          Ported, and lazy in both languages for the same reason: reading
          spike times for hundreds of units up front is what made the
          earlier function version slow to open.
      - name: update_spiking_plot / update_spike_overlay
        python_name: draw_spike_overlay / spike_lines
        access_matlab: private
        decision_log: >
          Ported, split: spike_lines is the transform (through
          transformSpikeData) and draw_spike_overlay puts it on the axes.
          MATLAB's bring_ticks_to_front is not ported -- matplotlib takes a
          zorder on the artist rather than reordering Children.
      - name: waveform_reset_x / waveform_zoom_x
        python_name: reset_x
        access_matlab: private
        decision_log: >
          Ported as one method. MATLAB has two because its zoom mode is a
          figure mode that must be turned off before the limits can be set;
          matplotlib has no such mode to clear.
      - name: update_spacing
        python_name: set_spacing / spacing_or_default
        access_matlab: private
        decision_log: >
          Ported. The rule -- a positive number, or DEFAULT_SPACING when
          the box holds anything else -- is a module-level function, so
          "what does this typo do" is answerable without a window.
      - name: update_from_scrollbars / update_scrollbars / update_pan_slider / onZoomPan
        python_name: set_pan / set_zoom / sync_scrollbars / pan_slider_state
        access_matlab: private
        decision_log: >
          Ported. duration_for_zoom and zoom_for_duration are MATLAB's
          logarithmic map, quantised to the same ZOOM_STEPS notches, so the
          slider steps through the same durations in both ports; the pan
          slider carries milliseconds because a Qt slider is integer-valued
          where MATLAB's is not.
      - name: update_view
        access_matlab: private
        decision_log: >
          Ported, and the one method worth reading twice: needs_reload is
          MATLAB's reload rule verbatim -- the view left the buffer, the
          pixel span changed by more than a tenth, or the view is under 80%
          of the duration last read for -- and everything else pans by
          moving the x limits. WHICH LEVEL to read is not decided here in
          either port; both ask the library.
      - name: plot_data
        access_matlab: private
        decision_log: >
          Ported, split into plot_lines (the transform) and plot_data (the
          drawing), through transformPlotData in both.
      - name: emptySpikingInfo
        kind: static
        python_name: "(none)"
        access_matlab: private
        decision_log: >
          Not ported. MATLAB needs a 0x0 struct with the right fields so
          the array can be grown; Python's empty list needs no shape.

  # -----------------------------------------------------------------------
  - name: vhNDISpikeSorter
    type: class
    matlab_path: "+ndi/+gui/+app/vhNDISpikeSorter.m"
    matlab_last_sync_hash: "0e2caa0"
    python_path: "ndi/gui/app/vh_ndi_spike_sorter.py"
    python_class: "vhNDISpikeSorter"
    inherits: "ndi.gui.app.sessionApp"

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "VHLab Spike Sorter", VERBATIM from MATLAB, as is the class name
          (PYTHON_PORTING_GUIDE section 2). The class name starts lowercase
          because the .m file does; a PascalCase alias VHNDISpikeSorter is
          bound to the same class for callers who would rather not write it.
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Spike Sorters", verbatim: it is the submenu title the navigator
          draws. This is the first app in that submenu; kiasort joins it.
      - name: LauncherFcn
        type_matlab: "string (Constant, private)"
        type_python: "module constant LAUNCHER, split into LAUNCHER_MODULE
          and LAUNCHER_FUNCTION"
        decision_log: >
          'vhNDISpikeSorter.spikesorting', unchanged: it is the EXTERNAL
          contract, the name of a function in vhlab-library-matlab. Public
          here rather than private because the availability rule is tested
          without a window, which is the split every app in this package
          makes.

    methods:
      - name: vhNDISpikeSorter
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        decision_log: >
          Ported. Python adds keyword-only position and build arguments;
          build=False constructs the app with no window, which is what lets
          the availability rule and the messages be tested with no display.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported. uifigure/uigridlayout become a QWidget with a box layout,
          in the same three rows and with the NDI Cloud colours from
          ndi.gui.cloudColors. The status label keeps MATLAB's WordWrap: the
          message is two sentences in a 460px window and is cut off mid-word
          without it, losing the actionable half.
      - name: isAvailable
        kind: private
        python_name: is_available
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          Ported in MEANING rather than mechanism, and this is the one place
          the two languages genuinely differ. MATLAB asks
          which('vhNDISpikeSorter.spikesorting') -- is that package function
          on the MATLAB path? Python asks whether the same NAME can be
          imported and called, via the module-level resolve_launcher.

          BE CLEAR: vhlab-library-matlab is MATLAB and has no Python build,
          so on a stock Python install this answers False and always will.
          It is written against the name rather than as a hardcoded "no" for
          two reasons: it is a faithful port of MATLAB's contract, and a lab
          that grows a Python launcher of that name (a binding, a
          reimplementation, a MATLAB-engine shim) gets a working button with
          no change to NDI.

          Every resolution failure is None, not an exception -- module
          absent, module raises on import, function missing, name not
          callable. All four mean "cannot launch" to this app, and a window
          that will not open cannot tell the user why.
      - name: refreshAvailability
        kind: private
        python_name: refresh_availability
        decision_log: >
          Ported. Python also RETURNS the state, so the rule can be asserted
          without reaching into the widget. Availability is asked fresh
          rather than cached, as MATLAB asks it: a library can appear while
          the window is open.
      - name: openSorter
        kind: private
        python_name: open_sorter
        output_arguments:
          - name: result
            type_matlab: "none"
            type_python: "Any (whatever the sorter returns)"
        decision_log: >
          Ported, including MATLAB's re-check at the press: the window may
          have been open a while, and calling into a launcher that has gone
          would be worse than saying so. MATLAB's
          feval(LauncherFcn, 'ndiSession', obj.session) becomes
          launcher(ndiSession=session); the keyword keeps MATLAB's spelling
          because it is the sorter's contract, not NDI's.

          MESSAGE DIVERGENCE, deliberate: MATLAB's unavailable text says the
          package "was not found on the MATLAB path. Install / add
          vhlab-library-matlab to use it." Said to a Python user that would
          send them after a pip package that does not exist. The Python text
          says the library is MATLAB, and names the two things that do work:
          run the sorter from MATLAB, or make a Python
          vhNDISpikeSorter.spikesorting importable.
      - name: onOff
        kind: "local function"
        decision_log: >
          NOT PORTED, and not needed: it converts a logical to MATLAB's
          'on'/'off' Enable strings, and Qt's setEnabled takes the bool.

  - name: kiasort
    type: class
    matlab_path: "+ndi/+gui/+app/kiasort.m"
    matlab_last_sync_hash: "0203294"
    python_path: "ndi/gui/app/kiasort.py"
    python_class: "kiasort"
    inherits: "ndi.gui.app.sessionApp"

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Kiasort", VERBATIM from MATLAB, as is the class name
          (PYTHON_PORTING_GUIDE section 2). The class name starts lowercase
          because the .m file does; a PascalCase alias Kiasort is bound to
          the same class for callers who would rather not write it.
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Spike Sorters", verbatim: the submenu title the navigator draws.
          Shared with vhNDISpikeSorter.
      - name: "kiasort_dir, binaryFileName, subdir"
        type_matlab: "char (private, defaulted)"
        type_python: "str constructor keyword"
        decision_log: >
          Ported. MATLAB defaults 'kiasort', 'kiasort.bin', 'kiasort_output'
          are the module-level DEFAULT_KIASORT_DIR / DEFAULT_BINARY_NAME /
          DEFAULT_SUBDIR and the constructor accepts overrides, so a
          non-default export layout stays a single-callsite change and the
          rules can be tested against a fixture path.
      - name: "ProbeList, RunButton, CurateButton, StatusLabel, ConfigChecks, ConfigNums"
        type_matlab: "handle (private)"
        type_python: "attributes on the instance"
        decision_log: >
          Ported. MATLAB's uilistbox, uibutton, uilabel and containers.Map of
          uicheckbox/uieditfield handles become a QListWidget, two
          QPushButtons, a QLabel, and two dict[str, QWidget]s -- checkboxes
          keyed by MATLAB's cfg field name (verbatim: those keys reach
          ndi.fun.probe.import_.kiasort.run as cfg_overrides), and numeric
          fields the same. QCheckBox for booleans; QSpinBox for integer
          fields and QDoubleSpinBox for float fields (integer flag from
          NUM_OPTIONS).
      - name: probes
        type_matlab: "cell (private)"
        type_python: "list on the instance"
        decision_log: >
          Ported. Loaded from session.getprobes(type='n-trode') in
          load_probes(), which try/catches as MATLAB does so that a session
          that cannot list its probes still opens the window.

    methods:
      - name: kiasort
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        decision_log: >
          Ported. Python adds keyword-only position, kiasort_dir,
          binary_file_name, subdir and build arguments; build=False
          constructs the app with no window -- probes are loaded, statuses
          read -- which is what lets every model decision be tested with no
          display.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported. MATLAB's uifigure/uigridlayout become a QWidget with box
          and grid layouts, in the same seven rows and with the NDI Cloud
          colours from ndi.gui.cloudColors. Config checkboxes and numeric
          fields are laid out from the module-level CHECK_OPTIONS and
          NUM_OPTIONS tables, which mirror MATLAB's inline defs / numDefs.
      - name: loadProbes
        kind: private
        python_name: load_probes
        output_arguments:
          - name: probes
            type_python: "list[Any]"
        decision_log: >
          Ported. Python returns the list rather than only setting it, so a
          test can assert without reaching into the instance. try/catches as
          MATLAB does; a session that cannot list its probes still opens
          the app, with an empty listbox.
      - name: probeStatus
        kind: private
        python_name: probe_status
        input_arguments:
          - name: probe
            type_matlab: "ndi.probe.timeseries"
            type_python: "Any"
        output_arguments:
          - name: status
            type_matlab: "struct"
            type_python: "ndi.fun.probe.import_.kiasort.status.Status | None"
        decision_log: >
          Ported as a thin delegate to ndi.fun.probe.import_.kiasort.status,
          so the app itself owns no answer about what 'exported' means.
          Returns None on any failure (a broken export layout, say), which
          every consumer treats as 'nothing known yet' rather than being
          surprised by an exception mid-refresh.
      - name: refreshProbeList
        kind: private
        python_name: refresh_probe_list
        output_arguments:
          - name: labels
            type_python: "list[str]"
        decision_log: >
          Ported. Python returns the list of rendered labels so the render
          rule can be asserted without reaching into the widget. Selection
          preserved when the row it names still exists, as MATLAB does.
      - name: updateButtonState
        kind: private
        python_name: update_button_state
        output_arguments:
          - name: enabled
            type_python: "tuple[bool, bool] (run, curate)"
        decision_log: >
          Ported. Python also RETURNS the (run, curate) pair, again so the
          rule can be asserted without reaching into the widgets. Uses the
          module-level can_run / can_curate so both the widget and the
          model-side tests read the same predicate.
      - name: selectedProbe
        kind: private
        python_name: selected_probe
        output_arguments:
          - name: probe
            type_python: "Any | None"
        decision_log: >
          Ported. Split into selected_index / selected_probe /
          selected_status so each is testable on its own; the composite
          MATLAB method reads the widget for the index and the cached probe
          list for the object, which Python replicates.
      - name: configOverrides
        kind: private
        python_name: config_overrides
        output_arguments:
          - name: cfg
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        decision_log: >
          Ported. The dict is built by the module-level
          config_overrides_from(checks, nums), which the tests call with
          plain dicts so the shape can be checked without any widgets. Keys
          keep MATLAB's cfg spelling verbatim: they cross the API boundary
          into the KIASORT backend as-is.
      - name: runSelected
        kind: private
        python_name: run_selected
        decision_log: >
          Ported in SHAPE rather than in effect, since
          ndi.fun.probe.import_.kiasort.run raises NotImplementedError on
          Python -- KIASORT is a MATLAB toolbox and its Python import is
          unported. The button stays enabled by pipeline state so the state
          machine reads the same as MATLAB; on press, the backend's
          NotImplementedError message is shown in an alert (its text names
          the way forward: sort in MATLAB, then import with
          ndi.fun.probe.import_.kiasort.probe -- which IS ported). A stack
          trace would leave the user hunting an installation bug for
          something that is not an installation problem.
      - name: curateSelected
        kind: private
        python_name: curate_selected
        decision_log: >
          Ported in the same shape as run_selected, and for the same reason:
          ndi.fun.probe.import_.kiasort.curate raises NotImplementedError on
          Python, and the alert quotes its message. A lab that grows a
          Python drop-in of either backend function gets a working button
          with no change here.
      - name: setBusy
        kind: private
        python_name: _set_busy
        decision_log: >
          Ported. Private on Python (underscore prefix) since it is a widget
          state helper, not a model rule.
      - name: onOff
        kind: "local function"
        decision_log: >
          NOT PORTED, and not needed: it converts a logical to MATLAB's
          'on'/'off' Enable strings, and Qt's setEnabled takes the bool.

  - name: pipelineEditor
    type: class
    matlab_path: "+ndi/+gui/+app/pipelineEditor.m"
    matlab_last_sync_hash: "0203294"
    python_path: "ndi/gui/app/pipeline_editor.py"
    python_class: "pipelineEditor"
    inherits: "ndi.gui.app.sessionApp"

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          "Pipeline Editor", VERBATIM from MATLAB. The class name is
          lowercase because the .m file is; PipelineEditor is the PascalCase
          alias.

    methods:
      - name: pipelineEditor
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        decision_log: >
          Ported IN SHAPE rather than in effect. MATLAB's constructor calls
          ndi.cpipeline.edit('command','new','session',SESSION) directly --
          the editor builds and owns its own window and there is no shell
          on MATLAB. On Python ndi.cpipeline is not ported yet, so calling
          it in the constructor would kill the app before it exists.

          Instead the app follows vhNDISpikeSorter's shape: a small window
          with an availability check and a disabled button, which upgrades
          itself to a working launcher the day ndi.cpipeline lands with no
          change here. The unavailable message says what is actually true
          (not ported yet, run it from MATLAB) rather than telling a user
          to install a package that does not exist. build=False constructs
          the model alone for the tests.
      - name: isAvailable
        kind: private
        python_name: is_available
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          Python only (MATLAB just calls ndi.cpipeline.edit directly).
          Resolves ndi.cpipeline.edit at runtime; every resolution failure
          collapses to False (module absent, module raises on import,
          function missing, name not callable), for the reasons documented
          on vhNDISpikeSorter.is_available.
      - name: openEditor
        kind: private
        python_name: open_editor
        output_arguments:
          - name: result
            type_python: "Any (whatever the editor returns)"
        decision_log: >
          Python only. MATLAB opens the editor in the constructor;
          separating construction from the call here means the app opens
          whether or not the editor is importable, and the failure of a
          later port of ndi.cpipeline gets reported in a dialog rather than
          taking the app down. Keeps MATLAB's keywords (command="new",
          session=SESSION) so the day a Python ndi.cpipeline.edit exists
          the same call reaches it.

# =========================================================================
# Module-level helpers (Python only)
# =========================================================================
functions:

  - name: class_name
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. The fully qualified name of a class, as list() reports it
      in the Class field and launch() resolves.

  - name: import_module
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Imports a module or returns None. Standing in for the
      part of MATLAB's meta.package lookup that simply finds nothing when a
      package is not on the path.

  - name: walk_modules
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. A module and, if it is a package, everything beneath it.
      The recursion MATLAB does through meta.package.PackageList.

  - name: resolve_class
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Turns the Class string back into the class, which
      MATLAB's feval does implicitly. Raises ValueError when the name names
      nothing importable, or names something that is not a class.

  - name: unique_stable
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: "Python only. MATLAB's unique(..., 'stable')."

  # --- ndi/gui/app/ensemble_maker.py -------------------------------------
  # What the Ensemble Maker's window SHOWS, lifted out of the class so it can
  # be checked without one. MATLAB computes each of these inline in the
  # method that draws it.

  - name: probe_items
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The list labels: one per probe, "* "-marked when the probe
      already has an ensemble, padded so the names line up. MATLAB builds
      these inline in reloadProbes.

  - name: ensemble_map
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only as a free function; MATLAB's buildEnsembleMap method. Probe
      element id -> its ndi.element.ensemble, found through the 'ensemble' MAP
      documents (which exist only once an epoch is built) and walked back to
      the underlying probe. See the method entry above for why the walk is
      not ndi_document2ndi_object.

  - name: epoch_choices
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The epoch dropdown's entries and whether it is usable.
      Accepts both epochtable shapes: Python's returns (table, hashvalue),
      MATLAB's the table alone.

  - name: session_path
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: "Python only as a free function; MATLAB's sessionPath method."

  - name: number_of_neurons
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. Rows of an ensemble's activity matrix, dense or sparse --
      MATLAB's size(E.activity, 1).

  - name: if_exists_for
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The Rebuild checkbox's state as all_element's if_exists:
      'replace' when ticked, 'skip' when not.

  - name: "built_message, failures_message, empty_ensemble_message, raster_title"
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The text of the app's alerts and its raster title, as
      MATLAB sprintf's them inline. Free functions so what the user is told is
      checkable without a display.

  # --- ndi/gui/app/stimulus_response.py ---------------------------------
  # What the Stimulus Response window SHOWS and DECIDES, lifted out of the
  # class so both can be checked with no display attached.

  - name: probe_labels
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      The dropdown labels, MATLAB's loop over elementstring() lifted out of
      reloadProbes. A probe that will not name itself falls back to its repr
      rather than to "", so no row is blank.

  - name: elements_to_compute
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's todo vector, as a pure function of the elements and the ids
      that already have responses. An element whose id cannot be read is
      computed rather than skipped: a duplicate is visible, a silent gap is
      not.

  - name: summary_message
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's two closing sentences, plus a third when the failures were
      NotImplementedError rather than the data. MATLAB points a user at the
      command window; in this port that window would only repeat
      NotImplementedError, so the reason is said in the dialog instead. The
      third sentence does NOT name a particular unported function: which step
      raised is not known here, and stimulus_responses itself is ported.

  - name: make_progress_bar / update_progress_bar / close_progress_bar
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's i_makeBar / i_updateBar / i_closeBar local functions, and
      swallowing as they do: a run that cannot draw a progress bar is still a
      run worth finishing. DIVERGENCE, the component's rather than this app's:
      MATLAB's ProgressBarWindow docks into an open navigator's Progress pane
      and the ported component opens its own window.
