# ndi_matlab_python_bridge.yaml — src/ndi/gui/app/
# The Primary Contract for the ndi.gui.app namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  - name: sessionApp
    type: class
    matlab_path: "+ndi/+gui/+app/sessionApp.m"
    matlab_last_sync_hash: "eaec593"
    python_path: "ndi/gui/app/session_app.py"
    python_class: "SessionApp"
    inherits: "handle"

    properties:
      - name: Name
        type_matlab: "string (Abstract, Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          The menu label. MATLAB declares it an abstract constant, so a
          subclass supplying none is abstract and meta.class reports it.
          Python has no such declaration to read, so Name is an ANNOTATION
          with no value: a subclass that never assigns it does not have the
          attribute, and that absence is what is_abstract tests.
      - name: Category
        type_matlab: "string (Constant, optional)"
        type_python: "ClassVar[str]"
        decision_log: >
          Optional submenu grouping, "" for none. Concrete in both
          languages, so an app opts INTO a submenu rather than out of one.

    methods:
      - name: list
        kind: static
        input_arguments:
          - name: packages
            type_matlab: "string (1,:)"
            type_python: "Sequence[str] | None"
            default: "None (ndi.gui.app.SessionApp.default_packages())"
        output_arguments:
          - name: apps
            type_matlab: "struct array with fields Name, Class, Category"
            type_python: "list[dict[str, str]]"
        decision_log: >
          Ported. MATLAB reads meta.package/meta.class, which catalogues the
          path without loading anything; Python has no such catalogue, so
          the modules are imported and their classes inspected. A module
          that will not import is SKIPPED rather than raised, mirroring
          MATLAB's tolerance of packages that are not on the path: one
          broken app must not empty the Apps menu. The struct array becomes
          a list of dicts, keeping MATLAB's capitalised field names, because
          the consumer (ndi.gui.nav.datasets_pane.session_apps) already
          speaks in Label/Launch/Category records.
      - name: defaultPackages
        kind: static
        python_name: default_packages
        input_arguments: []
        output_arguments:
          - name: pkgs
            type_matlab: "string (1,:)"
            type_python: "list[str]"
        decision_log: >
          Ported. ndi.gui.app and ndi.app, plus the packages the user named
          in the GUI.Navigator.SessionAppPackages preference, duplicates
          dropped and order kept. An unreadable preference leaves the
          built-ins in both languages.
      - name: launch
        kind: static
        input_arguments:
          - name: className
            type_matlab: "string | char"
            type_python: "str | type"
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: obj
            type_matlab: "the constructed app (cleared when nargout == 0)"
            type_python: "Any (always returned)"
        decision_log: >
          Ported. MATLAB's feval(className, session) becomes an import plus
          a call; the class object itself is accepted as well as its name.
          DIVERGENCE, deliberate: MATLAB may discard the app because its
          figure holds it through guidata, while a Python app that nothing
          references can be garbage-collected -- window and all -- as soon
          as launch returns. So launch always returns the object and
          DatasetsPane.launch_app keeps it in DatasetsPane.launched_apps.
      - name: parsePackageList
        kind: static
        python_name: parse_package_list
        access_matlab: private
        input_arguments:
          - name: value
            type_matlab: "string | char"
            type_python: "Any"
        output_arguments:
          - name: pkgs
            type_python: "list[str]"
        decision_log: >
          Ported. Splits on semicolons and commas, trims, drops empties.
          Python also accepts a list or tuple: ndi.preferences stores values
          verbatim with no type validation, so a user who set a list gets
          what they meant rather than the repr of one.
      - name: classesInPackages
        kind: static
        python_name: classes_in_packages
        access_matlab: private
        input_arguments:
          - name: packages
            type_python: "Sequence[str]"
        output_arguments:
          - name: classes
            type_matlab: "string (1,:) of class names"
            type_python: "list[type]"
        decision_log: >
          Ported, returning the classes themselves rather than their names,
          since Python has already imported them by the time it can name
          them. Recurses into subpackages, as MATLAB does through
          meta.package.PackageList. Only classes whose __module__ IS the
          module being scanned are reported, so a class re-exported by a
          package __init__ is attributed to the module that defines it and
          is never counted twice.
      - name: isSessionApp
        kind: static
        python_name: is_session_app
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "Any"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          MATLAB walks SuperclassList recursively; Python's issubclass does
          that walk itself. The interface is not an app: cls is SessionApp
          returns False in both languages (MATLAB never lists it because it
          is abstract).
      - name: isAbstract
        kind: static
        python_name: is_abstract
        access_matlab: "n/a (MATLAB reads meta.class.Abstract)"
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          NEW in Python, standing in for MATLAB's meta.class.Abstract: true
          when the class is abc-abstract, or when it never supplied a Name.
      - name: readName
        kind: static
        python_name: read_name
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: name
            type_python: "str"
        decision_log: >
          Ported, including MATLAB's fallback to the class's own name when
          the label cannot be read.
      - name: readCategory
        kind: static
        python_name: read_category
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: cat
            type_python: "str"
        decision_log: 'Ported. "" when the app declares no Category.'

  # -----------------------------------------------------------------------
  # The apps that adopt the interface
  # -----------------------------------------------------------------------

  - name: stimulusResponse
    type: class
    matlab_path: "+ndi/+gui/+app/stimulusResponse.m"
    matlab_last_sync_hash: "104c29e"
    python_path: "ndi/gui/app/stimulus_response.py"
    python_class: "stimulusResponse"
    inherits: "ndi.gui.app.sessionApp"
    decision_log: >
      Ported. Synchronized with MATLAB main as of 2026-09-01. The class name
      stays MATLAB's (AGENTS.md 3, Rule 3) and so do the Name and Category
      constants, which are the menu text a user reads. Every method is
      snake_case, the house style in ndi.gui, and no camelCase alias is kept:
      nothing calls these methods by MATLAB's spelling, so a second spelling
      would be a second thing to keep correct. Nothing is added to
      tests/test_matlab_name_aliases.py for the same reason.

      DIVERGENCE, deliberate: the widget selection is mirrored on the object
      (probe_index, element_types, replace) rather than read back out of the
      widgets on demand, as MATLAB's selectedProbe/selectedTypes do. It is
      what lets the run path -- which elements are computed and which
      documents are deleted -- be exercised with no display attached.

      DEPENDENCY, unported: ndi.app.stimulus.tuning_response.stimulus_responses
      raises NotImplementedError in this port (it is the framework, not the
      signal processing). The app calls it per element and counts the failure,
      as MATLAB does for any failing element, and its summary names the
      unported computation rather than reporting a bare "0 computed".

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: '"Stimulus Response", verbatim: it is the menu label.'
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: '"Stimulus", verbatim: it names the submenu.'
      - name: ElementTypes
        type_matlab: "cell (Constant, private)"
        type_python: "tuple[str, ...] (module constant ELEMENT_TYPES)"
        decision_log: >
          A module constant rather than a class attribute, so the listbox
          contents can be read and asserted without constructing an app.
          ("spikes",) in both languages.

    methods:
      - name: stimulusResponse
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (1,1)"
            type_python: "Any"
          - name: position
            type_python: "tuple[float, float, float, float]"
            default: "DEFAULT_POSITION (MATLAB's [100 100 640 460])"
          - name: build
            type_python: "bool"
            default: "True"
        decision_log: >
          Ported. The session stays the first positional argument, which is
          the sessionApp contract discovery and launch() rely on. build=False
          is Python-only: it makes the object without a window, as
          ndi.gui.profile_editor.ProfileEditor does.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported to PySide6. MATLAB's uigridlayout rows become a QVBoxLayout
          with two nested QHBoxLayouts; uidropdown/uilistbox/uicheckbox become
          QComboBox/QListWidget (ExtendedSelection)/QCheckBox. The NDI Cloud
          palette, the tooltip and the window Tag are MATLAB's.
      - name: sessionPath
        kind: private
        python_name: session_path
        output_arguments:
          - name: p
            type_python: "str"
        decision_log: >
          Ported. Best-effort in both languages: getpath(), then a path
          property, then "".
      - name: reloadProbes
        kind: private
        python_name: reload_probes
        output_arguments:
          - name: stimulators
            type_python: "list[Any] (Python only; MATLAB sets the property)"
        decision_log: >
          Ported. session.getprobes('type','stimulator') becomes
          getprobes(type="stimulator"). Returns the probes as well as storing
          them, so a caller can see what a Reload found.
      - name: selectedProbe
        kind: private
        python_name: selected_probe
        decision_log: "Ported. Reads probe_index; None when nothing is chosen."
      - name: selectedTypes
        kind: private
        python_name: selected_types
        decision_log: >
          Ported. MATLAB normalises a char to a cell; Python holds a list
          throughout, so the normalisation has nothing to do.
      - name: updateButtonState
        kind: private
        python_name: update_button_state
        output_arguments:
          - name: ok
            type_python: "bool (Python only)"
        decision_log: >
          Ported, returning the state it set. MATLAB's onOff local function
          has no counterpart: Qt takes a bool.
      - name: runResponses
        kind: private
        python_name: run_responses
        output_arguments:
          - name: result
            type_python: "RunResult (computed, skipped, failed, message)"
        decision_log: >
          Ported, including both database strategies: replace does ONE OR
          search, removes what it finds, and recomputes everything; otherwise
          ONE search lists the elements that already have a response and only
          the rest are computed. stimulus_responses is called with reset=False
          on both paths, as in MATLAB. MATLAB returns nothing and reports in a
          dialog; Python also returns the counts, which is what makes the
          decision testable. MATLAB's onCleanup(finishRun) becomes try/finally.
      - name: elementsOfTypes
        kind: private
        python_name: elements_of_types
        output_arguments:
          - name: elements
            type_python: "list[Any]"
          - name: element_types
            type_python: "list[str]"
        decision_log: >
          Ported. MATLAB's two outputs become a tuple, in MATLAB's order.
          getelements('element.type', T) becomes
          getelements(**{"element.type": T}).
      - name: responseQuery
        kind: private
        python_name: response_query
        input_arguments:
          - name: stimulator_id
            type_matlab: "ndi.probe (MATLAB passes the probe)"
            type_python: "str"
          - name: element_ids
            type_matlab: "cell of ndi.element"
            type_python: "Sequence[str]"
        decision_log: >
          Ported as a module function taking IDS rather than a method taking
          objects: it is pure, and the query it builds -- a big OR over the
          elements, ANDed onto the stimulator -- is the thing worth asserting.
      - name: removeExistingResponses
        kind: private
        python_name: remove_existing_responses
        output_arguments:
          - name: n_removed
            type_python: "int (Python only)"
        decision_log: >
          Ported, including the scalar-parameter documents: nothing points at
          those but the response being deleted, so leaving them would orphan
          them on every rebuild.
      - name: existingResponseElementIds
        kind: private
        python_name: existing_response_element_ids
        decision_log: "Ported. One search; the element ids read off its documents."
      - name: finishRun
        kind: private
        python_name: finish_run
        decision_log: >
          Ported. MATLAB guards with isvalid(); update_button_state already
          tolerates a window that is not there.
      - name: withWait / withWaitOut / clearWait
        kind: private
        python_name: "(none)"
        decision_log: >
          NOT ported. MATLAB needs two spellings because varargout cannot be
          forwarded through the one-output form, and a manual clearWait to
          undo the dialog. The Python app does its loading in the constructor
          and in reload_probes without a modal wait dialog; the long operation
          -- the run itself -- reports through the NDI progress bar, which is
          what a user watches in both languages.

  # -----------------------------------------------------------------------
  # NOT YET PORTED: the rest of MATLAB's eleven
  # -----------------------------------------------------------------------
  #   ElectrodeDataExport, ElectrodeMap, ensembleMaker, katzExporter,
  #   kiasort, pipelineEditor, pyraview, spikeSorterImporter,
  #   stimulusDecoder, vhNDISpikeSorter
  #
  # Each depends on further unported subsystems (ndi.cpipeline for the
  # pipeline editor, the sorters' own toolboxes, and so on) and each is its
  # own piece of work. Nothing here needs revisiting when they land: an app
  # reaches the navigator's Apps menu by subclassing SessionApp, and by
  # nothing else.

# =========================================================================
# Module-level helpers (Python only)
# =========================================================================
functions:

  - name: class_name
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. The fully qualified name of a class, as list() reports it
      in the Class field and launch() resolves.

  - name: import_module
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Imports a module or returns None. Standing in for the
      part of MATLAB's meta.package lookup that simply finds nothing when a
      package is not on the path.

  - name: walk_modules
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. A module and, if it is a package, everything beneath it.
      The recursion MATLAB does through meta.package.PackageList.

  - name: resolve_class
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Turns the Class string back into the class, which
      MATLAB's feval does implicitly. Raises ValueError when the name names
      nothing importable, or names something that is not a class.

  - name: unique_stable
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: "Python only. MATLAB's unique(..., 'stable')."

  - name: probe_labels
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      The dropdown labels, MATLAB's loop over elementstring() lifted out of
      reloadProbes. A probe that will not name itself falls back to its repr
      rather than to "", so no row is blank.

  - name: elements_to_compute
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's todo vector, as a pure function of the elements and the ids
      that already have responses. An element whose id cannot be read is
      computed rather than skipped: a duplicate is visible, a silent gap is
      not.

  - name: summary_message
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's two closing sentences, plus a third naming the unported
      computation when the failures were NotImplementedError. MATLAB points a
      user at the command window; in this port that window would only repeat
      NotImplementedError, so the reason is said in the dialog instead.

  - name: make_progress_bar / update_progress_bar / close_progress_bar
    type: function
    python_path: "ndi/gui/app/stimulus_response.py"
    decision_log: >
      MATLAB's i_makeBar / i_updateBar / i_closeBar local functions, and
      swallowing as they do: a run that cannot draw a progress bar is still a
      run worth finishing. DIVERGENCE, the component's rather than this app's:
      MATLAB's ProgressBarWindow docks into an open navigator's Progress pane
      and the ported component opens its own window.
