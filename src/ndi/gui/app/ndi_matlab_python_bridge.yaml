# ndi_matlab_python_bridge.yaml — src/ndi/gui/app/
# The Primary Contract for the ndi.gui.app namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  - name: sessionApp
    type: class
    matlab_path: "+ndi/+gui/+app/sessionApp.m"
    matlab_last_sync_hash: "eaec593"
    python_path: "ndi/gui/app/session_app.py"
    python_class: "SessionApp"
    inherits: "handle"

    properties:
      - name: Name
        type_matlab: "string (Abstract, Constant)"
        type_python: "ClassVar[str]"
        decision_log: >
          The menu label. MATLAB declares it an abstract constant, so a
          subclass supplying none is abstract and meta.class reports it.
          Python has no such declaration to read, so Name is an ANNOTATION
          with no value: a subclass that never assigns it does not have the
          attribute, and that absence is what is_abstract tests.
      - name: Category
        type_matlab: "string (Constant, optional)"
        type_python: "ClassVar[str]"
        decision_log: >
          Optional submenu grouping, "" for none. Concrete in both
          languages, so an app opts INTO a submenu rather than out of one.

    methods:
      - name: list
        kind: static
        input_arguments:
          - name: packages
            type_matlab: "string (1,:)"
            type_python: "Sequence[str] | None"
            default: "None (ndi.gui.app.SessionApp.default_packages())"
        output_arguments:
          - name: apps
            type_matlab: "struct array with fields Name, Class, Category"
            type_python: "list[dict[str, str]]"
        decision_log: >
          Ported. MATLAB reads meta.package/meta.class, which catalogues the
          path without loading anything; Python has no such catalogue, so
          the modules are imported and their classes inspected. A module
          that will not import is SKIPPED rather than raised, mirroring
          MATLAB's tolerance of packages that are not on the path: one
          broken app must not empty the Apps menu. The struct array becomes
          a list of dicts, keeping MATLAB's capitalised field names, because
          the consumer (ndi.gui.nav.datasets_pane.session_apps) already
          speaks in Label/Launch/Category records.
      - name: defaultPackages
        kind: static
        python_name: default_packages
        input_arguments: []
        output_arguments:
          - name: pkgs
            type_matlab: "string (1,:)"
            type_python: "list[str]"
        decision_log: >
          Ported. ndi.gui.app and ndi.app, plus the packages the user named
          in the GUI.Navigator.SessionAppPackages preference, duplicates
          dropped and order kept. An unreadable preference leaves the
          built-ins in both languages.
      - name: launch
        kind: static
        input_arguments:
          - name: className
            type_matlab: "string | char"
            type_python: "str | type"
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: obj
            type_matlab: "the constructed app (cleared when nargout == 0)"
            type_python: "Any (always returned)"
        decision_log: >
          Ported. MATLAB's feval(className, session) becomes an import plus
          a call; the class object itself is accepted as well as its name.
          DIVERGENCE, deliberate: MATLAB may discard the app because its
          figure holds it through guidata, while a Python app that nothing
          references can be garbage-collected -- window and all -- as soon
          as launch returns. So launch always returns the object and
          DatasetsPane.launch_app keeps it in DatasetsPane.launched_apps.
      - name: parsePackageList
        kind: static
        python_name: parse_package_list
        access_matlab: private
        input_arguments:
          - name: value
            type_matlab: "string | char"
            type_python: "Any"
        output_arguments:
          - name: pkgs
            type_python: "list[str]"
        decision_log: >
          Ported. Splits on semicolons and commas, trims, drops empties.
          Python also accepts a list or tuple: ndi.preferences stores values
          verbatim with no type validation, so a user who set a list gets
          what they meant rather than the repr of one.
      - name: classesInPackages
        kind: static
        python_name: classes_in_packages
        access_matlab: private
        input_arguments:
          - name: packages
            type_python: "Sequence[str]"
        output_arguments:
          - name: classes
            type_matlab: "string (1,:) of class names"
            type_python: "list[type]"
        decision_log: >
          Ported, returning the classes themselves rather than their names,
          since Python has already imported them by the time it can name
          them. Recurses into subpackages, as MATLAB does through
          meta.package.PackageList. Only classes whose __module__ IS the
          module being scanned are reported, so a class re-exported by a
          package __init__ is attributed to the module that defines it and
          is never counted twice.
      - name: isSessionApp
        kind: static
        python_name: is_session_app
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "Any"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          MATLAB walks SuperclassList recursively; Python's issubclass does
          that walk itself. The interface is not an app: cls is SessionApp
          returns False in both languages (MATLAB never lists it because it
          is abstract).
      - name: isAbstract
        kind: static
        python_name: is_abstract
        access_matlab: "n/a (MATLAB reads meta.class.Abstract)"
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: tf
            type_python: "bool"
        decision_log: >
          NEW in Python, standing in for MATLAB's meta.class.Abstract: true
          when the class is abc-abstract, or when it never supplied a Name.
      - name: readName
        kind: static
        python_name: read_name
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: name
            type_python: "str"
        decision_log: >
          Ported, including MATLAB's fallback to the class's own name when
          the label cannot be read.
      - name: readCategory
        kind: static
        python_name: read_category
        access_matlab: private
        input_arguments:
          - name: cls
            type_python: "type"
        output_arguments:
          - name: cat
            type_python: "str"
        decision_log: 'Ported. "" when the app declares no Category.'

  # -----------------------------------------------------------------------
  # The apps that adopt the interface
  # -----------------------------------------------------------------------

  - name: ensembleMaker
    type: class
    matlab_path: "+ndi/+gui/+app/ensembleMaker.m"
    matlab_last_sync_hash: "eaec593"
    python_path: "ndi/gui/app/ensemble_maker.py"
    python_class: "ensembleMaker"
    inherits: "ndi.gui.app.sessionApp"

    decision_log: >
      The CLASS NAME is MATLAB's exactly, as the porting guide requires of a
      class mirroring a .m file, and so are the Name and Category constants:
      they are the text of the Apps menu, so a "Pythonized" label would be a
      user-visible divergence. The METHODS are snake_case, which is the house
      style and what every module ported for the navigator uses. No caller
      wants MATLAB's spelling of a private method of a GUI app, so no
      camelCase alias is carried and the class needs no entry in
      tests/test_matlab_name_aliases.py.

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        value: "Ensemble Maker"
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        value: "Ensembles"
      - name: session
        type_matlab: "ndi.session (private)"
        type_python: "Any"
      - name: fig
        python_name: figure
        type_matlab: "uifigure (private)"
        type_python: "QtWidgets.QWidget | None"
        decision_log: >
          Named figure here, as ndi.gui.profile_editor names its window, so
          the two ported windows answer to the same attribute.
      - name: "probeList, epochDropdown, plotButton, rebuildCheckbox, makeButton"
        python_name: "probe_list, epoch_dropdown, plot_button, rebuild_checkbox, make_button"
        type_matlab: "uilistbox / uidropdown / uibutton / uicheckbox (private)"
        type_python: "Qt widgets, None until build() runs"
      - name: "probes, haveEnsemble, ensembleMap, waitDlg"
        python_name: "probes, have_ensemble, ensemble_map, wait_dialog"
        type_matlab: "cell / cell / containers.Map / uiprogressdlg (private)"
        type_python: "list / list[str] / dict[str, Any] / QProgressDialog | None"
      - name: "(none)"
        python_name: "items, selection, epoch_items, epoch, rebuild, make_enabled, plot_enabled, epoch_enabled, last_alert"
        type_python: "list[str] / list[int] / list[str] / str / bool / bool / bool / bool / tuple[str, str] | None"
        decision_log: >
          NEW in Python. MATLAB keeps this state IN the widgets -- the
          listbox's ItemsData is the probe index, the dropdown's Value is the
          epoch, and an alert leaves no trace. Here the state lives on the
          object and the widgets mirror it, so every decision the app makes is
          checkable with no display attached and a build failure costs the
          window rather than the class (build=False constructs the model
          alone). selection holds 0-BASED Qt rows where MATLAB's ItemsData
          holds 1:n: they index a Python list and are never shown, so they are
          internal data access rather than a user-facing count.

    methods:
      - name: ensembleMaker
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (1,1)"
            type_python: "Any"
          - name: position
            type_python: "tuple[float, float, float, float]"
            default: "DEFAULT_POSITION (100, 100, 560, 500)"
          - name: build
            type_python: "bool"
            default: "True"
        decision_log: >
          Ported. Builds the window, then loads the probes under the wait
          dialog. build=False is Python-only and builds the model without Qt.
          MATLAB's arguments block validates the session class; Python does
          not, following the rest of ndi.gui, which takes the session as
          given (nothing in the package uses pydantic).
      - name: build
        kind: private
        decision_log: >
          Ported to PySide6: MATLAB's uigridlayout rows become a QVBoxLayout
          with two QHBoxLayout rows, and the NDI Cloud palette is applied
          through style sheets. Same widgets, same order, same labels.
      - name: sessionPath
        python_name: session_path
        kind: private
        decision_log: >
          Ported, as both a module function and a method. Best-effort in both
          languages: getpath() first, then a path property, then "" -- a
          session need not be on disk, and a header line is not worth an
          exception.
      - name: reloadProbes
        python_name: reload_probes
        kind: private
        output_arguments:
          - name: items
            type_python: "list[str]"
        decision_log: >
          Ported, including the preserved selection and MATLAB's tolerance of
          a session that cannot list probes (empty list, not an error).
          Returns the labels, which MATLAB has no need to since its listbox
          holds them.
      - name: buildEnsembleMap
        python_name: build_ensemble_map
        kind: private
        decision_log: >
          Ported as a method delegating to the module function ensemble_map.
          DIVERGENCE, deliberate: MATLAB walks each 'ensemble' map document
          back to its element with ndi.database.fun.ndi_document2ndi_object.
          The Python function of that name maps the stored class to a
          constructor that builds a BRAND NEW element from its name,
          reference and type -- fresh id, no underlying element -- so the walk
          back to the probe would find nothing (the trap
          ndi.fun.ensemble_db._element_from_document documents). Python
          constructs ndi.element.ensemble from the document instead, the load
          form that restores the id and the underlying element, which is what
          MATLAB's helper achieves there.
      - name: selectedProbes
        python_name: selected_probes
        kind: private
      - name: singlePlottableProbe
        python_name: single_plottable_probe
        kind: private
        output_arguments:
          - name: "[probe, ens]"
            type_python: "tuple[Any, Any] -- (None, None) when there is not exactly one"
      - name: onSelectionChanged
        python_name: on_selection_changed
        kind: private
      - name: updateButtonState
        python_name: update_button_state
        kind: private
      - name: updateEpochChoices
        python_name: update_epoch_choices
        kind: private
        decision_log: >
          Ported, including keeping the previously chosen epoch when it is
          still on offer. The list of epochs itself is the module function
          epoch_choices, so what the dropdown offers is checkable on its own.
      - name: makeEnsembles
        python_name: make_ensembles
        kind: private
        output_arguments:
          - name: errors
            type_python: "list[str] -- one 'probe: reason' line per failure"
        decision_log: >
          Ported. Calls ndi.fun.ensemble.all_element per selected probe with
          IfExists 'skip' or 'replace' from the checkbox, collecting failures
          rather than stopping. Returns the failure lines, which MATLAB only
          shows; the progress dialog is closed on every path, as MATLAB's
          onCleanup does.
      - name: finishMake
        python_name: finish_make
        kind: private
      - name: plotEnsemble
        python_name: plot_ensemble
        kind: private
      - name: doPlot
        python_name: do_plot
        kind: private
      - name: "(part of doPlot)"
        python_name: draw_raster
        kind: private
        decision_log: >
          NEW in Python, splitting the drawing out of do_plot. MATLAB must
          create the figure, create the axes and make them CURRENT before
          calling ndi.fun.ensemble.plot, which draws into whatever is current;
          the Python function takes the axes as an argument, so the figure is
          built and handed over -- same picture, no global state in between.
      - name: withWait
        python_name: with_wait
        kind: private
        decision_log: >
          Ported, nestable as MATLAB's is. Returns what the callable returns,
          which MATLAB discards -- that is what lets plot_ensemble hand back
          its figure.
      - name: clearWait
        python_name: clear_wait
        kind: private
      - name: "(none)"
        python_name: "set_selection, set_epoch, set_rebuild, alert, show, close"
        decision_log: >
          NEW in Python. The setters are how a caller without a display says
          what the user would have clicked; alert records what it said in
          last_alert (MATLAB's uialert leaves no trace) and shows a box only
          when there is a window; show and close mirror the figure's
          lifecycle, and close also drops the rasters the app opened.

  # -----------------------------------------------------------------------
  # NOT YET PORTED: the remaining ten apps
  # -----------------------------------------------------------------------
  #   ElectrodeDataExport, ElectrodeMap, katzExporter, kiasort,
  #   pipelineEditor, pyraview, spikeSorterImporter, stimulusDecoder,
  #   stimulusResponse, vhNDISpikeSorter
  #
  # Three are blocked on something outside this repo (ndi.cpipeline for the
  # pipeline editor, the sorters' own toolboxes for kiasort and
  # vhNDISpikeSorter); the rest are each their own piece of work. Nothing
  # here needs revisiting when they land: an app reaches the navigator's Apps
  # menu by subclassing SessionApp, and by nothing else.

# =========================================================================
# Module-level helpers (Python only)
# =========================================================================
functions:

  - name: class_name
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. The fully qualified name of a class, as list() reports it
      in the Class field and launch() resolves.

  - name: import_module
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Imports a module or returns None. Standing in for the
      part of MATLAB's meta.package lookup that simply finds nothing when a
      package is not on the path.

  - name: walk_modules
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. A module and, if it is a package, everything beneath it.
      The recursion MATLAB does through meta.package.PackageList.

  - name: resolve_class
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: >
      Python only. Turns the Class string back into the class, which
      MATLAB's feval does implicitly. Raises ValueError when the name names
      nothing importable, or names something that is not a class.

  - name: unique_stable
    type: function
    python_path: "ndi/gui/app/session_app.py"
    decision_log: "Python only. MATLAB's unique(..., 'stable')."

  # --- ndi/gui/app/ensemble_maker.py -------------------------------------
  # What the Ensemble Maker's window SHOWS, lifted out of the class so it can
  # be checked without one. MATLAB computes each of these inline in the
  # method that draws it.

  - name: probe_items
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The list labels: one per probe, "* "-marked when the probe
      already has an ensemble, padded so the names line up. MATLAB builds
      these inline in reloadProbes.

  - name: ensemble_map
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only as a free function; MATLAB's buildEnsembleMap method. Probe
      element id -> its ndi.element.ensemble, found through the 'ensemble' MAP
      documents (which exist only once an epoch is built) and walked back to
      the underlying probe. See the method entry above for why the walk is
      not ndi_document2ndi_object.

  - name: epoch_choices
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The epoch dropdown's entries and whether it is usable.
      Accepts both epochtable shapes: Python's returns (table, hashvalue),
      MATLAB's the table alone.

  - name: session_path
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: "Python only as a free function; MATLAB's sessionPath method."

  - name: number_of_neurons
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. Rows of an ensemble's activity matrix, dense or sparse --
      MATLAB's size(E.activity, 1).

  - name: if_exists_for
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The Rebuild checkbox's state as all_element's if_exists:
      'replace' when ticked, 'skip' when not.

  - name: "built_message, failures_message, empty_ensemble_message, raster_title"
    type: function
    python_path: "ndi/gui/app/ensemble_maker.py"
    decision_log: >
      Python only. The text of the app's alerts and its raster title, as
      MATLAB sprintf's them inline. Free functions so what the user is told is
      checkable without a display.
