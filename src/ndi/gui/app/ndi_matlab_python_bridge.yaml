    inherits: "ndi.gui.app.sessionApp"
    decision_log: >
      Ported. Synchronized with MATLAB main as of 2026-09-01. The class name
      stays MATLAB's (AGENTS.md 3, Rule 3) and so do the Name and Category
      constants, which are the menu text a user reads. Every method is
      snake_case, the house style in ndi.gui, and no camelCase alias is kept:
      nothing calls these methods by MATLAB's spelling, so a second spelling
      would be a second thing to keep correct. Nothing is added to
      tests/test_matlab_name_aliases.py for the same reason.

      DIVERGENCE, deliberate: the widget selection is mirrored on the object
      (probe_index, element_types, replace) rather than read back out of the
      widgets on demand, as MATLAB's selectedProbe/selectedTypes do. It is
      what lets the run path -- which elements are computed and which
      documents are deleted -- be exercised with no display attached.

      DEPENDENCY: ndi.app.stimulus.tuning_response.stimulus_responses, ported
      alongside this app in the same change. An element can still reach some
      OTHER unported step (a reader for a format nobody has written yet, say);
      a NotImplementedError from any depth is counted as that element's
      failure, as MATLAB counts any failure, and the summary says the failures
      were an unported step rather than leaving a bare "0 computed".

    properties:
      - name: Name
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: '"Stimulus Response", verbatim: it is the menu label.'
      - name: Category
        type_matlab: "string (Constant)"
        type_python: "ClassVar[str]"
        decision_log: '"Stimulus", verbatim: it names the submenu.'
      - name: ElementTypes
        type_matlab: "cell (Constant, private)"
        type_python: "tuple[str, ...] (module constant ELEMENT_TYPES)"
        decision_log: >
          A module constant rather than a class attribute, so the listbox
          contents can be read and asserted without constructing an app.
          ("spikes",) in both languages.

    methods:
      - name: stimulusResponse
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (1,1)"
            type_python: "Any"
          - name: position
            type_python: "tuple[float, float, float, float]"
            default: "DEFAULT_POSITION (MATLAB's [100 100 640 460])"
          - name: build
            type_python: "bool"
            default: "True"
        decision_log: >
          Ported. The session stays the first positional argument, which is
          the sessionApp contract discovery and launch() rely on. build=False
          is Python-only: it makes the object without a window, as
          ndi.gui.profile_editor.ProfileEditor does.
      - name: build
        kind: private
        python_name: build
        decision_log: >
          Ported to PySide6. MATLAB's uigridlayout rows become a QVBoxLayout
          with two nested QHBoxLayouts; uidropdown/uilistbox/uicheckbox become
          QComboBox/QListWidget (ExtendedSelection)/QCheckBox. The NDI Cloud
          palette, the tooltip and the window Tag are MATLAB's.
      - name: sessionPath
        kind: private
        python_name: session_path
        output_arguments:
          - name: p
            type_python: "str"
        decision_log: >
          Ported. Best-effort in both languages: getpath(), then a path
          property, then "".
      - name: reloadProbes
        kind: private
        python_name: reload_probes
        output_arguments:
          - name: stimulators
            type_python: "list[Any] (Python only; MATLAB sets the property)"
        decision_log: >
          Ported. session.getprobes('type','stimulator') becomes
          getprobes(type="stimulator"). Returns the probes as well as storing
          them, so a caller can see what a Reload found.
      - name: selectedProbe
        kind: private
        python_name: selected_probe
        decision_log: "Ported. Reads probe_index; None when nothing is chosen."
      - name: selectedTypes
        kind: private
        python_name: selected_types
        decision_log: >
          Ported. MATLAB normalises a char to a cell; Python holds a list
          throughout, so the normalisation has nothing to do.
      - name: updateButtonState
        kind: private
        python_name: update_button_state
        output_arguments:
          - name: ok
            type_python: "bool (Python only)"
        decision_log: >
          Ported, returning the state it set. MATLAB's onOff local function
          has no counterpart: Qt takes a bool.
      - name: runResponses
        kind: private
        python_name: run_responses
        output_arguments:
          - name: result
            type_python: "RunResult (computed, skipped, failed, message)"
        decision_log: >
          Ported, including both database strategies: replace does ONE OR
          search, removes what it finds, and recomputes everything; otherwise
          ONE search lists the elements that already have a response and only
          the rest are computed. stimulus_responses is called with reset=False
          on both paths, as in MATLAB. MATLAB returns nothing and reports in a
          dialog; Python also returns the counts, which is what makes the
          decision testable. MATLAB's onCleanup(finishRun) becomes try/finally.
      - name: elementsOfTypes
        kind: private
        python_name: elements_of_types
        output_arguments:
          - name: elements
            type_python: "list[Any]"
          - name: element_types
            type_python: "list[str]"
        decision_log: >
          Ported. MATLAB's two outputs become a tuple, in MATLAB's order.
          getelements('element.type', T) becomes
          getelements(**{"element.type": T}).
      - name: responseQuery
        kind: private
        python_name: response_query
        input_arguments:
          - name: stimulator_id
            type_matlab: "ndi.probe (MATLAB passes the probe)"
            type_python: "str"
          - name: element_ids
            type_matlab: "cell of ndi.element"
            type_python: "Sequence[str]"
        decision_log: >
          Ported as a module function taking IDS rather than a method taking
          objects: it is pure, and the query it builds -- a big OR over the
          elements, ANDed onto the stimulator -- is the thing worth asserting.
      - name: removeExistingResponses
        kind: private
        python_name: remove_existing_responses
        output_arguments:
          - name: n_removed
            type_python: "int (Python only)"
        decision_log: >
          Ported, including the scalar-parameter documents: nothing points at
          those but the response being deleted, so leaving them would orphan
          them on every rebuild.
      - name: existingResponseElementIds
        kind: private
        python_name: existing_response_element_ids
        decision_log: "Ported. One search; the element ids read off its documents."
      - name: finishRun
        kind: private
        python_name: finish_run
        decision_log: >
          Ported. MATLAB guards with isvalid(); update_button_state already
          tolerates a window that is not there.
      - name: withWait / withWaitOut / clearWait
        kind: private
        python_name: "(none)"
        decision_log: >
          NOT ported. MATLAB needs two spellings because varargout cannot be
          forwarded through the one-output form, and a manual clearWait to
          undo the dialog. The Python app does its loading in the constructor
          and in reload_probes without a modal wait dialog; the long operation
          -- the run itself -- reports through the NDI progress bar, which is
          what a user watches in both languages.

