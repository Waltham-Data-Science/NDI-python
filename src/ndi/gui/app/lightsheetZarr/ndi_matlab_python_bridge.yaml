# ndi_matlab_python_bridge.yaml — src/ndi/gui/app/lightsheetZarr/
# The Primary Contract for ndi.gui.app.lightsheetZarr.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# PYTHON-ONLY PACKAGE, plus the ONE MATLAB GUI class that shells out to
# our console script.
#
# napari has no MATLAB counterpart, so unlike the rest of ndi.gui.app there
# is nothing here to mirror on the viewer side. MATLAB reads the same
# documents through +ndi/+fun/+doc/+lightsheet, which is recorded under
# src/ndi/fun/doc_lightsheet/ndi_matlab_python_bridge.yaml. What differs
# here is only the surface that draws them.
#
# The MATLAB GUI class ndi.gui.app.LightsheetZarrManager is recorded here
# rather than in src/ndi/gui/app/ndi_matlab_python_bridge.yaml so that
# every part of the lightsheetZarr feature lives in one file. It's not
# ported (napari is Python-only), but the shell wrapper it targets is,
# and that's the piece the CLI is documented against.
# =========================================================================
functions:

  # -----------------------------------------------------------------------
  # MATLAB GUI class — not ported (napari has no MATLAB counterpart).
  # The manager shell-execs /usr/local/bin/napariViewLightsheet, which is
  # a bash wrapper around this package's cli.main.
  # -----------------------------------------------------------------------
  - name: LightsheetZarrManager
    matlab_path: "+ndi/+gui/+app/LightsheetZarrManager.m"
    matlab_last_sync_hash: "5ab84f3"
    status: not_applicable
    decision_log: >-
      Not ported: napari is Python-only, so the manager class stays
      MATLAB-only. It is the caller side of the CLI in this package -
      shell-execs /usr/local/bin/napariViewLightsheet (a wrapper that
      scrubs MATLAB's library paths) which then runs
      ndi.gui.app.lightsheetZarr.cli.main. Mirrors the GEFManager /
      napariViewGEF split; if the day ever comes that a Python-hosted
      MATLAB-app equivalent is built, this entry is where it will get
      declared.

  # -----------------------------------------------------------------------
  # Python-only implementation.
  # -----------------------------------------------------------------------

  - name: build_parser
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    output_arguments:
      - name: parser
        type_python: argparse.ArgumentParser
    decision_log: >-
      Python-only. argparse surface for the napariViewLightsheet console
      script. The flag set MUST stay in sync with
      ndi.fun.doc.lightsheet.viewCommand in NDI-matlab: --pyramid,
      --reduction, --channel, --level, --no-controls, --name, --list,
      --report. Kept in a separate function so tests can inspect the
      parser without invoking main and without importing napari.

  - name: main
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    input_arguments:
      - name: argv
        type_python: "Sequence[str] | None"
    output_arguments:
      - name: exit_code
        type_python: int
    decision_log: >-
      Python-only. The napariViewLightsheet command line, reachable two
      ways that are the same function: the installed console script, and
      the shell wrapper that scrubs MATLAB's environment before exec.
      Handles --list and --report without importing napari or dask so
      those subcommands stay cheap on a headless box; napari is loaded
      only when a viewer is actually opened. Returns an integer exit
      code so the wrapper can propagate failure.

  - name: _open_session
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    decision_log: >-
      Python-only. Kept out of multiscale.py so --list and --report do
      not force a napari or dask import when they load the session.
      Deferred imports (ndi.session.dir) matter here because a
      MATLAB-launched Python inherits an ill-fitting LD_LIBRARY_PATH;
      every module touched before the first useful line is a candidate
      for a linker crash.

  - name: _pyramids
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    decision_log: >-
      Python-only. One place that spells the
      isa("lightsheetZarrPyramid") query so --list, --report and
      --pyramid resolution stay consistent.

  - name: _pick_pyramid
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    decision_log: >-
      Python-only. Refusal-first: a session with two pyramids and no
      --pyramid does not silently open the first one; it explains the
      situation and points at --list. Mirrors the pyramid_id-is-required
      stance in ndi.fun.doc.lightsheet.viewCommand.

  - name: _resolve_reduction
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/cli.py"
    decision_log: >-
      Python-only. --reduction swaps to the sibling pyramid with the
      same subject_id + source_file_id but a different reduction. NDI
      documents are immutable, so mean and max are separate parents;
      switching is a pyramid swap, not a doc edit.

  - name: require_napari
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/viewer.py"
    decision_log: >-
      Python-only. Mirrors ndi.gui.app.genepyramid.viewer.require_napari:
      napari is an extra, not a runtime dependency, so a headless
      install does not pull in Qt and OpenGL, and a missing toolkit
      surfaces as a sentence naming the extra rather than a traceback
      from deep inside.

  - name: openPyramid
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/viewer.py"
    decision_log: >-
      Python-only. Opens the pyramid in a napari.Viewer via layerSpec.
      Reduction / channel / level control panels are a no-op in this
      scaffold; the follow-up PR lands the magicgui panels alongside
      without changing this signature.

  - name: levelDocs
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    output_arguments:
      - name: docs
        type_python: list
    decision_log: >-
      Python-only. Depends_on query for a pyramid's level children,
      sorted finest-first. One place that spells the depends_on slot
      name so levelTable and levelArrays stay in sync.

  - name: levelTable
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    decision_log: >-
      Python-only. Metadata-only rows for --report and for choosing a
      level without reading chunk bytes. Mirror of the MATLAB
      ndi.fun.doc.lightsheet.levelTable.

  - name: worldTransform
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    decision_log: >-
      Python-only. Napari applies `scale` and `translate` to the FINEST
      level of a multiscale layer; coarser levels come out of the level
      documents' own voxel_size/translation. Returns (scale, translate)
      as plain lists so the caller can drop napari's Nones in when a
      pyramid has no coordinate transform.

  - name: levelArrays
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    output_arguments:
      - name: arrays
        type_python: list
    decision_log: >-
      Python-only. One lazy dask array per level, backed by the level's
      chunk.bin_# file series through the NDI cloud cache. Scaffold in
      this PR: enumerates levels and reads metadata; the per-chunk
      reader plus the dask.delayed assembly is the next step.

  - name: layerSpec
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    output_arguments:
      - name: spec
        type_python: dict
    decision_log: >-
      Python-only. Napari-consumable kwargs (`data`, `multiscale`,
      `name`, `scale`, `translate`) for `viewer.add_image(**spec)`.
      Split from openPyramid so a headless caller can build the ladder
      without a display.

  - name: _fetch_chunk
    matlab_path: null
    python_path: "ndi/gui/app/lightsheetZarr/multiscale.py"
    decision_log: >-
      Python-only. Reads one chunk file through
      session.database_openbinarydoc(level_doc, 'chunk.bin_#') and
      returns raw bytes; the caller decodes per the level's
      codec/dtype/chunk_order. Signature is fixed so the follow-up dask
      block can drop it in without changing levelArrays' call sites.
