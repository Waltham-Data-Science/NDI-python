# ndi_matlab_python_bridge.yaml — src/ndi/gui/utility/
# The Primary Contract for the ndi.gui.utility namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: centerFigure
    type: function
    matlab_path: "+ndi/+gui/+utility/centerFigure.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/gui/utility/centerFigure.py"
    input_arguments:
      - name: figureHandle
        type_matlab: "matlab.ui.Figure"
        type_python: "QWidget"
      - name: referencePosition
        type_matlab: "double (1,4) | matlab.ui.Figure"
        type_python: "tuple[int, int, int, int] | QWidget | None"
        default: "None"
      - name: offset
        type_matlab: "double (1,2)"
        type_python: "tuple[int, int]"
        default: "(0, 0)"
    output_arguments: []
    decision_log: >
      Ported. Centers a window on screen or relative to a reference
      widget/position. MATLAB uses setpixelposition; Python uses
      QWidget.move with screen geometry calculation.
      Synchronized with MATLAB main as of 2026-03-13.

      Read against NDI-matlab fe64a9f53, the file's last-touching commit.
      CONTEXT FOR EVERY ENTRY IN THIS FILE: PySide6 is an optional extra and
      ndi_install.py installs .[dev,tutorials], so CI has no Qt and every
      Qt-dependent test in this package skips on every job. Nothing here is
      exercised anywhere. What could be checked was checked by pulling the
      plain-Python parts out where they were entangled with widgets, which is
      the split ndi.gui.nav and ndi.gui.preferences_editor already make. This
      one holds. Same reference resolution -- an explicit rectangle, another
      window's geometry, or the screen -- and the same centring arithmetic.
      Two differences that matter only at the margins: MATLAB asks
      get(0,'ScreenSize') for the WHOLE screen where this uses
      availableGeometry(), which excludes the taskbar or dock; and MATLAB's
      figure coordinates run from the BOTTOM left while Qt's run from the top
      left, so a positive vertical offset moves the window up there and down
      here. Nothing to port.
