# =========================================================================
# Recorded in #154. Most of this package was ported over #88-#148 and the
# entries were never written; the three sorter/pipeline apps below are the
# genuine gaps.
#
# The +component entries are NOT here: they were already written, in
# src/ndi/gui/component/, and #154 only corrected their matlab_path. Each
# named a file MATLAB does not have and never had --
# "+component/ndi_gui_component_NDIProgressBar.m" -- because the path was
# built from the PYTHON class name, which mangles the package prefix into
# the class, instead of read off the MATLAB tree, where the prefix is the
# folder and the file is plain NDIProgressBar.m. The four classes at
# +gui/ (Data, Icon, Lab, docViewer) had the same invented paths for the
# same reason. Nothing had ever compared a matlab_path against MATLAB, so
# twelve entries pointed at nothing and read as if they pointed at
# something; registering this package is what surfaced them.
# =========================================================================
ported_late:

  # --- ndi.gui.nav: the navigator's pane stack ---------------------------
  - name: pane
    matlab_path: "+ndi/+gui/+nav/pane.m"
    matlab_last_sync_hash: "87c6d08a"
    python_path: "ndi/gui/nav/pane.py"
    decision_log: "Base pane: geometry, palette, show/hide. Ported in #88."

  - name: ndiPane
