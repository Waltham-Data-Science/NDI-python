# ndi_matlab_python_bridge.yaml — src/ndi/gui/
# The Primary Contract for the ndi.gui namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: gui
    type: function
    matlab_path: "+ndi/+gui/gui.m"
    python_path: "ndi/gui/gui.py"
    input_arguments:
      - name: ndi_session_obj
        type_matlab: "ndi.session"
        type_python: "ndi.session.ndi_session"
    output_arguments: []
    decision_log: >
      Ported from MATLAB. Opens a GUI window to display the contents of
      an NDI session. Shows probes, DAQ readers, cache, database documents,
      and document properties. MATLAB uses figure/uicontrol; Python uses
      PySide6 QMainWindow with equivalent layout.
      Synchronized with MATLAB main as of 2026-03-13.

  - name: gui_v2
    type: function
    matlab_path: "+ndi/+gui/gui_v2.m"
    python_path: "ndi/gui/gui_v2.py"
    input_arguments:
      - name: ndi_session_obj
        type_matlab: "ndi.session"
        type_python: "ndi.session.ndi_session"
    output_arguments: []
    decision_log: >
      Ported from MATLAB. Opens an enhanced GUI with two views:
      "Experiment View" (ndi_gui_Lab) showing subjects, probes, and DAQs as
      draggable icons with connections, and "ndi_database View" (ndi_gui_Data) showing
      a searchable/filterable document table with dependency graph
      visualization. MATLAB uses axes-based rendering; Python uses
      PySide6 with QGraphicsScene for the lab view.
      Synchronized with MATLAB main as of 2026-03-13.


  - name: preferencesEditor
    type: function
    matlab_path: "+ndi/+gui/preferencesEditor.m"
    python_path: "ndi/gui/preferences_editor.py"
    python_name: "preferences_editor"
    input_arguments:
      - name: Position
        type_matlab: "1x4 double"
        type_python: "tuple[float, float, float, float]"
        default: "(100, 100, 820, 540)"
      - name: prefs
        type_matlab: "n/a"
        type_python: "ndi.preferences.ndi_preferences | None"
        default: "None"
      - name: visible
        type_matlab: "n/a"
        type_python: "bool"
        default: "True"
    output_arguments:
      - name: fig
        type_matlab: "matlab.ui.Figure"
        type_python: "ndi.gui.preferences_editor.PreferencesEditor"
    decision_log: >
      Ported from MATLAB. Opens the preferences editor over
      ndi.preferences: a category/subcategory tree on the left, one editor
      row per preference on the right, and Revert / Apply / Save along the
      bottom. Edits stay pending in the editor until Apply or Save, as in
      MATLAB. Deviations, all documented in the module docstring:
      (a) MATLAB returns the uifigure handle, Python returns the
      PreferencesEditor object (its .figure is the Qt widget) -- a Qt window
      with no Python reference is garbage collected, so the object is what
      must be kept; (b) a `prefs` argument names the store to edit,
      defaulting to the singleton MATLAB always edits, so the editor can be
      tested against a temporary preferences file; (c) MATLAB's numeric
      uieditfield refuses a non-numeric entry at the widget, so Python
      coerces again on Apply (coerce_value) and reports a value that will
      not convert the way MATLAB reports a failing set;
      (d) the model -- tree, row selection, labels, widget choice, coercion
      -- is plain Python in the same module and is tested without a display,
      matching the split ndi.gui.navigator makes with ndi.gui.nav.layout;
      (e) MATLAB's alias `preferencesEditor` is exported alongside the
      snake_case `preferences_editor`.
      Synchronized with MATLAB main as of 2026-09-01.
# =========================================================================
# Classes
# =========================================================================
classes:

  - name: ndi_gui_Data
    type: class
    matlab_path: "+ndi/+gui/Data.m"
    python_path: "ndi/gui/data.py"
    python_class: "ndi_gui_Data"
    inherits: "handle"

    properties:
      - name: fullDocuments
        type_matlab: "ndi.document[]"
        type_python: "list[Any]"
        decision_log: "Exact match. Stores all loaded documents."
      - name: fullTable
        type_matlab: "cell"
        type_python: "list[list[str]]"
        decision_log: "Exact match. Rows of [name, id, type, datestamp, json]."
      - name: tempDocuments
        type_matlab: "ndi.document[]"
        type_python: "list[Any]"
        decision_log: "Exact match. Filtered document subset."
      - name: tempTable
        type_matlab: "cell"
        type_python: "list[list[str]]"
        decision_log: "Exact match. Filtered table rows."

    methods:
      - name: ndi_gui_Data
        kind: constructor
        input_arguments: []
        output_arguments:
          - name: obj
            type_python: "ndi_gui_Data"
        decision_log: >
          Ported. Creates a QWidget with a table, detail panel, and
          search controls. MATLAB uses uitable/uipanel; Python uses
          QTableWidget/QFrame.

      - name: addDoc
        input_arguments:
          - name: docs
            type_matlab: "cell array of ndi.document"
            type_python: "list[Any]"
        output_arguments: []
        decision_log: >
          Exact match. Populates the table with document name, id,
          type, and datestamp.

      - name: filter
        input_arguments: []
        output_arguments: []
        decision_log: >
          Exact match. Filters the table based on search criteria
          (contains, begins with, ends with).

      - name: clear
        input_arguments: []
        output_arguments: []
        decision_log: "Exact match. Clears the table display."

      - name: details
        input_arguments:
          - name: row_index
            type_matlab: "event.Indices"
            type_python: "int"
        output_arguments: []
        decision_log: >
          Adapted. MATLAB uses CellSelectionCallback with event.Indices;
          Python uses QTableWidget.cellClicked signal with row index.

      - name: graph
        input_arguments:
          - name: ind
            type_matlab: "numeric"
            type_python: "int"
        output_arguments: []
        decision_log: >
          Ported. Builds and displays a dependency graph for all
          documents. MATLAB uses digraph/plot; Python uses networkx
          with matplotlib or PySide6 rendering.

      - name: subgraph
        input_arguments:
          - name: ind
            type_matlab: "numeric"
            type_python: "int"
        output_arguments: []
        decision_log: >
          Ported. Builds and displays a subgraph showing only direct
          dependencies of the selected document.

