    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/gui/nav/progress_pane.py"
    decision_log: "Ported in #103 with sessionInfo."

  - name: sessionInfo
    matlab_path: "+ndi/+gui/+nav/sessionInfo.m"
    matlab_last_sync_hash: "46672187"
    python_path: "ndi/gui/nav/session_info.py"
    decision_log: "Ported in #103."

  - name: statusIcon
    matlab_path: "+ndi/+gui/+nav/statusIcon.m"
    matlab_last_sync_hash: "41ef50f5"
    python_path: "ndi/gui/nav/status_icon.py"
