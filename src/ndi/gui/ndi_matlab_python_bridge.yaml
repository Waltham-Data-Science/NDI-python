    matlab_last_sync_hash: "958ff7c5"
    python_path: "ndi/gui/nav/datasets_pane.py"
    decision_log: >
      The navigator's elastic pane, ported across #103, #109, #110 and
      #111 in four layers (pure, model, cloud actions, widgets) which is
      why Python spreads it over datasets_pane.py, datasets_model.py,
