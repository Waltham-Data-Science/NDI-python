  # --- ndi.gui top level -------------------------------------------------
  - name: navigator
    matlab_path: "+ndi/+gui/navigator.m"
    matlab_last_sync_hash: "be84180d"
    python_path: "ndi/gui/navigator.py"
    decision_log: "The navigator window and its layout arithmetic. #105."

  - name: profileEditor
    matlab_path: "+ndi/+gui/profileEditor.m"
    matlab_last_sync_hash: "46672187"
    python_path: "ndi/gui/profile_editor.py"
    decision_log: >
      Ported in #121. The only route to choosing the active cloud
      account, which is why ndi.cloud.uilogin and the +cloud/+ui
      LoginDialog are both recorded not_applicable in src/ndi/cloud/.

  - name: cloudColors
    matlab_path: "+ndi/+gui/cloudColors.m"
    matlab_last_sync_hash: "b9ccf47b"
    python_path: "ndi/gui/cloud_colors.py"
    python_class: "CloudColors"
    decision_log: >
      The NDI Cloud palette. Deliberately NOT in the alias guard's
      COVERED list: its camelCase names are @property accessors over a
      NamedTuple's snake_case fields, so both spellings already resolve
      and an alias would be a third name for one value. That exemption is
      itself tested, in TestCloudColorsIsExemptForAReason.

  - name: kiasort
    matlab_path: "+ndi/+gui/+app/kiasort.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      The KIASORT spike-sorting app. Blocked on the same thing as the
      import package: KIASORT is a MATLAB sorter, and
      ndi.fun.probe.import.kiasort is recorded not_yet_ported in
      src/ndi/fun/ for that reason. Python already names KIASORT as an
      export TARGET (ndi.gui.app.electrode_data_export offers it
      alongside Kilosort, writing kiasort/kiasort.bin), so the export
      half of the loop works; what is missing is running the sorter and
      importing its results, neither of which Python can do without a
      Python KIASORT. ndi.gui.app.ensemble_maker's module docstring
      already says so.

  - name: vhNDISpikeSorter
    matlab_path: "+ndi/+gui/+app/vhNDISpikeSorter.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      The VH Lab manual spike-sorting app: a curation GUI for accepting,
      splitting and merging clusters. Same class of gap as kiasort --
      an interactive sorter with no Python implementation behind it --
      and the two are named together in ensemble_maker's docstring as the
      pair blocking that app's sorter menu.

  - name: pipelineEditor
    matlab_path: "+ndi/+gui/+app/pipelineEditor.m"
    matlab_last_sync_hash: "5088f2ae"
    status: not_yet_ported
    decision_log: >
      Edits an analysis pipeline: the ordered list of calculators to run
      over a session. Python has the calculator layer underneath
      (ndi.calc, recorded in src/ndi/calc/) but no pipeline document and
      no editor over it, so there is nothing for the app to edit yet.
      It lands after a pipeline representation does, not before.
