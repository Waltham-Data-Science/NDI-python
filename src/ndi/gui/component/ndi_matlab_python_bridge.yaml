  # -----------------------------------------------------------------------
  # ndi.gui.component.internal.ndi_gui_component_internal_ProgressTracker
  # -----------------------------------------------------------------------
  - name: ndi_gui_component_internal_ProgressTracker
    type: class
    matlab_path: "+ndi/+gui/+component/+internal/ProgressTracker.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/gui/component/internal/ProgressTracker.py"
    python_class: "ndi_gui_component_internal_ProgressTracker"
    inherits: "handle"
    decision_log: >
      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      The core matches: step counting, the PercentageComplete dependent
      property, {{Property}} template rendering, the UpdateInterval throttle,
      reset and setCompleted, and MATLAB's events as callback lists.
      updateMessage WAS MISSING, and it is the only place MATLAB notifies
      MessageUpdated -- so the whole message channel was dead here:
      ProgressMonitor registers a listener on on_message_updated,
      MessageUpdatedEventData exists, and _fire_message_updated had no caller
      anywhere in the tree. Ported, notifying without storing as MATLAB does.
      Both notify sites now pass the full three-field payload. STILL ABSENT,
      deliberately recorded rather than improvised: setTotalSteps (MATLAB
      refuses to re-initialise TotalSteps once set, which rests on its
      NaN-initialised property where this port starts at 0), isComplete,
      resetProgress, deleteDumpFile, readFromFile, getAsynchTaskProgress
      (present here as a static on AsynchProgressTracker instead) and
      initializeAsynchListener. fillTemplateMessage and replacePropertyValue
      are folded into the private _render_template.

    properties:
      - name: CurrentStep
        type_matlab: "double"
        type_python: "int"
        decision_log: "Exact match."
      - name: TotalSteps
        type_matlab: "double"
        type_python: "int"
        decision_log: "Exact match."
      - name: IsFinished
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match."
      - name: PercentageComplete
        type_matlab: "double (dependent)"
        type_python: "float (property)"
        decision_log: "Exact match. Computed as CurrentStep / TotalSteps * 100."
      - name: Message
        type_matlab: "char (dependent)"
        type_python: "str (property)"
        decision_log: "Exact match. Formatted from TemplateMessage."
      - name: UpdateInterval
        type_matlab: "double"
        type_python: "float"
        decision_log: "Exact match. Seconds between event notifications."
      - name: TemplateMessage
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          Exact match. Uses {{PropertyName}} template syntax.
      - name: CompletedMessage
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match."
      - name: DumpFilePath
        type_matlab: "char"
        type_python: "str | None"
        decision_log: >
          Exact match. Path for async file-based progress dumps.
          Used by ndi_gui_component_internal_AsynchProgressTracker subclass. Synchronized 2026-03-13.

    methods:
      - name: ndi_gui_component_internal_ProgressTracker
        kind: constructor
        input_arguments:
          - name: totalSteps
            type_matlab: "double"
            type_python: "int"
            default: "0"
        output_arguments:
          - name: obj
            type_python: "ndi_gui_component_internal_ProgressTracker"
        decision_log: "Exact match."

      - name: updateProgress
        input_arguments:
          - name: currentStep
            type_matlab: "double"
            type_python: "int | None"
            default: "None"
        output_arguments: []
        decision_log: >
          Exact match. Increments by 1 if no argument, or sets to
