        output_arguments: []
        decision_log: "Exact match. Reinitializes the tracker."

  # -----------------------------------------------------------------------
  # ndi.gui.component.internal.ndi_gui_component_internal_AsynchProgressTracker
  # -----------------------------------------------------------------------
  - name: ndi_gui_component_internal_AsynchProgressTracker
    type: class
    matlab_path: "+ndi/+gui/+component/+internal/AsynchProgressTracker.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/gui/component/internal/AsynchProgressTracker.py"
    python_class: "ndi_gui_component_internal_AsynchProgressTracker"
    inherits: "ndi.gui.component.internal.ndi_gui_component_internal_ProgressTracker"
    decision_log: >
      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      The override, the throttled JSON dump and the three dumped properties
      (CurrentStep, TotalSteps, TemplateMessage) all match. Three deliberate
      differences: the port guards completion with TotalSteps > 0 so that 0
      means indeterminate, where MATLAB would finish immediately; it clamps
      CurrentStep to TotalSteps on finishing, where MATLAB leaves it; and it
      dumps on the FIRST update, where MATLAB starts its tic on that call and
      so waits one interval. getAsynchTaskProgress lives here as a static,
      where MATLAB puts it on ProgressTracker. Nothing further to port.

    methods:
      - name: updateProgress
        input_arguments:
          - name: currentStep
            type_matlab: "double"
            type_python: "int | None"
            default: "None"
        output_arguments: []
        decision_log: >
          Overrides parent. Adds file-based progress dumping for
          cross-process monitoring.

      - name: getAsynchTaskProgress
        kind: static
        input_arguments:
          - name: filepath
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: progressData
            type_python: "dict"
        decision_log: >
          Exact match. Reads progress state from a JSON dump file
          written by updateProgress. Returns dict with CurrentStep,
          TotalSteps, TemplateMessage keys. Synchronized 2026-03-13.

