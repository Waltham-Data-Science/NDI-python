        type_python: "ndi_gui_component_internal_ProgressTracker"
        decision_log: "Exact match."
      - name: DisplayElapsedTime
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match."
      - name: DisplayRemainingTime
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match."

