    python_path: "ndi/gui/component/internal/event/ProgressUpdatedEventData.py"
    python_class: "ndi_gui_component_internal_event_ProgressUpdatedEventData"
    inherits: "event.EventData"
    decision_log: >
      Examined against NDI-matlab fe64a9f53, the file's last-touching commit,
      and this one did NOT hold. MATLAB declares three properties --
      ProgressPercentage, CurrentStep, TotalSteps -- and BOTH of
      ProgressTracker's notify sites pass all three. The port carried only the
      percentage, and under a different name (PercentageComplete), so a
      listener written against the MATLAB API got AttributeError for two of
      the three and missed the third by spelling. All three are now carried
      under MATLAB's names, with PercentageComplete kept as a read-only alias
      so existing callers keep working. Covered by
      tests/test_gui_progress_events.py.

    properties:
      - name: PercentageComplete
        type_matlab: "double"
        type_python: "float"
        decision_log: "Exact match."

    methods:
