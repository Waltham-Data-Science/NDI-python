            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: Overwrite
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
          - name: AutoDelete
            type_matlab: "logical"
            type_python: "bool"
            default: "True"
        output_arguments:
