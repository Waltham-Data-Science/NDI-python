  - name: ndi_gui_component_abstract_ProgressMonitor
    type: class
    matlab_path: "+ndi/+gui/+component/+abstract/ProgressMonitor.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/gui/component/abstract/ProgressMonitor.py"
    python_class: "ndi_gui_component_abstract_ProgressMonitor"
    inherits: "handle (abstract)"
    decision_log: >
      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      The behaviour is present: tracker attach/detach, progress and message
      handling, completion, and time-remaining estimation (MATLAB's
      estimateRemainingTime and formatRemainingTime are the private
      _estimateRemainingTime and _formatDuration here). MATLAB's listener
      plumbing -- initializeListeners, resetListeners, onProgressTrackerSet,
      onInitalized and the four on*Updated handlers -- is MATLAB event
      machinery, replaced by plain callback lists, so it has no counterpart by
      design. The completion listener now takes the event data alongside the
      source, matching MATLAB's notify('TaskCompleted', eventData); the
      argument is optional so an existing one-argument listener still works.

    properties:
      - name: Title
        type_matlab: "char"
        type_python: "str"
        default: "'In progress...'"
        decision_log: "Exact match."
      - name: UpdateInterval
        type_matlab: "double"
        type_python: "float"
        decision_log: "Exact match. Seconds between display refreshes."
      - name: ndi_gui_component_internal_ProgressTracker
