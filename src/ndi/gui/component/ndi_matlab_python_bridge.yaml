  # -----------------------------------------------------------------------
  # ndi.gui.component.ndi_gui_component_ProgressBarWindow
  # -----------------------------------------------------------------------
  - name: ndi_gui_component_ProgressBarWindow
    type: class
    matlab_path: "+ndi/+gui/+component/ProgressBarWindow.m"
    matlab_last_sync_hash: "dfa7591cc"
    python_path: "ndi/gui/component/ProgressBarWindow.py"
    python_class: "ndi_gui_component_ProgressBarWindow"
    inherits: "matlab.apps.AppBase"
    decision_log: >
      Examined against NDI-matlab dfa7591cc, the file's last-touching commit.
      The multi-bar window is ported to PySide6 and the bar-management API
      matches: addBar, updateBar, removeBar, getBarNum, getState,
      checkComplete, setTimeout and checkTimeout, over a module-level registry
      standing in for MATLAB's findall. MATLAB's uifigure plumbing --
      setGraphics, setFigureSize, setFigureTitle, the success/error button
      icons, tryDock, forceReleaseDocked, bringToFront, handleAppChange,
      handleButtonPress and deleteIfNoOpenBars -- has no Qt counterpart and is
      absent by design. ONE BEHAVIOURAL GAP, RECORDED RATHER THAN IMPROVISED:
      MATLAB's isHeadless / resolveSilentMode / silentModeDefault let it
      detect that no display is usable (batchStartupOptionUsed, or an empty
      DISPLAY on Linux) and run SILENTLY instead of building a figure. This
      port has no equivalent -- require_qt raises ImportError when PySide6 is
      missing, and nothing checks for a display at all, so a headless caller
      that does have PySide6 gets a Qt failure where MATLAB degrades quietly.
      Porting a silent mode is a design decision for a maintainer rather than
      something to invent while dating a hash.

    properties:
      - name: ScreenFrac
        type_matlab: "double"
        type_python: "float"
        default: "0.025"
        decision_log: "Exact match."
      - name: Timeout
        type_matlab: "duration"
        type_python: "float"
        decision_log: >
          Adapted. MATLAB uses duration type (minutes(1));
          Python uses float seconds (60.0).
      - name: AutoDelete
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
        decision_log: "Exact match."
      - name: ProgressBars
        type_matlab: "struct array"
        type_python: "list[dict[str, Any]]"
        decision_log: >
          Adapted. MATLAB struct array with fields Tag, Progress,
          State, Auto, Axes, Patch, Percent, Button, Label, Clock,
          Timer. Python uses list of dicts with equivalent keys.

