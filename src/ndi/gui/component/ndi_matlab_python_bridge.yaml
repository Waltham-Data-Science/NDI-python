        input_arguments:
          - name: percentageComplete
            type_matlab: "double"
            type_python: "float"
        output_arguments:
          - name: obj
            type_python: "ndi_gui_component_internal_event_ProgressUpdatedEventData"
        decision_log: "Exact match."

