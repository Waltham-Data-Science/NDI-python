# ndi_matlab_python_bridge.yaml — src/ndi/update/
# The Primary Contract for the ndi.update namespace.
#
# The MATLAB side is +ndi/+update, added in VH-Lab/NDI-matlab#1038.
#
# What the two halves have in common: both check their OWN repository's main
# branch (NDI-matlab: also its releases, for the toolbox), report the same
# result fields, refuse the same unsafe updates (not on main; the user's own
# changes without consent), and read the same ~/.ndi/install.json receipt that
# install/install-ndi.sh and install-ndi.ps1 now write.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

functions:

  - name: check
    type: function
    matlab_path: "+ndi/+update/check.m"
    matlab_last_sync_hash: "749b1a266"
    python_path: "ndi/update/check.py"
    input_arguments:
      - name: IncludeDependencies
        type_matlab: "logical"
        type_python: "bool"
      - name: Verbose
        type_matlab: "logical"
        type_python: "bool"
      - name: Timeout
        type_matlab: "double"
        type_python: "float"
      - name: RepoRoot
        type_matlab: "string"
        type_python: "str"
      - name: IncludePython
        type_matlab: "logical"
        decision_log: "No counterpart: NDI-python checking NDI-python is the whole function."
      - name: IncludeCalculators
        type_matlab: "logical"
        decision_log: "No counterpart: there are no calculator clones to check (see decision_log)."
      - name: NdiHome
        type_python: "str"
        decision_log: "Python only, for tests: check the installer install under this folder (MATLAB's checkPython has the same option)."
      - name: GitHubApi
        type_python: "Callable[[str, float], Any] | None"
        decision_log: "Python only, for tests (MATLAB's checkPython has the same option)."
    output_arguments:
      - name: result
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported 2026-10-18 against NDI-matlab f9ced4bcd. Same field names in a dict.
      Git installs: the same git logic (fetch origin main, commits behind and
      ahead, the user's changed/new files and local commits), with the
      dependency clones taken from ~/.ndi/tools, where ndi_install.py puts
      them, instead of from requirements.txt siblings. Toolbox installs have
      no counterpart (NDI-python has no releases); in their place the
      installer install is compared with main through the commit in
      ~/.ndi/install.json, falling back to commits since the install time --
      the same three-step lookup as MATLAB's checkPython, which is how
      NDI-matlab checks this same install. Adds CanInstall and InstalledAt
      (both from checkPython's result) and drops ReleaseUrl, MltbxUrl,
      BothInstalled and Python. NaN counts are None.
      2026-10-19: NDI-matlab a24f19076: untracked files no longer count as the user's
      modifications (git stash and pull leave them alone); only untracked files
      at a path the update adds a file to are reported, as BlockingFiles
      (replacing NewFiles), and they set HasModifications. Ported the same.
      2026-10-21: NDI-matlab b6427cc89: ndi_install now puts stashed changes back after
      the pull (git stash pop), as ndi_install.py and this port already did, and
      only pops a stash it made itself. Comment only here; nothing to port.
      2026-10-28: NDI-matlab 19b8ab573 / 749b1a266 (the Update dialog's package
      table): Dependencies entries gain CurrentVersion and LatestVersion
      (short commit hashes) and Url -- ported; Url is "" here, since the clones
      in ~/.ndi/tools come from ndi_install.py, not a requirements.txt line.
      MATLAB also checks the NDIcalc-*-matlab calculator clones beside
      NDI-matlab (Calculators, CalculatorUpdateAvailable, IncludeCalculators).
      NDI-python has no such clones -- it gets the calculator definitions it
      uses (ndicalc-vis-matlab) as a pip dependency, updated with NDI-python --
      so both fields are present and always empty / False. MATLAB's Python
      field gains CurrentVersion, LatestVersion and CommitsBehind; this
      function is that check, and already returns them.

  - name: install
    type: function
    matlab_path: "+ndi/+update/install.m"
    matlab_last_sync_hash: "749b1a266"
    python_path: "ndi/update/install.py"
    input_arguments:
      - name: Confirm
        type_python: "bool"
      - name: Force
        type_python: "bool"
      - name: AllowModified
        type_python: "bool"
      - name: Timeout
        type_python: "float"
      - name: RepoRoot
        type_python: "str"
      - name: Dependencies
        type_matlab: "double (1 or 2)"
        decision_log: "No counterpart: NDI-python's dependencies are fixed by pyproject.toml."
      - name: IncludePython
        type_matlab: "logical"
        decision_log: "No counterpart (see check)."
      - name: IncludeCalculators
        type_matlab: "logical"
        decision_log: "No counterpart (see check)."
      - name: Packages
        type_matlab: "string array"
        type_python: "list[str] | None"
    output_arguments:
      - name: result
        type_python: "dict"
    decision_log: >
      Ported 2026-10-18 against NDI-matlab f9ced4bcd. Same guards in the same order
      and with the same error identifiers (UpdateError.identifier): not on
      main, the user's modifications (listed, default No; with Confirm=False
      an error unless AllowModified), then no installer. Git: pull --ff-only
      origin main with changed files stashed and restored (MATLAB's
      ndi_install stashes without restoring; ndi_install.py restores, and
      this follows it), then python ndi_install.py --update. Installer:
      re-runs install-ndi.sh --yes --no-path, or on Windows starts
      install-ndi.ps1 in its own window, waiting for this process to exit,
      because a running ndi.exe cannot be replaced. Clears caches afterwards,
      as MATLAB does. Ask stands in for MATLAB's input (tests).
      2026-10-19: NDI-matlab a24f19076: untracked files no longer count as the user's
      modifications (git stash and pull leave them alone); only untracked files
      at a path the update adds a file to are reported, as BlockingFiles
      (replacing NewFiles), and install stops before starting with
      ndi:update:install:untrackedFilesInTheWay, even with AllowModified. Ported the same.
      2026-10-21: NDI-matlab b6427cc89: ndi_install now puts stashed changes back after
      the pull (git stash pop), as ndi_install.py and this port already did, and
      only pops a stash it made itself. The two languages now behave the same.
      2026-10-28: NDI-matlab 19b8ab573 / 749b1a266: Packages updates only the
      named packages (unknown names raise ndi:update:install:unknownPackage;
      up-to-date ones are skipped; only changes in the named packages need
      consent; the clone need not be on main unless "NDI-python" is named),
      and each repository is pulled with pullRepo (stash, git pull --no-edit,
      stash pop; local commits are merged rather than refused by --ff-only).
      Ported. Mapping: "NDI-python" pulls main and runs ndi_install.py
      without --update (MATLAB pulls NDI-matlab and runs ndi_install only
      for named dependencies); a named dependency is pulled in ~/.ndi/tools,
      where the .pth file already points, so no installer run is needed.
      With no Packages, ndi_install.py --update runs as before, and main is
      pulled only when NDI-python is behind (as MATLAB now pulls NDI-matlab
      only when behind). Calculators and "NDI-matlab" have no counterpart.

  - name: installType
    type: function
    matlab_path: "+ndi/+update/installType.m"
    matlab_last_sync_hash: "f9ced4bcd"
    python_path: "ndi/update/install_type.py"
    output_arguments:
      - name: type
        type_matlab: "string"
        type_python: "str"
      - name: info
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported 2026-10-18 against NDI-matlab f9ced4bcd. MATLAB answers git / toolbox /
      unknown; NDI-python's installs are installer / git / pip / unknown. info
      has SourceDir and RepoRoot as in MATLAB, plus NdiHome and Receipt (the
      parsed install.json); ToolboxVersion and BothInstalled have no
      counterpart without a packaged toolbox.

  - name: modificationSummary
    type: function
    matlab_path: "+ndi/+update/modificationSummary.m"
    matlab_last_sync_hash: "b6427cc89"
    python_path: "ndi/update/modification_summary.py"
    input_arguments:
      - name: result
        type_python: "dict"
      - name: MaxFiles
        type_python: "int"
    output_arguments:
      - name: txt
        type_python: "str"
    decision_log: >
      Ported 2026-10-18 against NDI-matlab f9ced4bcd. Same layout. The closing
      sentence says changed files are put back after the update, because
      Python's git update restores the stash (see install).
      2026-10-19: NDI-matlab a24f19076: untracked files no longer count as the user's
      modifications (git stash and pull leave them alone); only untracked files
      at a path the update adds a file to are reported, as BlockingFiles
      (replacing NewFiles), and the summary lists them as "in the way". Ported the same.
      2026-10-21: NDI-matlab b6427cc89: ndi_install now puts stashed changes back after
      the pull (git stash pop), as ndi_install.py and this port already did, and
      only pops a stash it made itself. Its closing sentence now matches this port's.

  - name: checkOnStartup
    type: function
    matlab_path: "+ndi/+update/checkOnStartup.m"
    matlab_last_sync_hash: "19b8ab573"
    python_path: "ndi/update/check_on_startup.py"
    output_arguments:
      - name: line
        type_matlab: "(none; prints)"
        type_python: "str"
    decision_log: >
      Ported 2026-10-18 against NDI-matlab f9ced4bcd. Shares Update.CheckOnStartup
      and Update.CheckIntervalDays with MATLAB through NDI_Preferences.json,
      but keeps its own Update.Python.LastCheckTime (MATLAB's is
      Update.MATLAB.LastCheckTime), since one language checking must not hold
      off the other's check of a different repository. NDI-python has no
      ndi_Init: the navigator calls this, on a thread, when it opens; importing
      ndi never does. Returns the line it printed.
      2026-10-28: NDI-matlab 19b8ab573 also reports calculator updates
      (CalculatorUpdateAvailable). Nothing to port: NDI-python has no
      calculator clones (see check), and a dependency behind already sets
      UpdateAvailable here.

  - name: checkPython
    type: function
    matlab_path: "+ndi/+update/checkPython.m"
    matlab_last_sync_hash: "e2a3d8e57"
    python_path: "ndi/update/check.py"
    status: ported_differently
    decision_log: >
      MATLAB's check of an installed NDI-python, from NDI-matlab. Here that is
      ndi.update.check itself (its installer branch), using the same receipt,
      the same fallback to the install time (the receipt's installedAt, then
      uv's file time; NDI-matlab e2a3d8e57) and the same result fields.

  - name: compareVersions
    type: function
    matlab_path: "+ndi/+update/compareVersions.m"
    matlab_last_sync_hash: "f9ced4bcd"
    status: matlab_only
    decision_log: >
      Compares release numbers for NDI-matlab's packaged toolbox. NDI-python
      has no releases -- every install follows main and is compared by commit
      -- so there is nothing to compare.

  - name: latestRelease
    type: function
    matlab_path: "+ndi/+update/latestRelease.m"
    matlab_last_sync_hash: "f9ced4bcd"
    status: matlab_only
    decision_log: >
      Fetches NDI-matlab's latest GitHub release for its toolbox. NDI-python
      has no releases (see compareVersions).

  - name: toolboxIdentifier
    type: function
    matlab_path: "+ndi/+update/toolboxIdentifier.m"
    matlab_last_sync_hash: "f9ced4bcd"
    status: matlab_only
    decision_log: >
      The MATLAB Add-On identifier of the NDI-matlab toolbox. A MATLAB
      packaging concept; NDI-python has no counterpart.

  - name: runGit
    type: function
    matlab_path: "+ndi/+update/private/runGit.m"
    matlab_last_sync_hash: "42f532167"
    python_path: "ndi/update/_git.py"
    status: ported_differently
    decision_log: >
      Private helper; here run_git in the private module _git, taking the
      git arguments as a list (subprocess, no shell) rather than one string.
      NDI-matlab 42f532167 makes git non-interactive (empty stdin, no
      credential prompt, pager or editor); run_git does the same.

  - name: githubApi
    type: function
    matlab_path: "+ndi/+update/private/githubApi.m"
    matlab_last_sync_hash: "f9ced4bcd"
    python_path: "ndi/update/_github.py"
    status: ported_differently
    decision_log: >
      Private helper; here github_api in the private module _github, on
      urllib.request instead of webread.

  - name: packageStatus
    type: function
    matlab_path: "+ndi/+update/packageStatus.m"
    matlab_last_sync_hash: "749b1a266"
    python_path: "ndi/update/package_status.py"
    input_arguments:
      - name: result
        type_matlab: "struct"
        type_python: "dict"
    output_arguments:
      - name: rows
        type_matlab: "struct array"
        type_python: "list[dict]"
      - name: summary
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported (NDI-matlab 19b8ab573, 749b1a266). Same row and summary fields,
      notes, levels, Selectable/Selected rules and messages. Rows: a git
      install lists NDI-python ("ndi") and each ~/.ndi/tools clone
      ("dependency"); an installer install is one "installer" row for
      NDI-python (MATLAB's "toolbox" row has no counterpart), noting that it
      is updated by running the installer again; pip and unknown installs are
      one "Could not check" row. No "calculator" rows and no "python" row (see
      check). A dependency row's WillUpdate is its own status (behind or
      missing): MATLAB also requires UpdateAvailable, which a dependency
      behind always sets here. A snake_case alias package_status is bound to
      the same function.

  - name: findCalculators
    type: function
    matlab_path: "+ndi/+update/private/findCalculators.m"
    matlab_last_sync_hash: "19b8ab573"
    status: matlab_only
    decision_log: >
      Finds the NDIcalc-*-matlab git clones beside NDI-matlab and on the
      MATLAB path, for check's Calculators. NDI-python has no calculator
      clones: the calculator definitions it uses come from the
      ndicalc-vis-matlab pip dependency, updated with NDI-python.

  - name: pullRepo
    type: function
    matlab_path: "+ndi/+update/private/pullRepo.m"
    matlab_last_sync_hash: "19b8ab573"
    python_path: "ndi/update/install.py"
    status: ported_differently
    decision_log: >
      Private helper; here _pull_repo in install.py, beside the UpdateError
      it raises. Same steps and messages: stash tracked edits (comparing
      refs/stash so an unrelated older stash is never popped), git pull
      --no-edit, stash pop with a warning (printed) if the edits no longer
      apply, and ndi:update:install:pullFailed on a failed status, stash or
      pull.
