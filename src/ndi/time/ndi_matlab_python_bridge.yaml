# ndi_matlab_python_bridge.yaml — src/ndi/time/
# The Primary Contract for the ndi.time namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.time.clocktype  (enumeration)
  # =========================================================================
  - name: clocktype
    type: class
    matlab_path: "+ndi/+time/clocktype.m"
    matlab_last_sync_hash: "5210c69db"
    python_path: "ndi/time/clocktype.py"
    python_class: "ndi_time_clocktype"
    decision_log: >
      NDI-matlab 5210c69db repaired a typo: ne()'s second argument was
      declared ndi_cock_obj_b while the body read ndi_clocktype_obj_b, so
      every ~= errored on an undefined variable, and the fix also switched
      the comparison to strcmp. Nothing to port: Python's clocktype is an
      Enum, so != comes from Enum identity and the bug never existed here.

    properties:
      - name: UTC
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'utc'."

      - name: APPROX_UTC
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'approx_utc'."

      - name: EXP_GLOBAL_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'exp_global_time'."

      - name: APPROX_EXP_GLOBAL_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'approx_exp_global_time'."

      - name: DEV_GLOBAL_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'dev_global_time'."

      - name: APPROX_DEV_GLOBAL_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'approx_dev_global_time'."

      - name: DEV_LOCAL_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'dev_local_time'."

      - name: NO_TIME
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'no_time'."

      - name: INHERITED
        type_matlab: "char"
        type_python: "str"
        decision_log: "Enum member. Value 'inherited'."

    methods:
      - name: from_string
        kind: classmethod
        input_arguments:
          - name: type_str
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ct
            type_python: "ndi_time_clocktype"
        decision_log: >
          Python-specific factory. MATLAB uses constructor.
          Case-insensitive matching.

      - name: needs_epoch
        input_arguments: []
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match. Returns True only for DEV_LOCAL_TIME.

      - name: is_global
        input_arguments: []
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match. Returns True for UTC, APPROX_UTC,
          EXP_GLOBAL_TIME, APPROX_EXP_GLOBAL_TIME,
          DEV_GLOBAL_TIME, APPROX_DEV_GLOBAL_TIME.

      - name: epochgraph_edge
        input_arguments:
          - name: other
            type_matlab: "ndi.time.clocktype"
            type_python: "ndi_time_clocktype"
        output_arguments:
          - name: cost
            type_python: "float"
          - name: mapping
            type_python: "ndi_time_timemapping | None"
        decision_log: >
          Exact match. Returns 2-tuple (cost, mapping).
          Valid transitions (cost=100, identity mapping):
          utc→utc, utc→approx_utc, exp_global→exp_global,
          exp_global→approx_exp_global, dev_global→dev_global,
          dev_global→approx_dev_global.

    static_methods:
      - name: assert_global
        input_arguments:
          - name: clocktype
            type_python: "ndi_time_clocktype"
        output_arguments: []
        decision_log: >
          Exact match. Raises AssertionError if clock type is
          not global.

  # =========================================================================
  # ndi.time.timemapping
  # =========================================================================
  - name: timemapping
    type: class
    matlab_path: "+ndi/+time/timemapping.m"
    matlab_last_sync_hash: "89d6b45f"
    python_path: "ndi/time/timemapping.py"
    python_class: "ndi_time_timemapping"

    properties:
      - name: mapping
        type_matlab: "double array"
        type_python: "np.ndarray"
        decision_log: >
          Polynomial coefficients [a_n, ..., a_1, a_0].
          Implemented as @property in Python.

      - name: scale
        type_matlab: "double"
        type_python: "float"
        decision_log: >
          Computed property. First coefficient for linear mappings.

      - name: shift
        type_matlab: "double"
        type_python: "float"
        decision_log: >
          Computed property. Last coefficient for linear mappings.

    methods:
      - name: timemapping
        kind: constructor
        input_arguments:
          - name: mapping
            type_matlab: "double array"
            type_python: "list[float] | np.ndarray | None"
            default: "None"
        output_arguments:
          - name: tm_obj
            type_python: "ndi_time_timemapping"
        decision_log: >
          Exact match. Default is [1, 0] (identity). Tests
          mapping with t_in=0 on construction.

      - name: map
        input_arguments:
          - name: t_in
            type_matlab: "double"
            type_python: "float | np.ndarray"
        output_arguments:
          - name: t_out
            type_python: "float | np.ndarray"
        decision_log: >
          Exact match. Applies polynomial via numpy.polyval.

      - name: inverse
        input_arguments: []
        output_arguments:
          - name: tm_inv
            type_python: "ndi_time_timemapping"
        decision_log: >
          Exact match. Only supports linear mappings. Raises
          ValueError for higher-order or zero-scale mappings.

      - name: compose
        input_arguments:
          - name: other
            type_matlab: "ndi.time.timemapping"
            type_python: "ndi_time_timemapping"
        output_arguments:
          - name: tm_composed
            type_python: "ndi_time_timemapping"
        decision_log: >
          Exact match. Composes self then other. Only supports
          linear mappings. Raises ValueError for higher-order.

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Mapped to Python __eq__. Uses numpy.allclose for
          floating-point comparison.

      - name: to_dict
        input_arguments: []
        output_arguments:
          - name: data
            type_python: "dict"
        decision_log: "Python-specific serialization method."

      - name: from_dict
        kind: classmethod
        input_arguments:
          - name: data
            type_python: "dict"
        output_arguments:
          - name: tm_obj
            type_python: "ndi_time_timemapping"
        decision_log: "Python-specific factory method."

    static_methods:
      - name: identity
        kind: classmethod
        input_arguments: []
        output_arguments:
          - name: tm_obj
            type_python: "ndi_time_timemapping"
        decision_log: "Exact match. Returns ndi_time_timemapping([1, 0])."

      - name: linear
        kind: classmethod
        input_arguments:
          - name: scale
            type_matlab: "double"
            type_python: "float"
            default: "1.0"
          - name: shift
            type_matlab: "double"
            type_python: "float"
            default: "0.0"
        output_arguments:
          - name: tm_obj
            type_python: "ndi_time_timemapping"
        decision_log: >
          Python-specific convenience factory. Creates
          ndi_time_timemapping([scale, shift]).

  # =========================================================================
  # ndi.time.timereference
  # =========================================================================
  - name: timereference
    type: class
    matlab_path: "+ndi/+time/timereference.m"
    matlab_last_sync_hash: "fe64a9f5"
    python_path: "ndi/time/timereference.py"
    python_class: "ndi_time_timereference"

    properties:
      - name: referent
        type_matlab: "ndi.epoch.epochset"
        type_python: "Any"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Implemented as @property in Python."

      - name: clocktype
        type_matlab: "ndi.time.clocktype"
        type_python: "ndi_time_clocktype"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Implemented as @property in Python."

      - name: epoch
        type_matlab: "char"
        type_python: "str | None"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: >
          Implemented as @property in Python. Required when
          clocktype is DEV_LOCAL_TIME.

      - name: time
        type_matlab: "double"
        type_python: "float | None"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Implemented as @property in Python."

      - name: session_id
        type_matlab: "char"
        type_python: "str"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: >
          Implemented as @property in Python. Extracted from
          referent if not explicitly provided.

    methods:
      - name: timereference
        kind: constructor
        input_arguments:
          - name: referent
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
          - name: clocktype
            type_matlab: "ndi.time.clocktype | char"
            type_python: "ndi_time_clocktype | str"
          - name: epoch
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
          - name: time
            type_matlab: "double"
            type_python: "float | None"
            default: "None"
          - name: session_id
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: tr_obj
            type_python: "ndi_time_timereference"
        decision_log: >
          Exact match. Accepts clocktype as string or enum.
          Raises ValueError if DEV_LOCAL_TIME without epoch.

      - name: to_struct
        input_arguments: []
        output_arguments:
          - name: trs
            type_python: "ndi_time_timereference__struct"
        decision_log: >
          MATLAB: ndi_timereference2struct. Python uses to_struct().
          Converts to a serializable struct without live objects.

      - name: to_dict
        input_arguments: []
        output_arguments:
          - name: data
            type_python: "dict"
        decision_log: "Python-specific serialization method."

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Mapped to Python __eq__. Compares session_id, clocktype,
          epoch, and time. Referent comparison intentionally omitted.

    static_methods:
      - name: from_struct
        kind: classmethod
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
          - name: struct
            type_python: "ndi_time_timereference__struct"
        output_arguments:
          - name: tr_obj
            type_python: "ndi_time_timereference"
        decision_log: >
          MATLAB: ndi_timereferencestruct2timereference. Python
          uses classmethod from_struct(). Resolves referent from
          session via findexpobj().

  # =========================================================================
  # ndi.time.timereference_struct (dataclass)
  # =========================================================================
  - name: timereference_struct
    type: class
    matlab_path: null
    python_path: "ndi/time/timereference.py"
    python_class: "ndi_time_timereference__struct"

    properties:
      - name: referent_epochsetname
        type_python: "str"
        decision_log: "String representation of the referent."

      - name: referent_classname
        type_python: "str"
        decision_log: "Class name of the referent."

      - name: clocktypestring
        type_python: "str"
        decision_log: "Clock type as string."

      - name: epoch
        type_python: "str | None"
        decision_log: "ndi_epoch_epoch identifier."

      - name: session_id
        type_python: "str"
        decision_log: "ndi_session identifier."

      - name: time
        type_python: "float | None"
        decision_log: "Time value."

    decision_log: >
      Python dataclass for serialization. Mirrors the MATLAB struct
      used by ndi_timereference2struct / ndi_timereferencestruct2timereference.

  # =========================================================================
  # ndi.time.syncrule  (abstract base class)
  # =========================================================================
  - name: syncrule
    type: class
    matlab_path: "+ndi/+time/syncrule.m"
    matlab_last_sync_hash: "85b35859"
    python_path: "ndi/time/syncrule_base.py"
    python_class: "ndi_time_syncrule"
    inherits: "ndi.ido"

    properties:
      - name: parameters
        type_matlab: "struct"
        type_python: "dict[str, Any]"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: >
          Implemented as @property in Python. Returns a copy.

    methods:
      - name: syncrule
        kind: constructor
        input_arguments:
          - name: parameters
            type_matlab: "struct"
            type_python: "dict[str, Any] | None"
            default: "None"
          - name: identifier
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: sr_obj
            type_python: "ndi_time_syncrule"
        decision_log: >
          Abstract class. Validates parameters on construction.

      - name: set_parameters
        input_arguments:
          - name: parameters
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        output_arguments: []
        decision_log: >
          Exact match. Validates then sets parameters. Raises
          ValueError if invalid.

      - name: is_valid_parameters
        input_arguments:
          - name: parameters
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: is_valid
            type_python: "bool"
          - name: msg
            type_python: "str"
        decision_log: >
          Exact match. Returns 2-tuple (is_valid, error_message).
          Base implementation always returns (True, "").

      - name: eligible_clocks
        input_arguments: []
        output_arguments:
          - name: clocks
            type_python: "list[ndi_time_clocktype]"
        decision_log: >
          Exact match. Returns empty list by default (no limits).

      - name: ineligible_clocks
        input_arguments: []
        output_arguments:
          - name: clocks
            type_python: "list[ndi_time_clocktype]"
        decision_log: >
          Exact match. Base returns [ndi_time_clocktype.NO_TIME].

      - name: eligible_epochsets
        input_arguments: []
        output_arguments:
          - name: classes
            type_python: "list[str]"
        decision_log: >
          Exact match. Returns empty list by default.

      - name: ineligible_epochsets
        input_arguments: []
        output_arguments:
          - name: classes
            type_python: "list[str]"
        decision_log: >
          Exact match. Returns empty list by default.

      - name: apply
        kind: abstract
        input_arguments:
          - name: epochnode_a
            type_matlab: "struct"
            type_python: "dict[str, Any]"
          - name: epochnode_b
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: cost
            type_python: "float | None"
          - name: mapping
            type_python: "ndi_time_timemapping | None"
        decision_log: >
          Exact match. Returns 2-tuple (cost, mapping).
          Base returns (None, None).

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Mapped to Python __eq__. Compares parameters dict.

      - name: new_document
        input_arguments: []
        output_arguments:
          - name: doc
            type_python: "Any"
        decision_log: >
          Exact match. Creates a syncrule document with class
          name and parameters.

      - name: search_query
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "Any"
        decision_log: "Exact match. Returns ndi_query matching base.id."

      - name: to_dict
        input_arguments: []
        output_arguments:
          - name: data
            type_python: "dict[str, Any]"
        decision_log: "Python-specific serialization method."

    static_methods:
      - name: from_document
        kind: classmethod
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
          - name: doc
            type_matlab: "ndi.document"
            type_python: "Any"
        output_arguments:
          - name: sr_obj
            type_python: "ndi_time_syncrule"
        decision_log: >
          Factory method. Creates the appropriate subclass based
          on the document's syncrule.ndi_syncrule_class field.

  # =========================================================================
  # ndi.time.syncgraph  (graph-based time conversion)
  # =========================================================================
  - name: syncgraph
    type: class
    matlab_path: "+ndi/+time/syncgraph.m"
    matlab_last_sync_hash: "d06ef9cd5"
    decision_log: >
      NDI-matlab d06ef9cd5 and 2377c0679 repaired three MATLAB-only defects.
      Two were dead on arrival: removerule called setdiff(1:n),index -- the
      paren in the wrong place -- and the daqsystem node removal called
      setdiff with one argument, so it always errored and the method never
      ran. The third replaced == on a cell array of clocktypes with cellfun.
      Nothing to port: Python's remove_rule deletes from a list, and an
      epochnode carries a single clocktype rather than a cell array, so
      neither shape exists here.
    python_path: "ndi/time/syncgraph.py"
    python_class: "ndi_time_syncgraph"
    inherits: "ndi.ido"

    properties:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Implemented as @property in Python."

      - name: rules
        type_matlab: "ndi.time.syncrule array"
        type_python: "list[ndi_time_syncrule]"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: >
          Implemented as @property in Python. Returns a copy.

    methods:
      - name: syncgraph
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
            default: "None"
          - name: document
            type_matlab: "ndi.document"
            type_python: "Any | None"
            default: "None"
          - name: identifier
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
        output_arguments:
          - name: sg_obj
            type_python: "ndi_time_syncgraph"
        decision_log: >
          Exact match. Can load from document. Requires networkx.

      - name: add_rule
        input_arguments:
          - name: rule
            type_matlab: "ndi.time.syncrule"
            type_python: "ndi_time_syncrule"
        output_arguments:
          - name: sg_obj
            type_python: "ndi_time_syncgraph"
        decision_log: >
          Exact match. Returns self for chaining. Checks for
          duplicates. Clears cached graph info.

      - name: remove_rule
        input_arguments:
          - name: index
            type_matlab: "integer"
            type_python: "int"
        output_arguments:
          - name: sg_obj
            type_python: "ndi_time_syncgraph"
        decision_log: >
          Exact match. Returns self for chaining.
          Uses 0-based indexing (internal data structure access).

      - name: graphinfo
        input_arguments: []
        output_arguments:
          - name: ginfo
            type_python: "ndi_time_graphinfo"
        decision_log: >
          Exact match. Builds graph lazily and returns cached
          ndi_time_graphinfo with nodes, cost matrix, mappings.

      - name: time_convert
        input_arguments:
          - name: timeref_in
            type_matlab: "ndi.time.timereference"
            type_python: "ndi_time_timereference"
          - name: t_in
            type_matlab: "double"
            type_python: "float"
          - name: referent_out
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
          - name: clocktype_out
            type_matlab: "ndi.time.clocktype"
            type_python: "ndi_time_clocktype"
        output_arguments:
          - name: t_out
            type_python: "float | None"
          - name: timeref_out
            type_python: "ndi_time_timereference | None"
          - name: msg
            type_python: "str"
        decision_log: >
          Exact match. Returns 3-tuple (t_out, timeref_out, msg).
          Uses NetworkX shortest path for graph traversal.

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Mapped to Python __eq__. Compares session and rules list.

      - name: new_document
        input_arguments: []
        output_arguments:
          - name: docs
            type_python: "list[Any]"
        decision_log: >
          Exact match. Returns list of Documents (syncgraph doc +
          rule docs). Adds rule dependencies.

      - name: search_query
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "Any"
        decision_log: "Exact match. Returns ndi_query matching base.id and session_id."

  # =========================================================================
  # ndi.time.syncgraph.epochnode (dataclass)
  # =========================================================================
  - name: epochnode
    type: class
    matlab_path: null
    python_path: "ndi/time/syncgraph.py"
    python_class: "ndi_time_epochnode"

    properties:
      - name: epoch_id
        type_python: "str"
        decision_log: "ndi_epoch_epoch identifier."

      - name: epoch_session_id
        type_python: "str"
        decision_log: "ndi_session identifier."

      - name: epochprobemap
        type_python: "Any"
        decision_log: "ndi_probe map for this epoch."

      - name: epoch_clock
        type_python: "ndi_time_clocktype"
        decision_log: "Clock type for this epoch."

      - name: t0_t1
        type_python: "tuple[float, float]"
        decision_log: "Start and end times."

      - name: underlying_epochs
        type_python: "dict[str, Any] | None"
        decision_log: "Optional underlying epoch info."

      - name: objectname
        type_python: "str"
        decision_log: "Name of the object providing epochs."

      - name: objectclass
        type_python: "str"
        decision_log: "Class name of the object providing epochs."

    methods:
      - name: to_dict
        input_arguments: []
        output_arguments:
          - name: data
            type_python: "dict[str, Any]"
        decision_log: "Python-specific serialization."

      - name: from_dict
        kind: classmethod
        input_arguments:
          - name: data
            type_python: "dict[str, Any]"
        output_arguments:
          - name: node
            type_python: "ndi_time_epochnode"
        decision_log: "Python-specific factory."

    decision_log: >
      Python dataclass. Represents a node in the epoch sync graph.
      Mirrors the MATLAB struct used in epochgraph operations.

  # =========================================================================
  # ndi.time.syncgraph.graphinfo (dataclass)
  # =========================================================================
  - name: graphinfo
    type: class
    matlab_path: null
    python_path: "ndi/time/syncgraph.py"
    python_class: "ndi_time_graphinfo"

    properties:
      - name: nodes
        type_python: "list[ndi_time_epochnode]"
        decision_log: "List of epoch nodes."

      - name: G
        type_python: "np.ndarray | None"
        decision_log: "Cost matrix G[i,j] = cost from node i to j."

      - name: mapping
        type_python: "list[list[ndi_time_timemapping | None]] | None"
        decision_log: "Matrix of ndi_time_timemapping objects."

      - name: diG
        type_python: "Any"
        decision_log: "NetworkX DiGraph for path finding."

      - name: syncrule_ids
        type_python: "list[str]"
        decision_log: "List of sync rule document IDs."

      - name: syncrule_G
        type_python: "np.ndarray | None"
        decision_log: "Matrix indicating which sync rule created each edge."

    decision_log: >
      Python dataclass. Container for sync graph information.
      Mirrors the MATLAB struct used to hold graph state.

# =========================================================================
# ndi.time.fun and ndi.time.timeseries (#154)
# =========================================================================
time_fun:

  - name: syncTriggerTrains
    matlab_path: "+ndi/+time/+fun/syncTriggerTrains.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/time/syncrule/common_triggers_overlapping_epochs.py"
    python_qualified: "_sync_trigger_trains"
    input_arguments:
      - name: t1
        type_matlab: "double vector"
        type_python: "np.ndarray"
      - name: t2
        type_matlab: "double vector"
        type_python: "np.ndarray"
      - name: options.alignmentTolerance
        type_matlab: "double"
        type_python: "float"
        default: "0.005"
      - name: options.minMatchRate
        type_matlab: "double"
        type_python: "float"
        default: "0.8"
      - name: options.fingerprintSize
        type_matlab: "double"
        type_python: "int"
        default: "5"
    output_arguments:
      - name: shift
        type_python: "float"
      - name: scale
        type_python: "float"
    decision_log: >
      PORTED in NDI-python#223, which closed the gap this entry used to
      record. MATLAB keeps this as a free function in +time/+fun because two
      syncrules could use it; Python has one caller, so it lives as the
      private _sync_trigger_trains beside it, with runRobustGlobalSync as
      _run_robust_global_sync. That is placement only -- the algorithm is
      followed step for step: quantized inter-pulse-interval fingerprints
      seed candidate offsets, each offset is validated across the whole
      shorter train against a window that widens with distance from the seed
      to absorb 200ppm+ drift, at most one unmatched pulse is permitted, and
      the surviving hypotheses are ranked by match rate.
      THREE BEHAVIOURS A CALLER MUST NOT LOSE, all preserved: it returns
      (nan, nan) rather than a guess when nothing validates; it raises on a
      genuinely ambiguous alignment (SyncAmbiguityError, carrying MATLAB's
      'ndi:time:sync:ambiguous' identifier) rather than picking one; and the
      "at most one missed pulse" budget counts pulses of the SHORTER train
      with no partner in the longer one, so drops from the longer train are
      unbounded. tests/test_sync_trigger_trains.py pins all three.
      ONE DETAIL WORTH THE LINE: MATLAB's round() is half-away-from-zero and
      numpy's is half-to-even, which would bucket an interval landing exactly
      on .5 differently and silently fail to match a fingerprint. Python uses
      an explicit _matlab_round.
      ONE MATLAB DEFECT MIRRORED ON PURPOSE, reported upstream as
      VH-Lab/NDI-matlab#975: a candidate offset's rough shift is anchored at
      pulse 1 rather than at the fingerprint that produced the offset, so a
      pulse dropped within the first fingerprintSize intervals yields nan for
      an alignment that should be found. Mirrored rather than silently
      corrected, because the bridge's claim is correspondence with MATLAB, not
      improvement on it; test_a_drop_inside_the_lead_in_refuses pins it and
      says what to change when upstream fixes it.
      NOT THIS ENTRY, but adjacent and easy to confuse: _sync_triggers in the
      same file is the equal-length least-squares path, modelling
      vlt.time.syncTriggers (a different repo, so no entry here). It still
      raises on a count mismatch; commonTriggersOverlappingEpochs chooses
      between the two.

  - name: syncRandomTriggers
    matlab_path: "+ndi/+time/+fun/syncRandomTriggers.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/time/syncrule/random_pulses.py"
    python_qualified: "_sync_random_triggers"
    input_arguments:
      - name: t1
        type_matlab: "double vector"
        type_python: "np.ndarray"
      - name: t2
        type_matlab: "double vector"
        type_python: "np.ndarray"
      - name: alignmentTolerance
        type_matlab: "double"
        type_python: "float"
        default: "0.002"
      - name: fingerprintSize
        type_matlab: "double"
        type_python: "int"
        default: "4"
    output_arguments:
      - name: shift
        type_python: "float"
      - name: scale
        type_python: "float"
    decision_log: >
      Same placement story as syncTriggerTrains: a free function in MATLAB,
      a private helper beside its one caller in Python. Both return
      (shift, scale) such that t1 = shift + scale * t2 -- and note that
      convention is the OPPOSITE of syncTriggerTrains, which returns the
      line for t2 in terms of t1; MATLAB's headers document both directions
      that way and the port preserves each.
      PORTED 1:1 (NDI-python#249). Hash the longer-duration recording's
      interval fingerprints, probe the shorter one in randomized order,
      validate each hit with a secondary pulse check one beyond the
      fingerprint, and return the first candidate whose secondary check
      passes. On no match, return (nan, nan) -- the same failure contract
      MATLAB documents. That NaN is now the failure branch in the caller
      (random_pulses.apply): errorOnFailure=True turns it into a
      ValueError("Could not find random pulse match."), matching the
      behaviour the branch was written to implement.
      The pre-port helper cross-correlated the normalized IPI sequences and
      committed to a single argmax lag, so an ambiguous alignment produced
      a confident wrong answer and no-match surfaced as a "Poor fit
      quality" ValueError -- neither of those matches MATLAB. That helper
      is gone.
      SHARED HELPER: _matlab_round comes from
      common_triggers_overlapping_epochs.py (the sibling port for
      syncTriggerTrains, NDI-python#223), because interval quantization
      needs MATLAB's half-away-from-zero rounding, not numpy's half-to-
      even. If a third caller shows up, the two-line helper is worth
      lifting to a shared module.
      ONE ALGORITHMIC LIMITATION carried over deliberately, pinned by
      test_periodic_trains_pick_a_candidate_matlab_does_not_disambiguate:
      unlike syncTriggerTrains, syncRandomTriggers does NOT detect
      ambiguity. On perfectly periodic data every fingerprint matches
      every fingerprint AND the secondary pulse check also passes at
      several offsets, so the algorithm returns the first candidate it
      trips over, which may be off by a whole pulse period. A caller who
      needs the ambiguity guarantee should use syncTriggerTrains.

  - name: samples2times
    matlab_path: "+ndi/+time/+fun/samples2times.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/probe/timeseries.py"
    python_qualified: "ndi_probe_timeseries.samples2times"
    decision_log: >
      MATLAB has the arithmetic as a free function taking (s, t0_t1, sr);
      Python has it as a method that reads t0_t1 and the sample rate off
      the epoch it is given, so callers pass an epoch instead of three
      loose arguments. Same conversion either way.
      INDEXING, and it is not a mistake: MATLAB is 1-based
      (t = (s-1)/sr + t0), Python is 0-based (t = s/sr + t0). This is the
      one place ndi_xlang_principles says to diverge -- a sample index is
      an internal data-structure position, not a user-facing count -- and
      the method docstrings say so at the point of use. A caller porting a
      MATLAB line that passes a literal sample number must subtract one.
      The infinite-sample clamping (-Inf to t0, +Inf to t1) is carried over.

  - name: times2samples
    matlab_path: "+ndi/+time/+fun/times2samples.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/probe/timeseries.py"
    python_qualified: "ndi_probe_timeseries.times2samples"
    decision_log: >
      The inverse of samples2times, and the same two notes apply: a method
      over an epoch rather than a free function over (t, t0_t1, sr), and
      0-based where MATLAB is 1-based. Rounding is to nearest in both.

not_yet_ported:

  - name: timeseries
    matlab_path: "+ndi/+time/timeseries.m"
    matlab_last_sync_hash: "0e2caa09"
    status: ported_differently
    decision_log: >
      MATLAB's ndi.time.timeseries is an abstract mixin: it declares
      readtimeseries / samplerate / times2samples / samples2times and the
      epoch-clock contract, and the concrete timeseries classes
      (ndi.probe.timeseries, ndi.element.timeseries, and the image pair)
      inherit it alongside their main base.
      Python has no such mixin because it does not need one: the same
      methods are declared on ndi_probe_timeseries and
      ndi_element_timeseries directly. MATLAB uses multiple inheritance to
      attach the contract to classes whose primary base is elsewhere;
      Python's classes reach it through their own hierarchy, so a second
      base would add a name without adding behaviour.
      The cost is recorded honestly: there is no single Python type that
      means "is a timeseries", so generic code cannot isinstance-check for
      one the way MATLAB code can ask isa(obj,'ndi.time.timeseries'). If
      something needs that test, this is the entry to revisit -- a Protocol
      would be the Python-shaped answer.
