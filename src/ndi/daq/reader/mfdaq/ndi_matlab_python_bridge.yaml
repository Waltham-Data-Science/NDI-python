        kind: constructor
        input_arguments:
          - name: identifier
            type_python: "str | None"
            default: "None"
          - name: session
            type_python: "Any | None"
            default: "None"
          - name: document
            type_python: "Any | None"
            default: "None"
        output_arguments:
          - name: reader_obj
            type_python: "ndi_daq_reader_mfdaq_cedspike2"
        decision_log: "Exact match."

      - name: getchannelsepoch
