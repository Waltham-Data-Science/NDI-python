  - name: jsons2documents
    matlab_path: "N/A"
    python_path: "ndi/cloud/download.py"
    input_arguments:
      - name: doc_jsons
        type_matlab: "cell"
        type_python: "list[dict[str, Any]]"
    output_arguments:
      - name: documents
        type_python: "list[Any]"
    decision_log: >
      MATLAB file removed (old pipeline). Python function retained because
      it is used by the modern orchestration layer (downloadDataset,
      syncDataset). matlab_path is N/A rather than the removed
      +download/jsons2documents.m, which the bridge-completeness check
      (#131) caught pointing at nothing. The conversion MATLAB still does
