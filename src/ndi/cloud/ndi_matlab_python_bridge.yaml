# ndi_matlab_python_bridge.yaml — src/ndi/cloud/
# The Primary Contract for the ndi.cloud root namespace.
#
# Covers: auth.py, config.py, client.py, exceptions.py, orchestration.py,
#         download.py, upload.py, filehandler.py, internal.py, profile.py

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "N/A (no user-facing counting)"

# =============================================================================
# Infrastructure (Python-only — no MATLAB equivalent)
# =============================================================================
infrastructure:
  - name: CloudConfig
    type: class
    python_path: "ndi/cloud/config.py"
    decision_log: >
      Python-only configuration container. MATLAB uses environment variables
      and ndi_globals directly; Python wraps them in a dataclass.

  - name: CloudClient
    type: class
    python_path: "ndi/cloud/client.py"
    decision_log: >
      Python-only HTTP client. MATLAB uses webread/webwrite/call.m;
      Python wraps requests.ndi_session for all REST calls.

      Issue #137: the client retries transient gateway failures (502, 503,
      504, plus dropped connections and read timeouts) on idempotent
      methods only, three attempts total, with exponential backoff and full
      jitter. This has no MATLAB counterpart -- the +ndi/+cloud layer
      retries nothing, and its waitFor* helpers poll a job rather than
      repeat a request -- so it is a deliberate Python-side divergence
      rather than a port. POST is excluded on purpose: most POST routes
      create resources, so a repeat could duplicate them. Widening
      RETRY_METHODS is a correctness decision, not a tuning one.

  - name: APIResponse
    type: class
    python_path: "ndi/cloud/client.py"
    decision_log: >
      Python-only response wrapper. MATLAB returns raw structs/cells
      from webread; Python normalizes into APIResponse.

  - name: _auto_client
    type: decorator
    python_path: "ndi/cloud/client.py"
    decision_log: >
      Python-only decorator making the 'client' parameter optional.
      MATLAB functions implicitly use the environment for auth.

  - name: CloudError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only base exception class for cloud operations."

  - name: CloudAuthError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only. MATLAB raises generic errors."

  - name: CloudAPIError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only. MATLAB raises generic errors with status codes in message."

  - name: CloudNotFoundError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only 404 exception."

  - name: CloudSyncError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only sync exception."

  - name: CloudUploadError
    type: exception
    python_path: "ndi/cloud/exceptions.py"
    decision_log: "Python-only upload exception."

# =============================================================================
# Functions — Auth (auth.py)
# Maps to: +cloud/+api/+auth/ and +cloud/+internal/
# =============================================================================
functions:

  # --- auth.py functions ---
  - name: authenticate
    matlab_path: "+ndi/+cloud/authenticate.m"
    matlab_last_sync_hash: "2566fe4d"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: config
        type_matlab: "N/A (uses env)"
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: token
        type_python: "str"
      - name: organizationID
        type_python: "str"
    decision_log: >
      Synchronized with MATLAB main as of 2026-05-11 (matlab HEAD
      2566fe4d). Now requires both token AND organization_id to be
      populated before treating a cached login as valid (mirrors
      commit 5c4352eeac). The local JWT exp pre-check is delegated to
      isTokenExpired (extracted in commit 9562eb28e7). Organization-id
      extraction (auth._extract_first_organization_id) accepts dict,
      list-of-dicts, or single dict, and warns when multiple
      organizations are present.

  - name: testLogin
    matlab_path: "+ndi/+cloud/testLogin.m"
    matlab_last_sync_hash: "2566fe4d"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: user_name
        type_matlab: "string"
        type_python: "str | None"
        default: "None"
      - name: use_ui_login
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
    output_arguments:
      - name: is_good
        type_python: "bool"
    decision_log: >
      Ported from MATLAB main as of 2026-05-11 (matlab HEAD 2566fe4d).
      Three-attempt cascade: (1) probe NDI_CLOUD_TOKEN via direct GET
      /users/me bypassing wrappers (to avoid silent re-auth swapping
      the token mid-call); (2) if NDI_CLOUD_USERNAME / NDI_CLOUD_PASSWORD
      are set, do a silent login and re-probe; (3) if env credentials
      are absent, return False (Python has no GUI login -- use_ui_login
      is accepted for parity but never escalates to UI). Local JWT
      validity check is performed before any HTTP call. Verbose mode
      prints step-by-step diagnostics. UI step (MATLAB ndi.cloud.uilogin)
      is intentionally omitted from the Python port; that is part of the
      profileEditor GUI workstream.

  - name: login
    matlab_path: "+ndi/+cloud/+api/+auth/login.m"
    matlab_last_sync_hash: "9b75c0fe"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: email
        type_matlab: "char"
        type_python: "str | None"
      - name: password
        type_matlab: "char"
        type_python: "str | None"
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: config
        type_python: "CloudConfig"
    decision_log: "Exact match."

  - name: logout
    matlab_path: "+ndi/+cloud/logout.m"
    matlab_last_sync_hash: "23a1f8d8"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments: []
    decision_log: "Exact match."

  - name: logout
    matlab_path: "+ndi/+cloud/+api/+auth/logout.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/cloud/auth.py"
    python_qualified: "logout"
    input_arguments: []
    output_arguments:
      - name: b
        type_matlab: "logical"
        type_python: "None (raises on failure)"
    decision_log: >
      MATLAB has TWO logout functions and Python has one. This is the raw
      API wrapper, returning the usual [b, answer, apiResponse, apiURL];
      ndi.cloud.logout (recorded above) is the user-facing one that calls
      it and then clears NDI_CLOUD_TOKEN and NDI_CLOUD_ORGANIZATION_ID.
      Python's auth.logout does both in one function -- invalidate
      server-side, then clear the environment -- so the pair collapses,
      the same way the other +api/+auth wrappers (login, changePassword,
      resetPassword, verifyUser, resendConfirmation) live in auth.py
      rather than an api/auth module.
      Recorded in #154, when scoping the bare-name match caught it: the
      entry for +ndi/+cloud/logout.m was vouching for this file too,
      because the checker accepted a matching NAME from anywhere. Two
      different MATLAB files called logout.m, one entry between them.

  - name: changePassword
    matlab_path: "+ndi/+cloud/+api/+auth/changePassword.m"
    matlab_last_sync_hash: "9b75c0fe"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: old_password
        type_matlab: "char"
        type_python: "str"
      - name: new_password
        type_matlab: "char"
        type_python: "str"
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
    decision_log: "Exact match."

  - name: resetPassword
    matlab_path: "+ndi/+cloud/+api/+auth/resetPassword.m"
    matlab_last_sync_hash: "9b75c0fe"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: email
        type_matlab: "char"
        type_python: "str"
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
    decision_log: "Exact match."

  - name: verifyUser
    matlab_path: "+ndi/+cloud/+api/+auth/verifyUser.m"
    matlab_last_sync_hash: "9b75c0fe"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: email
        type_matlab: "char"
        type_python: "str"
      - name: confirmation_code
        type_matlab: "char"
        type_python: "str"
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
    decision_log: "Exact match."

  - name: resendConfirmation
    matlab_path: "+ndi/+cloud/+api/+auth/resendConfirmation.m"
    matlab_last_sync_hash: "43de1651"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: email
        type_matlab: "char"
        type_python: "str"
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
    decision_log: "Exact match."

  - name: decodeJwt
    matlab_path: "+ndi/+cloud/+internal/decodeJwt.m"
    matlab_last_sync_hash: "7ab96514"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: token
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: payload
        type_python: "dict"
    decision_log: >
      MATLAB places this in +internal; Python places it in auth.py
      since it is tightly coupled with authentication logic. Name exact match.

  - name: getTokenExpiration
    matlab_path: "+ndi/+cloud/+internal/getTokenExpiration.m"
    matlab_last_sync_hash: "7ab96514"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: token
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: expiration
        type_python: "datetime"
    decision_log: >
      MATLAB places this in +internal; Python places it in auth.py.
      Name exact match.

  - name: isTokenExpired
    matlab_path: "+ndi/+cloud/+internal/isTokenExpired.m"
    matlab_last_sync_hash: "2566fe4d"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: token
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: expired
        type_python: "bool"
    decision_log: >
      Ported from MATLAB main as of 2026-05-11 (matlab HEAD 2566fe4d,
      original commit 716442b940). Local-only JWT exp check; True for
      empty / malformed / expired tokens. MATLAB places this in
      +internal; Python places it in auth.py alongside the other JWT
      helpers. The pre-existing Python verifyToken is now defined in
      terms of `not isTokenExpired`.

  - name: verifyToken
    matlab_path: "N/A"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: token
        type_python: "str"
    output_arguments:
      - name: valid
        type_python: "bool"
    decision_log: "Python-only convenience. No MATLAB equivalent."

  - name: formatApiError
    matlab_path: "+ndi/+cloud/+internal/formatApiError.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/cloud/internal.py"
    input_arguments:
      - name: response
        type_matlab: "matlab.net.http.ResponseMessage"
        type_python: "Any"
    output_arguments:
      - name: msg
        type_matlab: "char"
        type_python: "str"
    decision_log: >
      Ported in #131. MATLAB accepts only a ResponseMessage; the Python
      version accepts a requests.Response, an APIResponse, an
      already-parsed body, or None, because those are the four shapes a
      Python caller has to hand at the point of failure. The message
      format is MATLAB's: "HTTP <code> <reason> - <body message>", with
      either half alone when only one is available, and
      "no response from server" / "unknown error" for the empty cases.

      CloudClient._handle_response now builds its CloudAPIError message
      through this, so str(exc) carries the server's own explanation
      instead of a bare "API error (HTTP 400)". That is what lets
      helloMatlab report MATLAB_LICENSE_REQUIRED, and what MATLAB's #624
      was about: an error formatter that assumes a struct body with a
      'message' field replaces the real failure with its own crash.

  - name: getActiveToken
    matlab_path: "+ndi/+cloud/+internal/getActiveToken.m"
    matlab_last_sync_hash: "2566fe4d"
    python_path: "ndi/cloud/auth.py"
    input_arguments:
      - name: config
        type_python: "CloudConfig | None"
        default: "None"
    output_arguments:
      - name: token
        type_python: "str"
      - name: org_id
        type_python: "str"
    decision_log: >
      Updated 2026-05-11 to require a non-empty organization id
      (matches MATLAB commit 5c4352eeac which made org id required for
      cached auth). MATLAB places this in +internal; Python places it
      in auth.py. Name exact match.

  # --- orchestration.py functions ---
  - name: downloadDataset
    matlab_path: "+ndi/+cloud/downloadDataset.m"
    matlab_last_sync_hash: "7e01b56d"
    python_path: "ndi/cloud/orchestration.py"
    input_arguments:
      - name: cloud_dataset_id
        type_matlab: "string"
        type_python: "str"
      - name: target_folder
        type_matlab: "string"
        type_python: "str"
      - name: sync_files
        type_matlab: "logical (via SyncOptions)"
        type_python: "bool"
        default: "False"
      - name: verbose
        type_matlab: "logical (via SyncOptions)"
        type_python: "bool"
        default: "False"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: ndi_dataset
        type_python: "Any"
    decision_log: >
      MATLAB takes (cloudDatasetId, targetFolder, syncOptions).
      Python unpacks SyncOptions into keyword args for convenience.
      Name exact match.

  - name: uploadDataset
    matlab_path: "+ndi/+cloud/uploadDataset.m"
    matlab_last_sync_hash: "629d9bad"
    python_path: "ndi/cloud/orchestration.py"
    input_arguments:
      - name: dataset
        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: upload_as_new
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: remote_name
        type_matlab: "char"
        type_python: "str"
        default: "''"
      - name: sync_files
        type_matlab: "logical (via SyncOptions)"
        type_python: "bool"
        default: "True"
      - name: verbose
        type_matlab: "logical (via SyncOptions)"
        type_python: "bool"
        default: "False"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
      - name: cloud_dataset_id
        type_python: "str"
      - name: message
        type_python: "str"
    decision_log: >
      MATLAB takes (ndiDataset, syncOptions, options.*).
      Python unpacks into keyword args. Name exact match.
      Issue #136: Python now performs MATLAB's first check --
      "Dataset is not fully ingested" (uploadDataset.m:53) -- which it
      previously could not, because ndi_dataset had no isIngested().
      The dataset is asked by duck typing rather than isinstance, so a
      caller passing a stand-in for the dataset is not blocked by a method
      it never claimed to have.

  - name: syncDataset
    matlab_path: "+ndi/+cloud/syncDataset.m"
    matlab_last_sync_hash: "fe64a9f5"
    python_path: "ndi/cloud/orchestration.py"
    input_arguments:
      - name: dataset
        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: sync_mode
        type_matlab: "ndi.cloud.sync.enum.SyncMode"
        type_python: "str"
        default: "'download_new'"
      - name: sync_files
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: dry_run
        type_python: "bool"
        default: "False"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: result
        type_python: "dict[str, Any]"
    decision_log: "Exact match."

  - name: helloMatlab
    matlab_path: "+ndi/+cloud/helloMatlab.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/cloud/orchestration.py"
    input_arguments:
      - name: timeout_seconds
        type_matlab: "double (name-value 'TimeoutSeconds')"
        type_python: "float"
        default: "1200.0"
      - name: poll_interval_seconds
        type_matlab: "double (name-value 'PollIntervalSeconds')"
        type_python: "float"
        default: "10.0"
      - name: verbose
        type_matlab: "logical (name-value 'Verbose')"
        type_python: "bool"
        default: "True"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: success
        type_matlab: "logical"
        type_python: "bool"
      - name: sessionId
        type_matlab: "string"
        type_python: "str"
      - name: statusMessage
        type_matlab: "string"
        type_python: "str"
      - name: sessionDoc
        type_matlab: "struct"
        type_python: "dict[str, Any]"
    decision_log: >
      Ported in #131. Returns a HelloMatlabResult NamedTuple so MATLAB's
      four outputs unpack in order -- success, sessionId, statusMessage,
      sessionDoc -- while still reading as result.statusMessage in Python.
      The output NAMES keep MATLAB's spelling per Rule 3.

      Three differences from the MATLAB source, all forced by the Python
      client:
      (1) MATLAB opens with an explicit ndi.cloud.authenticate() call;
      Python's @_auto_client does exactly that when no client is passed,
      so the step is present but not written out.
      (2) MATLAB's api wrappers return [b, answer, apiResponse, ~] and
      helloMatlab branches on b; the Python wrappers RAISE CloudAPIError
      instead, so the start call is wrapped in try/except and the payload
      is read off exc.response_body. The MATLAB_LICENSE_REQUIRED /
      MATLAB_LICENSE_DECRYPT_FAILED messages are byte-for-byte the same.
      (3) A failed status poll is logged before the retry. MATLAB retries
      silently, which cannot distinguish a slow pipeline from a status
      endpoint that failed on every one of the 120 polls -- and this
      function's whole job is to report which of those happened.

      The terminal-state rule (_hello_matlab_verdict) and the response
      readers are separate pure functions so the decision that ends a
      20-minute wait can be tested without a clock or a network.

  - name: newDataset
    matlab_path: "+ndi/+cloud/+upload/newDataset.m"
    matlab_last_sync_hash: "80092b7c"
    python_path: "ndi/cloud/orchestration.py"
    input_arguments:
      - name: dataset
        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: name
        type_matlab: "char"
        type_python: "str"
        default: "''"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: cloud_dataset_id
        type_python: "str"
    decision_log: >
      MATLAB places this in +upload; Python places it in orchestration.py
      as a high-level convenience. Name exact match.

  - name: load_dataset_from_json_dir
    matlab_path: "N/A"
