not_yet_ported:

  # =======================================================================
  # +ndi/+cloud/+download/+internal -- internals of the download loop
  #
  # Three MATLAB helpers extracted from downloadDocumentCollection and
  # downloadGenericFiles so their per-record shape can be unit-tested
  # without a live dataset (NDI-matlab#962, #963, #970). Python's cloud
  # download path is in cloud/download.py and does not currently mirror
  # these boundaries -- the whole loop is one function -- so recording
  # them as not_yet_ported is the honest status. They land as a group
  # with the batch-presign work referenced by
  # +sync/+internal/reconstructSeriesIngestLocations and by the
  # signed-URL-set family in the api YAML (issue #206), because none of
  # them is useful on its own.
  # =======================================================================

  - name: assertSingleArchiveEntry
    matlab_path: "+ndi/+cloud/+download/+internal/assertSingleArchiveEntry.m"
    matlab_last_sync_hash: "c1121e6"
    status: not_yet_ported
    decision_log: >
      MATLAB guard extracted from downloadDocumentCollection: refuses a
      chunk archive that is not exactly one file, so a server that ever
      split a chunk across archives fails loudly rather than silently
      dropping documents (NDI-matlab#945 shape). Python's chunk-handling
      is in download.py and has no equivalent explicit guard yet.

  - name: batchSignedUrlLookup
    matlab_path: "+ndi/+cloud/+download/+internal/batchSignedUrlLookup.m"
    matlab_last_sync_hash: "5804cd80"
    status: not_yet_ported
    decision_log: >
      MATLAB per-document signed-URL cache used by the batch-presign path
      (NDI-matlab#952, #962, #968). Turns one-call-per-uid into one call
      per (dataset, document, series) scope, with a fallback to
      getFileDetails and a negative cache for failed scopes. Depends on
      the signed-URL-set API family recorded as not_yet_ported in the api
      YAML (issue #206) and ports with it.

  - name: buildGenericFileDownloadList
    matlab_path: "+ndi/+cloud/+download/+internal/buildGenericFileDownloadList.m"
    matlab_last_sync_hash: "65aeeeb"
    status: not_yet_ported
    decision_log: >
      MATLAB helper extracted from downloadGenericFiles: flattens
      generic_file documents into a per-file record (uid, filename,
      documentId) so the download loop can key one getSignedURLSet call
      per document via the batch presign cache (NDI-matlab#962). Ports
      with batchSignedUrlLookup above.

