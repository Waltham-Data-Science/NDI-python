        default: "1.0"
      - name: progress
        type_python: "Callable | None"
        default: "None"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: documents
        type_python: "list[dict[str, Any]]"
    decision_log: "Exact match."

  - name: downloadFilesForDocument
    matlab_path: "N/A"
    python_path: "ndi/cloud/download.py"
    input_arguments:
      - name: dataset_id
        type_python: "str"
      - name: document
        type_python: "dict[str, Any]"
