    python_path: "ndi/cloud/download.py"
    input_arguments:
      - name: ndi_dataset
        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: ndi_document_ids
        type_matlab: "string"
        type_python: "list[str]"
      - name: target_folder
        type_matlab: "string"
        type_python: "str | Path"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
      - name: zip_result
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
