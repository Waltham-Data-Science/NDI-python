        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: ndi_document_ids
        type_matlab: "string"
        type_python: "list[str]"
      - name: target_folder
        type_matlab: "string"
        type_python: "str | Path"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
      - name: zip_result
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: naming_strategy
        type_matlab: "string"
        type_python: "str"
        default: "'original'"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: success
        type_python: "bool"
      - name: error_message
        type_python: "str"
      - name: report
        type_python: "dict[str, Any]"
    decision_log: "Exact match."

  - name: safeLocalFilename
    matlab_path: "+ndi/+cloud/+download/+internal/safeLocalFilename.m"
    matlab_last_sync_hash: "ac2df649"
    python_path: "ndi/cloud/download.py"
    input_arguments:
      - name: file_uid
        type_matlab: "string"
        type_python: "str"
    output_arguments:
      - name: safeFileName
        type_matlab: "char"
        type_python: "str"
      - name: isSafe
        type_matlab: "logical"
        type_python: "bool"
    decision_log: >
      Ported in #131. The MATLAB file's own header says it is the
      counterpart of "the basename + containment guard already present in
      NDI-python download.py" -- which was not true: downloadFilesForDocument
      wrote to target_dir / file_uid with the uid verbatim from the API, and
