  - name: downloadDatasetFiles
    matlab_path: "+ndi/+cloud/+download/downloadDatasetFiles.m"
    matlab_last_sync_hash: "211a705e"
    python_path: "ndi/cloud/download.py"
    input_arguments:
      - name: dataset_id
        type_matlab: "string"
        type_python: "str"
      - name: documents
