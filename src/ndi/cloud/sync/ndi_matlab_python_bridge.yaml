  - name: validate
    matlab_path: "+ndi/+cloud/+sync/validate.m"
    matlab_last_sync_hash: "f3d00bad"
    python_path: "ndi/cloud/sync/operations.py"
    input_arguments:
      - name: dataset
        type_matlab: "ndi.dataset"
        type_python: "Any"
      - name: cloud_dataset_id
