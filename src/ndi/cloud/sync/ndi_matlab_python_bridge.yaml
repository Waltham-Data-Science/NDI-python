# ndi_matlab_python_bridge.yaml — src/ndi/cloud/sync/
# The Primary Contract for the ndi.cloud.sync namespace.
#
# Covers: mode.py, operations.py, index.py

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "N/A (no user-facing counting)"

# =============================================================================
# Classes — mode.py
# Maps to: +cloud/+sync/+enum/SyncMode.m and +cloud/+sync/SyncOptions.m
# =============================================================================
classes:

  - name: SyncMode
    type: enum
    matlab_path: "+ndi/+cloud/+sync/+enum/SyncMode.m"
    matlab_last_sync_hash: "42f930762"
    python_path: "ndi/cloud/sync/mode.py"
    python_class: "SyncMode"

    decision_log: >
      NDI-python#295: MATLAB's enumeration carries a public `Function`
      property -- a function_handle bound per member so SyncMode.execute can
      dispatch through it. Python's SyncMode is a plain str-valued Enum and
      dispatch lives in the sync entry point, which keeps the enum importable
      without pulling in every sync implementation. Recorded in
      tests/bridge_property_allowlist.yaml.
    members:
      - name: DOWNLOAD_NEW
        value: "download_new"
      - name: MIRROR_FROM_REMOTE
        value: "mirror_from_remote"
      - name: UPLOAD_NEW
        value: "upload_new"
      - name: MIRROR_TO_REMOTE
        value: "mirror_to_remote"
      - name: TWO_WAY_SYNC
        value: "two_way_sync"
    decision_log: >
      MATLAB uses PascalCase enum values (DownloadNew, UploadNew, etc).
      Python uses UPPER_SNAKE for enum members (DOWNLOAD_NEW) with
      lowercase string values matching MATLAB's string representation.
      NDI-matlab 42f930762 fixed a dispatch that could never work: it called
      syncOptions.nvpairs(), a method SyncOptions does not have, and passed the
      result unexpanded. Nothing to port: Python's SyncMode is a plain Enum of
      mode names with no Function property and no dispatch of its own; the
      caller selects the operation.

  - name: SyncOptions
    type: dataclass
    matlab_path: "+ndi/+cloud/+sync/SyncOptions.m"
    matlab_last_sync_hash: "b7dc4b16"
    python_path: "ndi/cloud/sync/mode.py"
    python_class: "SyncOptions"

    decision_log: >
      NDI-python#295: MATLAB's four public properties are CamelCase because
      the matlab.mixin.SetGet interface requires it; this port is a plain
      dataclass whose fields are passed as keyword arguments, so they carry
      PEP 8 names (SyncFiles -> sync_files, and so on). Values and defaults
      match. Recorded per property in tests/bridge_property_allowlist.yaml.
    properties:
      - name: sync_files
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
      - name: dry_run
        type_matlab: "logical"
        type_python: "bool"
        default: "False"
      - name: file_upload_strategy
        type_python: "str"
        default: "'batch'"
    decision_log: "Exact match for shared fields."

  - name: SyncIndex
    type: dataclass
    matlab_path: "+ndi/+cloud/+sync/+internal/+index/"
    matlab_last_sync_hash: "fe4c4e79c"
    python_path: "ndi/cloud/sync/index.py"
    decision_log: >
      Examined against NDI-matlab fe4c4e79c, the commit that made the write
      atomic. The atomic write itself was already ported and matches. What did
      not: .ndi/sync/index.json lives INSIDE the dataset, so it is an
      interchange format between the two languages, and the two languages used
      different key names for it. MATLAB's createSyncIndexStruct writes
      localDocumentIdsLastSync / remoteDocumentIdsLastSync /
      lastSyncTimestamp; Python wrote local_doc_ids_last_sync /
      remote_doc_ids_last_sync / last_sync_timestamp. Neither could read the
      other's index, and neither reports a bad read -- SyncIndex.read fell back
      to [] for every unrecognised key, so a MATLAB-written index came back
      EMPTY and indistinguishable from never-synced. That is the state
      writeSyncIndex's own comment warns about. With it, uploadNew uploads
      nothing, downloadNew and mirrorFromRemote re-download the whole remote,
      twoWaySync sees everything as new, and mirrorToRemote computes
      remote - local and DELETES THE WHOLE REMOTE. Python now writes MATLAB's
      keys and reads both, so an index already on disk from an older
      NDI-python still loads and is migrated on the next write.
    python_class: "SyncIndex"
    properties:
      - name: local_doc_ids_last_sync
        type_python: "list[str]"
      - name: remote_doc_ids_last_sync
        type_python: "list[str]"
      - name: last_sync_timestamp
        type_python: "str"
    methods:
      - name: index_filepath
        kind: function
        matlab_equivalent: "getIndexFilepath"
        input_arguments:
          - name: dataset_path
            type_python: "Path"
          - name: mode
            type_matlab: "string, mustBeMember([\"read\",\"write\"])"
            type_python: "str"
            default: "'read'"
          - name: verbose
            type_matlab: "options.Verbose (logical, default true)"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: index_path
            type_python: "Path"
        decision_log: >
          Newly ported. MATLAB's getIndexFilepath was a named function and
          Python had inlined the path in read and write, which is how the two
          drifted apart on whether reading creates the directory: MATLAB
          creates it only in write mode, so reading a never-synced dataset
          leaves no trace. Verbose announces the creation, as MATLAB does, and
          an unrecognised mode is refused rather than treated as read --
          MATLAB's mustBeMember does the same.

      - name: read
        kind: classmethod
        matlab_equivalent: "readSyncIndex"
        input_arguments:
          - name: dataset_path
            type_python: "Path"
        output_arguments:
          - name: index
            type_python: "SyncIndex"
        decision_log: >
          MATLAB has readSyncIndex as a standalone function; Python wraps it as
          a classmethod. Now reads MATLAB's key names, falling back to the
          legacy Python spellings so an index already on disk still loads.
          MATLAB returns struct.empty for a missing file where Python returns a
          default-constructed index; callers on both sides treat that as never
          synced, but Python cannot distinguish "no file" from "empty index".
          Left as is -- no caller needs the distinction -- and recorded.

      - name: write
        matlab_equivalent: "writeSyncIndex"
        input_arguments:
          - name: dataset_path
            type_python: "Path"
        output_arguments: []
        decision_log: >
          MATLAB has writeSyncIndex as a standalone function; Python wraps it
          as an instance method. Both write atomically through a temp file in
          the destination directory, for the same reason and with the same
          same-filesystem constraint. Now writes MATLAB's key names.

      - name: update
        matlab_equivalent: "updateSyncIndex"
        input_arguments:
          - name: local_ids
            type_python: "list[str]"
          - name: remote_ids
            type_python: "list[str]"
        output_arguments: []
        decision_log: >
          NOT the same function, and recorded rather than changed. MATLAB's
          updateSyncIndex(ndiDataset, cloudDatasetId, indexData) FETCHES the id
          lists when they are not supplied -- listLocalDocuments and
          listRemoteDocumentIds -- then builds the struct AND writes it.
          Python's update is a setter: both lists are required and it does not
          write. The behaviour is not missing, it is decomposed: every caller
          in operations.py does read -> work -> update -> write itself, and
          both list helpers exist in ndi.cloud.internal. Adding a composite
          nothing calls would be worse than the asymmetry. The timestamp now
          uses MATLAB's format from createSyncIndexStruct,
          yyyy-MM-dd'T'HH:mm:ssZZZZ -- local time, second resolution, explicit
          numeric offset -- where Python wrote UTC isoformat with microseconds.
          Local time is MATLAB's choice; the offset is written out, so the
          value stays unambiguous. Nothing on either side parses it.

# =============================================================================
# Functions — operations.py
# Maps to: +cloud/+sync/
# =============================================================================
functions:

  - name: uploadNew
    matlab_path: "+ndi/+cloud/+sync/uploadNew.m"
    matlab_last_sync_hash: "8c31a8f28"
    python_path: "ndi/cloud/sync/operations.py"
    input_arguments:
      - name: dataset_path
        type_matlab: "char"
        type_python: "str"
      - name: cloud_dataset_id
        type_matlab: "char"
        type_python: "str"
      - name: options
        type_matlab: "ndi.cloud.sync.SyncOptions"
        type_python: "SyncOptions | None"
        default: "None"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: result
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match.
      2026-09-08: examined against 8c31a8f28 (was c372693a). Two commits.
      c425cd115 adds waitForAllBulkUploads and wires it into the sync pipeline,
      replacing fixed pauses; the wrapper existed here but nothing called it, so a
      sync could list the remote while the server was still extracting an upload
      and conclude documents were missing. Now settled before the first listing in
      all five entry points (commit 73b89fd on this branch). 8c31a8f28 stops the
      sync index recording documents whose binaries failed to upload: this side
      already records only the IDs whose addDocument returned, so a failed
      metadata upload never enters the index, and the binary half is now enforced
      in mirrorToRemote (commit 8b6351c). uploadNew itself uploads no binaries at
      all and posts an ndiId rather than the document body -- a structural gap
      these commits expose but do not cause, tracked as #232.
      2026-09-08: signature changed to take an ndi.dataset, matching MATLAB's
      uploadNew(ndiDataset, syncOptions), and the cloud id is now optional -- an empty one
      is resolved from the dataset's dataset_remote document as MATLAB does. This
      side previously took (dataset_path, cloud_dataset_id) and worked from the
      sync index's id lists alone, which made the port's central claim false:
      with only ids there is no document content to send, so every upload posted
      {"ndiId": id} -- a document with no base, no document_class and no
      properties. The call succeeded, the remote listed the id, and no later run
      resent it because a live listing showed it present. NDI-python#232.
      Also returns MATLAB's (success, errorMessage, report) triple rather than the
      report alone, so a caller can ask "did it work" without reconstructing the
      answer from report fields whose names differ per mode. success is false when
      anything did not transfer, in either direction: NDI-matlab 29546720b made a
      partial upload a failure rather than a clean mirror ("a scripted pipeline
      checking only success believed the dataset was mirrored when zero documents
      transferred"), and the same argument covers a partial download, which MATLAB
      still reports as success. Stricter than MATLAB for the two download modes,
      and never wrong. One divergence kept deliberately: MATLAB aborts on a failed
      upload and leaves the sync index un-advanced, while this records what
      actually landed and advances over exactly that, so a retry re-sends only
      what is still missing. A caller mistake -- a path where a dataset belongs --
      still raises rather than becoming success=false.
      Correction to the note above: the sync-index divergence it described is
      gone. An upload failure -- documents or binaries -- now aborts before the
      index is written, matching MATLAB exactly: uploadNew returns early with
      "sync index not updated" (8c31a8f28), and mirrorToRemote and twoWaySync
      raise NDI:Cloud:Sync:UploadIncomplete so every later phase is skipped
      (29546720b). In mirrorToRemote that includes the remote deletions, which
      matters on its own -- deleting the remote's copies while the local ones have
      not all arrived is how a half-finished mirror loses documents. A failed
      remote deletion still does NOT abort, because MATLAB's deleteRemoteDocuments
      warns and returns rather than throwing; nor does a short download. Selection
      runs against a live remote listing rather than the index, so skipping the
      index write costs no retries.

  - name: downloadNew
    matlab_path: "+ndi/+cloud/+sync/downloadNew.m"
    matlab_last_sync_hash: "7efa0a8a0"
    python_path: "ndi/cloud/sync/operations.py"
    input_arguments:
      - name: dataset_path
        type_matlab: "char"
        type_python: "str"
      - name: cloud_dataset_id
        type_matlab: "char"
        type_python: "str"
      - name: options
        type_matlab: "ndi.cloud.sync.SyncOptions"
        type_python: "SyncOptions | None"
        default: "None"
      - name: client
        type_python: "CloudClient | None"
        default: "None"
    output_arguments:
      - name: result
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match.
      2026-09-08: examined against 7efa0a8a0 (was c372693a). Two commits.
      c425cd115 is the bulk-upload settling, ported (see uploadNew). 7efa0a8a0
      stops the sync index burying a short download -- ask for 50 documents, get
      47, and downloadNew wrote the full remote list into the index anyway, so the
      three that never arrived were recorded as synced and never requested again.
      The index half of that was already ported (a document not landed on disk
      enters neither list); what was added now is the warning, so a short download
      is visible without reading report['failed'] (commit 21a4e4b on this branch).
      2026-09-08: signature changed to take an ndi.dataset, matching MATLAB's
      downloadNew(ndiDataset, syncOptions), and the cloud id is now optional -- an empty one
      is resolved from the dataset's dataset_remote document as MATLAB does. This
      side previously took (dataset_path, cloud_dataset_id) and worked from the
      sync index's id lists alone, which made the port's central claim false:
      with only ids there is no document content to send, so every upload posted
      {"ndiId": id} -- a document with no base, no document_class and no
      properties. The call succeeded, the remote listed the id, and no later run
      resent it because a live listing showed it present. NDI-python#232.
      Also returns MATLAB's (success, errorMessage, report) triple rather than the
      report alone, so a caller can ask "did it work" without reconstructing the
      answer from report fields whose names differ per mode. success is false when
      anything did not transfer, in either direction: NDI-matlab 29546720b made a
      partial upload a failure rather than a clean mirror ("a scripted pipeline
      checking only success believed the dataset was mirrored when zero documents
      transferred"), and the same argument covers a partial download, which MATLAB
      still reports as success. Stricter than MATLAB for the two download modes,
