      actually landed and advances over exactly that, so a retry re-sends only
      what is still missing. A caller mistake -- a path where a dataset belongs --
      still raises rather than becoming success=false.
      Correction to the note above: these two have no upload phase, so the abort
      rule added for the upload modes does not reach them. A short download warns
      and still writes the index over what actually landed, exactly as MATLAB
      does -- only the success flag is stricter here.

