      MATLAB path resolver. Python handles this inside
      SyncIndex.read() and SyncIndex.write() methods.

  - name: uploadedDocumentIds
    matlab_path: "+ndi/+cloud/+sync/+internal/uploadedDocumentIds.m"
    matlab_last_sync_hash: "29546720"
    status: matlab_only
    decision_log: >
      MATLAB needs this because uploadDocumentCollection reports a
      manifest of INTENDED ids alongside a parallel per-entry status
      list, so mirrorToRemote and twoWaySync had to filter one by the
      other -- and before it existed they reported every intended id as
      uploaded even when the upload failed. The Python
      uploadDocumentCollection has no such gap to close: it appends a
      document id to report['manifest'] only after addDocument returns,
      so the manifest already IS the uploaded set (report['status'] is a
      single scalar, not a per-entry list). mirrorToRemote and
      twoWaySync likewise append to uploaded_document_ids per successful
      document. Porting the filter would mean first introducing the
      shape it exists to correct.
