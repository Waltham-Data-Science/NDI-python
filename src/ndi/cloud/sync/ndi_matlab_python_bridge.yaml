# Not-yet-ported MATLAB functions
# =============================================================================
not_yet_ported:

  - name: Constants
    matlab_path: "+ndi/+cloud/+sync/+internal/Constants.m"
    matlab_last_sync_hash: "fe64a9f5"
    status: ported_differently
    python_path: "ndi/cloud/internal.py"
    decision_log: >
      MATLAB sync constants class; the earlier entry said "values may be
      inlined in Python" and none had been. Its one property,
      FileSyncLocation, is now the module constant FILE_SYNC_LOCATION in
      internal.py -- a classdef of a single constant has no reason to
      become a Python class. downloadDataset stages downloaded binaries
      there before the database ingests them, which is what the MATLAB
      constant is for. No hash move: the MATLAB side is unchanged.

  - name: deleteRemoteDocuments
    matlab_path: "+ndi/+cloud/+sync/+internal/deleteRemoteDocuments.m"
    matlab_last_sync_hash: "1498b2ea"
    status: ported_differently
    decision_log: >
      MATLAB internal for removing remote documents during mirror operations.
      Python sync operations handle this inline via API calls.

  - name: createSyncIndexStruct
    matlab_path: "+ndi/+cloud/+sync/+internal/+index/createSyncIndexStruct.m"
    matlab_last_sync_hash: "fe64a9f5"
    status: ported_differently
    decision_log: >
      MATLAB struct constructor. Python uses SyncIndex dataclass
      with default field values instead.

  - name: getIndexFilepath
    matlab_path: "+ndi/+cloud/+sync/+internal/+index/getIndexFilepath.m"
    matlab_last_sync_hash: "fe64a9f5"
    status: ported_differently
    decision_log: >
      MATLAB path resolver. Python handles this inside
      SyncIndex.read() and SyncIndex.write() methods.

  - name: uploadedDocumentIds
    matlab_path: "+ndi/+cloud/+sync/+internal/uploadedDocumentIds.m"
    matlab_last_sync_hash: "29546720"
    status: matlab_only
    decision_log: >
      MATLAB needs this because uploadDocumentCollection reports a
      manifest of INTENDED ids alongside a parallel per-entry status
      list, so mirrorToRemote and twoWaySync had to filter one by the
      other -- and before it existed they reported every intended id as
      uploaded even when the upload failed. The Python
      uploadDocumentCollection has no such gap to close: it appends a
      document id to report['manifest'] only after addDocument returns,
      so the manifest already IS the uploaded set (report['status'] is a
      single scalar, not a per-entry list). mirrorToRemote and
      twoWaySync likewise append to uploaded_document_ids per successful
      document. Porting the filter would mean first introducing the
      shape it exists to correct.
