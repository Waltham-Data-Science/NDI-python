      - name: calculate_all_oridir_indexes
        input_arguments:
          - name: ndi_element_obj
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: docexistsaction
            type_matlab: "char"
            type_python: "str"
            default: "'Replace'"
        output_arguments:
          - name: oriprops
            type_python: "list[ndi_document]"
        decision_log: >
          Implemented. Finds the element's angle-varying responses, then the
          tuning curves computed from each, and adds an
          orientation_direction_tuning appdoc per curve.

          The indices themselves come from vlt.neuro.vision.oridir.index
          (oridir_vectorindexes, oridir_fitindexes) and the two ANOVA
          p-values from vhlib.response_stats.neural_response_significance --
          none of that arithmetic is reimplemented here, mirroring
          NDI-matlab, which calls both toolboxes directly. Reaching those
          needed VH-Lab/vhlab-toolbox-python#24 (import bug) and
          VH-Lab/vhlab-library-python#8 and #10 (the port, and packaging so
          it can be depended on); all three landed.

          DIVERGENCE WORTH KNOWING: MATLAB builds two response structs
          (oridirtuning.m:155-165) that differ in `ind` -- the significance
          test gets the RAW individual responses against the blank, the
          indices get the control-SUBTRACTED ones. Python does the same. The
          shared helper tuningcurvedoc2vhlabrespstruct is deliberately NOT
          used, because MATLAB's version of it returns the raw individuals
          while the Python port returns the subtracted ones, so it matches
          neither caller cleanly.

