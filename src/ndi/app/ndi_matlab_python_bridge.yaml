# ndi_matlab_python_bridge.yaml — src/ndi/app/
# The Primary Contract for the ndi.app namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.app  (base class)
  # =========================================================================
  - name: app
    type: class
    matlab_path: "src/ndi/+ndi/app.m"
    python_path: "ndi/app/__init__.py"
    python_class: "ndi_app"
    inherits: "ndi.documentservice"

    properties:
      - name: session
        type_matlab: "ndi.session"
        type_python: "ndi_session | None"
        access: "protected set, public get"
        decision_log: "Exact match."

      - name: name
        type_matlab: "char"
        type_python: "str"
        access: "protected set, public get"
        decision_log: "Exact match."

    methods:
      - name: app
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
          - name: name
            type_matlab: "char (optional, via varargin)"
            type_python: "str"
            default: "'generic'"
        output_arguments:
          - name: app_obj
            type_python: "ndi_app"
        decision_log: >
          MATLAB uses varargin for optional session and name.
          Python uses explicit keyword arguments with defaults.

      - name: varappname
        input_arguments: []
        output_arguments:
          - name: an
            type_python: "str"
        decision_log: >
          Exact match. MATLAB uses regexprep for sanitization;
          Python uses re.sub. Both produce valid variable names.

      - name: version_url
        input_arguments: []
        output_arguments:
          - name: version
            type_python: "str"
          - name: url
            type_python: "str"
        decision_log: >
          Exact match. Returns 2-tuple (version, url).
          Both read from git; both fall back to defaults.

      - name: newdocument
        input_arguments: []
        output_arguments:
          - name: doc
            type_python: "ndi_document"
        decision_log: >
          Exact match. Creates 'app' document with name, version,
          url, os, os_version, interpreter, interpreter_version.
          MATLAB uses 'Matlab' for interpreter; Python uses 'Python'.

      - name: searchquery
        input_arguments: []
        output_arguments:
          - name: q
            type_python: "ndi_query"
        decision_log: >
          Exact match. Returns query for isa('app') & app.name matches.

  # =========================================================================
  # ndi.app.appdoc  (mixin)
  # =========================================================================
  - name: appdoc
    type: class
    matlab_path: "src/ndi/+ndi/+app/appdoc.m"
    python_path: "ndi/app/appdoc.py"
    python_class: "ndi_app_appdoc"

    properties:
      - name: doc_types
        type_matlab: "cell array of char"
        type_python: "list[str]"
        decision_log: "Exact match."

      - name: doc_document_types
        type_matlab: "cell array of char"
        type_python: "list[str]"
        decision_log: "Exact match."

      - name: doc_session
        type_matlab: "ndi.session"
        type_python: "Any"
        decision_log: "Exact match."

    methods:
      - name: appdoc
        kind: constructor
        input_arguments:
          - name: doc_types
            type_matlab: "cell array"
            type_python: "list[str] | None"
          - name: doc_document_types
            type_matlab: "cell array"
            type_python: "list[str] | None"
          - name: doc_session
            type_matlab: "ndi.session"
            type_python: "Any"
            default: "None"
        output_arguments:
          - name: appdoc_obj
            type_python: "ndi_app_appdoc"
        decision_log: "Exact match."

      - name: add_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct
            type_matlab: "struct | char | ndi.document | empty"
            type_python: "Any"
            default: "None"
          - name: docexistsaction
            type_matlab: "char"
            type_python: "DocExistsAction"
            default: "DocExistsAction.ERROR"
        output_arguments:
          - name: doc
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
        decision_log: >
          Exact match. MATLAB accepts struct/char/document/empty for
          appdoc_struct; Python accepts dict or None. MATLAB returns
          cell array; Python returns list. DocExistsAction enum mirrors
          MATLAB string options.

      - name: struct2doc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: doc
            type_python: "ndi_document | None"
        decision_log: >
          Exact match. Base class returns empty/None.
          Subclasses must override.

      - name: doc2struct
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
        output_arguments:
          - name: appdoc_struct
            type_python: "dict"
        decision_log: >
          Exact match. Reads property_list_name from document.

      - name: defaultstruct_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: appdoc_struct
            type_python: "dict"
        decision_log: "Exact match."

      - name: loaddata_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: data
            type_python: "Any"
        decision_log: >
          Exact match. Base class returns empty/None.

      - name: clear_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "bool"
        decision_log: >
          Exact match. Returns True/1 if document was found and removed.

      - name: find_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
        decision_log: >
          Exact match. Base class returns empty/[].

      - name: isvalid_appdoc_struct
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "bool"
          - name: errormsg
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns [b, errormsg] 2-tuple.
          Python was returning only bool. Updated Python to return
          tuple[bool, str] to match MATLAB.

      - name: isequal_appdoc_struct
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct1
            type_matlab: "struct"
            type_python: "dict"
          - name: appdoc_struct2
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: "Exact match."

  # =========================================================================
  # ndi.app.markgarbage
  # =========================================================================
  - name: markgarbage
    type: class
    matlab_path: "src/ndi/+ndi/+app/markgarbage.m"
    matlab_last_sync_hash: "0e2caa0"
    python_path: "ndi/app/markgarbage.py"
    python_class: "ndi_app_markgarbage"
    inherits: "ndi.app"
    decision_log: >
      identifyvalidintervals ported and markvalidinterval's stored fields
      corrected, 2026-09-02, as dependencies of
      ndi.app.stimulus.tuning_response.compute_stimulus_response_scalar.

    methods:
      - name: markgarbage
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_markgarbage"
        decision_log: "Exact match. Name is 'ndi_app_markgarbage'."

      - name: markvalidinterval
        input_arguments:
          - name: ndi_epochset_obj
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
          - name: t0
            type_matlab: "double"
            type_python: "float"
          - name: timeref_t0
            type_matlab: "ndi.time.timereference"
            type_python: "Any"
          - name: t1
            type_matlab: "double"
            type_python: "float"
          - name: timeref_t1
            type_matlab: "ndi.time.timereference"
            type_python: "Any"
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "bool"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns b (logical). Python was
          returning None. Updated Python to return bool.

          SECOND FIX, 2026-09-02: the two time references are now stored as
          the structs the valid_interval document schema defines --
          timeref_structt0 and timeref_structt1, each naming the referent,
          its class, the clock, the epoch and the time, as MATLAB's
          ndi_timereference_struct() does. Python previously wrote
          timeref_t0/timeref_t1 holding str(timeref): fields the schema does
          not define, holding text that no time can be projected through. A
          marking written that way was unreadable by identifyvalidintervals
          AND by NDI-matlab, so no interval it named was ever honoured.

      - name: savevalidinterval
        input_arguments:
          - name: ndi_epochset_obj
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
          - name: validintervalstruct
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "bool"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns b (logical). Python was
          returning None. Updated Python to return bool.

          SECOND FIX, 2026-09-02: the two time references are now stored as
          the structs the valid_interval document schema defines --
          timeref_structt0 and timeref_structt1, each naming the referent,
          its class, the clock, the epoch and the time, as MATLAB's
          ndi_timereference_struct() does. Python previously wrote
          timeref_t0/timeref_t1 holding str(timeref): fields the schema does
          not define, holding text that no time can be projected through. A
          marking written that way was unreadable by identifyvalidintervals
          AND by NDI-matlab, so no interval it named was ever honoured.

      - name: clearvalidinterval
        input_arguments:
          - name: ndi_epochset_obj
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
        output_arguments: []
        decision_log: "Exact match."

      - name: loadvalidinterval
        input_arguments:
          - name: ndi_epochset_obj
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
        output_arguments:
          - name: vi
            type_matlab: "struct array"
            type_python: "list[dict[str, Any]]"
          - name: mydoc
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns [vi, mydoc] 2-tuple.
          Python was returning only intervals list. Updated Python
          to return tuple of (intervals, docs).

      - name: identifyvalidintervals
        input_arguments:
          - name: ndi_epochset_obj
            type_matlab: "ndi.epoch.epochset"
            type_python: "Any"
          - name: timeref
            type_matlab: "ndi.time.timereference"
            type_python: "Any"
          - name: t0
            type_matlab: "double"
            type_python: "float"
          - name: t1
            type_matlab: "double"
            type_python: "float"
        output_arguments:
          - name: intervals
            type_matlab: "cell array"
            type_python: "list[tuple[float, float]]"
        decision_log: >
          PORTED, 2026-09-02 (was a stub raising NotImplementedError).
          Each stored region is projected into the query's referent and
          clock through the session syncgraph and the projections are
          unioned with vlt.math.interval_add, as MATLAB does. A region that
          cannot be projected, or that lands in another epoch, adds NO
          restriction -- it is not evidence that the data here is bad, only
          that the marking says nothing about here -- so the fall-through
          for "nothing projected" is the whole baseline [(t0, t1)], not an
          empty list. MATLAB's ndi.time.timereference(session, struct)
          overload is spelled ndi_time_timereference.from_struct here, via
          the private _timeref_from_struct, which returns None rather than
          raising for a struct nothing can be rebuilt from.

  # =========================================================================
  # ndi.app.spikeextractor
  # =========================================================================
  - name: spikeextractor
    type: class
    matlab_path: "src/ndi/+ndi/+app/spikeextractor.m"
    python_path: "ndi/app/spikeextractor.py"
    python_class: "ndi_app_spikeextractor"
    inherits: "ndi.app & ndi.app.appdoc"

    methods:
      - name: spikeextractor
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_spikeextractor"
        decision_log: "Exact match."

      - name: makefilterstruct
        input_arguments:
          - name: extraction_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document | dict"
          - name: sample_rate
            type_matlab: "double"
            type_python: "float"
        output_arguments:
          - name: filterstruct
            type_python: "dict[str, Any] | None"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Full
          scipy.signal.cheby1 high-pass design; 'none' returns None
          (MATLAB returns []).

      - name: filter
        input_arguments:
          - name: data_in
            type_matlab: "double array"
            type_python: "numpy.ndarray"
          - name: filterstruct
            type_matlab: "struct"
            type_python: "dict[str, Any] | None"
        output_arguments:
          - name: data_out
            type_python: "numpy.ndarray"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Zero-phase
          scipy.signal.filtfilt over the sample axis; None passes through.

      - name: extract
        input_arguments:
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: epoch
            type_matlab: "integer | char (optional)"
            type_python: "Any"
            default: "None"
          - name: extraction_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
          - name: redo
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
          - name: t0_t1
            type_matlab: "double array (optional)"
            type_python: "Any | None"
            default: "None"
        output_arguments:
          - name: created_docs
            type_python: "list[ndi_document]"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). MATLAB
          writes spikewaves documents as a side effect; the Python port
          also returns the created documents (empty list when no session
          is configured) as a caller convenience.

      - name: struct2doc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: doc
            type_python: "ndi_document"
        decision_log: "Exact match."

      - name: isvalid_appdoc_struct
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
          - name: appdoc_struct
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: b
            type_python: "bool"
          - name: errormsg
            type_python: "str"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns [b, errormsg]. Python
          was returning only bool. Updated to return tuple.

      - name: find_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: loaddata_appdoc
        input_arguments:
          - name: appdoc_type
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: data
            type_python: "Any"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). For
          'spikewaves' returns (waveforms, waveparameters, spiketimes,
          spikewaves_doc) decoded from the attached .vsw and spiketimes.bin.

  # =========================================================================
  # ndi.app.spikesorter
  # =========================================================================
  - name: spikesorter
    type: class
    matlab_path: "src/ndi/+ndi/+app/spikesorter.m"
    python_path: "ndi/app/spikesorter.py"
    python_class: "ndi_app_spikesorter"
    inherits: "ndi.app & ndi.app.appdoc"

    methods:
      - name: spikesorter
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_spikesorter"
        decision_log: "Exact match."

      - name: check_sorting_parameters
        input_arguments:
          - name: sorting_parameters_struct
            type_matlab: "struct"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: sorting_parameters_struct
            type_python: "dict[str, Any]"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Clamps
          'interpolation' to [1, 10] as MATLAB does; missing field
          raises ValueError.

      - name: loadwaveforms
        input_arguments:
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: extraction_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
        output_arguments:
          - name: waveforms
            type_python: "numpy.ndarray"
          - name: waveformparams
            type_python: "dict[str, Any]"
          - name: spiketimes
            type_python: "numpy.ndarray"
          - name: epochinfo
            type_python: "list[dict]"
          - name: extraction_params_doc
            type_python: "ndi_document"
          - name: waveform_docs
            type_python: "list[ndi_document]"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Reads
          spikewaves documents directly from the database and decodes
          the attached spikewaves.vsw + spiketimes.bin binaries.

      - name: spike_sort
        input_arguments:
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: extraction_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
          - name: sorting_parameters_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
          - name: redo
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: spike_cluster_doc
            type_python: "list[ndi_document]"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Automatic
          path uses ndi.util.klustakwik (klustakwik2, optional dep) in
          place of MATLAB's external classic-KlustaKwik binary; results
          are in the same family but not bit-identical. graphical_mode=1
          raises NotImplementedError pointing at issue #97 until the
          spikesorter GUI lands here.

      - name: clusters2neurons
        input_arguments:
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: sorting_parameters_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
          - name: extraction_parameters_name
            type_matlab: "char"
            type_python: "str"
            default: "'default'"
          - name: redo
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: neuron_docs
            type_python: "list[ndi_document]"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). Emits an
          ndi.neuron element (via ndi_element_timeseries.addMultiple
          with element_class='ndi.neuron') plus a neuron_extracellular
          document and per-epoch spike trains for each cluster whose
          qualitylabel is Excellent/Good/Multi-unit; returns the
          neuron_extracellular docs. Depends on issue #133 (now landed
          via PR #143) for neurons to round-trip correctly.

      - name: struct2doc
        input_arguments:
          - name: appdoc_type
            type_python: "str"
          - name: appdoc_struct
            type_python: "dict"
        output_arguments:
          - name: doc
            type_python: "ndi_document"
        decision_log: "Exact match."

      - name: isvalid_appdoc_struct
        input_arguments:
          - name: appdoc_type
            type_python: "str"
          - name: appdoc_struct
            type_python: "dict"
        output_arguments:
          - name: b
            type_python: "bool"
          - name: errormsg
            type_python: "str"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns [b, errormsg]. Python
          was returning only bool. Updated to return tuple.

      - name: find_appdoc
        input_arguments:
          - name: appdoc_type
            type_python: "str"
        output_arguments:
          - name: doc
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: loaddata_appdoc
        input_arguments:
          - name: appdoc_type
            type_python: "str"
        output_arguments:
          - name: data
            type_python: "Any"
        decision_log: >
          Ported from catchup/ndi-python-2026-08 (issue #135). For
          'spike_clusters' returns (clusterids, spike_clusters_doc) with
          clusterids decoded from the spike_cluster.bin uint16 file.

  # =========================================================================
  # ndi.app.oridirtuning
  # =========================================================================
  - name: oridirtuning
    type: class
    matlab_path: "src/ndi/+ndi/+app/oridirtuning.m"
    matlab_last_sync_hash: "b7102250"
    python_path: "ndi/app/oridirtuning.py"
    python_class: "ndi_app_oridirtuning"
    inherits: "ndi.app & ndi.app.appdoc"

    methods:
      - name: oridirtuning
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_oridirtuning"
        decision_log: "Exact match."

      - name: calculate_all_tuning_curves
        input_arguments:
          - name: ndi_element_obj
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: docexistsaction
            type_matlab: "char"
            type_python: "str"
            default: "'Replace'"
        output_arguments:
          - name: tuning_doc
            type_python: "list[ndi_document]"
        decision_log: >
          Implemented. Searches the element's stimulus_response_scalar
          documents, keeps the ones whose stimulus set varies only in angle,
          and adds a stimulus_tuningcurve appdoc for each. Responses from
          other stimulus sets are skipped rather than erroring, as in MATLAB.

      - name: calculate_tuning_curve
        input_arguments:
          - name: ndi_element_obj
            type_matlab: "ndi.element"
            type_python: "Any"
