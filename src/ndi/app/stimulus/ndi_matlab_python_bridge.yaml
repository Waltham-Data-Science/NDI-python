# ndi_matlab_python_bridge.yaml — src/ndi/app/stimulus/
# The Primary Contract for the ndi.app.stimulus namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.app.stimulus.decoder
  # =========================================================================
  - name: decoder
    type: class
    matlab_path: "src/ndi/+ndi/+app/+stimulus/decoder.m"
    python_path: "ndi/app/stimulus/decoder.py"
    python_class: "ndi_app_stimulus_decoder"
    inherits: "ndi.app"

    methods:
      - name: decoder
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_stimulus_decoder"
        decision_log: "Exact match."

      - name: parse_stimuli
        input_arguments:
          - name: ndi_element_stim
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: reset
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: newdocs
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
          - name: existingdocs
            type_matlab: "cell array of ndi.document"
            type_python: "list[ndi_document]"
        decision_log: >
          DISCREPANCY FIXED: MATLAB returns [newdocs, existingdocs]
          2-tuple. Python was returning single list. Updated Python
          to return tuple of (newdocs, existingdocs).

      - name: load_presentation_time
        input_arguments:
          - name: stimulus_presentation_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
        output_arguments:
          - name: presentation_time
            type_matlab: "struct"
            type_python: "dict[str, Any] | None"
        decision_log: "Exact match."

  # =========================================================================
  # ndi.app.stimulus.tuning_response
  # =========================================================================
  - name: tuning_response
    type: class
    matlab_path: "src/ndi/+ndi/+app/+stimulus/tuning_response.m"
    matlab_last_sync_hash: "0e2caa0"
    python_path: "ndi/app/stimulus/tuning_response.py"
    python_class: "ndi_app_stimulus_tuning__response"
    inherits: "ndi.app"
    decision_log: >
      PORTED. Synchronized with MATLAB main as of 2026-09-02. Every compute
      method raised NotImplementedError before this: the class shipped with
      the initial bulk port as a framework (signatures, docstrings, document
      plumbing) and the numerics were never written, which left a hole in the
      middle of the pipeline between ndi.app.stimulus.decoder and
      ndi.calc.stimulus.tuningcurve, both of which are implemented.

      THE MATH COMES FROM vhlab-toolbox-python, not from a second copy of it
      here: fieldsearch, stimids2reps, findclosest, findrowvec, nanstderr,
      findcontrolstimulus, fouriercoeffs_tf2 and fouriercoeffs_tf_spikes are
      all imported from vlt, as MATLAB calls them.

      ONE EXCEPTION, temporary: vlt.neuro.stimulus.stimulus_response_scalar
      cannot run as of vhlab-toolbox-python 9228e90 -- it reaches its helpers
      as module.function where the package __init__ has bound the bare
      function to that name, and its output arrays are preallocated float so
      the F1/F2 path raises when a complex response is stored. Reported as
      VH-Lab/vhlab-toolbox-python#24. The module-level scalar_responses() here
      is that loop and only that loop, written to the same signature so it
      can be deleted for the toolbox function when the toolbox is fixed.

      MIRRORED UPSTREAM ODDITY: MATLAB passes control_stimulus_ids -- a
      per-presentation vector of control PRESENTATION indexes -- to vlt's
      control_stimid argument, which that function documents as the id of the
      control STIMULUS. The quantities differ, so the control actually paired
      with each presentation is not the one control_stimulus() computed. It
      is mirrored rather than corrected: a divergence would make the two
      ports store different responses for the same data. Worth an NDI-matlab
      issue.

      DEPENDENCY ported alongside: ndi.app.markgarbage.identifyvalidintervals,
      which compute_stimulus_response_scalar calls to find the usable stretch
      of the response recording, and which also raised NotImplementedError.

    methods:
      - name: tuning_response
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session (optional, via varargin)"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_app_stimulus_tuning__response"
        decision_log: "Exact match."

      - name: stimulus_responses
        input_arguments:
          - name: ndi_element_stim
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: reset
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
          - name: do_mean_only
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: rdocs
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: compute_stimulus_response_scalar
        input_arguments:
          - name: ndi_stim_obj
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: ndi_timeseries_obj
            type_matlab: "ndi.element.timeseries"
            type_python: "Any"
          - name: stim_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: control_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document | None"
        output_arguments:
          - name: response_doc
            type_python: "ndi_document | None"
        decision_log: >
          Ported. One document per frequency command: 'mean' always, plus
          'F1' and 'F2' when any stimulus in the set declares a fundamental
          frequency, as MATLAB decides it. Extra keyword arguments mirror
          MATLAB's name/value pairs (temporalfreqfunc, freq_response,
          prestimulus_time, prestimulus_normalization, isspike,
          spiketrain_dt); isspike defaults to reading the element's type,
          as MATLAB does. Returns the LIST of documents, where the MATLAB
          signature names one: the function has always produced up to three
          and MATLAB's own variable is a cell array.

      - name: tuning_curve
        input_arguments:
          - name: stim_response_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: independent_label
            type_matlab: "cell (Name-Value via varargin)"
            type_python: "str | list[str]"
            default: "'label1'"
          - name: independent_parameter
            type_matlab: "cell (Name-Value via varargin)"
            type_python: "str | list[str] (required)"
            default: "None"
          - name: constraint
            type_matlab: "vlt.data.fieldsearch struct array"
            type_python: "list[dict] | None"
            default: "None"
          - name: do_Add
            type_matlab: "logical"
            type_python: "bool (do_add)"
            default: "True"
          - name: response_units
            type_matlab: "char"
            type_python: "str"
            default: "'Spikes/s'"
        output_arguments:
          - name: tuning_doc
            type_python: "ndi_document | None"
        decision_log: >
          Ported. MATLAB's name/value pairs become keyword arguments;
          do_Add is spelled do_add, the only rename, since a mixed-case
          keyword argument reads as a mistake in Python. A complex mean is
          stored as its magnitude, as MATLAB does -- the phase of an F1
          response depends on when the stimulus started, so it is not
          comparable across stimuli. Returns None with a warning for an
          empty curve, MATLAB's behaviour.

      - name: label_control_stimuli
        input_arguments:
          - name: stimulus_element_obj
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: reset
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: cs_doc
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: control_stimulus
        input_arguments:
          - name: stim_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
        output_arguments:
          - name: cs_ids
            type_python: "list[int]"
          - name: cs_doc
            type_python: "ndi_document | None"
        decision_log: >
          Ported, both methods: 'pseudorandom' pairs each presentation with
          the control from the same repetition (the previous repetition's
          control stands in for an incomplete last one) and 'hasfield' takes
          any stimulus carrying the parameter. An irregular presentation
          order takes the control closest in ONSET, which needs the
          per-stimulus timing; a document carrying none raises ValueError
          naming that as the reason. cs_ids are 1-based presentation
          numbers, NaN where the set has no control, as MATLAB stores them.

      - name: find_tuningcurve_document
        input_arguments:
          - name: ndi_element_obj
            type_matlab: "ndi.element"
            type_python: "Any"
          - name: epochid
            type_matlab: "char"
            type_python: "str"
          - name: response_type
            type_matlab: "char"
            type_python: "str"
            default: "'mean'"
        output_arguments:
          - name: tc_doc
            type_python: "list[ndi_document]"
          - name: srs_doc
            type_python: "list[ndi_document]"
        decision_log: >
          Ported, INCLUDING MATLAB's two filters, which the stub dropped:
          only curves whose response document matches BOTH the requested
          response_type and the requested element epoch are returned, and
          the two lists are aligned. An element usually has a mean and an F1
          curve for every epoch, so returning all of them made the caller
          guess, and a wrong guess is a plausible-looking wrong answer.

      - name: make_1d_tuning
        input_arguments:
          - name: stim_response_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: param_to_vary
            type_matlab: "char"
            type_python: "str"
          - name: param_to_vary_label
            type_matlab: "char"
            type_python: "str"
          - name: param_to_fix
            type_matlab: "cell array of char"
            type_python: "list[str]"
        output_arguments:
          - name: tuning_docs
            type_python: "list[ndi_document]"
        decision_log: >
          Ported. One tuning curve per unique value of param_to_fix, with
          blank stimuli excluded. param_to_fix is a single parameter name in
          both languages (MATLAB's signature takes one; the earlier bridge
          entry called it a cell array, which the MATLAB source does not
          support).

      - name: tuningcurvedoc2vhlabrespstruct
        kind: static
        input_arguments:
          - name: tuning_doc
            type_python: "ndi_document"
        output_arguments:
          - name: resp
            type_matlab: "struct with curve, ind, spont, spontind, blankresp, blankind"
            type_python: "dict with the same keys"
        decision_log: >
          Ported. Previously listed as not_applicable ("VH-lab specific
          format, no Python equivalent needed"), which was wrong in both
          directions: the VH lab libraries are being ported too, and this is
          how a tuning curve reaches them. The struct becomes a dict and
          MATLAB's 4-row curve becomes a (4, N) NumPy array.

      - name: tuningdoc_fixcellarrays_static
        kind: static
        input_arguments:
          - name: tc_doc
            type_python: "ndi_document"
        output_arguments:
          - name: tc_doc
            type_python: "ndi_document"
        decision_log: >
          Ported, and MOSTLY A NO-OP here by construction. MATLAB needs it
          because a cell array of equal-length entries comes back from JSON
          as a matrix and one of scalars as a vector, so the field's type
          depends on its contents; Python lists survive the round trip. What
          remains is the genuinely ambiguous stored case -- one repetition
          per point written as bare numbers -- which is wrapped so a caller
          can always index [point][repetition]. MATLAB's datestamp-based
          transpose is NOT ported: it corrects an orientation that only
          MATLAB's writer produced.

      - name: modulated_or_mean
        kind: static
        input_arguments:
          - name: stimulus_response_scalar_docs
            type_python: "list[ndi_document]"
          - name: modulated_response_names
            type_python: "tuple[str, ...]"
            default: "('F1', 'modulated')"
          - name: mean_response_names
            type_python: "tuple[str, ...]"
            default: "('F0', 'mean')"
        output_arguments:
          - name: b
            type_python: "int (1 modulated, 0 mean, -1 no basis)"
          - name: ratio
            type_python: "float"
          - name: meanresponse
            type_python: "float"
          - name: modulatedresponse
            type_python: "float"
          - name: mean_index
            type_python: "int | None"
          - name: modulated_index
            type_python: "int | None"
        decision_log: >
          Ported. MATLAB's six outputs become a tuple in MATLAB's order.
          MATLAB leaves mean_index/modulated_index undefined when it returns
          early; Python returns None for them, since a tuple has no
          "undefined" element.

    not_applicable:
      - name: tuningdoc_fixcellarrays
        reason: >
          Deprecated in MATLAB, where it raises immediately and directs the
          caller to tuningdoc_fixcellarrays_static. Porting a function whose
          whole body is an error would only reproduce the error.
