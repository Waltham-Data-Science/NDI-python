# ndi_matlab_python_bridge.yaml — src/ndi/dataset/
# The Primary Contract for the ndi.dataset namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

classes:

  # =========================================================================
  # ndi.dataset  (base class)
  # =========================================================================
  - name: dataset
    type: class
    matlab_path: "+ndi/dataset.m"
    matlab_last_sync_hash: "f485088"
    python_path: "ndi/dataset/_dataset.py"
    python_class: "ndi_dataset"

    properties:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
        access: "protected"
        decision_log: "Stored as _session in Python. Access=protected in MATLAB."

      - name: session_info
        type_matlab: "struct"
        type_python: "list[dict[str, Any]]"
        access: "protected"
        decision_log: "Stored as _session_info in Python."

      - name: session_array
        type_matlab: "struct array"
        type_python: "list[dict[str, Any]]"
        access: "protected"
        decision_log: "Stored as _session_array in Python."

    methods:
      # --- Constructor ---
      - name: dataset
        kind: constructor
        input_arguments:
          - name: reference
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: "Python __init__ takes no arguments; session is set by subclass."

      # --- Public instance methods ---
      - name: id
        input_arguments: []
        output_arguments:
          - name: identifier
            type_python: "str"
        decision_log: "Delegates to self._session.id()."

      - name: reference
        kind: property
        type_matlab: "char"
        type_python: "str"
        decision_log: "Implemented as a @property in Python, matching MATLAB getter."

      - name: getpath
        input_arguments: []
        output_arguments:
          - name: p
            type_python: "Path"
        decision_log: "Delegates to self._session.getpath()."

      - name: add_linked_session
        input_arguments:
          - name: ndi_session_obj
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: "MATLAB name uses underscores. Exact match."

      - name: add_ingested_session
        input_arguments:
          - name: ndi_session_obj
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: >
          MATLAB name uses underscores. Exact match. Updated in sync
          f485088: MATLAB now delegates to the copySessionToDataset static
          method instead of ndi.database.fun.copy_session_to_dataset; the
          Python port delegates to the _copy_session_documents helper (see
          copySessionToDataset entry) and guards on session.isIngested().
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: deleteIngestedSession
        input_arguments:
          - name: session_id
            type_matlab: "char"
            type_python: "str"
          - name: are_you_sure
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: >
          MATLAB name is deleteIngestedSession (camelCase).
          Python was previously delete_ingested_session; renamed to match MATLAB.

      - name: unlink_session
        input_arguments:
          - name: ndi_session_id
            type_matlab: "char"
            type_python: "str"
          - name: are_you_sure
            type_matlab: "logical"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: "MATLAB name uses underscores. Exact match."

      - name: isIngested
        input_arguments: []
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Added in MATLAB 3cde88c8 (present in sync f485088). Returns True if
          every session in the dataset is fully ingested; a dataset with no
          sessions is considered ingested. Iterates the session_info and calls
          session.isIngested() on each opened session.
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: isInCloud
        input_arguments: []
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "bool"
          - name: cloudDatasetId
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          Ported from MATLAB 41ef50f54 (PR #859, dataset.m:260-296). MATLAB
          returns two outputs [b, cloudDatasetId]; Python returns the tuple
          (in_cloud, cloud_dataset_id), the idiomatic equivalent. True when the
          dataset's own database holds a dataset_remote document, written
          locally on first upload. Purely local — no network call, and it does
          NOT open linked sessions, so it reads session._database.search
          directly rather than dataset.database_search (which fans out to every
          linked session), matching MATLAB's
          ndi_dataset_obj.session.database.search. Never throws: a missing
          database, a failing search, or a malformed document yields
          (False, '') / an empty id, and several dataset_remote documents
          (a misconfiguration) return the first rather than raising. The id is
          coerced with str(), mirroring MATLAB's char(string(...)).

      - name: convertLinkedSessionToIngested
        input_arguments:
          - name: session_id
            type_matlab: "char"
            type_python: "str"
          - name: are_you_sure
            type_matlab: "logical (name-value)"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: >
          New in sync f485088. Converts a linked session to ingested by copying
          all of its documents and binary files into the dataset (via the
          _copy_session_documents helper), then replacing its
          session_in_a_dataset record with one marked is_linked=0. The session
          must already be fully ingested (session.isIngested()). MATLAB uses
          name-value args (areYouSure, askUserToConfirm); Python omits the GUI
          confirmation dialog (askUserToConfirm not applicable) and returns self
          for chaining.
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: open_session
        input_arguments:
          - name: session_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ndi_session_obj
            type_python: "Any | None"
        decision_log: "MATLAB name uses underscores. Exact match."

      - name: session_list
        input_arguments: []
        output_arguments:
          - name: ref_list
            type_python: "list[str]"
          - name: id_list
            type_python: "list[str]"
          - name: session_doc_ids
            type_python: "list[str]"
          - name: dataset_session_doc_id
            type_python: "str"
        decision_log: "Returns a 4-tuple matching the MATLAB [ref_list, id_list, session_doc_ids, dataset_session_doc_id]."

      - name: database_add
        input_arguments:
          - name: document
            type_matlab: "ndi.document | cell"
            type_python: "ndi_document | list[ndi_document]"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: "Exact match."

      - name: database_rm
        input_arguments:
          - name: doc_unique_id
            type_matlab: "ndi.document | char | cell"
            type_python: "ndi_document | str | list"
          - name: error_if_not_found
            type_matlab: "logical (name-value)"
            type_python: "bool"
            default: "False"
        output_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
        decision_log: "Exact match."

      - name: database_search
        input_arguments:
          - name: searchparameters
            type_matlab: "ndi.query"
            type_python: "ndi_query"
        output_arguments:
          - name: ndi_document_obj
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: database_openbinarydoc
        input_arguments:
          - name: ndi_document_or_id
            type_matlab: "ndi.document | char"
            type_python: "Any"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ndi_binarydoc_obj
            type_python: "Any"
        decision_log: "Exact match."

      - name: database_existbinarydoc
        input_arguments:
          - name: ndi_document_or_id
            type_matlab: "ndi.document | char"
            type_python: "Any"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: tf
            type_python: "bool"
          - name: file_path
            type_python: "Path | None"
        decision_log: "Delegates to self._session.database_existbinarydoc(). Exact match."

      - name: database_closebinarydoc
        input_arguments:
          - name: ndi_binarydoc_obj
            type_matlab: "ndi_binarydoc_obj"
            type_python: "Any"
        output_arguments: []
        decision_log: "Exact match."

      - name: document_session
        input_arguments:
          - name: ndi_document_obj
            type_matlab: "ndi.document"
            type_python: "ndi_document"
        output_arguments:
          - name: ndi_session_obj
            type_python: "Any | None"
        decision_log: "Exact match."

      # --- Protected methods ---
      - name: build_session_info
        kind: protected
        input_arguments: []
        output_arguments: []
        decision_log: "Exact match."

      - name: open_linked_sessions
        kind: protected
        input_arguments: []
        output_arguments: []
        decision_log: "Python uses _open_linked_sessions (leading underscore for protected convention)."

      # --- Static methods ---
      - name: repairDatasetSessionInfo
        kind: static
        input_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
          - name: doc
            type_python: "list[ndi_document]"
        output_arguments:
          - name: new_docs
            type_python: "list[ndi_document]"
        decision_log: "MATLAB camelCase preserved exactly."

      - name: addSessionInfoToDataset
        kind: static
        input_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
          - name: session_info
            type_python: "dict[str, Any]"
        output_arguments:
          - name: new_doc
            type_python: "ndi_document"
        decision_log: "MATLAB camelCase preserved exactly."

      - name: removeSessionInfoFromDataset
        kind: static
        input_arguments:
          - name: ndi_dataset_obj
            type_python: "ndi_dataset"
          - name: session_id
            type_python: "str"
        output_arguments: []
        decision_log: "MATLAB camelCase preserved exactly."

      - name: copySessionToDataset
        kind: static
        python_method: "_copy_session_documents"
        input_arguments:
          - name: ndi_session_obj
            type_matlab: "ndi.session"
            type_python: "Any"
          - name: ndi_dataset_obj
            type_matlab: "ndi.dataset"
            type_python: "(self)"
          - name: skip_duplicate_check
            type_matlab: "logical (name-value)"
            type_python: "(not implemented)"
            default: "False"
        output_arguments:
          - name: b
            type_matlab: "logical"
            type_python: "(none; raises on failure)"
          - name: errmsg
            type_matlab: "char"
            type_python: "(none; raises on failure)"
        decision_log: >
          New in sync f485088. In MATLAB this is a static method
          ndi.dataset.copySessionToDataset (moved from
          ndi.database.fun.copy_session_to_dataset) returning (success, errmsg).
          Python factored the same logic into the protected instance helper
          _copy_session_documents(session), shared by add_ingested_session and
          convertLinkedSessionToIngested. It adds each doc directly via
          _database.add() (so ingested docs keep their original session_id),
          tolerates FileExistsError duplicates, and re-raises a RuntimeError
          listing any other failures instead of returning an errmsg. The
          MATLAB skip_duplicate_check name-value pair has no Python equivalent.
          Now implemented (previously a stub).
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

  # =========================================================================
  # ndi.dataset.dir  (directory-backed subclass)
  # =========================================================================
  - name: dir
    type: class
    matlab_path: "+ndi/+dataset/dir.m"
    matlab_last_sync_hash: "7512bcb0"
    python_path: "ndi/dataset/_dataset.py"
    python_class: "ndi_dataset_dir"
    inherits: "ndi.dataset"

    properties:
      - name: path
        type_matlab: "char"
        type_python: "Path"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Stored as _path in Python."

    methods:
      - name: dir
        kind: constructor
        input_arguments:
          - name: reference
            type_matlab: "char"
            type_python: "str | Path"
          - name: path_name
            type_matlab: "char"
            type_python: "str | Path | None"
          - name: docs
            type_matlab: "cell (hidden)"
            type_python: "list[ndi_document] | None"
        output_arguments:
          - name: ndi_dataset_dir_obj
            type_python: "ndi_dataset_dir"
        decision_log: >
          Python constructor supports MATLAB calling conventions:
          dir(path), dir(reference, path), dir(reference, path, docs).
          Like MATLAB, the constructor ends by calling
          session.setObjectTypeMarker('dataset') so the directory is recorded
          on disk as a dataset (unconditionally, so even an empty dataset --
          which has no session_in_a_dataset documents -- is marked correctly
          and legacy datasets are migrated when re-opened).
          NOT PORTED: the MATLAB static guard mustNotBeSession(path), which
          rejects opening a plain session directory as a dataset. Python's
          constructor has extra calling conventions and a legacy
          '.ndi_dataset' layout that MATLAB main does not have, so the guard
          needs its own design pass.

    static_methods:
      - name: exists
        input_arguments:
          - name: path
            type_matlab: "text scalar"
            type_python: "str | Path"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Exact match: returns ndi.session.dir.directorytype(path)=='dataset'.
          False for a plain session, a non-NDI directory, and a legacy NDI
          directory whose type has not yet been recorded ('unknown').

      - name: dataset_erase
        input_arguments:
          - name: ndi_dataset_dir_obj
            type_matlab: "ndi.dataset.dir"
            type_python: "ndi_dataset_dir"
          - name: areyousure
            type_matlab: "char"
            type_python: "str"
            default: "'no'"
        output_arguments: []
        decision_log: >
          Removes the .ndi directory from the dataset path.
          MATLAB also calls delete(obj); Python does not destroy the object
          (no equivalent of MATLAB handle delete).
