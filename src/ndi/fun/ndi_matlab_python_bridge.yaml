    decision_log: >
      Exact match. MATLAB option names are 'name' and 'type'; Python
      uses 'element_name' and 'element_type' (Pythonized to avoid
      shadowing builtins). Finds elements containing specified epoch IDs.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit,
      AND IT COULD NOT FIND ANYTHING. It read the epoch table out of the
      stored element DOCUMENTS, from a field element.epoch_table that DOES NOT
      EXIST: it appears in no document schema in ndi_common, and nothing in
      this tree ever writes one. So the lookup came back empty for every epoch
      id ever passed in. MATLAB asks the ELEMENT OBJECT for its epochtable(),
      which is built from the epoch files, and so does this now, through
