# =========================================================================
# Functions — doc_gene.py
# MATLAB: +ndi/+fun/+doc/+gene/*.m
#
# The gene package mirrors a MATLAB PACKAGE rather than loose functions, so
# ndi.fun.doc.gene.<f> becomes ndi.fun.doc_gene.<f>, following the
# +ndi/+fun/+docTable -> ndi/fun/doc_table precedent already in this file.
#
# Two conventions run through the whole module and are not repeated on
# every entry:
#   * Gene rows and gene indices are ZERO-BASED on both sides. They are
#     written into a binary read by both languages, and shifting them on
#     one side only is the likeliest way for the two to diverge. This is
#     the indexing_policy's "0-based for internal data".
#   * MATLAB name-value option names are preserved verbatim (a caller types
#     'binSizes'), while positional argument names take Python style. The
#     option name is part of the calling convention; the positional name is
#     not.
# =========================================================================

  - name: readTileFile
    matlab_path: "+ndi/+fun/+doc/+gene/readTileFile.m"
    matlab_last_sync_hash: "6636493c"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: source
        type_matlab: "char"
        type_python: "str | IO[bytes] | bytes"
    output_arguments:
      - name: tile
        type_python: "dict[str, Any]"
    decision_log: >
      MATLAB takes a filename. Python also accepts an open file object or
      raw bytes, because the caller often already holds the handle from
      database_openbinarydoc and writing it to a temporary file only to
      read it back would be worse. A filename still works, so the MATLAB
      call translates unchanged. Verified against conformance_tile.bin,
      the same fixture NDI-matlab's TestTileFormat asserts on, so both
      implementations agree on one artifact rather than pairwise.

  - name: writeTileFile
    matlab_path: "+ndi/+fun/+doc/+gene/writeTileFile.m"
    matlab_last_sync_hash: "2714eeda"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: filename
        type_python: "str"
      - name: x
        type_python: "ArrayLike"
      - name: y
        type_python: "ArrayLike"
      - name: gene_index
        type_python: "ArrayLike"
      - name: count
        type_python: "ArrayLike"
    decision_log: >
      Exact match. gene_index is zero-based on both sides; see the module
      note above.

  - name: renderTile
    matlab_path: "+ndi/+fun/+doc/+gene/renderTile.m"
    matlab_last_sync_hash: "9f1f122e"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: tile
        type_python: "dict[str, Any]"
      - name: genes
        type_python: "ArrayLike | None"
      - name: tile_height
        type_python: "int"
      - name: tile_width
        type_python: "int"
      - name: binSize
        type_python: "int"
    output_arguments:
      - name: img
        type_python: "np.ndarray"
    decision_log: >
      Semantic Parity: genes are ZERO-BASED geneList rows, matching the
      binary they index into; conversion to 1-based happens inside, at the
      point of use. Python additionally accepts a boolean mask for genes,
      which lets a caller that already computed one skip an isin() over
      every tile; a row-index array behaves identically in both languages.

  - name: makeGeneList
    matlab_path: "+ndi/+fun/+doc/+gene/makeGeneList.m"
    matlab_last_sync_hash: "83562678"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Exact match. Name-value options (genomeAssembly, geneIdNamespace)
      keep their MATLAB spelling.

  - name: makePyramid
    matlab_path: "+ndi/+fun/+doc/+gene/makePyramid.m"
    matlab_last_sync_hash: "8fff9ff6"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Exact match. Options keep their MATLAB spelling (binSizes, grid,
      basePixelSize, subjectID). subjectID is REQUIRED on both sides: the
      pyramid document declares subject_id mustbenotempty, because a
      section is measured from an animal and NDI records that on the
      measurement rather than leaving it to be inferred.

  - name: readViewport
    matlab_path: "+ndi/+fun/+doc/+gene/readViewport.m"
    matlab_last_sync_hash: "73830fc6"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: bin_size
        type_python: "int"
      - name: rect
        type_python: "tuple[int, int, int, int] | None"
      - name: gene_rows
        type_python: "ArrayLike | None"
      - name: density
        type_python: "bool"
    decision_log: >
      rect is in the pixels OF ONE LEVEL, zero-based and relative to that
      level's upper-left, on both sides -- an internal frame, so
      zero-based per the indexing_policy. MATLAB's 'density' name-value
      becomes a Python keyword of the same name. See readViewportBase for
      the source-coordinate entry point.

  - name: exportRegion
    matlab_path: "+ndi/+fun/+doc/+gene/exportRegion.m"
    matlab_last_sync_hash: "96f10959"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: "Exact match. Returns raw counts, never density."

  - name: levelTable
    matlab_path: "+ndi/+fun/+doc/+gene/levelTable.m"
    matlab_last_sync_hash: "0bfc9f0b"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: session
        type_python: "Any"
      - name: pyr_doc
        type_python: "Any"
    output_arguments:
      - name: levels
        type_matlab: "table"
        type_python: "list[dict[str, Any]]"
      - name: frame
        type_python: "dict[str, Any]"
    decision_log: >
      DIVERGENCE in return shape, deliberate. MATLAB returns ONE table and
      hangs the shared frame (origin, extent, base pixel size, index order)
      on Properties.UserData. Python has no table type carrying metadata
      that a caller would expect to find, and reaching for a DataFrame
      would make pandas a dependency of reading a document, so the two
      halves are returned as a pair instead. Field names are the MATLAB
      ones, so the two read alike. Levels come back finest first in both,
      which is the order a multiscale viewer wants and makes levels[0]
      mean the finest rather than an arbitrary one.

  - name: chooseLevel
    matlab_path: "+ndi/+fun/+doc/+gene/chooseLevel.m"
    matlab_last_sync_hash: "fb395b41"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: levels
        type_matlab: "table"
        type_python: "list[dict[str, Any]]"
      - name: rect_source
        type_python: "tuple[float, float, float, float]"
      - name: target_pixels
        type_python: "float"
    output_arguments:
      - name: bin_size
        type_python: "int"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      Takes the level collection each language's levelTable returns, so the
      divergence above does not spread. rect_source is in SOURCE
      coordinates -- the acquisition frame, not an index -- so the
      1-based/0-based question does not arise. Missing the target returns
      the finest level with info.metTarget false rather than raising, on
      both sides: asking for more detail than the data holds is a
      legitimate request with a definite answer.

  - name: readViewportBase
    matlab_path: "+ndi/+fun/+doc/+gene/readViewportBase.m"
    matlab_last_sync_hash: "033c8331"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: bin_size
        type_python: "int"
      - name: rect_source
        type_python: "tuple[float, float, float, float] | None"
      - name: gene_rows
        type_python: "ArrayLike | None"
      - name: density
        type_python: "bool"
    output_arguments:
      - name: img
        type_python: "np.ndarray"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      rect_source is in SOURCE coordinates, the frame the data was acquired
      in and the one cell centroids and contours also use -- unlike
      readViewport, whose rect is in one level's pixels. The rounding is
      identical in both languages and is the part that matters: the low
      edge floors and the high edge ceils, so the result covers the request
      rather than clipping it, and info.rectSourceCovered reports what
      actually came back. A rectangle wholly off the pyramid returns an
      empty image rather than raising, because a viewer pans off the edge
      routinely.

  - name: storeDoc
    matlab_path: "+ndi/+fun/+doc/+gene/private/storeDoc.m"
    python_path: "ndi/fun/doc_gene.py"
    python_name: "_store_doc"
    decision_log: >
      MATLAB keeps this in the package's private/ folder, which makes it
      reachable only from the gene functions; Python marks the same
      non-public status with a leading underscore, so the name differs by
      convention rather than by choice. Every maker routes document
      creation through it, which is why it is recorded here rather than
      treated as an implementation detail: if the two ever disagree about
      how a document enters the database, they disagree everywhere at once.

  - name: readCells
    matlab_path: "+ndi/+fun/+doc/+gene/readCells.m"
    matlab_last_sync_hash: "c0572a2e"
    python_path: "ndi/fun/doc_gene.py"
    output_arguments:
      - name: columns
        type_matlab: "table"
        type_python: "dict[str, Any]"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      Columns are read BY HEADER NAME on both sides, not by position. The
      spec names cell_index, cell_id, x, y, area, dnb_count, total_counts,
      n_genes, but only the first four are required and writers differ on
      the rest: the extraction spike that produced the first opossum cells
      wrote dnbCount and n_genes_by_counts. Reading by position would have
      silently mapped one measurement onto another's name, so both
      implementations keep the writer's own column names.
      cell_id stays TEXT in both. A 14-digit identifier loses precision as
      a double and stops matching the source file it came from.
      MATLAB returns a table; Python returns a dict of arrays, the same
      divergence and the same reason as levelTable -- a DataFrame would
      make pandas a dependency of reading a document.
      Contours are NOT read: contours.bin needs its own reader, and
      info.contoursPresent says whether there is more.

  - name: _parse_cells_tsv
    matlab_path: null
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Python-only helper, split out so a DIRECTORY of extracted cells is
      parsed by exactly the same rules as a document's copy. The Cells
      document's file list is cells.tsv and contours.bin -- the same names
      extract_cells.py writes -- and reading the two by different rules is
      how they quietly diverge. MATLAB has no directory path to serve, so
      it keeps the parsing inline.

  - name: makeCells
    matlab_path: "+ndi/+fun/+doc/+gene/makeCells.m"
    matlab_last_sync_hash: "28f35474"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Writes cells.tsv, optionally contours.bin, and stores the document.
      cell_index is written explicitly and is ZERO-BASED on both sides: it
      is the key contours.bin and every cellTypeLabels document reference,
      so a reader must never have to infer it from row order.
      cellID is kept as TEXT rather than a number, because these are
      commonly 14-digit identifiers that lose precision as a double or a
      float and then no longer match the source file they came from.
      subjectID is OPTIONAL here, unlike makePyramid where it is required:
      the pyramid this depends on already carries one.
      MATLAB takes extra columns as a table, Python as a dict of columns --
      the same divergence and reason as levelTable and readCells.

  - name: writeContourFile
    matlab_path: "+ndi/+fun/+doc/+gene/writeContourFile.m"
    matlab_last_sync_hash: "2311e503"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      contour_format_version 1, little-endian, ragged form with an offset
      array. Both languages write ONLY the ragged form even when every cell
      has the same vertex count: the fixed-width form the spec also allows
      saves n_cells+1 offsets and cannot represent a later ragged edit, and
      readContourFile accepts both anyway.
      An empty polygon is written as zero vertices rather than dropped, so
      row i of cells.tsv stays row i here; dropping it would shift every
      later cell's contour onto the wrong cell silently.
      The vertex RANGE is checked, not assumed. int16 holds +/-32767, ample
      for centroid-relative vertices and not for absolute source
      coordinates on a large chip; those would wrap silently, so a value
      that does not fit is an error naming the offending vertex and
      pointing at contour_reference.

  - name: readContourFile
    matlab_path: "+ndi/+fun/+doc/+gene/readContourFile.m"
    matlab_last_sync_hash: "5f7b4a0d"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Accepts BOTH the ragged and the fixed-width form, the latter
      signalled by a positive n_vertices_per_cell. Neither language writes
      the fixed form, but a file may come from another writer, so both read
      it; there is a test on hand-built bytes for that path precisely
      because nothing here produces it.
      vertexType and offsetType are arguments rather than constants because
      they are document FIELDS -- data_type_vertex and data_type_offset --
      so a level can widen without a format version change, exactly as the
      tile format does.

# =========================================================================
# Functions — doc_gene_export.py
#
# PYTHON-ONLY, and recorded as such rather than left to be discovered. This
# project's rule is that MATLAB leads; these three have no MATLAB
# counterpart today. They exist because the export path was needed to
# verify the pyramid against the reference builder: a GEF written from
# documents rebuilds byte-identical tiles, which is what proves the
# document round trip rather than only the codec. If MATLAB gains them, the
# names and argument order here are what it should mirror.
# =========================================================================

  - name: readGeneList
    matlab_path: null
    python_path: "ndi/fun/doc_gene_export.py"
    decision_log: >
      Python-only. Reads a geneList document's genes.tsv back into ids and
      names. MATLAB reads the same file inline where it needs it; if that
      is ever factored out, this is the shape to match.

  - name: exportGef
    matlab_path: null
    python_path: "ndi/fun/doc_gene_export.py"
    decision_log: >
      Python-only. Writes a pyramid level back out as a Stereo-seq GEF.
      Used to prove the round trip: the exported GEF rebuilds tiles that
      are byte-identical to the originals through the reference builder.

  - name: exportHdf5
    matlab_path: null
    python_path: "ndi/fun/doc_gene_export.py"
    decision_log: >
      Python-only. Writes a pyramid level as a plain HDF5 with both
      coordinate frames recorded, for tools that read neither GEF nor the
      NDI tile format.

not_applicable:

  - name: avi2mp4
    matlab_path: "+ndi/+fun/+data/avi2mp4.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Not ported. Batch-compresses .avi to H.264 .mp4 by shelling out to
      FFmpeg; nothing in it is NDI-specific beyond the recursive search, and
      no Python caller needs it yet. A port is a thin subprocess wrapper
      whenever one does. Deferred, not declined: unlike the MATLAB path and
      logging helpers below, this is portable work that simply has no
      demand.

  - name: prism2csv
    matlab_path: "+ndi/+fun/+data/prism2csv.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Not ported. Converts GraphPad Prism files to CSV by invoking an R
      script that ships beside the .m file. Porting it means either shipping
      that R script in the Python package too or finding a Python reader for
      the .prism format; both are real decisions and neither is needed by a
      current caller, so the choice is left to whoever needs it.

  - name: parallelWorkers
    matlab_path: "+ndi/+fun/parallelWorkers.m"
    matlab_last_sync_hash: "9a9150e7"
    status: not_applicable
    decision_log: >
      Not applicable. Returns the worker limit to pass as the second
      argument of a MATLAB `parfor`, reading the Parallel.OpenPoolIfNone and
      Parallel.NumberOfWorkers preferences. Python has no parfor: parallel
      code here uses multiprocessing or joblib, which take a worker count
      directly, so there is no argument for this function to compute. The
      preferences themselves stay meaningful on the MATLAB side; a Python
      caller that grows a worker pool should read them through
      ndi.preferences rather than reviving this signature.

  - name: assertAddonOnPath
    matlab_path: "+ndi/+fun/assertAddonOnPath.m"
    status: not_applicable
    decision_log: >
      Not applicable. Asks MATLAB's `ver` whether a named add-on is
      installed and errors naming what required it. Python states its
      requirements in pyproject.toml and pip refuses to install without
      them, so the check happens before any code runs and there is nothing
      left for a runtime assertion to catch.

  - name: check_Matlab_toolboxes
    matlab_path: "+ndi/+fun/check_Matlab_toolboxes.m"
    status: not_applicable
    decision_log: >
      Not applicable, for the same reason as assertAddonOnPath: it reads
      ndi_common/requirements/ndi-matlab-toolboxes.json and warns about
      MATLAB toolboxes `ver` does not list. The file names MATLAB products
      (Signal Processing Toolbox, and so on); Python's equivalent list is
      pyproject.toml's dependencies, enforced by the installer.

  - name: console
    matlab_path: "+ndi/+fun/console.m"
    status: not_applicable
    decision_log: >
      Not applicable. Opens a macOS Terminal window tailing a log file, so
      a long MATLAB run can be watched from outside the MATLAB console; the
      function itself says only macOS is supported. Python code that wants
      this runs `tail -f` in the terminal it was already launched from, and
      logging goes through the standard logging module, which the user
      configures rather than a helper spawning a window.

  - name: convertoldnsd2ndi
    matlab_path: "+ndi/+fun/convertoldnsd2ndi.m"
    status: not_applicable
    decision_log: "Legacy NSD-to-NDI migration tool. MATLAB-specific."

  - name: debuglog
    matlab_path: "+ndi/+fun/debuglog.m"
    status: not_applicable
    decision_log: "MATLAB logging utility. Python uses standard logging."

  - name: errlog
    matlab_path: "+ndi/+fun/errlog.m"
    status: not_applicable
    decision_log: "MATLAB logging utility. Python uses standard logging."

  - name: find_calc_directories
    matlab_path: "+ndi/+fun/find_calc_directories.m"
    status: not_applicable
    decision_log: >
      Not applicable. Finds NDIcalc-*-matlab calculator toolboxes by going
      three directories up from ndi.toolboxdir and globbing the siblings --
      a search that only works because MATLAB toolboxes are installed side
      by side. Python calculators are found through the ndi.calc package
      and the class registry (ndi/class_registry.py), which is an import
      question rather than a filesystem one; a third-party calculator
      distributed as its own package is discovered by being importable.

  - name: plot_extracellular_spikeshapes
    matlab_path: "+ndi/+fun/plot_extracellular_spikeshapes.m"
    matlab_last_sync_hash: "960fff8"
    status: implemented
    python_path: "ndi/fun/plot.py"
    decision_log: >
      Ported (issue #78 tranche a). Defined in ndi/fun/plot.py and re-exported
      from ndi.fun, so ndi.fun.plot_extracellular_spikeshapes is the mirror
      path -- MATLAB puts this file at the top of +fun, not inside +fun/+plot.

      Two deliberate departures from the MATLAB source, both documented in
      the function's docstring and covered by tests/test_fun_plot_spikeshapes.py:

      1. MATLAB accumulates the shared upper x-limit as
         x_axis(2) = max(x_axis(1), max(...)) -- reading index 1, the running
         MINIMUM, instead of index 2. The upper limit therefore tracks the
         minimum rather than the maximum. This port accumulates correctly;
         one test drives the case where the ordering makes the difference
         observable.
      2. MATLAB's help text says the search is for 'neuron_extracellular'
         documents; the code queries 'extracellular'. The code is followed
         here, since that is the observable behaviour.

      Rendering is exercised through matplotlib's Agg backend so the tests
      run headless. matplotlib is imported lazily inside the function with
      the same ImportError contract as the rest of ndi.fun.plot.

  - name: run_Linux_checks
    matlab_path: "+ndi/+fun/run_Linux_checks.m"
    status: not_applicable
    decision_log: >
      Not applicable. Warns about the known Linux incompatibilities of the
      MATLAB RUNTIME (it branches on computer('arch') returning GLNXA64).
      The problems it warns about are MATLAB's, not NDI's; CPython on Linux
      has none of them, and this project's own CI runs on Linux, which is a
      stronger check than a warning.

  - name: syslog
    matlab_path: "+ndi/+fun/syslog.m"
    status: not_applicable
    decision_log: "MATLAB logging utility. Python uses standard logging."
