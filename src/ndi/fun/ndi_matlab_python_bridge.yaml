    decision_log: >
      Exact match for option names. Python now uses ignoreFields,
      checkFiles, checkFileList, session1, session2 — matching MATLAB.
      Default for ignoreFields is ['base.session_id']. NOTE: MATLAB
      returns 2 separate outputs [are_equal, report]; Python returns
      1 dict with 'equal' and 'details' keys (structural difference).

      Examined against NDI-matlab c60307963, the file's last-touching commit,
      and STEP 5 WAS MISSING ENTIRELY. MATLAB's diff compares the documents'
      binary files when checkFiles is true: union of both file lists,
      presence, then size, then content through
      ndi.util.getHexDiffFromFileObj, with each file wrapped in a try/catch
      that records the error. None of it was ported -- and checkFiles,
      session1 and session2 were all accepted as parameters and none of the
      three was ever read. So diff(a, b, checkFiles=True) returned {'equal':
      True} for documents whose files differ, and MATLAB's guard ("If
      checkFiles is true, session1 and session2 must be provided") never fired
      either. A difference-finder answering "equal" for a comparison it did
      not run is the failure this bridge exists to catch. Ported, through the
      same getHexDiffFromFileObj MATLAB uses -- this is that helper's only
      caller on either side, which is why nothing noticed it was itself
      unusable until #219. Covered by tests/test_fun_doc_diff_files.py. THREE
      DIVERGENCES RECORDED, NOT CHANGED. MATLAB pops `files` out of the
      property comparison entirely and checks only files.file_list when
      checkFileList is true, where this port compares the whole `files`
      subtree and treats file_info as the order-independent list -- so it
      compares MORE, and on a different field. MATLAB's ignoreFields honours
      only one or two dot-separated parts and silently ignores anything
      deeper; this handles arbitrary depth. And MATLAB returns [are_equal,
      report] where this returns {'equal', 'details'}.

