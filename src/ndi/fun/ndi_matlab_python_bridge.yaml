        type_python: "Any"
    output_arguments:
      - name: table
        type_python: "pd.DataFrame"
    matlab_last_sync_hash: "234c356"
    decision_log: >
      Creates a summary table of epoch-related documents with columns:
      EpochNumber, EpochDocumentIdentifier, ProbeDocumentIdentifier,
      SubjectDocumentIdentifier, MixtureName, MixtureOntology,
      ApproachName, ApproachOntology.

      FIXED (issue #138): MixtureName and MixtureOntology were read from
      stimulus_bath.location.name and .ontologyNode -- the place the bath was
      applied, not what was in it. The columns were populated and plausible
      and named the wrong thing, which is why nobody caught it: a bath
      location reads like a perfectly good string to find under MixtureName.
      MATLAB parses stimulus_bath.mixture_table (epoch.m:108) and joins the
      compounds' name and ontologyName; that needed readtablechar, which had
      no Python implementation, so this could not have been right.

      Two further corrections came with it, both MATLAB behaviours the old
      code did not have: EVERY stimulus_bath in the epoch contributes, not
      just the first (MATLAB vstacks them, so a two-bath epoch kept only one
      drug before), and repeats collapse in first-seen order
      (unique(...,'stable')).

      This entry previously read "Exact match", which it was not.

