  - name: diff (session)
    type: function
    matlab_path: "+ndi/+fun/+session/diff.m"
    matlab_last_sync_hash: "be168b479"
    python_path: "ndi/fun/session.py"
    python_qualified: "ndi.fun.session.diff"
    input_arguments:
      - name: session1
        type_matlab: "ndi.session (S1)"
        type_python: "Any"
      - name: session2
        type_matlab: "ndi.session (S2)"
        type_python: "Any"
      - name: exclude_fields
        type_matlab: "N/A"
        type_python: "list[str]"
        default: "None"
      - name: verbose
        type_matlab: "options.verbose (logical, default true)"
        type_python: "bool"
        default: "True"
      - name: recheckFileReport
        type_matlab: "options.recheckFileReport (default [])"
        type_python: "list | None"
        default: "None"
    output_arguments:
      - name: result
        type_matlab: "report (struct)"
        type_python: "dict[str, Any]"
    decision_log: >
      NOT an exact match, and the record saying so was wrong. Examined against
      NDI-matlab be168b479, which finished get_fuid -- the accessor this
      function needs to decide whether two documents name the same stored
      file. MATLAB's help says the comparison "includes both the documents and
      the files"; only the document half was ported. The file loop -- union
      both current_file_list()s, resolve each name through get_fuid, report a
      missing one as 'not present' without opening it, size and hexdiff the
      rest through ndi.util.getHexDiffFromFileObj -- is now present, so two
      sessions whose documents point at different bytes no longer compare
      equal. recheckFileReport was accepted and never read, so asking for a
      targeted re-check silently ran a full comparison; it now returns from the
      recheck branch as MATLAB does. The document query was ndi_query('').isa
      ('base') against MATLAB's ndi.query('base.id','regexp','(.*)') -- a
      different question -- and doc.diff was called without checkFileList,
      which MATLAB passes explicitly. Report fields are MATLAB's:
      documentsInAOnly, documentsInBOnly, mismatchedDocuments (id/mismatch),
      fileDifferences (MATLAB's 13 fields, NaN for an unmeasured size).
      Python-only extras kept: exclude_fields (default ['base.session_id'],
      which MATLAB hard-codes), plus equal and common_count. MATLAB's own
      diffTest.testMismatchedFiles had no Python counterpart; it does now.

