# =========================================================================
# Functions — doc_gene.py
# MATLAB: +ndi/+fun/+doc/+gene/*.m
#
# The gene package mirrors a MATLAB PACKAGE rather than loose functions, so
# ndi.fun.doc.gene.<f> becomes ndi.fun.doc_gene.<f>, following the
# +ndi/+fun/+docTable -> ndi/fun/doc_table precedent already in this file.
#
# Two conventions run through the whole module and are not repeated on
# every entry:
#   * Gene rows and gene indices are ZERO-BASED on both sides. They are
#     written into a binary read by both languages, and shifting them on
#     one side only is the likeliest way for the two to diverge. This is
#     the indexing_policy's "0-based for internal data".
#   * MATLAB name-value option names are preserved verbatim (a caller types
#     'binSizes'), while positional argument names take Python style. The
#     option name is part of the calling convention; the positional name is
#     not.
# =========================================================================

  - name: readTileFile
    matlab_path: "+ndi/+fun/+doc/+gene/readTileFile.m"
    matlab_last_sync_hash: "f5d4baaec"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: source
        type_matlab: "char"
        type_python: "str | IO[bytes] | bytes"
    output_arguments:
      - name: tile
        type_python: "dict[str, Any]"
    decision_log: >
      MATLAB takes a filename. Python also accepts an open file object or
      raw bytes, because the caller often already holds the handle from
      database_openbinarydoc and writing it to a temporary file only to
      read it back would be worse. A filename still works, so the MATLAB
      call translates unchanged. Verified against conformance_tile.bin,
      the same fixture NDI-matlab's TestTileFormat asserts on, so both
      implementations agree on one artifact rather than pairwise.

  - name: writeTileFile
    matlab_path: "+ndi/+fun/+doc/+gene/writeTileFile.m"
    matlab_last_sync_hash: "f5d4baaec"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: filename
        type_python: "str"
      - name: x
        type_python: "ArrayLike"
      - name: y
        type_python: "ArrayLike"
      - name: gene_index
        type_python: "ArrayLike"
      - name: count
        type_python: "ArrayLike"
    decision_log: >
      Exact match. gene_index is zero-based on both sides; see the module
      note above.

  - name: renderTile
    matlab_path: "+ndi/+fun/+doc/+gene/renderTile.m"
    matlab_last_sync_hash: "f5d4baaec"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: tile
        type_python: "dict[str, Any]"
      - name: genes
        type_python: "ArrayLike | None"
      - name: tile_height
        type_python: "int"
      - name: tile_width
        type_python: "int"
      - name: binSize
        type_python: "int"
    output_arguments:
      - name: img
        type_python: "np.ndarray"
    decision_log: >
      Semantic Parity: genes are ZERO-BASED geneList rows, matching the
      binary they index into; conversion to 1-based happens inside, at the
      point of use. Python additionally accepts a boolean mask for genes,
      which lets a caller that already computed one skip an isin() over
      every tile; a row-index array behaves identically in both languages.

  - name: makeGeneList
    matlab_path: "+ndi/+fun/+doc/+gene/makeGeneList.m"
    matlab_last_sync_hash: "c32e1ace2"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Exact match. Name-value options (genomeAssembly, geneIdNamespace)
      keep their MATLAB spelling.

  - name: makePyramid
    matlab_path: "+ndi/+fun/+doc/+gene/makePyramid.m"
    matlab_last_sync_hash: "6ae508708"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Exact match. Options keep their MATLAB spelling (binSizes, grid,
      basePixelSize, subjectID). subjectID is REQUIRED on both sides: the
      pyramid document declares subject_id mustbenotempty, because a
      section is measured from an animal and NDI records that on the
      measurement rather than leaving it to be inferred.

  - name: readViewport
    matlab_path: "+ndi/+fun/+doc/+gene/readViewport.m"
    matlab_last_sync_hash: "b9972abf1"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: bin_size
        type_python: "int"
      - name: rect
        type_python: "tuple[int, int, int, int] | None"
      - name: gene_rows
        type_python: "ArrayLike | None"
      - name: density
        type_python: "bool"
    decision_log: >
      rect is in the pixels OF ONE LEVEL, zero-based and relative to that
      level's upper-left, on both sides -- an internal frame, so
      zero-based per the indexing_policy. MATLAB's 'density' name-value
      becomes a Python keyword of the same name. See readViewportBase for
      the source-coordinate entry point.
      NOT PORTED, deliberately -- same NDI-matlab change (b9972abf1 /
      e217f367a) and the same reasoning as exportRegion: MATLAB now reads
      tiles through ndi.fun.doc.gene.tilePath's memo; this module opens the
      binary document each time. Python's memo exists on _TileFetcher, whose
      class shape is a recorded threading decision, and these free functions
      cannot reach it. Performance only; the tiles read are the same.

  - name: tilePath
    matlab_path: "+ndi/+fun/+doc/+gene/tilePath.m"
    matlab_last_sync_hash: "b9972ab"
    python_path: "ndi/gui/app/genepyramid/multiscale.py"
    status: ported
    decision_log: >
      Resolves one of a document's binary files to a local path, fetching
      it if remote, and REMEMBERS the answer so a repeat is one existence
      check. Safe to remember because the database names a cached file by
      its immutable uid: the path for a given document and filename cannot
      change meaning, so the file is either still there or gone, never
      different. It is checked rather than trusted, because it can go.

      THE TWO PORTS DIFFER IN SHAPE, deliberately, and this is the entry
      that records why. MATLAB has a plain function holding a persistent
      map, because readViewport and exportRegion are functions with no
      object to hang state on. Python has _TileFetcher.tilePath, a method,
      because the Python side needed a class regardless: dask runs blocks
      on a thread pool and NDI's database may only be used from the thread
      that opened it, so fetches are marshalled to threads that own a
      session each. MATLAB has no such constraint here -- neither reader
      is driven by a pool -- so it needs no equivalent of that machinery
      and would be worse for carrying it.

      The memo is the half that IS common, and it is the half worth
      keeping in step: same key (document id AND filename, so two tiles of
      one level cannot collide), same existence check, same
      fetch-again-on-miss.

  - name: exportRegion
    matlab_path: "+ndi/+fun/+doc/+gene/exportRegion.m"
    matlab_last_sync_hash: "b9972abf1"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Exact match. Returns raw counts, never density.
      NOT PORTED, deliberately. NDI-matlab b9972abf1 / e217f367a route tile
      reads through ndi.fun.doc.gene.tilePath, so a caller reading overlapping
      rectangles pays an isfile check instead of a document read and a
      location resolve each time. Python HAS that memo -- _TileFetcher.tilePath
      in ndi/gui/app/genepyramid/multiscale.py -- but this module's free
      functions cannot reach it, and the tilePath entry records WHY the shapes
      differ: the Python memo lives on a class because dask runs blocks on a
      thread pool and the database may only be used from one thread. Wiring
      these functions to it, or giving them a second cache, is a design change
      against that reasoning rather than a port. It is a performance
      divergence only: the same tiles are read, just not remembered.

  - name: levelTable
    matlab_path: "+ndi/+fun/+doc/+gene/levelTable.m"
    matlab_last_sync_hash: "02403a034"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: session
        type_python: "Any"
      - name: pyr_doc
        type_python: "Any"
    output_arguments:
      - name: levels
        type_matlab: "table"
        type_python: "list[dict[str, Any]]"
      - name: frame
        type_python: "dict[str, Any]"
    decision_log: >
      DIVERGENCE in return shape, deliberate. MATLAB returns ONE table and
      hangs the shared frame (origin, extent, base pixel size, index order)
      on Properties.UserData. Python has no table type carrying metadata
      that a caller would expect to find, and reaching for a DataFrame
      would make pandas a dependency of reading a document, so the two
      halves are returned as a pair instead. Field names are the MATLAB
      ones, so the two read alike. Levels come back finest first in both,
      which is the order a multiscale viewer wants and makes levels[0]
      mean the finest rather than an arbitrary one.

  - name: chooseLevel
    matlab_path: "+ndi/+fun/+doc/+gene/chooseLevel.m"
    matlab_last_sync_hash: "02403a034"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: levels
        type_matlab: "table"
        type_python: "list[dict[str, Any]]"
      - name: rect_source
        type_python: "tuple[float, float, float, float]"
      - name: target_pixels
        type_python: "float"
    output_arguments:
      - name: bin_size
        type_python: "int"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      Takes the level collection each language's levelTable returns, so the
      divergence above does not spread. rect_source is in SOURCE
      coordinates -- the acquisition frame, not an index -- so the
      1-based/0-based question does not arise. Missing the target returns
      the finest level with info.metTarget false rather than raising, on
      both sides: asking for more detail than the data holds is a
      legitimate request with a definite answer.

  - name: readViewportBase
    matlab_path: "+ndi/+fun/+doc/+gene/readViewportBase.m"
    matlab_last_sync_hash: "02403a034"
    python_path: "ndi/fun/doc_gene.py"
    input_arguments:
      - name: bin_size
        type_python: "int"
      - name: rect_source
        type_python: "tuple[float, float, float, float] | None"
      - name: gene_rows
        type_python: "ArrayLike | None"
      - name: density
        type_python: "bool"
    output_arguments:
      - name: img
        type_python: "np.ndarray"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      rect_source is in SOURCE coordinates, the frame the data was acquired
      in and the one cell centroids and contours also use -- unlike
      readViewport, whose rect is in one level's pixels. The rounding is
      identical in both languages and is the part that matters: the low
      edge floors and the high edge ceils, so the result covers the request
      rather than clipping it, and info.rectSourceCovered reports what
      actually came back. A rectangle wholly off the pyramid returns an
      empty image rather than raising, because a viewer pans off the edge
      routinely.

  - name: storeDoc
    matlab_path: "+ndi/+fun/+doc/+gene/private/storeDoc.m"
    python_path: "ndi/fun/doc_gene.py"
    python_name: "_store_doc"
    decision_log: >
      MATLAB keeps this in the package's private/ folder, which makes it
      reachable only from the gene functions; Python marks the same
      non-public status with a leading underscore, so the name differs by
      convention rather than by choice. Every maker routes document
      creation through it, which is why it is recorded here rather than
      treated as an implementation detail: if the two ever disagree about
      how a document enters the database, they disagree everywhere at once.

  - name: readCells
    matlab_path: "+ndi/+fun/+doc/+gene/readCells.m"
    matlab_last_sync_hash: "cd2dcfad6"
    python_path: "ndi/fun/doc_gene.py"
    output_arguments:
      - name: columns
        type_matlab: "table"
        type_python: "dict[str, Any]"
      - name: info
        type_python: "dict[str, Any]"
    decision_log: >
      Columns are read BY HEADER NAME on both sides, not by position. The
      spec names cell_index, cell_id, x, y, area, dnb_count, total_counts,
      n_genes, but only the first four are required and writers differ on
      the rest: the extraction spike that produced the first opossum cells
      wrote dnbCount and n_genes_by_counts. Reading by position would have
      silently mapped one measurement onto another's name, so both
      implementations keep the writer's own column names.
      cell_id stays TEXT in both. A 14-digit identifier loses precision as
      a double and stops matching the source file it came from.
      MATLAB returns a table; Python returns a dict of arrays, the same
      divergence and the same reason as levelTable -- a DataFrame would
      make pandas a dependency of reading a document.
      Contours are NOT read: contours.bin needs its own reader, and
      info.contoursPresent says whether there is more.

  - name: _parse_cells_tsv
    matlab_path: null
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Python-only helper, split out so a DIRECTORY of extracted cells is
      parsed by exactly the same rules as a document's copy. The Cells
      document's file list is cells.tsv and contours.bin -- the same names
      extract_cells.py writes -- and reading the two by different rules is
      how they quietly diverge. MATLAB has no directory path to serve, so
      it keeps the parsing inline.

  - name: makeCells
    matlab_path: "+ndi/+fun/+doc/+gene/makeCells.m"
    matlab_last_sync_hash: "6ae508708"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Writes cells.tsv, optionally contours.bin, and stores the document.
      cell_index is written explicitly and is ZERO-BASED on both sides: it
      is the key contours.bin and every cellTypeLabels document reference,
      so a reader must never have to infer it from row order.
      cellID is kept as TEXT rather than a number, because these are
      commonly 14-digit identifiers that lose precision as a double or a
      float and then no longer match the source file they came from.
      subjectID is OPTIONAL here, unlike makePyramid where it is required:
      the pyramid this depends on already carries one.
      MATLAB takes extra columns as a table, Python as a dict of columns --
      the same divergence and reason as levelTable and readCells.

  - name: writeContourFile
    matlab_path: "+ndi/+fun/+doc/+gene/writeContourFile.m"
    matlab_last_sync_hash: "1ddb60032"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      contour_format_version 1, little-endian, ragged form with an offset
      array. Both languages write ONLY the ragged form even when every cell
      has the same vertex count: the fixed-width form the spec also allows
      saves n_cells+1 offsets and cannot represent a later ragged edit, and
      readContourFile accepts both anyway.
      An empty polygon is written as zero vertices rather than dropped, so
      row i of cells.tsv stays row i here; dropping it would shift every
      later cell's contour onto the wrong cell silently.
      The vertex RANGE is checked, not assumed. int16 holds +/-32767, ample
      for centroid-relative vertices and not for absolute source
      coordinates on a large chip; those would wrap silently, so a value
      that does not fit is an error naming the offending vertex and
      pointing at contour_reference.

  - name: readContourFile
    matlab_path: "+ndi/+fun/+doc/+gene/readContourFile.m"
    matlab_last_sync_hash: "1ddb60032"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Accepts BOTH the ragged and the fixed-width form, the latter
      signalled by a positive n_vertices_per_cell. Neither language writes
      the fixed form, but a file may come from another writer, so both read
      it; there is a test on hand-built bytes for that path precisely
      because nothing here produces it.
      vertexType and offsetType are arguments rather than constants because
      they are document FIELDS -- data_type_vertex and data_type_offset --
      so a level can widen without a format version change, exactly as the
      tile format does.

  # =======================================================================
  # +ndi/+fun/+doc/+gene -- spatial-transcriptomics ingest additions
  #
  # A group of MATLAB functions that lift the .gef / .h5ad ingest path out
  # of ndi.gui.app.GeneIngest so a script, a batch importer or a Python
  # caller can drive it without opening the GUI (VH-Lab/NDI-matlab
  # PR #933). The four recorded here have no Python counterpart yet:
  # ndi.gui.app.GeneIngest itself is not ported either (see the entry in
  # src/ndi/gui/app/ndi_matlab_python_bridge.yaml), and the ingest path
  # only becomes reachable from Python once the GUI class or a
  # non-interactive equivalent lands. The tile / cell / pyramid readers
  # and writers around them are ported (readTileFile, readCells,
  # writeContourFile, ...), so these four join them when the ingest
  # boundary is drawn on the Python side. Deferred as a group rather than
  # a file at a time because they call each other -- fromGEF makes the
  # source file and readNotes reports what the reader could not verify up
  # front.
  #
  # tilePath came over with this group in MATLAB but is recorded ABOVE,
  # with the ported doc_gene entries, because the lazy tile fetcher does
  # have a Python counterpart now (_TileFetcher.tilePath); its entry
  # records why the two ports differ in shape.
  # =======================================================================

  - name: fromCellBin
    matlab_path: "+ndi/+fun/+doc/+gene/fromCellBin.m"
    matlab_last_sync_hash: "6ae5087"
    status: porting_deferred
    decision_log: >
      MATLAB reads a SAW cellbin .h5ad with
      ndr.format.stereoseq.readCellBin and turns it into a
      spatialGeneExpressionCells plus one cellTypeLabels document per
      requested labeling, positioned against a pyramid document. Reads
      the file exactly once so cells and label arrays cannot disagree
      about row order. Ports as a group with the other three entries
      under this heading; no current Python caller.

  - name: fromGEF
    matlab_path: "+ndi/+fun/+doc/+gene/fromGEF.m"
    matlab_last_sync_hash: "a178e46"
    status: porting_deferred
    decision_log: >
      MATLAB reads a Stereo-seq .gef with ndr.format.stereoseq.readGEF
      and produces the geneList, spatialGeneExpressionPyramid and one
      spatialGeneExpressionTiles per level -- the whole .gef-to-database
      path in one call. Ports with the other three entries under this
      heading.

  - name: makeSourceFile
    matlab_path: "+ndi/+fun/+doc/+gene/makeSourceFile.m"
    matlab_last_sync_hash: "6ae5087"
    status: porting_deferred
    decision_log: >
      MATLAB creates the generic_file document that the spatial gene
      expression documents' source_file_id dependency points at, so a
      pyramid can name the .gef it was built from. Describes by default
      (name + checksum + dates), attaches only when attachFile=true.
      Ports with the other three entries under this heading.

  - name: readNotes
    matlab_path: "+ndi/+fun/+doc/+gene/readNotes.m"
    matlab_last_sync_hash: "6ae5087"
    status: porting_deferred
    decision_log: >
      MATLAB post-flight helper: turns the reader meta from
      ndr.format.stereoseq into a cellstr of things a caller should be
      told after the fact (counts hitting ceilings, extents from
      attributes rather than records, tables trimmed by maxGenes).
      Ports with the other three entries under this heading; nothing in
      Python asks for these notes yet.

# =========================================================================
# Functions — doc_gene_export.py
#
# PYTHON-ONLY, and recorded as such rather than left to be discovered. This
# project's rule is that MATLAB leads; these three have no MATLAB
# counterpart today. They exist because the export path was needed to
# verify the pyramid against the reference builder: a GEF written from
# documents rebuilds byte-identical tiles, which is what proves the
# document round trip rather than only the codec. If MATLAB gains them, the
# names and argument order here are what it should mirror.
  - name: makeCellTypeLabels
    matlab_path: "+ndi/+fun/+doc/+gene/makeCellTypeLabels.m"
    matlab_last_sync_hash: "46a01c077"
    python_path: "ndi/fun/doc_gene.py"
    decision_log: >
      Writes labels.tsv and stores a cellTypeLabels document depending on
      the spatialGeneExpressionCells document it labels.
      NDI-matlab 46a01c077 moved its empty-labels check ahead of the
      length check, so passing no labels is reported as that rather than as a
      length mismatch. Its commit says the two ports ordering these
      differently would itself be a divergence. Nothing to port: Python
      already checks empty first.

      LABELS ARE THEIR OWN DOCUMENT rather than a column of cells.tsv
      because one segmentation routinely carries several competing
      labelings -- a transferred atlas call, a clustering at one
      resolution, the same clustering at another -- arriving at different
      times from different sources. One document each lets them coexist,
      be added later, and be deleted independently, and a test asserts two
      labelings can sit on one segmentation at once.

      is_unsupervised is the one argument here that is not cosmetic, and
      it DEFAULTS TO TRUE on both sides -- the safer assumption, meaning
      "do not read biology into it". An unsupervised clustering carries no
      biological identity: cluster 3 is an index, not a cell type, and
      means nothing outside the run that produced it. A viewer colouring
      by a clustering looks identical to one colouring by a subclass call,
      so the difference must be carried in the data or it is lost, and
      reading a cluster index as a cell type is a scientific error rather
      than a display bug. The source file does not record which kind it
      is; ndr.format.stereoseq.readCellBin can only GUESS from a column
      name and marks its guess as one. This project has already lost work
      to that guess, so here a caller claiming a labeling is a real cell
      type call has to say so explicitly.

      An empty label means UNLABELED, which is a real state rather than an
      error, and it is excluded from n_categories. n_cells, n_categories
      and n_unlabeled are computed rather than supplied; the last matters
      because a labeling covering a third of the cells and one covering
      all of them look the same in a legend.

      A length mismatch against the cells document is an ERROR rather than
      padded or truncated: labels are matched to cells by row order, so a
      shifted labeling gives every cell its neighbour's type and nothing
      downstream notices.

      cell_index in labels.tsv is 0-BASED, as in cells.tsv and
      contours.bin, and is written explicitly rather than inferred from
      row order.

      DIVERGENCE: MATLAB returns [doc, tsvPath], Python returns the
      document alone. That follows each language's existing convention in
      this package -- makeGeneList and makeCells already differ the same
      way -- rather than introducing a third.

# =========================================================================

  - name: readGeneList
    matlab_path: null
    python_path: "ndi/fun/doc_gene_export.py"
    decision_log: >
      Python-only. Reads a geneList document's genes.tsv back into ids and
      names. MATLAB reads the same file inline where it needs it; if that
      is ever factored out, this is the shape to match.

  - name: exportGef
    matlab_path: null
    python_path: "ndi/fun/doc_gene_export.py"
    decision_log: >
      Python-only. Writes a pyramid level back out as a Stereo-seq GEF.
      Used to prove the round trip: the exported GEF rebuilds tiles that
      are byte-identical to the originals through the reference builder.

