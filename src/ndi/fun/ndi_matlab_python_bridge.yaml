    decision_log: >
      Ported at its MATLAB mirror path -- MATLAB's +ndi/+fun/+calc/ becomes
      ndi/fun/calc.py -- and reachable as ndi.fun.calc.stimulus_tuningcurve_log.
      Uses doc.dependency_value(), matching MATLAB.

      A second implementation lives at ndi.fun.stimulus.stimulus_tuningcurve_log
      (predates this port; walks document_properties.depends_on directly and is
      covered by tests/test_phase2_gaps.py). It stays for backward
      compatibility -- callers already imported from that path -- but the
      calc.py entry is the canonical one for Mirror Rule purposes. Anything
      new should reach for ndi.fun.calc; consolidation onto one implementation
      is its own follow-up because the two use different duck-typing
      strategies and the phase2 tests would need updating.

  # =========================================================================
  # Functions — table.py
  # MATLAB: +ndi/+fun/+table/*.m
  # =========================================================================

  - name: identifyMatchingRows
    type: function
    matlab_path: "+ndi/+fun/+table/identifyMatchingRows.m"
    matlab_last_sync_hash: "227088a01"
    python_path: "ndi/fun/table.py"
    input_arguments:
      - name: df
        type_matlab: "table (dataTable)"
        type_python: "pd.DataFrame"
      - name: column
        type_matlab: "cellstr (columnNames)"
        type_python: "str | list[str]"
      - name: value
        type_matlab: "any (dataValues)"
        type_python: "Any"
      - name: stringMatch
        type_matlab: "options.stringMatch (default 'identical', validated member)"
        type_python: "str"
        default: "'identical'"
      - name: numericMatch
        type_matlab: "options.numericMatch (default 'eq', validated member)"
        type_python: "str"
        default: "'eq'"
    output_arguments:
      - name: mask
        type_matlab: "rowInd (logical vector)"
        type_python: "pd.Series"
    decision_log: >
      Exact match. Python now uses stringMatch and numericMatch kwargs
      matching MATLAB option names. Removed legacy 'mode' positional
      parameter.

      Examined against NDI-matlab 227088a01, the file's last-touching commit,
      and this one did NOT hold in three ways, all now fixed. (1) THE SILENT
      ONE: the port chose string-vs-numeric matching from the COLUMN's dtype,
      where MATLAB chooses from the MATCH VALUE's type (ischar(matchVal) /
      isnumeric(matchVal) -- it never inspects the column). Against an
      object-dtype column of numbers, which pandas produces routinely from
      mixed data, numericMatch='gt' took the string path and returned the rows
      EQUAL to the threshold instead of those above it. No error, just the
      wrong rows. (2) The multi-value form MATLAB's own help documents,
      identifyMatchingRows(T,'col',{{'a','b','c'}}), raised "Lengths must
      match to compare": MATLAB ORs the alternatives for one column, the port
      compared the Series against the whole list. (3) A column not in the
      table raised KeyError, where MATLAB warns
      identifyMatchingRows:ColumnNotFound and sets the whole index false. Also
      adds string_match / numeric_match as snake_case spellings, per this
      project's cross-language naming convention;
      tests/matlab_tests/test_jess_haley.py already called them that way and
      would have failed with TypeError had a module-level dataset skip not
      been hiding it. Covered by tests/test_fun_table.py.

  - name: identifyValidRows
    type: function
    matlab_path: "+ndi/+fun/+table/identifyValidRows.m"
    matlab_last_sync_hash: "a642da55f"
    python_path: "ndi/fun/table.py"
    input_arguments:
      - name: df
        type_matlab: "table (variableTable)"
        type_python: "pd.DataFrame"
      - name: checkVariables
        type_matlab: "cellstr (checkVariables, default {})"
        type_python: "list[str] | None"
        default: "None"
      - name: invalidValues
        type_matlab: "cell (invalidValues, default {NaN})"
        type_python: "Any"
        default: "None"
    output_arguments:
      - name: mask
        type_matlab: "validInd (logical vector)"
        type_python: "pd.Series"
    decision_log: >
      Exact match. Python now uses checkVariables and invalidValues
      matching MATLAB argument names. Python default for invalidValues
      is None (matches MATLAB NaN semantic).

      Examined against NDI-matlab a642da55f, the file's last-touching commit,
      and this one did NOT hold. Passing NaN as invalidValues returned EVERY
      row valid: the port compared with `df[col] != invalidValues`, and NaN
      never equals itself, so the test was True even on the NaN rows -- the
      exact opposite of what was asked. MATLAB gives NaN and NaT their own
      branches (isnumeric && isnan, isdatetime && isnat) for precisely this
      reason, and {NaN} is its DEFAULT invalidValues, so it is the value a
      caller is most likely to pass explicitly. Fixed, with a missing column
      now warning as MATLAB's identifyValidRows:InvalidVariableName does
      rather than being skipped in silence. TWO DIVERGENCES LEFT AS THEY ARE.
      With no checkVariables MATLAB returns true(height,1) immediately --
      every row valid, no filtering -- where this port checks EVERY column, so
      `identifyValidRows(df)` can return far fewer rows here than there. That
      behaviour is asserted by
      tests/test_phase1_gaps.py::test_identify_valid_rows and matches the
      port's own `columns=` idiom, so it is a deliberate API choice rather
      than a slip -- but it is a real difference and a caller moving between
      the two languages must know it. And MATLAB accepts one invalidValue PER
      checkVariable (broadcasting a scalar, erroring
      identifyValidRows:VariableValueMismatch on a length mismatch) where this
      takes a single sentinel for all columns.

  - name: join
    type: function
    matlab_path: "+ndi/+fun/+table/join.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/table.py"
    python_qualified: "ndi.fun.table.join"
    input_arguments:
      - name: tables
        type_matlab: "cell of tables"
        type_python: "list[pd.DataFrame]"
      - name: unique_variables
        type_matlab: "options.uniqueVariables (char, default '')"
        type_python: "list[str] | None"
        default: "None"
    output_arguments:
      - name: merged
        type_matlab: "combinedTable"
        type_python: "pd.DataFrame"
    decision_log: >
      Exact match. Combines multiple DataFrames using common columns
      as keys. Performs inner merge on common columns. MATLAB option
      name is uniqueVariables; Python uses unique_variables.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit.
      The inner join over common columns, and the uniqueVariables aggregation
      that collapses each group's other columns, both match; MATLAB's explicit
      re-sort by ileft is unnecessary here because pandas merge already
      preserves the left frame's order. ONE DIVERGENCE RECORDED RATHER THAN
      CHANGED: when two tables share NO columns, MATLAB's innerjoin errors,
      while this port falls back to pd.concat and stacks them VERTICALLY -- a
      different operation returned silently, with NaN filling both blocks.
      Whether that fallback is wanted is a caller-facing decision rather than
      a porting slip, so it is written down here rather than removed. MATLAB
      also errors join:InvalidUniqueVariables for a uniqueVariable absent from
      the combined table, where a pandas groupby raises KeyError -- same
      refusal, different exception -- and rejects an empty tables list via
      mustBeNonempty, where this returns an empty frame.

  - name: moveColumnsLeft
    type: function
    matlab_path: "+ndi/+fun/+table/moveColumnsLeft.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/table.py"
    input_arguments:
      - name: df
        type_matlab: "table (dataTable)"
        type_python: "pd.DataFrame"
      - name: columns
        type_matlab: "cellstr (columnNames)"
        type_python: "list[str]"
    output_arguments:
      - name: reordered
        type_python: "pd.DataFrame"
    decision_log: >
      Exact match. Moves specified columns to the left of the DataFrame.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit
      (the src/ layout move; unchanged since). Behaviour matches: the named
      columns move to the front keeping the order they were given, and the
      rest keep their relative order. MATLAB reaches that with two movevars
      calls (to the end, then before the new first variable); the port
      reorders directly, which is the same result. One divergence: MATLAB's
      movevars errors on a column name the table does not have, where this
      filters it out silently. Nothing to port.

  - name: vstack
    type: function
    matlab_path: "+ndi/+fun/+table/vstack.m"
    matlab_last_sync_hash: "b1d8a6f6c"
    python_path: "ndi/fun/table.py"
    input_arguments:
      - name: tables
        type_matlab: "cell of tables (tablesCellArray)"
        type_python: "list[pd.DataFrame]"
    output_arguments:
      - name: stacked
        type_matlab: "T_stacked"
        type_python: "pd.DataFrame"
    decision_log: >
      Exact match. Vertically stacks DataFrames with dissimilar
      columns. Discovers union of all column names and fills missing
      with NaN.

      Examined against NDI-matlab b1d8a6f6c, the file's last-touching commit.
      pd.concat(..., sort=False) already does what MATLAB's 236 lines achieve:
      the union of columns in first-encounter order, with missing cells
      filled. Most of that length is MATLAB working around table limitations
      pandas does not have -- typed empty prototypes per variable, and
      multi-column variables, which have no pandas counterpart. Divergences,
      none behavioural enough to change: MATLAB errors
      vstack:InvalidCellContent for a non-table element and requires a
      non-empty cell array, where this leaves both to pandas or returns an
      empty frame; and MATLAB returns a single input table untouched where
      concat resets the index. Nothing to port.

# =========================================================================
# Functions — ensemble.py, ensemble_db.py
# MATLAB: +ndi/+fun/+ensemble/
#
# MATLAB splits the ensemble helpers across ten files in one package;
# Python splits them across TWO modules on a different seam, because the
# seam that matters in Python is not the file boundary but the database.
# ensemble.py holds `filter`, the one operation that touches no session
# (it reshapes a structure already in memory); ensemble_db.py holds the
# nine that do. ndi.fun.ensemble re-exports all of them, so a caller
# writing ndi.fun.ensemble.read sees MATLAB's layout regardless.
#
# Every function is exported under BOTH its MATLAB name and a snake_case
# alias (allElement / all_element), as elsewhere in ndi.fun.
# =========================================================================

  - name: allElement
    type: function
    matlab_path: "+ndi/+fun/+ensemble/allElement.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: all_element
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: "IfExists / verbose"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (if_exists='skip', verbose=False)"
    output_arguments:
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
    decision_log: >
      Ported. Finds or creates the ensemble element for ELEMENT and adds an
      epoch for each of ELEMENT's epochs, via create. MATLAB's IfExists
      option is spelled if_exists; its remaining name-value pairs are passed
      through to create as **create_options rather than being re-declared,
      so the two cannot drift apart. Exported as both allElement and
      all_element.

