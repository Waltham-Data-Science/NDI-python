  - name: docCellArray2Table
    type: function
    matlab_path: "+ndi/+fun/+docTable/docCellArray2Table.m"
    matlab_last_sync_hash: "fa67d45d0"
    python_path: "ndi/fun/doc_table.py"
    input_arguments:
      - name: documents
        type_matlab: "cell (doc_cell_array)"
        type_python: "list[Any]"
    output_arguments:
      - name: table
        type_python: "pd.DataFrame"
    decision_log: >
      Exact match. Converts a list of NDI documents to a DataFrame.
      Each document contributes one row.

      Examined against NDI-matlab fa67d45d0, the file's last-touching commit,
      and this one did NOT hold. MATLAB does not flatten anything itself -- it
      calls ndi.document/to_table on each document and vstacks the results,
      and to_table drops depends_on and files, gives each dependency its own
      depends_on_NAME column, and flattens the rest with dot notation TO ANY
      DEPTH. The port flattened document_properties inline, ONE level deep,
      keeping both fields MATLAB removes. On the same document the two
      produced different columns outright: the port gave base.id, base.name,
      depends_on, element.type, files.file_list where MATLAB gives base.id,
      base.name, depends_on_subject_id, element.type.nested -- a raw
      depends_on column and a files.* column that should not be there, no
      depends_on_* column that should, and a nested value left unflattened.
      Now uses the document's own to_table when it returns a frame, and
      otherwise applies the same rules. Covered by
      tests/test_fun_doc_table.py. ONE GAP RECORDED, NOT FIXED HERE: MATLAB's
      to_table also abbreviates column names through
      ndi_common/config/ndi_document2table_abbreviations.json
      (orientation_direction_tuning -> oridir, and nine more). That file IS
      present in this repo's ndi_common, but ndi.document.to_table never reads
      it, so every abbreviated field's column is named differently in the two
      languages. That belongs to the ndi.document entry rather than this one.

