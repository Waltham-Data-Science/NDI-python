      those; then the one whose independent_variable_label matches. It reads
      both curves through tuning_response.tuningcurvedoc2vhlabrespstruct and
      returns both values at ONE stimulus index -- chosen, when the caller
      gives none, as the location of the larger of the two peaks. The port did
      none of that. It read one value out of the document it was handed and
      returned None for the other, so one of the pair was always absent and
      the two could never be compared -- which is the entire reason the
      function exists. It also read stimulus_tuningcurve.responses directly
      rather than the curve, and returned None where MATLAB returns NaN.
      Ported in full, against the existing Python
      tuningcurvedoc2vhlabrespstruct; covered by
      tests/test_fun_plot_stimulus_against_matlab.py. TWO MATLAB QUIRKS NOT
      COPIED. Its first switch matches lower(rt) against 'f1' while the second
      matches rt against 'F1', so a lower-case 'f1' passes the first and falls
      through the second, leaving f0_tuning_curve unset; the port compares
      case-insensitively throughout. And after warning about too many matches
      MATLAB truncates to one and then tests for more than one again, which
      cannot fire.

  - name: findMixtureName
    type: function
    matlab_path: "+ndi/+fun/+stimulus/findMixtureName.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/stimulus.py"
    input_arguments:
      - name: dictionary_path
        type_matlab: "char (mixtureDictionaryPath)"
        type_python: "str"
      - name: mixture
        type_matlab: "cell of structs"
        type_python: "list[dict[str, Any]]"
    output_arguments:
      - name: names
        type_matlab: "matchingNames"
        type_python: "list[str]"
    decision_log: >
      Exact match. Matches mixture against a JSON mixture dictionary.
      Returns list of matching entry names from the dictionary.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit,
      and THE MATCHING RULE WAS THE WRONG ONE. MATLAB is all(entryMatch) where
      each entryMatch(j) = any(mixtureMatch): every component of a dictionary
      entry must find SOME element of the mixture that matches it on all five
      fields. The mixture may hold more. The port required len(entry) ==
      len(mixture), skipping anything else outright, then paired the two lists
      sorted by name and compared them one to one -- so an entry that is a
      subset of the mixture never matched, and two components sharing a name
      paired arbitrarily. Worse, `if not isinstance(entry_components, list):
      continue` meant a ONE-COMPONENT entry could never match at all:
      jsondecode gives MATLAB a scalar struct there, which it wraps, while
      json.load gives a dict, which this skipped. And every field was compared
      as a STRING, so 1 and 1.0 -- a JSON integer and a JSON float for the
      same quantity -- were different. All ported. ONE PLACE MORE PERMISSIVE
      THAN MATLAB, deliberately: numeric TEXT is accepted on either side of
      the value comparison. MATLAB's eq('0.9', 0.9) compares char codes and
      returns a 1x3 logical, which the following && rejects, so MATLAB errors
      on that input rather than defining an answer -- and a mixture read out
      of a table or a CSV carries its values as text. There was an existing
      test asserting that a string value matches its number; it still passes.

  - name: stimulustemporalfrequency
    type: function
    matlab_path: "+ndi/+fun/stimulustemporalfrequency.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/stimulus.py"
    input_arguments:
      - name: stimulus_parameters
        type_matlab: "struct {mustBeA(stimulus_parameters,'struct')}"
        type_python: "dict[str, Any]"
      - name: config_path
        type_matlab: "N/A (not in MATLAB)"
        type_python: "str | None"
        default: "None"
    output_arguments:
      - name: tf_value
        type_python: "float | None"
      - name: param_name
        type_matlab: "tf_name"
        type_python: "str"
    decision_log: >
      Exact match for the 1-arg form. Python adds an optional
      config_path parameter not present in MATLAB (Python-only
      convenience for specifying custom config file path).

      FIXED 2026-09-02: this returned (None, "") for EVERY stimulus. It
      looked for a config named temporal_frequency_rules.json, which does
      not exist in ndi_common, and read rule keys (parameterName,
      multiplier, adder, multiplyByParameter) that are not the ones the
      shipped file uses. It now reads
      ndi_common/stimulus/ndi_stimulusparameters2temporalfrequency.json --
      the same file MATLAB reads -- and its keys parameter_name,
      temporalFrequencyMultiplier, temporalFrequencyAdder, isPeriod and
      parameterMultiplier, applying them in MATLAB's order
      (adder + multiplier * value, then invert if isPeriod, then multiply by
      the named parameter). The silence was not harmless: a stimulus with no
      temporal frequency gets no F1 or F2 response, so
      ndi.app.stimulus.tuning_response computed means only.

      DIVERGENCE, deliberate: MATLAB errors when a rule names a
      parameterMultiplier that the stimulus does not carry. Python skips
      that rule and tries the next, so one malformed stimulus in a set does
      not cost the frequencies of the rest; the caller still gets
      (None, "") when nothing matches.

      Confirmed against NDI-matlab fe64a9f53, the file's last-touching commit.
      This one was already examined and repaired -- the docstring records that
      it used to read a file name and rule keys that do not exist, and
      returned (None, '') for every stimulus ever passed to it -- and the
      repair holds against MATLAB: the same shipped
      ndi_common/stimulus/ndi_stimulusparameters2temporalfrequency.json, the
      same five rule keys, the same adder + multiplier * value, the same 1/x
      when isPeriod, the same optional parameterMultiplier lookup, rules tried
      in file order with the first match winning. Verified live: the shipped
      file has three rules and a tFrequency of 4.0 comes back as 4.0. ONE
      DELIBERATE DIVERGENCE, already documented in the function: MATLAB ERRORS
      on a malformed rule, a non-numeric value, a zero period or a missing
      multiplier parameter, where the port skips that rule and tries the next,
      so one bad entry does not cost a stimulus set every frequency in it. The
      port also takes an optional config_path that MATLAB has no counterpart
      for. Nothing further to port.

