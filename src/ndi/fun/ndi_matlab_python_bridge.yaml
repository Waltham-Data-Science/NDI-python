        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
      - name: existing
        type_matlab: "cell array of ndi.document"
        type_python: "list of ndi_document"
    decision_log: >
      Ported. Adds EPOCHID to the ensemble element for ELEMENT: reads the
      epoch's spikes with load, writes them as a marked point process, and
      stores the per-epoch 'ensemble' map document naming the neuron ids and
      names behind each column. MATLAB returns [ensembleElement, existing];
      Python returns the same pair as a tuple, so a caller who wants only
      the element takes [0].

  - name: filter
    type: function
    matlab_path: "+ndi/+fun/+ensemble/filter.m"
