      Exact match. Reports which stimulus parameters take more than one
      value across a stimulus set, and which do not. MATLAB's two outputs
      become a tuple; whatIsConstant is the second alone. excludeBlank keeps
      its MATLAB spelling (Strict Naming) even though it is the only
      camelCase keyword argument in the module.

