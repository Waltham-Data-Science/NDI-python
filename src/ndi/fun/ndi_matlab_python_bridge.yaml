      1-BASED in Python, matching MATLAB's IncludeIndex: the shared symmetry
      battery feeds one case list to both languages, so a 0-based Python
      variant would make identical inputs mean different neurons in the two
      ports. The reason is stated at _index_mask, where a reader who thinks
      it is a leftover would go to change it. Shadows the builtin `filter`,
