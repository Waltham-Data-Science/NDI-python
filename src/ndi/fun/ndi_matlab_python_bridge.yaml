        type_python: "str"
        default: "'subject_id'"
      - name: errorIfEmpty
        type_matlab: "options.errorIfEmpty (logical, default false)"
        type_python: "bool"
        default: "False"
      - name: depends_on_docs
        type_matlab: "options.depends_on_docs (default {})"
        type_python: "dict | None"
        default: "None"
      - name: hideMixtureTable
        type_matlab: "options.hideMixtureTable (logical, default true)"
        type_python: "bool"
        default: "True"
    output_arguments:
      - name: table
        type_matlab: "treatmentTable"
        type_python: "pd.DataFrame"
      - name: doc_ids
        type_matlab: "docIDs"
        type_python: "list[str]"
      - name: dependency_ids
        type_matlab: "dependencyIDs"
        type_python: "list[str]"
    matlab_last_sync_hash: "234c356"
    decision_log: >
      Returns MATLAB's 3 outputs (table, doc_ids, dependency_ids), and the
      options depends_on, errorIfEmpty, depends_on_docs and hideMixtureTable.

      FIXED (issue #138): the three mixture columns MATLAB always writes --
      DrugTreatmentMixtureName, ...Quantity, ...Ontology (treatment.m:111-114)
      -- did not exist here at all. Two reasons, both now addressed. The query
      asked only for "treatment"; treatment_drug is a SIBLING class, so no
      drug document was ever returned and mixture_table was never in reach.
      And hideMixtureTable dropped every column whose name contained
      "Mixture", which would have discarded the expansion along with its
      source: MATLAB computes the three columns unconditionally and the flag
      governs only the RAW table column.

      DIVERGENCE, deliberate: MATLAB assigns the mixture columns straight from
      the parsed table, which fits a one-row table only when the mixture has a
      single compound; real mixtures have several
      (mixtureStr2mixtureTable builds one row per compound). The compounds are
      comma-joined into one cell instead -- what the sibling docTable/epoch
      does with the same data, and what this function's own header promises
      ("strings become comma-separated lists").

      STILL DIVERGENT, not addressed here and worth its own issue: MATLAB also
      queries virus_injection and measurement documents, aggregates all
      treatments per dependency into ONE row, and parses the _time fields into
      datetimes. Python returns one row per document, no aggregation, and
      leaves times as strings. Fixing the mixture columns did not require it
      and doing it silently would have changed the table's shape.

      This entry previously read "Exact match", which it was not.

  - name: subject (docTable)
