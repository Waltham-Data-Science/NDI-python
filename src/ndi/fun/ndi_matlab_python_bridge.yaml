  - name: clearAllCaches
    type: function
    matlab_path: "+ndi/+fun/clearAllCaches.m"
    matlab_last_sync_hash: "8653c2c8"
    python_path: "ndi/fun/cache.py"
    python_name: clear_all_caches
    input_arguments:
      - name: varargin
        type_matlab: "objects to clear"
        type_python: "*objects"
      - name: verbose
        type_python: "keyword argument (verbose=False)"
    output_arguments:
      - name: cleared
        type_matlab: "(none; prints)"
        type_python: "list[str]"
    decision_log: >
      Ported. Clears the caches reachable from the given objects (sessions,
      datasets, and their sub-objects). MATLAB returns nothing and reports
      nothing, so a caller cannot tell which caches it actually found;
      Python RETURNS the list of names and prints them under verbose, so a
      test can assert that a cache is still being cleared rather than
      silently skipped. Exported as both clearAllCaches and
      clear_all_caches.

  - name: parseText
    type: function
    matlab_path: "+ndi/+fun/parseText.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/text.py"
    python_name: parse_text
    input_arguments:
      - name: inputText
        type_matlab: "char | cell array | string array"
        type_python: "str | Sequence[str] | Sequence[Sequence[str]]"
      - name: textParser
        type_matlab: "ndi.document | struct"
        type_python: "ndi_document | Mapping"
      - name: clean
        type_matlab: "name-value pair (default true)"
        type_python: "keyword argument (clean=True)"
    output_arguments:
      - name: variableTable
        type_matlab: "table"
        type_python: "pd.DataFrame"
    decision_log: >
      Ported. Applies a text_parser document's rules to free text and
      returns the extracted variables as a table. MATLAB's table becomes a
      DataFrame; pandas is imported lazily (_require_pandas), as elsewhere
      in ndi.fun. matlab_column_class is exported alongside it because
      MATLAB's per-column class is what the 'clean' step tests, and a
      DataFrame's dtype is not the same question.

