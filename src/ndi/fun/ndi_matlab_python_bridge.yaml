    python_path: "ndi/fun/export.py"
    python_name: blech_clust
    input_arguments:
      - name: stimulator
        type_matlab: "ndi.probe"
        type_python: "probe"
      - name: probe
        type_matlab: "ndi.probe"
        type_python: "probe"
      - name: epochID
        type_matlab: "char"
        type_python: "str"
      - name: outputfile
        type_matlab: "char"
        type_python: "str | os.PathLike"
      - name: "sample_rate / pre_stim / post_stim / ensemble / quality filters"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments"
    decision_log: >
      Ported. Gathers an epoch's ensemble, stimulus onsets and stimulus ids
      and hands them to blech_clust_write. The HDF5 file it produces is read
      by the blech_clust pipeline, so the layout is fixed by that consumer
      rather than by either toolbox; h5py is imported lazily (_require_h5py)
      so the rest of ndi.fun.export stays importable without it.

  - name: blech_clust_write
    type: function
    matlab_path: "+ndi/+fun/+export/blech_clust_write.m"
    matlab_last_sync_hash: "e2d961df"
    python_path: "ndi/fun/export.py"
    python_name: blech_clust_write
    input_arguments:
      - name: outputfile
        type_matlab: "char"
        type_python: "str | os.PathLike"
      - name: unit_spiketimes
        type_matlab: "cell array"
        type_python: "Sequence[Any]"
      - name: unit_info
        type_matlab: "struct array"
        type_python: "Sequence[Mapping[str, Any]]"
      - name: onset_times
        type_python: "array-like"
      - name: trial_stimid
        type_python: "array-like"
      - name: stimid_tastant
        type_matlab: "containers.Map"
        type_python: "Mapping[Any, str]"
      - name: "pre_stim / post_stim / sample_rate"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments"
    decision_log: >
      Ported. Writes the blech_clust HDF5 file. Sample indices are computed
      with _matlab_round, which rounds halves away from zero the way
      MATLAB's round does rather than to even the way Python's does — a
      difference of one sample in the spike raster otherwise. MATLAB's
      containers.Map becomes a plain Mapping.

