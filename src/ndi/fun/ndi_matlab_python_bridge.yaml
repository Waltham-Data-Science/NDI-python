    output_arguments:
      - name: E
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported. The one ensemble function that touches no session, which is
      why it lives in ensemble.py rather than ensemble_db.py. Pure and
      in-memory: subsets the rows of E['activity'] and the matching entries
      of neuron_ids / neuron_names, updates info['num_neurons'], and trims
