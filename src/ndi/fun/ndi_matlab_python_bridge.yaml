      which is equally absent from every schema, so it too returns nothing for
      every input. Left for its own change rather than edited from here, since
      that entry's record is being written on another branch. Two structural
      differences that stand: MATLAB returns a cell array the same size as the
      input where this returns a dict keyed by epoch id, and MATLAB drives a
      ProgressBarWindow that has no counterpart in a headless port.

