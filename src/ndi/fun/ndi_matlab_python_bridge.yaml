# =========================================================================
# Functions — ensemble.py, ensemble_db.py
# MATLAB: +ndi/+fun/+ensemble/
#
# MATLAB splits the ensemble helpers across ten files in one package;
# Python splits them across TWO modules on a different seam, because the
# seam that matters in Python is not the file boundary but the database.
# ensemble.py holds `filter`, the one operation that touches no session
# (it reshapes a structure already in memory); ensemble_db.py holds the
# nine that do. ndi.fun.ensemble re-exports all of them, so a caller
# writing ndi.fun.ensemble.read sees MATLAB's layout regardless.
#
# Every function is exported under BOTH its MATLAB name and a snake_case
# alias (allElement / all_element), as elsewhere in ndi.fun.
# =========================================================================

  - name: allElement
    type: function
    matlab_path: "+ndi/+fun/+ensemble/allElement.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: all_element
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: "IfExists / verbose"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (if_exists='skip', verbose=False)"
    output_arguments:
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
    decision_log: >
      Ported. Finds or creates the ensemble element for ELEMENT and adds an
      epoch for each of ELEMENT's epochs, via create. MATLAB's IfExists
      option is spelled if_exists; its remaining name-value pairs are passed
      through to create as **create_options rather than being re-declared,
      so the two cannot drift apart. Exported as both allElement and
      all_element.

  - name: allNTrodes
    type: function
    matlab_path: "+ndi/+fun/+ensemble/allNTrodes.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
