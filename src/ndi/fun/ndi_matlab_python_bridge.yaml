# ndi_matlab_python_bridge.yaml — src/ndi/fun/
# The Primary Contract for the ndi.fun namespace.
#
# Covers: utils.py, name_utils.py, data.py, dataset.py, doc.py,
#         doc_table.py, doc_gene.py, doc_gene_export.py, epoch.py,
#         file.py, plot.py, session.py, stimulus.py, table.py

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Functions — utils.py
# MATLAB: +ndi/+fun/channelname2prefixnumber.m, name2variableName.m,
#         pseudorandomint.m, timestamp.m
# =========================================================================
functions:

  - name: channelname2prefixnumber
    type: function
    matlab_path: "+ndi/+fun/channelname2prefixnumber.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/utils.py"
    input_arguments:
      - name: channelname
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: prefix
        type_python: "str"
      - name: number
        type_python: "int"
    decision_log: >
      Exact match. Parses a channel name into prefix and number
      (e.g. 'ai5' -> ('ai', 5)).

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      Holds: split at the first digit, strip whitespace from the prefix, parse
      the rest as the number, and refuse both a name with no digits and one
      that starts with a digit. MATLAB raises plain errors where the port
      raises ValueError with the same two conditions.

  - name: name2variableName
    type: function
    matlab_path: "+ndi/+fun/name2variableName.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/utils.py"
    input_arguments:
      - name: name
        type_matlab: "char {mustBeTextScalar}"
        type_python: "str"
    output_arguments:
      - name: variableName
        type_python: "str"
    decision_log: >
      Exact match. Converts arbitrary string to camelCase variable name.
      Replaces non-alphanumeric chars (except underscore) with spaces,
      splits into words, capitalizes each. Prepends 'x' if result
      starts with digit. A PascalCase variant also exists in
      ndi/fun/name_utils.py (Python-only convenience).

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit,
      AND THIS RECORD AND THE NEXT ONE ARE SWAPPED. This entry called the
      utils.py implementation an "Exact match" and "the canonical
      MATLAB-matching implementation". It is not. MATLAB replaces ':' and '-'
      with '_' BEFORE the general cleanup, capitalises the first letter of
      every word while KEEPING THE REST OF THE WORD AS IT WAS (the lowercasing
      is commented out in the source), joins to PascalCase, and prepends
      'var_' when the result does not start with a letter. utils.py does none
      of those four: it lets ':' and '-' become word separators, lowercases
      the first word, uses str.capitalize() which lowercases the rest of each
      word, and prepends 'x'. On the same inputs: 'NCBITaxon:10116' gives
      'ncbitaxon10116' here against MATLAB's 'NCBITaxon_10116';
      'spatial_frequency' gives 'spatial_frequency' against
      'Spatial_frequency'; '2 photon' gives 'x2Photon' against 'var_2Photon'.
      The faithful implementation is the one in ndi/fun/name_utils.py,
      recorded below as a "Python-only convenience". IT MATTERS BEYOND
      BOOKKEEPING: ndi.fun exports THIS one, and +docTable/element.m builds
      its metadata column names with ndi.fun.name2variableName -- so whoever
      ports that aggregation (still missing, see the element entry) would get
      different column names using the exported function. No production code
      calls either today, and two tests assert the camelCase behaviour, so
      which one ndi.fun should export is left to a maintainer rather than
      swapped here.

  - name: pseudorandomint
    type: function
    matlab_path: "+ndi/+fun/pseudorandomint.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/utils.py"
    input_arguments: []
    output_arguments:
      - name: value
        type_python: "int"
    decision_log: >
      Exact match. Generates pseudo-random integer from date/time
      plus random component: seconds since 2022-06-01 * 1000 +
      random(1..1000).

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit.
      MATLAB is t_offset*1000 + randi(1000) - 1, and its own comment spells it
      out: "random number between 1 and 1000, -1". The port dropped the -1,
      shifting every value by one against the MATLAB and putting the random
      part in [1,1000] rather than [0,999]. Restored. One divergence left:
      MATLAB measures its offset from local midnight on 2022-06-01 using
      `now`, where the port uses UTC for both ends, so the two disagree by the
      local UTC offset; each is self-consistent and the value is only ever
      compared with itself.

  - name: timestamp
    type: function
    matlab_path: "+ndi/+fun/timestamp.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/utils.py"
    input_arguments: []
    output_arguments:
      - name: ts
        type_python: "str"
    decision_log: >
      Exact match. Returns current UTC timestamp string. Handles
      leap-second artefact by clamping second=60 to 59.999.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit,
      and this one did NOT hold. MATLAB is
      char(datetime('now','TimeZone','UTCLeapSeconds')), a format that ends in
      a ZONE DESIGNATOR. The port emitted '2026-09-08T02:25:18.707' with no Z
      -- and that is the one shape ndi.util.datestamp2datetime refuses, so two
      functions in this same package did not compose. It also disagreed with
      ndi.common.timestamp, which does emit the Z and is what ndi_document
      stamps documents with; every datestamp under ndi_common/ carries one.
      Fixed, and the two tests that asserted the 23-character no-Z shape were
      updated -- they encoded the defect. Its leap-second guard was also wrong
      in a way that would only show if it fired: `ts.replace(':60.',
      ':59.999')` leaves the old fraction appended ('...:59.999123'), where
      MATLAB rewrites the six characters before the Z. Now replaces the
      seconds field itself.

  # =========================================================================
  # Functions — name_utils.py (Python-only variant)
  # =========================================================================

  - name: name2variableName (PascalCase variant)
    type: function
    matlab_path: "+ndi/+fun/name2variableName.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/name_utils.py"
    input_arguments:
      - name: name
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: variableName
        type_python: "str"
    decision_log: >
      Python-only PascalCase variant of name2variableName. The canonical
      MATLAB-matching implementation is in utils.py. This variant uses a
      slightly different algorithm (Replace ':', '-' with '_', prepend
      'var_' if starts with non-letter) and is provided as a convenience.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit,
      AND THIS IS THE FAITHFUL PORT, not a "Python-only PascalCase variant...
      provided as a convenience". What this record calls a "slightly different
      algorithm (Replace ':', '-' with '_', prepend 'var_' if starts with
      non-letter)" is precisely MATLAB's algorithm, and it agrees with MATLAB
      on every case tried: 'orientation direction tuning' ->
      'OrientationDirectionTuning', 'spatial_frequency' ->
      'Spatial_frequency', 'a:b' -> 'A_b', 'NCBITaxon:10116' ->
      'NCBITaxon_10116', '2 photon' -> 'var_2Photon'. The entry above, which
      claims to be the canonical match, is the one that diverges. See it for
      the consequences.

  # =========================================================================
  # Functions — data.py
  # MATLAB: +ndi/+fun/+data/*.m
  # =========================================================================

  - name: readngrid
    type: function
    matlab_path: "+ndi/+fun/+data/readngrid.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/data.py"
    input_arguments:
      - name: file_path
        type_matlab: "char (fileName_or_fileObj)"
        type_python: "str | Path"
      - name: data_size
        type_matlab: "double (vector)"
        type_python: "Sequence[int]"
      - name: data_type
        type_matlab: "char"
        type_python: "str"
        default: "'double'"
    output_arguments:
      - name: data
        type_python: "np.ndarray"
    decision_log: >
      Exact match. Reads n-dimensional binary matrix from file.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit.
      The byte layout matches, which is the part that matters for a format the
      two languages exchange: _TYPE_MAP pins '<' on every numeric type against
      MATLAB's explicit 'ieee-le', and the reshape uses order='F' against
      fread's column-major fill. Both are now pinned by
      tests/test_fun_data_ngrid.py rather than left to a comment. TWO
      DELIBERATE DIVERGENCES. MATLAB WARNS on an unrecognised dataType and on
      an element-count mismatch, then carries on and returns whatever fread
      produced; the port raises ValueError in both cases, so a short or
      misdescribed file cannot be read as if it were whole. ONE REAL GAP,
      RECORDED RATHER THAN GUESSED AT: MATLAB special-cases 'ubit1' to skip
      the warning, and fread('ubit1') reads ONE BIT per element -- eight
      values to the byte. _TYPE_MAP maps ubit1 to NumPy bool, one BYTE per
      element, so a logical ngrid written by MATLAB cannot be read here and
      vice versa. mat2ngrid labels every logical array ubit1, so this is
      reachable. Fixing it means packing bits, and MATLAB's bit order within a
      byte is not something to infer without a MATLAB to test against;
      recorded here for whoever has one.

  - name: writengrid
    type: function
    matlab_path: "+ndi/+fun/+data/writengrid.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/data.py"
    input_arguments:
      - name: data
        type_matlab: "numeric"
        type_python: "np.ndarray"
      - name: file_path
        type_matlab: "char"
        type_python: "str | Path"
      - name: data_type
        type_matlab: "char"
        type_python: "str"
        default: "'double'"
    output_arguments: []
    decision_log: >
      Exact match. Writes n-dimensional matrix to binary file
      in little-endian format.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit.
      Matches: little-endian by dtype against MATLAB's 'ieee-le', and
      ravel(order='F') before tofile against fwrite's column-major walk --
      ndarray.tofile is C-order, so the explicit ravel is what makes the file
      readable by MATLAB at all. Now covered by
      tests/test_fun_data_ngrid.py::TestNgridByteLayout, including a direct
      assertion on the on-disk element order. One divergence: MATLAB warns on
      an unrecognised dataType and lets fwrite try, where the port raises.
      Note that MATLAB's own validDataTypes list omits 'ubit1', so MATLAB
      warns when writing the very type mat2ngrid assigns to logical arrays;
      the bit-packing gap is recorded on readngrid.

  - name: mat2ngrid
    type: function
    matlab_path: "+ndi/+fun/+data/mat2ngrid.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/data.py"
    input_arguments:
      - name: data
        type_matlab: "numeric (x)"
        type_python: "np.ndarray"
      - name: coordinates
        type_matlab: "varargin (cell)"
        type_python: "list[np.ndarray] | None"
        default: "None"
    output_arguments:
      - name: ngrid_struct
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match. Converts n-dimensional array to ngrid metadata
      structure with keys: data_size, data_type, data_dim, coordinates.
      MATLAB uses varargin for optional coordinates; Python uses a
      single list argument.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit,
      and one thing did NOT hold. MATLAB ends with `if islogical(x),
      ngrid.data_type = 'ubit1'; end`, so a logical array is ALWAYS recorded
      as ubit1. The port reverse-mapped the dtype by scanning _TYPE_MAP, where
      both 'logical' and 'ubit1' map to the same NumPy dtype, so which name
      came out was decided by dict order -- 'logical' -- and the two languages
      disagreed on the recorded data_type of every boolean ngrid. Booleans are
      now named explicitly, before the scan. TWO DIVERGENCES LEFT AS THEY ARE,
      both in the default coordinates. MATLAB builds ONE column vector holding
      every dimension's indices concatenated (1:size(x,i) for each i), from
      which a reader cannot tell where one axis ends and the next begins
      without data_dim; the port returns a LIST of per-axis arrays, which is
      what a Python caller indexes. And those arrays run 0..N-1 where MATLAB's
      run 1..N, following each language's indexing convention. The
      list-of-arrays shape is asserted by tests/test_fun.py::TestMat2Ngrid, so
      it is a deliberate choice rather than an oversight -- it had simply
      never been written down. A caller comparing coordinates across the two
      languages must account for both.

  - name: evaluate_fitcurve
    type: function
    matlab_path: "+ndi/+data/evaluate_fitcurve.m"
    matlab_last_sync_hash: "fe64a9f53"
    python_path: "ndi/fun/data.py"
    input_arguments:
      - name: fitcurve_doc
        type_matlab: "N/A here (see canonical)"
        type_python: "Any"
      - name: "*args"
        type_matlab: "N/A here (see canonical)"
        type_python: "np.ndarray"
    output_arguments:
      - name: values
        type_python: "np.ndarray"
    decision_log: >
      Predates the canonical port. MATLAB's evaluate_fitcurve lives at
      +ndi/+data/, which mirrors to ndi.data.evaluate_fitcurve (see the
      root ndi_matlab_python_bridge.yaml); this ndi.fun.data variant is a
      different, Python-invented shape and is not the Mirror Rule entry.

      The differences matter to a caller:

      * Schema. This variant reads fit_variable_names (with the dependent
        variable as the last entry) and fit_parameter_values; the canonical
        reads MATLAB's fit_independent_variable_names,
        fit_dependent_variable_names and fit_parameters.
      * Safety. This variant restricts eval()'s builtins and namespace;
        the canonical parses the equation to an AST and walks it against
        an allow-list, refusing attribute access, subscripts, calls to
        anything unlisted, comprehensions and lambdas. A fitcurve document
        is data that can arrive from a shared or cloud dataset, so the
        canonical is the one to use in that setting.

      This entry stays for backward compatibility with tests/test_phase1_gaps.py
      and any caller already importing from ndi.fun.data. New code should
      import from ndi.data.

      Examined against NDI-matlab fe64a9f53, the file's last-touching commit,
      and the record above holds in full -- this really is a Python-invented
      variant reading fit_variable_names and fit_parameter_values, where
      MATLAB reads fit_independent_variable_names,
      fit_dependent_variable_names and fit_parameters, and the canonical
      mirror entry ndi.data.evaluate_fitcurve is the one that matches. WHAT
      WAS WRONG WAS THE PATH ITSELF. matlab_path read
      '+ndi/+data/evaluate_fitcurve.m (in a different namespace)' -- the note
      was written INSIDE the path string, so it resolved to no file at all,
      which is why the drift gate could never hash this entry and why it sat
      in the allowlist. The note belongs in this log, where it already was;
      the path is now the real one, so the entry is gated on the same MATLAB
      source as its canonical sibling and a change there flags both records
      rather than one. The sibling carries 76b0673 for the same file, which is
      equally current -- no commit has touched it since either.

  - name: readImageStack
    type: function
    matlab_path: "+ndi/+fun/+data/readImageStack.m"
    matlab_last_sync_hash: "a695aedff"
    python_path: "ndi/fun/data.py"
    input_arguments:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
      - name: doc
        type_matlab: "ndi.document"
        type_python: "Any"
      - name: fmt
        type_matlab: "char"
        type_python: "str"
        default: "'auto'"
    output_arguments:
      - name: image_data
        type_matlab: "imageStack"
        type_python: "np.ndarray"
      - name: info
        type_matlab: "imageStack_info"
        type_python: "dict[str, Any]"
    decision_log: >
      Exact match. Reads an image stack or video from a database
      binary document. Supports formats: tif, png, mp4, ngrid, auto.

      Examined against NDI-matlab a695aedff, the file's last-touching commit,
      and the port follows MATLAB's HELP TEXT rather than MATLAB's CODE. The
      help promises an HxWxCxN array 'containing the pixel data for all
      frames', but the body calls plain imread(file, fmt), which returns the
      FIRST frame only; nothing in it loops over frames. The port does loop,
      stacking every frame on the last axis. Section 7's precedent runs the
      other way -- plot_extracellular_spikeshapes follows the code, 'since
      that is the observable behaviour' -- so this is flagged rather than
      quietly kept: reading all frames is almost certainly what was wanted,
      but MATLAB does not currently do it, and the two disagree today for any
      multi-frame TIFF. THREE FURTHER DIVERGENCES. For video formats MATLAB
      returns a VideoReader OBJECT -- a lazy handle, the point of which is not
      loading the file -- where the port returns decoded array data. MATLAB's
      second output is imfinfo's per-frame struct array, or get(VideoReader);
      the port returns a small dict of format/size/mode/num_frames. And the
      port adds two formats MATLAB has no notion of: 'ngrid', reading raw
      binary via the document's imageStack_parameters, and 'auto', which
      sniffs the file header and falls back to ngrid, where MATLAB errors
      readImageStack:UnsupportedFormat for anything outside imformats and
      VideoReader's list.

  # =========================================================================
  # Functions — dataset.py
  # MATLAB: +ndi/+fun/+dataset/diff.m
  # =========================================================================

  - name: diff (dataset)
    type: function
    matlab_path: "+ndi/+fun/+dataset/diff.m"
    matlab_last_sync_hash: "be168b479"
    python_path: "ndi/fun/dataset.py"
    python_qualified: "ndi.fun.dataset.diff"
    input_arguments:
      - name: dataset1
        type_matlab: "ndi.dataset (D1)"
        type_python: "Any"
      - name: dataset2
        type_matlab: "ndi.dataset (D2)"
        type_python: "Any"
      - name: exclude_fields
        type_matlab: "N/A"
        type_python: "list[str]"
        default: "None"
      - name: verbose
        type_matlab: "options.verbose (logical, default true)"
        type_python: "bool"
        default: "True"
      - name: recheckFileReport
        type_matlab: "options.recheckFileReport (default [])"
        type_python: "list | None"
        default: "None"
    output_arguments:
      - name: result
        type_matlab: "report (struct)"
        type_python: "dict[str, Any]"
    decision_log: >
      NOT an exact match, and the record saying so was wrong. Examined against
      NDI-matlab be168b479, the commit that finished get_fuid and so made this
      function's file comparison expressible here at all. Three divergences,
      all ported: (1) the port delegated to ndi.fun.session.diff on
      dataset.session, where MATLAB searches the DATASET, so documents owned by
      member sessions were never compared and their files -- which MATLAB opens
      via open_session(session_id) -- were never opened; (2) MATLAB compares
      dataset documents with isequaln on document_properties minus files, not
      through ndi.fun.doc.diff, which asks a different question; (3) the entire
      file half was missing, so two datasets whose documents pointed at
      different stored bytes were reported equal. recheckFileReport was
      accepted and never read; it now short-circuits to the named files as
      MATLAB does. Report fields are MATLAB's: documentsInAOnly,
      documentsInBOnly, mismatchedDocuments, fileDifferences. Python-only
      extras kept: exclude_fields, and equal/common_count (MATLAB computes the
      latter and prints it but does not return it). MATLAB's recheck branch
      queries the legacy 'ndi_document.id' field here where the session variant
      uses 'base.id'; this uses 'base.id' in both, which is the live field name.

  # =========================================================================
  # Functions — doc.py
  # MATLAB: +ndi/+fun/+doc/*.m
  # =========================================================================

  - name: allTypes
    type: function
    matlab_path: "+ndi/+fun/+doc/allTypes.m"
    matlab_last_sync_hash: "f57144891"
    python_path: "ndi/fun/doc.py"
    input_arguments: []
    output_arguments:
      - name: types
        type_python: "list[str]"
    decision_log: >
      Exact match. Returns all known NDI document types by scanning
      schema JSON files.

      Examined against NDI-matlab f57144891, the file's last-touching commit.
      Same shape: scan the document folder and the calculator document paths
      for .json files, take each file's stem, skip dotfiles, unique and sort.
      Returns the same 101 type names here. One latent divergence: the port
      additionally strips a trailing '_schema' from the stem, which MATLAB
      does not -- today no file under database_documents is named that way, so
      nothing differs, but a future *_schema.json would be reported under two
      different names by the two languages.

  - name: findFuid
    type: function
    matlab_path: "+ndi/+fun/+doc/findFuid.m"
    matlab_last_sync_hash: "321d54fde"
    python_path: "ndi/fun/doc.py"
    input_arguments:
      - name: session
        type_matlab: "ndi.session (ndi_obj)"
        type_python: "Any"
      - name: fuid
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: document
        type_python: "Any | None"
      - name: filename
        type_python: "str"
    decision_log: >
      Exact match. Searches session for a document containing a file
      with the given UID. Returns (document, filename) or (None, '').

      Examined against NDI-matlab 321d54fde, the file's last-touching commit.
      Same search and the same early return on the first match, returning
      (doc, filename) and (empty, '') when nothing matches. Two differences in
      how the search is spelled, neither changing the result: MATLAB queries
      base.id with the regexp '(.*)' where the port uses isa('base') -- both
      select every document; and MATLAB asks the document for
      current_file_list and get_fuid where the port walks
      files.file_info[].locations[].uid directly, so it matches on ANY
      location's uid for a file rather than the document's canonical one.
      Nothing to port.

  - name: makeSpeciesStrainSex
    type: function
    matlab_path: "+ndi/+fun/+doc/+subject/makeSpeciesStrainSex.m"
    matlab_last_sync_hash: "b33d8ce64"
    python_path: "ndi/fun/doc.py"
    input_arguments:
      - name: session
        type_matlab: "ndi.session (ndiSession)"
        type_python: "Any"
      - name: subjectID
        type_matlab: "char (subjectID — a string ID)"
        type_python: "str"
      - name: Species
        type_matlab: "options.Species (char, default '')"
        type_python: "str"
        default: "''"
      - name: Strain
        type_matlab: "options.Strain (char, default '')"
        type_python: "str"
        default: "''"
      - name: BiologicalSex
        type_matlab: "options.BiologicalSex (char, default '')"
        type_python: "str"
        default: "''"
      - name: AddToSession
        type_matlab: "options.AddToSession (logical, default false)"
        type_python: "bool"
        default: "False"
    output_arguments:
      - name: documents
        type_matlab: "ndiDocArray"
        type_python: "list[Any]"
    decision_log: >
      Exact match. Python 2nd argument is now subjectID (string),
      matching MATLAB. Option names match MATLAB: Species, Strain,
      BiologicalSex, AddToSession. NOTE: MATLAB also returns a second
      output openMindsObj which Python does not yet return.

      Examined against NDI-matlab b33d8ce64, the file's last-touching commit.
      The three-step shape is right and the PATO map for biological sex
      matches, but four things did not hold. (1) A STRAIN LOST ITS ONTOLOGY
      IDENTIFIER. MATLAB builds openminds.core.research.Strain with
      'ontologyIdentifier', ID; the port passed only name and species, so a
      strain document came back as a bare name with nothing to resolve it.
      Ported. (2) A FAILED LOOKUP FABRICATED AN IDENTIFIER. The fallback was
      `ont_id, name = Species, Species`, so a species that did not resolve
      became a document named after the raw input AND claiming that same text
      as its preferredOntologyIdentifier. The identifier is now simply absent,
      and the failure is warned about. DELIBERATELY MORE PERMISSIVE THAN
      MATLAB, which warns and creates nothing at all: a caller holding a plain
      species name still gets a document, it just does not carry a false
      identifier. Two existing tests pass plain names ('Mus musculus',
      'Rattus') and still pass. (3) BiologicalSex accepted ANY string, where
      MATLAB's mustBeMember allows only male, female, hermaphrodite and
      notDetectable -- so a typo became a document. Now rejected, with the
      four terms exported as BIOLOGICAL_SEX_TERMS. notDetectable also builds
      with a name and NO preferredOntologyIdentifier, as MATLAB does, rather
      than an empty one. (4) AddToSession added documents one at a time inside
      `except Exception: pass`. One call now, errors reaching the caller.
      Noted in passing, and belonging to openminds_convert rather than here:
      the Python serialisation spells openMINDS fields snake_case
      (preferred_ontology_identifier, ontology_identifiers) where MATLAB's are
      camelCase.

  - name: probeLocations4probes
    type: function
