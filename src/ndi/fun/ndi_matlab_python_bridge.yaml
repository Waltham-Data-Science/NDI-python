# MATLAB: +ndi/+fun/+ensemble/
#
# MATLAB splits the ensemble helpers across ten files in one package;
# Python splits them across TWO modules on a different seam, because the
# seam that matters in Python is not the file boundary but the database.
# ensemble.py holds `filter`, the one operation that touches no session
# (it reshapes a structure already in memory); ensemble_db.py holds the
# nine that do. ndi.fun.ensemble re-exports all of them, so a caller
# writing ndi.fun.ensemble.read sees MATLAB's layout regardless.
#
# Every function is exported under BOTH its MATLAB name and a snake_case
# alias (allElement / all_element), as elsewhere in ndi.fun.
# =========================================================================

  - name: allElement
    type: function
    matlab_path: "+ndi/+fun/+ensemble/allElement.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: all_element
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: "IfExists / verbose"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (if_exists='skip', verbose=False)"
    output_arguments:
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
    decision_log: >
      Ported. Finds or creates the ensemble element for ELEMENT and adds an
      epoch for each of ELEMENT's epochs, via create. MATLAB's IfExists
      option is spelled if_exists; its remaining name-value pairs are passed
      through to create as **create_options rather than being re-declared,
      so the two cannot drift apart. Exported as both allElement and
      all_element.

  - name: allNTrodes
    type: function
    matlab_path: "+ndi/+fun/+ensemble/allNTrodes.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: all_ntrodes
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: "IfExists / verbose"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (if_exists='skip', verbose=False)"
    output_arguments:
      - name: ensembleElements
        type_matlab: "cell array of ndi.element.ensemble"
        type_python: "list of ndi.element.ensemble"
    decision_log: >
      Ported. Sweeps every probe of type 'n-trode' (the constant
      NTRODE_TYPE, named so the string appears once) and calls allElement
      on each. MATLAB's cell array becomes a list.

  - name: create
    type: function
    matlab_path: "+ndi/+fun/+ensemble/create.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: create
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: epochid
        type_matlab: "char"
        type_python: "str"
      - name: "CheckExisting / verbose / load options"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (check_existing=True, verbose=False, **load_options)"
    output_arguments:
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
      - name: existing
        type_matlab: "cell array of ndi.document"
        type_python: "list of ndi_document"
    decision_log: >
      Ported. Adds EPOCHID to the ensemble element for ELEMENT: reads the
      epoch's spikes with load, writes them as a marked point process, and
      stores the per-epoch 'ensemble' map document naming the neuron ids and
      names behind each column. MATLAB returns [ensembleElement, existing];
      Python returns the same pair as a tuple, so a caller who wants only
      the element takes [0].

  - name: filter
    type: function
    matlab_path: "+ndi/+fun/+ensemble/filter.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble.py"
    python_name: filter
    input_arguments:
      - name: E
        type_matlab: "struct (from ndi.fun.ensemble.read)"
        type_python: "Mapping[str, Any]"
      - name: "IncludeNames / ExcludeNames / IncludeIndex / ExcludeIndex / IncludeIds / ExcludeIds / Keep"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (include_names=..., exclude_index=..., keep=...)"
    output_arguments:
      - name: E
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported. The one ensemble function that touches no session, which is
      why it lives in ensemble.py rather than ensemble_db.py. Pure and
      in-memory: subsets the rows of E['activity'] and the matching entries
      of neuron_ids / neuron_names, updates info['num_neurons'], and trims
      trailing all-zero columns. include_index and exclude_index stay
      1-BASED in Python, matching MATLAB's IncludeIndex: the shared symmetry
      battery feeds one case list to both languages, so a 0-based Python
      variant would make identical inputs mean different neurons in the two
      ports. The reason is stated at _index_mask, where a reader who thinks
      it is a leftover would go to change it. Shadows the builtin `filter`,
      deliberately and with a noqa, because Strict Naming wins.

  - name: findExisting
    type: function
    matlab_path: "+ndi/+fun/+ensemble/findExisting.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: find_existing
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble | char (document id)"
        type_python: "ndi.element.ensemble | str"
      - name: epochid
        type_matlab: "name-value pair"
        type_python: "keyword argument (epochid='')"
    output_arguments:
      - name: docs
        type_matlab: "cell array of ndi.document"
        type_python: "list of ndi_document"
    decision_log: >
      Exact match. Returns the 'ensemble' map documents belonging to an
      ensemble element, optionally restricted to one epoch. Empty epochid
      means "every epoch", as MATLAB's empty default does.

  - name: load
    type: function
    matlab_path: "+ndi/+fun/+ensemble/load.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: load
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: epochid
        type_matlab: "char"
        type_python: "str"
      - name: "neurons / clocktype / value_type / value_description / verbose"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments"
    output_arguments:
      - name: activity
        type_matlab: "sparse double (neurons x spikes)"
        type_python: "scipy.sparse matrix"
      - name: neuron_ids
        type_python: "list[str]"
      - name: neuron_names
        type_python: "list[str]"
      - name: info
        type_matlab: "struct"
        type_python: "dict"
      - name: spike_rows
        type_python: "list"
    decision_log: >
      Ported. Finds the 'spikes' elements built on ELEMENT (the constant
      SPIKES_TYPE), reads each neuron's spike times against a time reference
      on ELEMENT for EPOCHID, and packs them into a sparse matrix where
      row i, column n is the time of neuron i's n-th spike. MATLAB's five
      outputs become a five-tuple. The matrix has the shape
      ndi.element.ensemble.spikeMatrix calls "the export form", the one
      ndi.util.writeSparse serializes -- but neither language's ensemble
      path writes it through writeSparse today; both store the epoch as a
      marked point process and rebuild the matrix on read. So the two
      toolboxes agree on the SHAPE here and on the FILE FORMAT in
      ndi.util.sparse_array, and nothing yet joins them.

  - name: neuronQuality
    type: function
    matlab_path: "+ndi/+fun/+ensemble/neuronQuality.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: neuron_quality
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: neuron_ids
        type_matlab: "cell array of char"
        type_python: "Sequence[str]"
    output_arguments:
      - name: quality_number
        type_matlab: "1xN double"
        type_python: "np.ndarray"
      - name: quality_label
        type_matlab: "1xN cell of char"
        type_python: "list[str]"
    decision_log: >
      Exact match. Looks up each neuron's 'neuron_extracellular' document
      and returns its spike-sorting quality. A neuron with no such document
      gives NaN and '', exactly as MATLAB does — the absence is reported,
      not silently dropped, so quality_number stays aligned with neuron_ids.

  - name: plot
    type: function
    matlab_path: "+ndi/+fun/+ensemble/plot.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: plot
    input_arguments:
      - name: E
        type_matlab: "struct (from ndi.fun.ensemble.read)"
        type_python: "Mapping[str, Any]"
      - name: "axes / color / marker size / labels"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (ax=None, color='k', marker_size=2.0, show_names=True)"
    output_arguments:
      - name: h
        type_matlab: "graphics handle"
        type_python: "matplotlib artist"
    decision_log: >
      Ported to matplotlib, with one of MATLAB's two calling forms. MATLAB
      accepts plot(E, ...) and plot(S, ENSEMBLEELEMENT, EPOCH, ...); Python
      accepts only the first, because the second is exactly
      plot(read(S, ensembleElement, epoch)) and Python has no varargin
      dispatch to make the shorthand free. A caller porting the three
      argument form writes the read call out. MATLAB's 'axes' is spelled
      'ax', matplotlib's name for it.

  - name: read
    type: function
    matlab_path: "+ndi/+fun/+ensemble/read.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: read
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: ensembleElement
        type_matlab: "ndi.element.ensemble | ndi.document | char"
        type_python: "ndi.element.ensemble | ndi_document | str"
      - name: epoch
        type_matlab: "char | double"
        type_python: "str | int"
      - name: "the filter and quality name-value pairs"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (include_names=..., min_quality=..., ...)"
    output_arguments:
      - name: E
        type_matlab: "struct"
        type_python: "dict"
    decision_log: >
      Ported. Reads one epoch of an ensemble element and returns the
      activity, neuron ids, neuron names and info as a single mapping — the
      one-step equivalent of read followed by filter (and neuronQuality for
      the quality options), as in MATLAB. MATLAB's struct becomes a dict
      rather than a class: the fields are data, and a caller round-tripping
      one through filter should not have to construct a type to do it.

  - name: ensembleElementFor
    type: function
    matlab_path: "+ndi/+fun/+ensemble/private/ensembleElementFor.m"
    matlab_last_sync_hash: "0e2caa09"
    python_path: "ndi/fun/ensemble_db.py"
    python_name: _find_or_create_ensemble_element
    input_arguments:
      - name: S
        type_matlab: "ndi.session | ndi.dataset"
        type_python: "session"
      - name: probe
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
    output_arguments:
      - name: ens
        type_matlab: "ndi.element.ensemble"
        type_python: "ndi.element.ensemble"
    decision_log: >
      Ported as a private helper. MATLAB puts it in a `private/` folder,
      which makes it callable only from within +ensemble; Python's
      equivalent is the leading underscore, so the name is
      _find_or_create_ensemble_element rather than a Strict Naming mirror —
      Strict Naming governs the public surface, and this file is
      deliberately not on it. Finds or constructs the ndi.element.ensemble
      whose underlying element is PROBE, named [probe.name '_ensemble'].

