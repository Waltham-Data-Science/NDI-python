        type_python: "session"
      - name: element
        type_matlab: "ndi.element | ndi.probe"
        type_python: "element | probe"
      - name: epochid
        type_matlab: "char"
        type_python: "str"
      - name: "CheckExisting / verbose / load options"
        type_matlab: "name-value pairs"
        type_python: "keyword arguments (check_existing=True, verbose=False, **load_options)"
