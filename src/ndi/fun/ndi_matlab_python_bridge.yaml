        type_python: "keyword arguments (if_exists='skip', verbose=False)"
    output_arguments:
      - name: ensembleElements
        type_matlab: "cell array of ndi.element.ensemble"
        type_python: "list of ndi.element.ensemble"
    decision_log: >
      Ported. Sweeps every probe of type 'n-trode' (the constant
      NTRODE_TYPE, named so the string appears once) and calls allElement
      on each. MATLAB's cell array becomes a list.

  - name: create
    type: function
