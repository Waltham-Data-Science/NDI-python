      THE EMPTY-COLUMN RULE IS THE ONE THING THAT HAD TO CHANGE SHAPE: the
      schema shapes these fields [N x 1], and MATLAB writes zeros(0,1)
      rather than [] for an absent optional field because validation rejects
      a 0x0. Python has no 0x1; the shape the validator accepts is [[]],
      read as 1x0 under the same rule that lets a row vector stand for a
      column. So [[]] goes into documents (EMPTY_COLUMN / _document_column)
      and _column reads it back as empty, which is also why geometry.get
      normalises what it returns. Without it every layout with an empty
      optional field fails validation.
