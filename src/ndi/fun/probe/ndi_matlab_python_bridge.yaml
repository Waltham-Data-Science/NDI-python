# -------------------------------------------------------------------------
# The three geometry INPUT paths, not yet ported.
#
# geometry.py can read a layout out of the NDI library (fromLibrary), out of
# a struct (fromStruct), and out of the session (get), and can WRITE a
# Kilosort map (toKilosortMap, writeKilosortMap). What it cannot yet do is
# go the other way: build a layout FROM a Kilosort channel map or a
# ProbeInterface file, or add one to the shipped library. All three are
# recorded here rather than left silent, because the gap is a shape -- one
# direction of the same conversion -- and not three unrelated omissions.
# -------------------------------------------------------------------------

  - name: geometry.fromKilosortMap
    matlab_path: "+ndi/+fun/+probe/+geometry/fromKilosortMap.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Not ported. The inverse of geometry.toKilosortMap, which IS ported:
      reads a Kilosort/KIASORT channel map (a .mat file or a struct with
      xcoords / ycoords / kcoords / connected / chanMap) and creates the
      probe_geometry and site2channelmap documents for a probe. Porting it
      needs a .mat reader for the channel-map file (scipy.io.loadmat), and
      the axis mapping xcoords -> site_locations_leftright, ycoords ->
      site_locations_depth must agree exactly with toKilosortMap's, which is
      why it should be ported alongside a test that round-trips through the
      ported direction rather than on its own.

  - name: geometry.fromProbeInterface
    matlab_path: "+ndi/+fun/+probe/+geometry/fromProbeInterface.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Not ported. Converts a ProbeInterface JSON probe (the SpikeInterface
      community format) into an NDI electrode-layout struct plus a
      site-to-channel map. One detail a port must get right and would be
      easy to miss: ProbeInterface's device_channel_indices are 0-BASED and
      MATLAB converts them to 1-based, with -1 becoming NaN. NDI's
      site2channelmap holds a channel NUMBER read off a probe, so it stays
      1-based in Python too (see ndi_xlang_principles.md) -- the conversion
      is kept, not dropped, and the +1 is not a MATLAB artifact.

  - name: geometry.writeLibrary
    matlab_path: "+ndi/+fun/+probe/+geometry/writeLibrary.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Not ported. Writes a layout as ndi_common/probe/geometry/group/model
      .json so it ships with NDI and is found by listLibrary. This is a
      MAINTAINER operation: it writes into the installed ndi_common tree,
      which for a pip-installed Python NDI is inside site-packages, so the
      Python version needs a decision about where a user-contributed layout
      belongs before it can be written at all. geometry.readLibrary and
      geometry.listLibrary, the read side, are both ported, so Python
      consumes the library MATLAB writes.

