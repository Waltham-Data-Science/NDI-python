# ndi_matlab_python_bridge.yaml — src/ndi/fun/probe/
# The Primary Contract for the ndi.fun.probe namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: export_binary
    type: function
    matlab_path: "+ndi/+fun/+probe/export_binary.m"
    python_path: "ndi/fun/probe/export_binary.py"
    input_arguments:
      - name: probe
        type_matlab: "ndi.element or ndi.probe"
        type_python: "Any"
      - name: outputfile
        type_matlab: "char"
        type_python: "str | Path"
      - name: multiplier
        type_matlab: "double"
        type_python: "float"
        default: "1.0"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
      - name: precision
        type_matlab: "char"
        type_python: "str"
        default: "'int16'"
    output_arguments: []
    decision_log: >
      Exact match. Exports data from a probe to a binary file.
      Creates metadata file alongside outputfile with .metadata
      extension. Probe must be an ndi.element.ndi_element or
      ndi.probe.ndi_probe of type 'n-trode'.

  - name: export_all_binary
    type: function
    matlab_path: "+ndi/+fun/+probe/export_all_binary.m"
    python_path: "ndi/fun/probe/export_binary.py"
    input_arguments:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
      - name: kilosort_dir
        type_matlab: "char"
        type_python: "str"
        default: "'kilosort'"
      - name: verbose
        type_matlab: "logical"
        type_python: "bool"
        default: "True"
      - name: multiplier
        type_matlab: "double"
        type_python: "float"
        default: "5.128205128205128"
    output_arguments: []
    decision_log: >
      Exact match. Exports all n-trode probes in a session to binary
      files. Creates subdirectories and kilosort.bin files. Default
      multiplier is 1/0.195 (approx 5.128).

  - name: location
    type: function
    matlab_path: "+ndi/+fun/+probe/location.m"
    python_path: "ndi/fun/probe/location.py"
    input_arguments:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
      - name: element
        type_matlab: "ndi.element or char"
        type_python: "Any | str"
    output_arguments:
      - name: probe_locations
        type_python: "list[Any]"
      - name: probe_obj
        type_python: "Any | None"
    decision_log: >
      Exact match. Finds probe location documents and probe object
      for an NDI element. Traverses underlying_element dependency
      tree until ndi_probe object is found. element can be an
      ndi.element.ndi_element object or string identifier.

  - name: extracellularInfo
    type: function
    matlab_path: "+ndi/+fun/+probe/extracellularInfo.m"
    python_path: "ndi/fun/probe/extracellularInfo.py"
    matlab_last_sync_hash: "0324ad04f"
    input_arguments:
      - name: session
        type_matlab: "ndi.session"
        type_python: "Any"
        note_python: "MATLAB arg name is S; renamed `session` in Python."
      - name: probe
        type_matlab: "ndi.probe or ndi.element"
        type_python: "Any"
      - name: quality_labels
        type_matlab: "string"
        type_python: "Sequence[str] | None"
        default: "None"
    output_arguments:
      - name: info
        type_matlab: "struct array"
        type_python: "list[dict[str, Any]]"
      - name: summary
        type_matlab: "char"
        type_python: "str"
    decision_log: >
      Exact match. Database-side counterpart to
      ndi.fun.probe.import.kilosort.getInfo: finds neuron ndi.elements whose
      underlying element is the probe (depends_on underlying_element_id) and their
      neuron_extracellular documents (depends_on element_id), assembles one entry
      per neuron sorted by cluster_index, optionally filtered by quality_labels
      (case-insensitive), and returns a parallel multiline summary. MATLAB
      containers.Map -> Python dict; MATLAB struct array -> list of dicts.

  - name: plotProbeGeometry
    type: function
    matlab_path: "+ndi/+fun/+probe/plotProbeGeometry.m"
    python_path: "ndi/fun/probe/plotProbeGeometry.py"
    matlab_last_sync_hash: "4f7c78c82"
    input_arguments:
      - name: pg
        type_matlab: "struct or ndi.document (probe_geometry)"
        type_python: "dict | ndi_document"
      - name: axes
        type_matlab: "axes handle"
        type_python: "matplotlib Axes | None"
        default: "None"
      - name: marker_size
        type_matlab: "double"
        type_python: "float"
        default: "60"
      - name: contour_color
        type_matlab: "double[3]"
        type_python: "tuple[float, float, float]"
        default: "(0.6, 0.6, 0.6)"
      - name: contour_linewidth
        type_matlab: "double"
        type_python: "float"
        default: "1.5"
    output_arguments:
      - name: h
        type_matlab: "struct (graphics handles)"
        type_python: "dict[str, Any]"
    decision_log: >
      Faithful match. Scatters electrode sites (colored by shank_id when present),
      plots the optional planar body contour, sets axis labels/title/equal aspect,
      and adds a Shank ID colorbar when multiple shanks exist. matplotlib is a
      DEFERRED import inside the function (raising a clear ImportError if absent) so
      the module imports cleanly in the standard env. MATLAB vlt.data.assign
      name-value parsing is replaced by native Python keyword arguments (no vlt
      dependency). pyplot.gca() stands in for MATLAB gca.

# =========================================================================
# Not yet ported
# =========================================================================
not_yet_ported:

  - name: geometry.fromStruct
    matlab_path: "+ndi/+fun/+probe/+geometry/fromStruct.m"
    matlab_last_sync_hash: "bf85e24b7"
    status: not_yet_ported
    decision_log: >
      Drift item S6. MATLAB bf85e24b7 makes fromStruct coerce every
      matrix-valued probe_geometry field to a column vector, spelling an unused
      optional field (contact_shape_radius on a square-contact probe, an absent
      contour) as a 0x1 empty rather than 0x0, because MATLAB document
      validation rejects a 0x0 [] against a schema shape of [N x 1].
      Python has no ndi.fun.probe.geometry package at all (that whole library is
      drift item S5, sized L) and emits no probe_geometry documents anywhere --
      the only Python probe_geometry surface is the read-only consumer
      plotProbeGeometry. So the emit-side coercion has nothing to attach to.
      The half of the invariant that survives JSON serialization was ported
      instead, into ndi.validate: a matrix-typed field's empty must be [] and
      never null (a JSON null decodes MATLAB-side to exactly the unshaped 0x0
      this commit exists to prevent), and a matrix must be rectangular. See
      tests/test_validate.py::TestMatrixEmptyIsList and TestMatrixRagged.
      The declared [rows, cols] dimensions are deliberately NOT enforced: a flat
      JSON list is orientation-free, so [N,1] and [1,N] are indistinguishable on
      the wire, and Python and MATLAB do not presently agree on the nested case
      (element_epoch/epochclocktimes t0_t1 is declared [2, NaN] but emitted
      N-by-2 by Python). Settling that convention is a cross-language decision,
      not a validation tweak.
