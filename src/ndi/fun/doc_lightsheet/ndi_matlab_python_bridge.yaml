      2026-11-07: examined against NDI-matlab b2af80d09: a See also line
      renamed (ndi.gui.app.LightsheetZarrManager is now LightsheetManager);
      no behaviour change, nothing to port.
      2026-11-07: examined against NDI-matlab b2af80d09 and ported to
      ndi/fun/doc_lightsheet/view.py as
      view(session, pyramidID='', *, launcher='', sessionPath='',
      reduction='', channel=-1, level=-1, controls=True, name='', wait=False,
      verbose=True, debug=True, logFile=''). Same options; it runs the
      napariViewLightsheet command line (flags from viewCommand) as a child
