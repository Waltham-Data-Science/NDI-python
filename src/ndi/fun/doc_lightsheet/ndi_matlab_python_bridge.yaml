# ndi_matlab_python_bridge.yaml — src/ndi/fun/doc_lightsheet/
# The Primary Contract for the +ndi/+fun/+doc/+lightsheet MATLAB package.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# +ndi/+fun/+doc/+lightsheet -- lightsheet OME-Zarr document tooling
# (VH-Lab/NDI-matlab claude/lightsheet-zarr-ndi-viewer-djp5vk).
#
# A group of MATLAB functions that build lightsheetZarrPyramid +
# lightsheetZarrLevel documents from an OME-Zarr store and read them
# back through the NDI cloud cache. None have a Python counterpart yet.
# The napari viewer they enable is on the Python side already
# (src/ndi/gui/app/lightsheetZarr/), but its reader queries the same
# documents through the standard NDI query API rather than through a
# ported wrapper: the Python surface a viewer needs and the Python
# surface a script needs are different, and the second waits until
# there is a caller.
#
# When the ingest boundary is drawn on the Python side, these functions
# port as a group into a doc_lightsheet.py flat file, mirroring how
# doc_gene.py mirrors +ndi/+fun/+doc/+gene. Deferred as a group rather
# than a file at a time because they call each other -- fromOMEZarr
# drives makePyramid + makeSourceFile, and readViewport-style callers
# will need chooseLevel + levelTable.
# =========================================================================
functions:

  - name: fromOMEZarr
    matlab_path: "+ndi/+fun/+doc/+lightsheet/fromOMEZarr.m"
    matlab_last_sync_hash: "1b7876574"
    status: porting_deferred
    decision_log: >-
      MATLAB probes an OME-Zarr store with ndr.format.omezarr.listPyramids,
      writes ONE lightsheetZarrPyramid document (per source volume), and
      one lightsheetZarrLevel document per unique array path across all
      multiscales entries. Level 0 is deduped when two entries reference
      the same NGFF path (typical for mean + max pyramids). c8f3479 added
      tileBudgetBytes (default 8 MB uncompressed) and an optional chunks
      override, forwarded to makePyramid so each level is re-tiled to hit
      the budget. bd6a245 added materializeChunks (default false) which
      makePyramid uses to read each level from the source OME-Zarr and
      write chunk.bin_<idx> files onto the level documents before
      database_add -- the Python port lands the same option and calls
      into ndr.format.omezarr.readArray equivalent. Ports with the other
      entries under this heading.
      2026-10-12: examined against 5c9e8a83 on
      claude/lightsheet-zarr-ndi-viewer-djp5vk (was 71d7387). It raises
      the default tile budget from 8*2^20 to 32*2^20 bytes
      (signing/fetch/decode measurements on a whole-brain volume) and
      updates the doc comments to match. Nothing on the Python side to
      follow: this function has no Python counterpart yet, and the
      Python viewer only reads the levels MATLAB wrote. The Python port
      must use the 32 MB default when it lands.
      2026-11-07: examined against NDI-matlab 1b7876574 (VH-Lab/NDI-matlab#1045
      and #1178, merged). Three changes the Python port must carry when it
      lands. (1) The target may be an ndi.cloud.upload.SessionWriter instead
      of a session: chunks are then always materialized and streamed to a
      session of an NDI Cloud dataset (see the SessionWriter entry under
      src/ndi/cloud/). (2) 1b7876574: translations are recorded as voxel
      CORNERS (lightsheetZarrLevel.md), so the store's NGFF translations,
      which place voxel CENTRES, have half a voxel of each level subtracted
      along the spatial axes (centresToCorners); INFO.pyramids keeps the
      store's own. (3) profileLog and resume options are forwarded to
      makePyramid. Still porting_deferred with the group.

  - name: makePyramid
    matlab_path: "+ndi/+fun/+doc/+lightsheet/makePyramid.m"
    matlab_last_sync_hash: "a3fcbbc48"
    status: porting_deferred
    decision_log: >-
      The worker fromOMEZarr calls; writes one lightsheetZarrPyramid
      parent (describes the source volume, reduction-agnostic) plus one
      lightsheetZarrLevel per unique NGFF path across all entries.
      reduction_function on the level names the reduction ('none' for
      the shared raw level 0, 'mean' / 'max' / ... for reduced levels).
      c8f3479 drops the source zarr's chunk shape and re-chooses per
      level via chooseTileShape to hit tileBudgetBytes (default 8 MB
      uncompressed, sized for a viewer over an ~200 MB/s link fetching
      ~4 tiles in parallel per pan gesture). 04293e3 encodes
      axes_units as a comma-separated string (e.g.
      'micrometer,micrometer,micrometer') and leaves channel_names
      empty by default, matching the schema type change from matrix
      to string on both fields -- the Python port must match this
      encoding when it lands. bd6a245 added materializeChunks +
      sourceZarrPath options: when enabled the maker reads each level
      via ndr.format.omezarr.readArray and attaches chunk.bin_<idx>
      files via add_file BEFORE database_add (NDI documents are
      immutable after add). n_chunks_stored is set to
      prod(chunk_grid) in that mode; the metadata-only default keeps
      it at 0. Bytes are C-order to match Zarr v2 -- MATLAB permutes
      into reversed axis order before serialising. f37fbf1 replaced
      the ~100-line encodeBloscZstd/compressZstd shell-out with a
      call to ndr.format.blosc.encode -- NDR-matlab now owns the
      Blosc container encoder, backed by numcodecs.Blosc inside a
      self-installing private venv (sonpipe pattern; MATLAB's pyenv
      is never touched). Container bytes are unchanged, so this side
      of the port stays the same when it lands: use numcodecs.Blosc
      directly. Ports with the other entries.
      2026-10-12: examined against 5c9e8a83 on
      claude/lightsheet-zarr-ndi-viewer-djp5vk (was 8134a20). It raises
      the default tile budget from 8*2^20 to 32*2^20 bytes
      (signing/fetch/decode measurements on a whole-brain volume) and
      updates the doc comments to match. Nothing on the Python side to
      follow: this function has no Python counterpart yet, and the
      Python viewer only reads the levels MATLAB wrote. The Python port
      must use the 32 MB default when it lands.
      2026-10-12: examined against 04ce18f9 on
      claude/lightsheet-zarr-ndi-viewer-djp5vk (was 5c9e8a83). Adds
      levelSources (per level path: 'omezarr' -- the unchanged default --
      'smartspim' slices, or 'reduce' from an earlier level's stored
      chunks) and channelNames, for fromSPIM. Default behaviour is
      unchanged; the Python port must carry levelSources when it lands.
      2026-11-07: examined against NDI-matlab a3fcbbc48 (VH-Lab/NDI-matlab#1045
      and #1178, merged). Much has changed, all of it for streaming a large
      build to NDI Cloud; the Python port must match the DOCUMENTS it writes,
      and should follow the rest when it lands. Documents: dtype is written as
      the Zarr dtype string ('<u2'; dtypeName), whatever the source spells it,
      and read in either form; translations are voxel corners (fromOMEZarr).
      Build: a streaming target (SessionWriter: declare each level, then
      streamMembers per batch, verified a batch later); whole-row super-blocks
      (planSuperBlocks); level 1 of both ladders folded into level 0 from the
      same reads of the SmartSPIM slices (buildFolded / planFoldCells, option
      foldLevel1), or built together from one more read (twins); parallel
      reads of z-slabs on readWorkers workers of their own, beside numWorkers
      compressing (the pool is numWorkers + readWorkers); work-weighted
      progress (chunkWeight); per-batch timing (BuildProfile, option
      profileLog); resume (option resume: adopt the levels already in the
      cloud and build only their missing chunks). Still porting_deferred with
      the group; the Python napari viewer reads what this writes.

  - name: fromSPIM
    matlab_path: "+ndi/+fun/+doc/+lightsheet/fromSPIM.m"
    matlab_last_sync_hash: "1dcf98ec7"
    status: porting_deferred
    decision_log: >-
      Builds a lightsheetZarrPyramid straight from a SmartSPIM
      acquisition's stitched All_Channels slices (no spim2zarr step):
      level 0 from ndr.format.smartspim, mean and max ladders built by
      block-reducing each level just written, through makePyramid's
      levelSources. Deferred with the rest of the ingest side (the
      Python package is a viewer today); planned to port after the
      MATLAB version is validated, on top of a makePyramid port, using
      ndr-python's smartspim All_Channels reader.
      2026-10-12: examined against 668beb13 (was 04ce18f9): preallocation of
      the ladder arrays only; no behaviour change, nothing to port.
      2026-11-07: examined against NDI-matlab 1dcf98ec7 (VH-Lab/NDI-matlab#1045
      and #1178, merged). Adds a cloud target (an ndi.cloud.upload.SessionWriter,
      level 1 reduced straight from the slices since level 0 does not stay on
      disk) and the options readWorkers, splitReadsWithoutPool, foldLevel1,
      profileLog and resume, forwarded to makePyramid. Every level's
      translation is 0, the corner of voxel 0 (see lightsheetZarrLevel.md).
      NDR-matlab ea26242 (VH-Lab/NDR-matlab#149, ported to NDR-python #38)
      also accepts All_Channels slices named <z>_ch<k>.tiff. Still
      porting_deferred with the group.

  - name: reduceBlocks
    matlab_path: "+ndi/+fun/+doc/+lightsheet/reduceBlocks.m"
    matlab_last_sync_hash: "04ce18f9"
    status: porting_deferred
    decision_log: >-
      Vectorized per-axis block mean/max with
      ndr.format.omezarr.reduce's semantics (trailing partial block
      included), used by fromSPIM to build reduced levels. Ports with
      fromSPIM; in numpy it is a reshape + mean/max per axis.

  - name: chooseTileShape
    matlab_path: "+ndi/+fun/+doc/+lightsheet/chooseTileShape.m"
    matlab_last_sync_hash: "5c9e8a83"
    status: porting_deferred
    decision_log: >-
      Pure function that picks an OME-Zarr chunk shape landing near a
      byte budget with tiles ISOTROPIC IN WORLD SPACE: each spatial
      axis gets a chunk length inversely proportional to its voxel
      size, so a lightsheet volume with 1 um XY and 5 um Z produces
      pancake tiles rather than voxel cubes. Non-spatial axes (t, c)
      stay at 1. Across a dyadic pyramid this keeps chunk-in-voxels
      constant so chunk_grid halves per axis per level and tile count
      drops by 8x per level for a 3D ladder. The Python port must use
      element-wise membership on the axes_order string to identify
      spatial axes (1d11302 fixed a bug where MATLAB's ismember with a
      cellstr collapsed the char row into one string and returned a
      scalar); the equivalent Python idiom is `[ax not in "tc" for ax
      in axes_order.lower()]`. Ports with the other entries under this
      heading; the Python builder that mirrors makePyramid will call
      it directly.
      2026-10-12: examined against 5c9e8a83 on
      claude/lightsheet-zarr-ndi-viewer-djp5vk (was 1d11302). It raises
      the default tile budget from 8*2^20 to 32*2^20 bytes
      (signing/fetch/decode measurements on a whole-brain volume) and
      updates the doc comments to match. Nothing on the Python side to
      follow: this function has no Python counterpart yet, and the
      Python viewer only reads the levels MATLAB wrote. The Python port
      must use the 32 MB default when it lands.

  - name: makeSourceFile
    matlab_path: "+ndi/+fun/+doc/+lightsheet/makeSourceFile.m"
    matlab_last_sync_hash: "1af66bb"
    status: porting_deferred
    decision_log: >-
      MATLAB creates the fileReference document the lightsheet documents'
      source_file_id dependency points at, so a pyramid can name the
      OME-Zarr store it was built from. Describes rather than attaches by
      default (the store is a directory tree of many GB; a checksum of
      .zattrs is the identifying fingerprint). attachFile=true is
      accepted only for a plain file (creating a generic_file), never a
      directory. Mirrors +gene/makeSourceFile after issue #981. Ports
      with the other five entries.

  - name: chooseLevel
    matlab_path: "+ndi/+fun/+doc/+lightsheet/chooseLevel.m"
    matlab_last_sync_hash: "5ab84f3"
    status: porting_deferred
    decision_log: >-
      Given a level table and a target per-axis voxel size, returns the
      coarsest level whose voxel size still meets the target. Pure
      function over the pyramid metadata; when Python readers grow a
      viewport-style call this ports as its selection helper.

  - name: levelTable
    matlab_path: "+ndi/+fun/+doc/+lightsheet/levelTable.m"
    matlab_last_sync_hash: "1af66bb"
    status: porting_deferred
    decision_log: >-
      Joins a lightsheetZarrPyramid and its lightsheetZarrLevel children
      into one finest-first table, carrying the parent frame in
      Properties.UserData. Accepts an optional 'reduction' name-value
      that filters the table to reduction_function in {'none',
      <reduction>}. Python already has an equivalent inside
      ndi.gui.app.lightsheetZarr.multiscale.levelTable (which returns a
      list of dicts and takes the same reduction filter); the
      doc-package mirror lands with the other five entries so the
      surface a script sees matches on both sides.

  - name: viewCommand
    matlab_path: "+ndi/+fun/+doc/+lightsheet/viewCommand.m"
    matlab_last_sync_hash: "b2af80d09"
    status: porting_deferred
    decision_log: >-
      Pure command builder that ndi.gui.app.LightsheetManager calls
      to construct the /usr/local/bin/napariViewLightsheet invocation.
      The flag set here defines the CLI in
      ndi.gui.app.lightsheetZarr.cli exactly, so if a Python-hosted
      equivalent ever needs to build the same command (a batch runner,
      a headless test), that is when this ports. Same pattern the GEF
      side follows (viewCommand is on the GEFManager class, not in the
      doc.gene package, but the shape is the same); the lightsheet
      package puts it under +doc/+lightsheet because the manager stays
      thin.
      2026-10-16: the shell wrapper the MATLAB side names here,
      scripts/napariViewLightsheet installed at
      /usr/local/bin/napariViewLightsheet, is gone from NDI-python. The
      napariViewLightsheet console script now drops MATLAB's library paths
      itself (src/_ndi_launch.py), and install/install-ndi.sh puts it in
      ~/.ndi/bin; the MATLAB-side default moves in NDI-matlab. Nothing
      here to port; the hash is unchanged.
      2026-10-17: NDI-matlab d96fd856 (VH-Lab/NDI-matlab#1032) only rewords
      the no-launcher error to point at ndi.python.install(); nothing for this
      deferred port to follow.
      2026-11-07: examined against NDI-matlab b2af80d09: a See also line
      renamed (ndi.gui.app.LightsheetZarrManager is now LightsheetManager);
      no behaviour change, nothing to port.

  - name: view
    matlab_path: "+ndi/+fun/+doc/+lightsheet/view.m"
    matlab_last_sync_hash: "b2af80d09"
    status: porting_deferred
    decision_log: >-
      MATLAB caller that pairs viewCommand + SYSTEM: builds the
      napariViewLightsheet command line from viewCommand and dispatches
      it via system(). Optional PYRAMIDID argument; empty runs the
      launcher in --list mode. Launcher defaults to
      /usr/local/bin/napariViewLightsheet, the shell wrapper installed
      alongside NDI-python. Backgrounds the launcher on POSIX so MATLAB
      stays interactive. No Python-side counterpart is needed because
      the Python side IS the launcher; this is the MATLAB-side entry
      point. Ports with the other entries.
      2026-10-12: examined against 2f9b0eaf on
      claude/lightsheet-zarr-ndi-viewer-djp5vk (was a7ba07a). A viewer
      launch now goes through launchViewer (NDI_LIGHTSHEET_DEBUG=1, output
      appended to lightsheet_YYYYMMDDHHMMSS.txt in NDI's temp folder), and
      view gains 'debug' and 'logFile' options; --list mode is unchanged.
      Nothing on the Python side to follow: the Python side is the
      launched process, and it already honours NDI_LIGHTSHEET_DEBUG.
      2026-10-16: the shell wrapper the MATLAB side names here,
      scripts/napariViewLightsheet installed at
      /usr/local/bin/napariViewLightsheet, is gone from NDI-python. The
      napariViewLightsheet console script now drops MATLAB's library paths
      itself (src/_ndi_launch.py), and install/install-ndi.sh puts it in
      ~/.ndi/bin; the MATLAB-side default moves in NDI-matlab. Nothing
      here to port; the hash is unchanged.
      2026-10-17: NDI-matlab d96fd856 (VH-Lab/NDI-matlab#1032): the launcher
      now defaults to empty, meaning ndi.python.findCommand finds
      napariViewLightsheet (~/.ndi/bin first), and --list mode runs through
      ndi.python.launch with NDI_FROM_MATLAB=1. Both concern starting the
      console script from MATLAB; a Python port would call the viewer
      directly. Still deferred.
      2026-11-07: examined against NDI-matlab b2af80d09: a See also line
      renamed (ndi.gui.app.LightsheetZarrManager is now LightsheetManager);
      no behaviour change, nothing to port.

  - name: launchViewer
    matlab_path: "+ndi/+fun/+doc/+lightsheet/launchViewer.m"
    matlab_last_sync_hash: "b2af80d09"
    status: matlab_only
    decision_log: >-
      MATLAB-side launch of the Python viewer: runs a viewCommand line
      through SYSTEM with NDI_LIGHTSHEET_DEBUG=1 and stdout/stderr
      appended to lightsheet_YYYYMMDDHHMMSS.txt in
      ndi.common.PathConstants.TempFolder, so a viewer started from
      MATLAB (no terminal) leaves a log. No Python counterpart: from
      Python the viewer is called directly (napariViewLightsheet or
      ndi.gui.app.lightsheetZarr.viewer.openPyramid) with its output on
      the caller's own stderr, and the in-viewer log buffer
      (ndi.gui.feedback) already keeps it for problem reports.
      2026-11-07: examined against NDI-matlab b2af80d09: a See also line
      renamed (LightsheetZarrManager is now LightsheetManager); no behaviour
      change.

  - name: viewerLogFile
    matlab_path: "+ndi/+fun/+doc/+lightsheet/viewerLogFile.m"
    matlab_last_sync_hash: "2f9b0eaf"
    status: matlab_only
    decision_log: >-
      Pure helper of launchViewer: the timestamped log path
      lightsheet_YYYYMMDDHHMMSS.txt under NDI's temp folder. Not
      needed in Python for the same reason as launchViewer -- nothing in
      Python launches the viewer as a detached child that needs a log.

  - name: viewerShellCommand
    matlab_path: "+ndi/+fun/+doc/+lightsheet/viewerShellCommand.m"
    matlab_last_sync_hash: "d96fd856"
    status: matlab_only
    decision_log: >-
      Pure helper of launchViewer: the POSIX / cmd.exe line that sets
      NDI_LIGHTSHEET_DEBUG, appends output to the log and detaches. Not
      needed in Python for the same reason as launchViewer.
      2026-10-17: NDI-matlab d96fd856 (VH-Lab/NDI-matlab#1032) adds
      NDI_FROM_MATLAB=1 to the shell line, so the console script drops
      MATLAB's library paths itself (src/_ndi_launch.py). Still MATLAB-only:
      Python starts no viewer through a shell line.

  - name: dtypeName
    matlab_path: "+ndi/+fun/+doc/+lightsheet/dtypeName.m"
    matlab_last_sync_hash: "67e985640"
    status: porting_deferred
    decision_log: >-
      A voxel type as a Zarr (NumPy) dtype string ('<u2') or a MATLAB class
      ('uint16'), from either form or a Zarr v3 name: makePyramid writes the
      first into lightsheetZarrPyramid / lightsheetZarrLevel documents and
      works with the second. Deferred with the group, as the documents'
      writer it serves is. The Python reader needs no port of it: NumPy
      takes either spelling, and ndi.pyramid.multiscale already maps
      MATLAB class names to NumPy codes when reading a level's dtype, so
      pyramids written before the dtype was normalized ('uint16') and after
      ('<u2') both read.

classes:

  - name: BuildProfile
    type: class
    matlab_path: "+ndi/+fun/+doc/+lightsheet/BuildProfile.m"
    matlab_last_sync_hash: "df55d3f4f"
    status: porting_deferred
    decision_log: >-
      makePyramid's per-batch timings (read-wait, assemble, compress and how
      busy the workers were, upload split into URLs / staging+CRC / waiting
      for curl / cloud check, progress), summarized every 10 minutes and at
      the end of each level, and appended as CSV rows to profileLog (a
      job's profile.csv). It only measures makePyramid, so it ports with
      makePyramid and the rest of the group.
