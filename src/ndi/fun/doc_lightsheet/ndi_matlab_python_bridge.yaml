classes:

  - name: BuildProfile
    type: class
    matlab_path: "+ndi/+fun/+doc/+lightsheet/BuildProfile.m"
    matlab_last_sync_hash: "df55d3f4f"
    python_path: "ndi/fun/doc_lightsheet/BuildProfile.py"
    python_class: "ndi_fun_doc_lightsheet_BuildProfile"
    decision_log: >-
      makePyramid's per-batch timings (read-wait, assemble, compress and how
      busy the workers were, upload split into URLs / staging+CRC / waiting
      for curl / cloud check, progress), summarized every 10 minutes and at
      the end of each level, and appended as CSV rows to profileLog (a
      job's profile.csv). It only measures makePyramid, so it ports with
      makePyramid and the rest of the group.
      2026-11-07: examined against NDI-matlab df55d3f4f and ported to
      ndi/fun/doc_lightsheet/BuildProfile.py as class
      ndi_fun_doc_lightsheet_BuildProfile (alias BuildProfile), constructor
      (logFile='', everySeconds=600). Same methods (add, endLevel, finish,
      static summarize and emptyRows), same summary sentences, and the same
      CSV columns in the same order (when, level, superblock, nSuperBlocks,
      chunks, workers, mbRead, mbChunks, mbOut, readWait, assemble, compress,
      workerBusy, upload, urls, stage, send, verify, progress, total; strings
      double-quoted, numbers %.4g), so a profile.csv from either language has
      the same header and a resumed build appends without a second one. Rows
      are dicts (MATLAB structs); logFile and rows are read-only properties
      (MATLAB SetAccess = private); emptyRows() is [] and the field order is
      the FIELDS constant. add() refuses a row whose fields differ, as
      MATLAB's orderfields does.
