      napariViewLightsheet console script on PATH, else
      `python -m ndi.gui.app.lightsheetZarr.cli` (MATLAB:
      ndi.python.findCommand); there is no launchViewer/shell line
      (matlab_only) -- debug sets NDI_LIGHTSHEET_DEBUG=1 in the child's
      environment, and logFile '' leaves the output on the caller's own
      stdout/stderr rather than a timestamped temp log (a Python caller has a
      terminal); --list mode always waits so the ids are printed before it
