# ndi_matlab_python_bridge.yaml — src/ndi/calc/example/
# The Primary Contract for the ndi.calc.example namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.calc.example.simple
  # =========================================================================
  - name: simple
    type: class
    matlab_path: "src/ndi/+ndi/+calc/+example/simple.m"
    matlab_last_sync_hash: "31da40e14"
    python_path: "ndi/calc/example/simple.py"
    python_class: "ndi_calc_example_simple"
    inherits: "ndi.calculator"
    decision_log: >
      Examined against NDI-matlab 31da40e14, the file's last-touching commit.
      calculate and default_search_for_input_parameters match in substance --
      the simple_calc document holding input_parameters and answer, the
      document_id dependency, the default answer of 5 and the isa('base')
      query. ONE THING PORTED: MATLAB validates its argument with
      ndi.validators.mustHaveFields(parameters,
      {'input_parameters','depends_on'}) and then reads
      input_parameters.answer directly, so a missing field is an error. Every
      read here was a .get() with a default, so calculate({}) produced a
      perfectly well-formed document asserting that the answer is 0 -- the
      failure mode a validator exists to prevent. Both checks added. ONE
      METHOD NOT PORTED, recorded rather than invented: generate_mock_docs,
      which builds the mock inputs and expected outputs for ndi.mock.ctest and
      takes generate_expected_docs and specific_test_inds options. It is the
      calculator side of the same mock pipeline whose other half is recorded
      as porting_deferred on the ndi.mock stimulus_response entry; the two
      want doing together. One difference left alone: MATLAB hardcodes the
      dependency NAME as 'document_id' where the port uses the name carried on
      the dependency itself, defaulting to document_id -- strictly more
      general, and it agrees with MATLAB on every input MATLAB accepts.

    methods:
      - name: simple
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_calc_example_simple"
        decision_log: "Exact match."

      - name: calculate
        input_arguments:
          - name: parameters
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: doc
            type_python: "list[ndi_document]"
        decision_log: "Exact match."

      - name: default_search_for_input_parameters
        input_arguments: []
        output_arguments:
          - name: parameters
            type_python: "dict"
        decision_log: "Exact match."

      - name: generate_mock_docs
        input_arguments:
          - name: scope
            type_matlab: "char"
            type_python: "str"
          - name: number_of_tests
            type_matlab: "integer"
            type_python: "int"
          - name: generate_expected_docs
            type_matlab: "logical (Name-Value)"
            type_python: "bool"
            default: "False"
          - name: specific_test_inds
            type_matlab: "double array (Name-Value)"
            type_python: "list[int] | None"
            default: "None"
        output_arguments:
          - name: docs
            type_python: "list[Any]"
          - name: doc_output
            type_python: "list[Any]"
          - name: doc_expected_output
            type_python: "list[Any]"
        decision_log: >
          Exact match. Returns 3-tuple. Inherited from calculator
          but overridden in MATLAB simple.m.
