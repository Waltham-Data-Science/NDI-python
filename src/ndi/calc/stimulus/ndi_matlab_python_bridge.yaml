classes:

  # =========================================================================
  # ndi.calc.stimulus.tuningcurve
  # =========================================================================
  - name: tuningcurve
    type: class
    status: porting_deferred
    matlab_path: "src/ndi/+ndi/+calc/+stimulus/tuningcurve.m"
    matlab_last_sync_hash: "63043f393"
    python_path: "ndi/calc/stimulus/tuningcurve.py"
    python_class: "ndi_calc_stimulus_tuningcurve"
    inherits: "ndi.calculator"
    decision_log: >
      Examined against NDI-matlab 63043f393, the file's last-touching commit,
      AND THE STATUS IS CHANGED TO porting_deferred, because CALCULATE -- the
      whole point of a calculator -- IS A STUB. MATLAB's calculate errors if
      input_parameters or depends_on is missing, looks up the
      stimulus_response_scalar document named by the
      stimulus_response_scalar_id dependency and errors unless exactly one
      comes back, splits independent_label and independent_parameter on commas
      and errors if their counts differ, then walks
      parameters.input_parameters.selection applying seven different
      operations -- hasnumericvalue, hasnumericvalue>, hasnumericvalue<,
      NumberAtLeast, 'best' (through best_value and the named best_algorithm),
      'greatest', and 'varies' -- RETURNING NO DOCUMENT AT ALL when a
      constraint is not met, and only then builds the tuning curve. The port
      creates a tuningcurve_calc document whose independent_variable,
      response_mean and response_stderr are EMPTY LISTS, sets the session id
      and the first dependency, and returns it. No stimulus response is looked
      up, no selection constraint is applied, no curve is computed, and a
      document always comes back. So a caller gets a well-formed
      tuningcurve_calc that says nothing, for every input, including inputs
      MATLAB would decline. WHAT IS REAL: property_value_array, best_value and
      best_value_empirical are genuine ports, and default_parameters_query
      matches. They are the helpers calculate exists to use. ALSO MISSING:
      is_valid_dependency_input, doc_about and plot. Recorded rather than
      invented -- writing the selection engine and the curve computation from
      the MATLAB without a populated session to check against is how a
      plausible wrong answer gets committed, and this entry has already
      carried one claim too many.

    methods:
      - name: tuningcurve
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "ndi_session | None"
            default: "None"
        output_arguments:
          - name: obj
            type_python: "ndi_calc_stimulus_tuningcurve"
        decision_log: "Exact match."

      - name: calculate
        input_arguments:
          - name: parameters
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: doc
            type_python: "list[ndi_document]"
        decision_log: >
          STUB -- NOT AN EXACT MATCH. MATLAB's calculate errors if
          input_parameters or depends_on is missing, looks up the
          stimulus_response_scalar document named by the
          stimulus_response_scalar_id dependency and errors unless exactly one
          comes back, splits independent_label and independent_parameter on
          commas and errors if their counts differ, then walks
          parameters.input_parameters.selection applying seven operations --
          hasnumericvalue, hasnumericvalue>, hasnumericvalue<, NumberAtLeast,
          'best' (through best_value and the named best_algorithm), 'greatest',
          and 'varies' -- returning NO document at all when a constraint is
          not met, and only then builds the tuning curve. The Python port
          creates a tuningcurve_calc document whose independent_variable,
          response_mean and response_stderr are empty lists, sets the session
          id and the first dependency, and returns it. No stimulus response
          is looked up, no selection constraint is applied, no curve is
          computed, and a document always comes back -- including for inputs
          MATLAB would decline. See the class-level decision_log for the
          reason this was recorded rather than written.

      - name: default_search_for_input_parameters
        input_arguments: []
        output_arguments:
          - name: parameters
            type_python: "dict"
        decision_log: "Exact match."

      - name: default_parameters_query
        input_arguments:
          - name: parameters_specification
            type_matlab: "struct"
            type_python: "dict"
        output_arguments:
          - name: query
            type_python: "list[dict]"
        decision_log: "Exact match."

      - name: is_valid_dependency_input
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: value
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          DISCREPANCY NOTED: Method exists in MATLAB but is not
          overridden in Python ndi_calc_stimulus_tuningcurve. Base class default
          (always True) is used, which is acceptable for now.

      - name: generate_mock_docs
        input_arguments:
          - name: scope
            type_matlab: "char"
            type_python: "str"
            default: "'standard'"
          - name: number_of_tests
            type_matlab: "integer"
            type_python: "int"
            default: "4"
          - name: generate_expected_docs
            type_matlab: "logical (Name-Value)"
            type_python: "bool"
            default: "False"
          - name: specific_test_inds
            type_matlab: "double array (Name-Value)"
            type_python: "list[int] | None"
            default: "None"
        output_arguments:
          - name: docs
            type_python: "list[Any]"
          - name: doc_output
            type_python: "list[Any]"
          - name: doc_expected_output
            type_python: "list[Any]"
        decision_log: "Exact match. Returns 3-tuple."

      - name: best_value
        input_arguments:
          - name: algorithm
            type_matlab: "char"
            type_python: "str"
          - name: stim_response_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: property
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: n
            type_python: "int"
          - name: v
            type_python: "float"
          - name: property_value
            type_python: "Any"
        decision_log: >
          Exact match. Returns 3-tuple. n is 0-based in Python
          (internal array index), 1-based in MATLAB.

      - name: best_value_empirical
        input_arguments:
          - name: stim_response_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: property
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: n
            type_python: "int"
          - name: v
            type_python: "float"
          - name: property_value
            type_python: "Any"
        decision_log: >
          Exact match. Returns 3-tuple.

      - name: property_value_array
        input_arguments:
          - name: stim_response_doc
            type_matlab: "ndi.document"
            type_python: "ndi_document"
          - name: property
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: pva
            type_python: "list[Any]"
        decision_log: "Exact match."

    not_applicable:
      - name: doc_about
        reason: "MATLAB documentation method. Python uses docstrings."
      - name: plot
        reason: "MATLAB GUI plotting. Python should use matplotlib if needed."
