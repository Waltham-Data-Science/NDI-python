# ndi_matlab_python_bridge.yaml — src/ndi/calc/
# The Primary Contract for the ndi.calc namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.calc.tuning_fit  (abstract base)
  # =========================================================================
  - name: tuning_fit
    type: class
    status: porting_deferred
    matlab_path: "src/ndi/+ndi/+calc/tuning_fit.m"
    matlab_last_sync_hash: "63043f393"
    python_path: "ndi/calc/tuning_fit.py"
    python_class: "ndi_calc_tuning__fit"
    inherits: "ndi.calculator"
    decision_log: >
      Examined against NDI-matlab 63043f393, the file's last-touching commit,
      AND THE STATUS IS CHANGED TO porting_deferred. The abstract constructor
      and generate_mock_parameters match, and the scope presets are exactly
      MATLAB's -- highSNR is 5 reps at noise 0.001, lowSNR is 10 reps at noise
      1. GENERATE_MOCK_DOCS IS A DIFFERENT FUNCTION. MATLAB builds REAL
      documents: it calls ndi.mock.fun.stimulus_response to make a subject,
      stimulator, neuron, presentation and responses in the session; narrows
      the calculator's own default query to that element; runs
      obj.run('Replace', calcparameters) and ERRORS if the result is not
      exactly one document; optionally writes that document as the stored
      expected output; and loads doc_expected_output from disk through
      load_mock_expected_output for every index. The port builds a dict of
      synthetic stimulus responses in memory, never touches the database,
      never runs the calculator through run() -- it calls calculate() directly
      and swallows any exception into None -- hand-makes doc_expected_output
      as noiseless values instead of loading the stored ones, and never calls
      write_mock_expected_output or load_mock_expected_output at all. It also
      loops over number_of_tests where MATLAB loops over
      obj.numberOfSelfTests, a property with no Python counterpart. THIS
      CANNOT BE PORTED UNTIL THE MOCK PIPELINE IS. It is built on
      ndi.mock.fun.stimulus_response, which is itself recorded as
      porting_deferred, and on ctest's write/load_mock_expected_output, which
      now exist but have nothing to store yet. The three want doing together,
      and the tuningcurve calculator it exists to self-test is deferred for
      its own reasons.

    methods:
      - name: tuning_fit
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "ndi_session | None"
            default: "None"
          - name: name
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: doc_type
            type_matlab: "char"
            type_python: "str"
            default: "''"
        output_arguments:
          - name: obj
            type_python: "ndi_calc_tuning__fit"
        decision_log: >
          MATLAB constructor takes (session, name, doc_type).
          Python takes (session, document_type, path_to_doc_type).
          Semantically equivalent.

      - name: generate_mock_docs
        input_arguments:
          - name: scope
            type_matlab: "char"
            type_python: "str"
          - name: number_of_tests
            type_matlab: "integer"
            type_python: "int"
          - name: generate_expected_docs
            type_matlab: "logical (Name-Value)"
            type_python: "bool"
            default: "False"
          - name: specific_test_inds
            type_matlab: "double array (Name-Value)"
            type_python: "list[int] | None"
            default: "None"
        output_arguments:
          - name: docs
            type_python: "list[Any]"
          - name: doc_output
            type_python: "list[Any]"
          - name: doc_expected_output
            type_python: "list[Any]"
        decision_log: >
          Exact match. Returns 3-tuple. Scope presets: 'highSNR', 'lowSNR'.

      - name: generate_mock_parameters
        kind: abstract
        input_arguments:
          - name: scope
            type_matlab: "char"
            type_python: "str"
          - name: index
            type_matlab: "integer"
            type_python: "int"
        output_arguments:
          - name: param_struct
            type_python: "dict[str, Any]"
          - name: independent_variable
            type_python: "list[str]"
          - name: x
            type_python: "numpy.ndarray"
          - name: r
            type_python: "numpy.ndarray"
        decision_log: >
          Exact match. Abstract in both. Returns 4-tuple.
          Index is 1-based (test number).
