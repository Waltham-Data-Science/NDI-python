  # =========================================================================
  # ndi.epoch.epochprobemap_daqsystem
  # =========================================================================
  - name: epochprobemap_daqsystem
    type: class
    matlab_path: "+ndi/+epoch/epochprobemap_daqsystem.m"
    matlab_last_sync_hash: "fe64a9f5"
    python_path: "ndi/epoch/epochprobemap_daqsystem.py"
    python_class: "ndi_epoch_epochprobemap__daqsystem"
    inherits: "ndi.epoch.epochprobemap"

    properties:
      - name: daqsystemstring
        type_matlab: "ndi.daq.daqsystemstring"
        type_python: "ndi_daq_daqsystemstring"
        access: "computed property"
        decision_log: >
          Lazy-parsed from devicestring. MATLAB stores explicitly;
          Python computes on access.

    methods:
      - name: epochprobemap_daqsystem
        kind: constructor
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: reference
            type_matlab: "integer"
            type_python: "int"
          - name: type
            type_matlab: "char"
            type_python: "str"
          - name: devicestring
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: subjectstring
            type_matlab: "char"
            type_python: "str"
            default: "''"
        output_arguments:
          - name: epm_daq_obj
            type_python: "ndi_epoch_epochprobemap__daqsystem"
        decision_log: "Exact match."

      - name: serialization_struct
        input_arguments: []
        output_arguments:
          - name: s
            type_python: "dict[str, Any]"
        decision_log: "Exact match. MATLAB returns a struct; Python returns a dict."

      - name: serialize
        input_arguments: []
        output_arguments:
          - name: s
            type_python: "str"
        decision_log: >
          MATLAB ndi.epoch.epochprobemap_daqsystem/serialize emits a tab-delimited
          header row of field names followed by one data row per object. Python now
          matches: a header row plus this object's data row. The prior Python output
          was a single header-less line, which crashed MATLAB's decode and could not
          represent an array; PR5 fixes it (audit C10).
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: serialize_array
        kind: classmethod
        input_arguments:
          - name: objs
            type_python: "list[ndi_epoch_epochprobemap__daqsystem]"
        output_arguments:
          - name: s
            type_python: "str"
        decision_log: >
          Serializes a list of probe maps as one header row + one data row per
          object. MATLAB has no separate array method because its serialize is
          array-native (loops over the struct array); Python factors the array
          case into its own classmethod for idiomatic call sites (audit C10).
          Added in PR5.
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: savetofile
        input_arguments:
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments: []
        decision_log: "Exact match. Writes a header row + data row."

      - name: save_array_to_file
        kind: classmethod
        input_arguments:
          - name: objs
            type_python: "list[ndi_epoch_epochprobemap__daqsystem]"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments: []
        decision_log: >
          Writes a list of probe maps to a file (one header row + N data rows).
          MATLAB's savetofile is array-native (writes the whole struct array);
          Python adds this classmethod as the explicit array counterpart to the
          instance savetofile (audit C10). Added in PR5.
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: decode
        kind: classmethod
        input_arguments:
          - name: s
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: epm_daq_obj
            type_python: "ndi_epoch_epochprobemap__daqsystem"
        decision_log: >
          MATLAB is a static method; Python uses classmethod. Python's decode now
          skips the header row and returns the first data row's object, matching
          MATLAB's header-aware decode (audit C10).
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: decode_array
        kind: classmethod
        input_arguments:
          - name: s
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: epm_list
            type_python: "list[ndi_epoch_epochprobemap__daqsystem]"
        decision_log: >
          Decodes all probe maps from a serialized string (header skipped). MATLAB's
          decode is array-native (returns a struct array for all data rows); Python
          splits the single-object case (decode) from the array case (decode_array)
          for idiomatic typing (audit C10). Added in PR5.
          Synchronized with MATLAB main as of 2026-06 (commit 2d76370).

      - name: loadfromfile
        kind: classmethod
        input_arguments:
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: epm_list
            type_python: "list[ndi_epoch_epochprobemap__daqsystem]"
        decision_log: "MATLAB is a static method. Python uses classmethod."
