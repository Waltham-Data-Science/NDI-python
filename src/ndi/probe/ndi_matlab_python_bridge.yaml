# ndi_matlab_python_bridge.yaml — src/ndi/probe/
# The Primary Contract for the ndi.probe namespace.

project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# =========================================================================
# Standalone functions
# =========================================================================
functions:

  - name: initProbeTypeMap
    type: function
    matlab_path: "+ndi/+probe/+fun/initProbeTypeMap.m"
    matlab_last_sync_hash: "fe64a9f5"
    python_path: "ndi/probe/__init__.py"
    input_arguments: []
    output_arguments:
      - name: type_map
        type_python: "dict[str, str]"
    decision_log: >
      Exact match. Loads probe type→class mapping from
      probetype2object.json. Returns a dict mapping type strings
      to class name strings.

  - name: getProbeTypeMap
    type: function
    matlab_path: "+ndi/+probe/+fun/getProbeTypeMap.m"
    matlab_last_sync_hash: "86f7a0a3"
    python_path: "ndi/probe/__init__.py"
    input_arguments: []
    output_arguments:
      - name: type_map
        type_python: "dict[str, str]"
    decision_log: >
      Exact match. Returns the cached probe type→class mapping,
      loading it on first call via initProbeTypeMap().

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.probe  (base probe class, extends ndi_element)
  # =========================================================================
  - name: probe
    type: class
    matlab_path: "+ndi/probe.m"
    matlab_last_sync_hash: "e6890be7"
    python_path: "ndi/probe/__init__.py"
    python_class: "ndi_probe"
    inherits: "ndi.element"

    properties:
      - name: name
        type_matlab: "char"
        type_python: "str"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Inherited from ndi_element. @property in Python."

      - name: reference
        type_matlab: "integer"
        type_python: "int"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Inherited from ndi_element. @property in Python."

      - name: type
        type_matlab: "char"
        type_python: "str"
        access: "GetAccess=public, SetAccess=protected"
        decision_log: "Inherited from ndi_element. @property in Python."

    methods:
      # --- Constructor ---
      - name: probe
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any | None"
          - name: name
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: reference
            type_matlab: "integer"
            type_python: "int"
            default: "0"
          - name: type
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: subject_id
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: identifier
            type_matlab: "char"
            type_python: "str | None"
            default: "None"
          - name: document
            type_matlab: "ndi.document"
            type_python: "Any | None"
            default: "None"
        output_arguments:
          - name: probe_obj
            type_python: "ndi_probe"
        decision_log: >
          Probes are always direct=False and have no underlying_element.
          These are hardcoded in the constructor.

      # --- ndi_epoch_epochset Overrides ---
      - name: buildepochtable
        input_arguments: []
        output_arguments:
          - name: et
            type_python: "list[dict[str, Any]]"
        decision_log: >
          Overrides ndi_element. Scans all DAQ systems in the session and
          collects epochs where the epochprobemap matches this probe.

      - name: epochsetname
        input_arguments: []
        output_arguments:
          - name: name
            type_python: "str"
        decision_log: "Exact match. Returns 'probe: name | reference'."

      - name: issyncgraphroot
        input_arguments: []
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          Always returns False for probes (continue traversal
          to underlying DAQ systems).

      # --- ndi_probe-specific methods ---
      - name: probestring
        input_arguments: []
        output_arguments:
          - name: s
            type_python: "str"
        decision_log: "Exact match. Returns 'name | reference | type'."

      - name: epochprobemapmatch
        input_arguments:
          - name: epochprobemap
            type_matlab: "ndi.epoch.epochprobemap"
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: "Exact match. Checks name, reference, type."

      - name: getchanneldevinfo
        input_arguments:
          - name: epoch_number
            type_matlab: "integer"
            type_python: "int"
        output_arguments:
          - name: devinfo
            type_python: "dict[str, Any]"
        decision_log: >
          Semantic Parity: epoch_number is 1-indexed (user concept).
          Internally maps to 0-based index. Returns dict with
          daqsystem, device_epoch_id, epochprobemap.

      # --- ndi_documentservice Override ---
      - name: newdocument
        input_arguments: []
        output_arguments:
          - name: doc
            type_python: "Any"
        decision_log: >
          Overrides ndi_element. Sets element.direct=False for probes.

      - name: eq
        input_arguments:
          - name: other
            type_python: "Any"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: "Inherited from ndi_element. Mapped to Python __eq__ dunder method."

    static_methods:
      - name: buildmultipleepochtables
        input_arguments:
          - name: probes
            type_matlab: "ndi.probe array"
            type_python: "list[ndi_probe]"
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any"
        output_arguments:
          - name: result
            type_python: "dict[str, list[dict[str, Any]]]"
        decision_log: >
          Exact match. Builds epoch tables for multiple probes
          efficiently by loading DAQ systems once. Returns dict
          mapping probe.id to epoch table.

  # =========================================================================
  # ndi.probe.timeseries  (timeseries probe, extends ndi_probe)
  # =========================================================================
  - name: timeseries
    type: class
    matlab_path: "+ndi/+probe/timeseries.m"
    matlab_last_sync_hash: "0b39ad6c"
    python_path: "ndi/probe/timeseries.py"
    python_class: "ndi_probe_timeseries"
    inherits: "ndi.probe"

    methods:
      - name: readtimeseries
        input_arguments:
          - name: timeref_or_epoch
            type_matlab: "ndi.time.timereference | integer | char"
            type_python: "int | str | Any | None"
            default: "None"
          - name: t0
            type_matlab: "double"
            type_python: "float"
            default: "0.0"
          - name: t1
            type_matlab: "double"
            type_python: "float"
            default: "float('inf')"
          - name: timeref
            type_matlab: "ndi.time.timereference"
            type_python: "Any | None"
            default: "None"
        output_arguments:
          - name: data
            type_python: "np.ndarray | None"
          - name: t
            type_python: "np.ndarray | None"
          - name: timeref_out
            type_python: "Any | None"
        decision_log: >
          Returns 3-tuple. If a timereference is given -- in
          timeref_or_epoch, as MATLAB takes it, or in the extra
          timeref argument -- the syncgraph does the time
          conversion; otherwise the epoch is read directly.
          epoch_number is 1-indexed (user concept).
          NAMING (issue #166): the first argument was called
          `epoch` here until 2026-09, while MATLAB and
          ndi.element.timeseries both call it timeref_or_epoch
          (+ndi/+probe/timeseries.m:23, +ndi/+element/timeseries.m:15,
          +ndi/+time/timeseries.m:23). That was not cosmetic: a
          caller passing the argument by keyword bound on a probe
          and raised TypeError on an element, which made
          ndi.fun.probe.export.binary silently probe-only. The name
          now matches, and the argument accepts either a
          timereference or an epoch, as MATLAB's does. This entry
          previously read "Exact match", which is the divergence
          this contract exists to catch -- a renamed argument must
          be checked against the .m file, not against the entry.
          The trailing timeref argument has no MATLAB counterpart
          and is a FORCED DIVERGENCE retained as pre-existing
          public API; it is equivalent to passing the same object
          as timeref_or_epoch.

      - name: readtimeseriesepoch
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: t0
            type_matlab: "double"
            type_python: "float"
            default: "0.0"
          - name: t1
            type_matlab: "double"
            type_python: "float"
            default: "float('inf')"
        output_arguments:
          - name: data
            type_python: "np.ndarray | None"
          - name: t
            type_python: "np.ndarray | None"
          - name: timeref_out
            type_python: "Any | None"
        decision_log: >
          Base implementation returns (None, None, None).
          Subclasses override with format-specific reading.
          Semantic Parity: epoch_number is 1-indexed.

      - name: samplerate
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
        output_arguments:
          - name: sr
            type_python: "float"
        decision_log: >
          Exact match. Returns sample rate in Hz, or -1 if
          not applicable. Semantic Parity: epoch is 1-indexed.

      - name: times2samples
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: times
            type_matlab: "double array"
            type_python: "np.ndarray"
        output_arguments:
          - name: samples
            type_python: "np.ndarray"
        decision_log: >
          INDEXING DIFFERENCE: MATLAB returns 1-indexed samples; Python returns
          0-indexed. Sample 0 in Python corresponds to sample 1 in MATLAB.
          Formula: s = round(t * sr) (Python) vs s = 1 + round(t * sr) (MATLAB).

      - name: samples2times
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: samples
            type_matlab: "double array"
            type_python: "np.ndarray"
        output_arguments:
          - name: times
            type_python: "np.ndarray"
        decision_log: >
          INDEXING DIFFERENCE: MATLAB accepts 1-indexed samples; Python accepts
          0-indexed. Sample 0 in Python corresponds to sample 1 in MATLAB.
          Formula: t = s / sr (Python) vs t = (s - 1) / sr (MATLAB).

  # =========================================================================
  # ndi.probe.timeseries.mfdaq  (MFDAQ timeseries probe)
  # =========================================================================
  - name: mfdaq
    type: class
    matlab_path: "+ndi/+probe/+timeseries/mfdaq.m"
    matlab_last_sync_hash: "1b188d97"
    python_path: "ndi/probe/timeseries_mfdaq.py"
    python_class: "ndi_probe_timeseries_mfdaq"
    inherits: "ndi.probe.timeseries"

    methods:
      - name: read_epochsamples
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: s0
            type_matlab: "integer"
            type_python: "int"
          - name: s1
            type_matlab: "integer"
            type_python: "int"
        output_arguments:
          - name: data
            type_python: "np.ndarray | None"
          - name: t
            type_python: "np.ndarray | None"
          - name: timeref_out
            type_python: "Any | None"
        decision_log: >
          Exact match. Returns 3-tuple. Semantic Parity: epoch
          and sample indices (s0, s1) are 1-indexed.

      - name: readtimeseriesepoch
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: t0
            type_matlab: "double"
            type_python: "float"
            default: "0.0"
          - name: t1
            type_matlab: "double"
            type_python: "float"
            default: "float('inf')"
        output_arguments:
          - name: data
            type_python: "np.ndarray | None"
          - name: t
            type_python: "np.ndarray | None"
          - name: timeref_out
            type_python: "Any | None"
        decision_log: >
          Overrides ndi_probe_timeseries. Converts t0/t1 to sample
          indices and delegates to read_epochsamples.

      - name: samplerate
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
        output_arguments:
          - name: sr
            type_python: "float"
        decision_log: >
          Overrides ndi_probe_timeseries. Gets sample rate from
          underlying DAQ device.

      - name: getchanneldevinfo
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
        output_arguments:
          - name: devinfo
            type_python: "tuple[Any, Any, Any, list[int]] | None"
        decision_log: >
          Overrides ndi_probe.getchanneldevinfo. Returns 4-tuple
          (device, device_epoch, channeltype, channellist) or
          None. Semantic Parity: epoch is 1-indexed.

  # =========================================================================
  # ndi.probe.timeseries.stimulator  (Stimulus delivery probe)
  # =========================================================================
  - name: stimulator
    type: class
    matlab_path: "+ndi/+probe/+timeseries/stimulator.m"
    matlab_last_sync_hash: "209d46b3"
    python_path: "ndi/probe/timeseries_stimulator.py"
    python_class: "ndi_probe_timeseries_stimulator"
    inherits: "ndi.probe.timeseries"

    methods:
      - name: stimulator
        kind: constructor
        input_arguments:
          - name: session
            type_matlab: "ndi.session"
            type_python: "Any | None"
            default: "None"
          - name: name
            type_matlab: "char"
            type_python: "str"
            default: "''"
          - name: reference
            type_matlab: "integer"
            type_python: "int"
            default: "1"
          - name: type
            type_matlab: "char"
            type_python: "str"
            default: "'stimulator'"
        output_arguments:
          - name: stim_obj
            type_python: "ndi_probe_timeseries_stimulator"
        decision_log: >
          Exact match. Defaults type to 'stimulator' and
          reference to 1.

      - name: readtimeseriesepoch
        input_arguments:
          - name: epoch
            type_matlab: "integer | char"
            type_python: "int | str"
          - name: t0
            type_matlab: "double"
            type_python: "float"
            default: "0.0"
          - name: t1
            type_matlab: "double"
            type_python: "float"
            default: "float('inf')"
        output_arguments:
          - name: data
            type_python: "dict[str, Any] | None"
          - name: times
            type_python: "dict[str, Any] | None"
          - name: timeref_out
            type_python: "Any | None"
        decision_log: >
          Overrides ndi_probe_timeseries. Returns structured data dicts
          instead of arrays. data has keys: stimid, parameters,
          analog. times has keys: stimon, stimoff, stimopenclose,
          stimevents. Semantic Parity: epoch is 1-indexed.

      - name: parse_marker_data
        input_arguments:
          - name: mk_timestamps
            type_matlab: "double array"
            type_python: "np.ndarray"
          - name: mk_values
            type_matlab: "double array"
            type_python: "np.ndarray"
        output_arguments:
          - name: result
            type_python: "dict[str, Any]"
        decision_log: >
          Exact match. Utility method to parse raw marker channel
          data into structured stimulus events. Returns dict with
          stimid, stimon, stimoff, stimopenclose arrays.

# =========================================================================
# Not-yet-ported MATLAB functions and classes
# =========================================================================
not_yet_ported:

  - name: probestruct2probe
    matlab_path: "+ndi/+probe/+fun/probestruct2probe.m"
    matlab_last_sync_hash: "0e2caa09"
    status: not_yet_ported
    decision_log: >
      Turns probe structs (name, reference, type) into probe OBJECTS by
      looking each type up in getProbeTypeMap and constructing the class it
      names -- ndi.probe.timeseries.mfdaq for an ephys probe,
      ndi.probe.timeseries.stimulator for a stimulator, and so on. It
      raises NDI:Probe:ProbeTypeNotFound for a type the map does not carry.
      This records a real divergence, not just a missing helper.
      getProbeTypeMap itself IS ported (above), but nothing calls it:
      ndi_session.getprobes constructs a base ndi_probe for every struct,
      whatever its type. So where MATLAB hands back typed probes that can
      readtimeseries, Python hands back generic ones that cannot, and the
      substitution is silent -- no error, just a less capable object.
      Porting it is a behavior change to getprobes rather than a new
      function, and it needs the classes the map names to exist first:
      ndi.probe.image is absent (see below) and ndi.probe.timage, which
      probetype2object.json names for the wide-field, 2-photon and
      1-photon types, has no MATLAB source either. A faithful port would
      raise ProbeTypeNotFound for those types where today they quietly
      become base probes. That is the better failure, but it is a
      deliberate change with its own tests, not a side effect of recording
      this entry.

  - name: image
    matlab_path: "+ndi/+probe/image.m"
    matlab_last_sync_hash: "2e6f3c35"
    status: not_yet_ported
    decision_log: >
      The imaging counterpart of ndi.probe.timeseries: reads frames from an
      ndi.daq.system.image and returns each frame's time through the epoch
      clock and syncgraph, so an image series participates in time
      conversion the way a timeseries does. Implements ndi.time.timeseries,
      with samplerate() returning -1 and times2samples / samples2times
      mapping through frametimes rather than assuming a constant rate,
      because frames are not regularly sampled.
      Python has the layer underneath it -- ndi.daq.system_image and
      ndi.daq.reader.image landed already -- but not the probe on top, and
      not ndi.element.image either.
      Worth knowing before anyone opens an imaging dataset: Python ships
      probetype2object.json naming "ndi.probe.image" for the
      brightfield-imaging type, and the class registry has no such entry,
      so that mapping resolves to nothing on this side. Today it does no
      visible harm only because getprobes ignores the map entirely (see
      probestruct2probe above); the two gaps hide each other, and closing
      either one alone surfaces the other.
