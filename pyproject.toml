[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndi"
version = "0.1.0"
description = "Neuroscience Data Interface - Python implementation"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "VH-Lab", email = "vhlab@brandeis.edu"}
]
maintainers = [
    {name = "Waltham Data Science"}
]
keywords = [
    "neuroscience",
    "data management",
    "experimental data",
    "database",
    "scientific computing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    # NOTE: the project is licensed CC-BY-NC-SA-4.0 (see the `license` field).
    # There is no Trove classifier for that license, so we omit a license
    # classifier rather than mislabel the project as proprietary.
    # (CC-BY-NC-SA is an awkward choice for software — flagged to maintainers.)
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    # Git dependencies are pinned to commit SHAs (these repos publish no
    # release tags yet) so installs are reproducible and can't silently pull
    # an unvetted upstream change. Bump deliberately; tag a lockstep release
    # upstream and switch these to tags when one exists.
    "did @ git+https://github.com/VH-Lab/DID-python.git@1b1491fb98f37a61a74b86cccdfabae8b6bbce9e",
    "ndr[formats] @ git+https://github.com/VH-lab/NDR-python.git@896ed637c35cd8ba118e1512a8c65bdd634a7622",
    "vhlab-toolbox-python @ git+https://github.com/VH-Lab/vhlab-toolbox-python.git@b073185565ea5b47bb0307cddeae923fa9b86268",
    "ndi-compress @ git+https://github.com/Waltham-Data-Science/NDI-compress-python.git@0c05d9dbd63ed5d15866eb1bf0a096568ef0c192",
    "numpy>=1.20.0",
    "networkx>=2.6",
    "jsonschema>=4.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0",
    "openMINDS>=0.2.0",
    "scipy>=1.9.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]
pandas = [
    "pandas>=1.5.0",
]
scipy = [
    # Now a core dependency; kept for backward compatibility with pip install ndi[scipy]
    "scipy>=1.9.0",
]
openminds = [
    # Now a core dependency; kept for backward compatibility with pip install ndi[openminds]
    "openMINDS>=0.2.0",
]
tutorials = [
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "opencv-python-headless>=4.5.0",
]
sorting = [
    # Automatic spike sorting (ndi.app.spikesorter.spike_sort / ndi.util.klustakwik).
    # NOTE: klustakwik2 needs numpy present at build time, so a plain
    # `pip install klustakwik2` may fail with "No module named numpy"; install
    # with `pip install klustakwik2 --no-build-isolation` (or ensure numpy is
    # already installed in the build environment).
    "klustakwik2>=0.2.6",
]
all = [
    "ndi[dev,docs,pandas,scipy,openminds,tutorials,sorting]",
]

[project.scripts]
ndi = "ndi.__main__:main"

[project.urls]
Homepage = "https://github.com/Waltham-Data-Science/NDI-python"
Documentation = "https://waltham-data-science.github.io/NDI-python"
Repository = "https://github.com/Waltham-Data-Science/NDI-python"
Issues = "https://github.com/Waltham-Data-Science/NDI-python/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ndi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --ignore=tests/symmetry"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "symmetry: marks cross-language symmetry tests (run with 'pytest tests/symmetry/')",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B905",  # zip-without-explicit-strict (too noisy for now)
    "E402",  # module-level imports not at top (deferred imports are intentional)
    "B017",  # assertRaises(Exception) in tests is acceptable
    "B028",  # stacklevel in warnings.warn
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "UP035"]  # unused imports are re-exports; typing aliases used throughout
"ndi_install.py" = ["UP036"]  # version check is intentional (standalone script)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
